, "flag": "fragile"}, {"txt": "Poudre jaune, orangée ou brune sur ou autour de l'objet", "sub": "Maladie de la pyrite : le sulfure de fer s'oxyde en sulfates et libère de l'acide sulfurique. Altération active et destructrice.", "to": "H_AMB_01", "warn": true, "flag": "urgent"}, {"txt": "Sédiment argileux gris-noir collé, veines ou nodules gris métalliques internes", "sub": "Pyrite associée à l'ambre : risque de déclenchement de la maladie de la pyrite dès que l'humidité dépasse 60 %.", "to": "H_AMB_01", "warn": true, "flag": "urgent"}, {"txt": "Surface opaque, granuleuse, croûte d'altération", "sub": "Croûte d'altération : c'est l'épiderme archéologique, il porte d'éventuelles traces d'usage. NE PAS NETTOYER.", "to": "H_AMB_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "H_AMB_01"}]}, "H_AMB_01": {"type": "question", "phase": "Terrain · état d'humidité", "q": "Dans quel état l'ambre a-t-il été découvert ?", "help": "Règle d'or : on conserve humide ce qui a été découvert humide. Un séchage rapide à l'air libre est fatal.", "choices": [{"txt": "Humide ou gorgé d'eau", "sub": "Sédiment collant, objet frais ou saturé", "warn": true, "flag": "gorge", "to": "C_HUM_AMB_01"}, {"txt": "Sec", "sub": "L'objet est sec au dégagement", "to": "S_AMB_01"}]}, "S_AMB_01": {"type": "question", "phase": "Terrain · état de surface", "q": "Comment se présente l'ambre sec ?", "help": "Trois cas appellent trois conduites différentes. En cas de doute, choisissez le plus protecteur.", "choices": [{"txt": "Sain, translucide et cohérent", "sub": "Surface régulière, pas de fissure ni de poudre", "to": "C_SAIN_AMB_01"}, {"txt": "Altéré, craquelé, pulvérulent ou desquamé", "sub": "Croûte opaque, écailles, microfissures", "warn": true, "flag": "fragile", "to": "C_ALT_AMB_01"}, {"txt": "Poudre jaune-orangée, veines grises métalliques, ou sédiment gris-noir collé", "sub": "Maladie de la pyrite : altération active et acide", "warn": true, "flag": "pyrite", "to": "C_PYR_AMB_01"}]}, "C_HUM_AMB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ambre humide — maintenir en état", "accent": "accent", "why": "Ce qui a été découvert humide doit rester humide. Le séchage rapide provoque un retrait volumétrique et l'éclatement de la résine.", "lines": [["Sur place", "Ne jamais laisser sécher au soleil ni au vent. En attendant le prélèvement, recouvrir de terre humide du site, de mousse de polyéthylène humidifiée ou d'un film étirable."], ["Prélever", "Prélèvement en bloc, ou isolement sur piédestal de terre, sans retirer la gangue de sédiment humide : elle amortit les chocs et régule l'humidité."], ["Conditionner", "Triple sachet polyéthylène scellé à ras bord, ou boîte hermétique calée avec de la mousse Plastazote humidifiée à l'eau déminéralisée."], ["Stocker", "Au frais (4 à 8 °C), à l'obscurité. Transfert rapide au laboratoire."], ["Fenêtre", "QUELQUES JOURS — craquelures puis pulvérulence à l'assèchement direct."], ["Si rien n'est fait", "Craquelures, opacification puis pulvérisation de la résine."]], "never": "Ne jamais laisser sécher à l'air libre, ni nettoyer, ni utiliser de solvant.", "more": [["Suite du traitement", "L'ambre fait partie des CAS COMPLEXES : contrairement à la plupart des organiques gorgés d'eau, son séchage ne peut pas être conduit en agence. Prévenir rapidement le laboratoire de conservation-restauration, qui prendra en charge le séchage contrôlé et l'éventuelle consolidation."], ["Références", "Bergeron, Rémillard 2021 ; Beck 1982 ; Giroire et al. 2015 ; Lozano et al. 2025 ; Pastorelli 2009 ; Thickett et al. 1995 ; Waddington, Fenn 1988"]], "next": {"label": "Traitement post-fouille →", "to": "P_AMB_01"}}, "C_SAIN_AMB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ambre sain — nettoyage léger autorisé", "accent": "accent", "why": "Un ambre cohérent supporte un dégagement doux, à condition de proscrire les outils métalliques (dureté 2 à 2,5 Mohs, il se raye) et tout solvant.", "lines": [["Dégager", "À sec, au pinceau doux et à l'aide de micro-outils tendres en bois ou en os. Jamais d'outil métallique."], ["Nettoyer", "Tamponnement très doux au coton-tige légèrement humidifié à l'eau déminéralisée, en roulant sans frotter."], ["Conditionner", "Boîte rigide étanche, calage sur mesure en mousse Plastazote neutre, gel de silice conditionné pour maintenir 50 % HR (45-55 %). Obscurité totale."], ["Fenêtre", "QUELQUES JOURS — craquelures puis pulvérulence à l'assèchement direct."], ["Si rien n'est fait", "Craquelures, opacification puis pulvérisation de la résine."]], "never": "Ne jamais employer d'outil métallique, d'acétone, d'éthanol ni aucun solvant organique.", "more": [["Pourquoi pas de solvant", "L'ambre archéologique altéré peut perdre jusqu'à un quart de sa masse superficielle au contact des solvants organiques polaires."], ["Références", "Bergeron, Rémillard 2021 ; Beck 1982 ; Giroire et al. 2015 ; Lozano et al. 2025 ; Pastorelli 2009 ; Thickett et al. 1995 ; Waddington, Fenn 1988"]], "next": {"label": "Traitement post-fouille →", "to": "P_AMB_01"}}, "C_ALT_AMB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ambre altéré — ne pas nettoyer", "accent": "lab", "why": "La croûte d'altération est l'épiderme archéologique de l'objet : elle porte d'éventuelles traces d'usage ou de façonnage. La retirer, c'est perdre l'information.", "lines": [["Nettoyage", "INTERDICTION DE NETTOYER, ni à l'eau ni au solvant."], ["Prélever", "Levée en motte si l'objet menace de s'effondrer sous son propre poids."], ["Conditionner", "Boîte rigide étanche, calage souple sans aucune pression, y compris du couvercle. Atmosphère stable à 50 % HR, obscurité."], ["Fenêtre", "QUELQUES JOURS — craquelures puis pulvérulence à l'assèchement direct."], ["Si rien n'est fait", "Craquelures, opacification puis pulvérisation de la résine."]], "never": "Ne jamais laver, brosser, ni appliquer d'acétone ou d'éthanol.", "more": [["Consolidation d'urgence", "Mesure d'exception, réservée au cas où l'objet s'effrite au point de compromettre sa propre collecte, et à réaliser après avis du laboratoire : application locale par capillarité (pipette ou pinceau fin) d'une résine dissoute dans des solvants retenus pour leur faible pouvoir dissolvant sur la résine fossile (selon les préconisations du laboratoire) ; l'acétone et l'éthanol sont à proscrire absolument."], ["Références", "Bergeron, Rémillard 2021 ; Beck 1982 ; Giroire et al. 2015 ; Lozano et al. 2025 ; Pastorelli 2009 ; Thickett et al. 1995 ; Waddington, Fenn 1988"]], "next": {"label": "Traitement post-fouille →", "to": "P_AMB_01"}}, "C_PYR_AMB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ambre pyriteux — microclimat anoxique humide", "accent": "lab", "why": "Dilemme : l'oxydation de la pyrite exige un air très sec (moins de 30 % HR), mais un air aussi sec déshydrate l'ambre et le fait éclater. La solution est de supprimer l'oxygène plutôt que l'humidité.", "lines": [["Reconnaître", "Poudre jaune, orangée ou brune ; veines ou nodules gris métalliques ; sédiment argileux gris-noir ; efflorescences blanches ou jaunes en aiguilles ; emballage carton rongé."], ["Enceinte", "Boîte ou pochette parfaitement hermétique aux gaz."], ["Supprimer l'oxygène", "Absorbeur d'oxygène actif (type Ageless Z) pour descendre près de 0 % : sans oxygène, l'oxydation de la pyrite est bloquée même en présence d'eau."], ["Stabiliser l'humidité", "Stabilisateur d'humidité (type Art Sorb ou Pro Sorb) préconditionné à 50 % HR, pour empêcher les fentes de retrait."], ["Piéger les polluants", "Ajouter du charbon actif pour neutraliser les acides formique et acétique émis par l'ambre dégradé ou le sédiment."], ["Fenêtre", "Urgent — transfert au laboratoire pour traitement curatif spécialisé."], ["Si rien n'est fait", "Poursuite de l'oxydation : gonflement, fissuration mécanique et attaque acide, jusqu'à la désagrégation de l'objet et de son conditionnement."]], "never": "Ne jamais stocker en atmosphère sèche pour lutter contre la pyrite : l'ambre éclaterait. Ne jamais laver ni employer de solvant.", "more": [["Seuil de déclenchement", "La maladie de la pyrite s'amorce dès que l'humidité relative dépasse 60 %."], ["Traitement curatif", "Réservé au laboratoire : nettoyage aux ultrasons, neutralisation de l'acidité, consolidation réversible."], ["Références", "Bergeron, Rémillard 2021 ; Beck 1982 ; Giroire et al. 2015 ; Lozano et al. 2025 ; Pastorelli 2009 ; Thickett et al. 1995 ; Waddington, Fenn 1988"]], "next": {"label": "Traitement post-fouille →", "to": "P_AMB_01"}}, "P_AMB_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "INTERDICTION DE LAVER. Dégagement à sec exclusif."], ["Séchage", "Séchage extrêmement lent et contrôlé."], ["Marquage", "Indirect uniquement (étiquette imputrescible au marqueur indélébile placé dans le sachet)."], ["Conditionnement", "Sachet individuel zippé dans boîte hermétique opaque."], ["Surveiller en dépôt", "Contrôler régulièrement l'apparition d'efflorescences blanches ou jaunes en aiguilles à la surface de l'objet, et l'état du conditionnement : un carton rongé, fissuré ou taché signale la production d'acide sulfurique par la pyrite. Dans ce cas, isoler immédiatement l'objet et prévenir votre GAF et le pôle restauration."]], "never": "Ne jamais : solvants organiques (acétone, toluène), dessèchement, lumière directe (UV).", "more": [["Climat cible", "50-55% · 18-20 °C"], ["Niveau de preuve", "CONSENSUS — conditions alignées sur le verre, Bergeron & Rémillard 2021."], ["Références", "Bergeron, Rémillard 2021 ; Beck 1982 ; Giroire et al. 2015 ; Lozano et al. 2025 ; Pastorelli 2009 ; Thickett et al. 1995 ; Waddington, Fenn 1988"]]}, "ENTREE_AMB_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_AMB_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_AMB_01"}]}}, "epi": false}, "VER_01": {"nom": "Verre", "cat": "Matériaux siliceux / minéraux", "urgence": "Urgence", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_VER_01", "nodes": {"M_VER_01": {"type": "question", "phase": "Terrain · milieu", "q": "Dans quel milieu l'objet était-il enfoui ?", "help": "Le milieu commande la conduite avant même l'état de l'objet. L'eau, surtout salée, change tout.", "choices": [{"txt": "Sec", "sub": "Terre sèche, l'objet n'est pas humide au toucher", "to": "K_VER_01"}, {"txt": "Humide", "sub": "La terre colle, l'objet est frais et humide", "flag": "humide", "to": "K_VER_01"}, {"txt": "Gorgé d'eau", "sub": "Puits, fossé, zone humide non marine", "warn": true, "to": "C_HUM_VER_01"}, {"txt": "Subaquatique (eau douce)", "sub": "Rivière, lac, source — eau non salée", "warn": true, "to": "C_HUM_VER_01"}, {"txt": "Sous-marin / eau salée", "sub": "Mer, estran, épave, résurgence salée", "warn": true, "to": "MAR_VER_01"}]}, "K_VER_01": {"type": "question", "phase": "Terrain · contexte", "q": "Dans quel contexte l'objet a-t-il été découvert ?", "help": "Le contexte dit si l'objet fait partie d'un ensemble dont il faut préserver l'organisation.", "choices": [{"txt": "Standard", "sub": "Habitat, remblai, couche générale", "to": "D_VER_01"}, {"txt": "Funéraire", "sub": "Sépulture, dépôt funéraire", "flag": "funeraire", "to": "D_VER_01"}, {"txt": "Dépôt / amas", "sub": "Cache, dépôt volontaire, objets groupés", "flag": "depot", "to": "D_VER_01"}, {"txt": "Bâti", "sub": "Pris dans une maçonnerie, un sol, une structure", "flag": "bati", "to": "D_VER_01"}]}, "D_VER_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Irisations nacrées, feuillets qui se soulèvent", "sub": "Lixiviation des alcalins : les couches superficielles vont chuter au séchage.", "to": "E_VER_01", "warn": true, "flag": "urgent"}, {"txt": "Surface granuleuse, aspect 'sucré', microfissures", "sub": "Altération avancée : l'objet perd sa cohésion.", "to": "E_VER_01", "warn": true, "flag": "urgent"}, {"txt": "Aspect brillant et translucide, surface saine", "sub": "Attention : le verre archéologique paraît souvent sain par simple effet de mouillage. Le suspecter altéré.", "to": "E_VER_01", "flag": "fragile"}, {"txt": "Croûte opaque adhérente, brune ou blanchâtre", "sub": "Produits d'altération et concrétions : ne pas tenter de les retirer.", "to": "E_VER_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "E_VER_01"}]}, "E_VER_01": {"type": "question", "phase": "Terrain · état et typologie", "q": "Dans quel état se présente le verre ?", "help": "Attention : le verre archéologique paraît souvent sain par simple effet de mouillage. Le suspecter altéré.", "choices": [{"txt": "Tesson ou lot de tessons en bon état", "sub": "Cohérent, sans feuillet qui se soulève", "to": "R_VER_01"}, {"txt": "Récipient complet ou archéologiquement complet", "sub": "Encore rempli de sédiment : le contenu est une archive", "warn": true, "flag": "vase_plein", "to": "R_VER_01"}, {"txt": "Objet écrasé en place, fragments encore en connexion", "sub": "La forme se lit encore : prélever en bloc pour la préserver", "warn": true, "flag": "fragile", "to": "C_MOTTE_VER_01"}, {"txt": "Irisations, feuillets instables, aspect granuleux", "sub": "Altération avancée : les couches vont chuter au séchage", "warn": true, "flag": "urgent", "to": "C_MOTTE_VER_01"}]}, "R_VER_01": {"type": "question", "phase": "Terrain · décors et marques", "q": "Le verre porte-t-il un décor ou une marque ?", "help": "Décor peint ou doré, émaux, filets rapportés, marque de moule, inscription : le lavage et le frottement les effacent.", "choices": [{"txt": "Oui, ou c'est possible", "sub": "On protège la surface : ni brossage, ni frottement", "warn": true, "flag": "decor", "to": "C_DECOR_VER_01"}, {"txt": "Non, surface nue", "sub": "Traitement courant", "to": "C_STD_VER_01"}]}, "C_STD_VER_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel + calage souple", "accent": "accent", "lines": [["Geste", "Verre cohérent, sans feuillet d'irisation instable. Ramasser individuellement ou par petits lots calés. NE RIEN LAVER SUR LE TERRAIN : le verre archéologique paraît souvent sain par simple effet de mouillage de surface. Le lavage éventuel se décide en post-fouille, l'objet sec et examiné. Attention aux arêtes coupantes."], ["Matériel", "Sachets individuels, mousse fine PE, boîte rigide."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES JOURS — les feuillets d'irisation chutent au séchage non contrôlé."], ["Décor", "Surface décorée (décor peint, émail, dorure) : ne pas la laver, dégagement à sec au pinceau souple, sans jamais frotter. En cas de doute, voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."], ["Si rien n'est fait", "Chute des feuillets d'irisation au séchage, puis perte définitive de la surface et du décor."]], "more": [["Post-fouille — lavage", "Un verre sec, sans altération visible — c'est souvent le cas du verre antique — peut être lavé : brosse souple humidifiée au préalable, sans immersion et sans jet d'eau. ARRÊT IMMÉDIAT à la moindre paillette : c'est la surface du verre qui se désolidarise. Un verre irisé, feuilleté, granuleux ou douteux ne se lave pas — nettoyage à sec ou au coton-tige, et avis de votre GAF ou du pôle restauration."], ["Post-fouille — séchage", "Séchage très lent contrôlé."], ["Post-fouille — conditionnement", "Boîtes sans entassement, Plastazote."], ["Climat cible", "45-50% · 18-20 °C"], ["Niveau de preuve", "EXPÉRIMENTAL — plage de sécurité entre transpiration (> 55 %) et crizzling (< 40 %), ICC/CCI ; mesures de sorption Thickett et al. 2024."], ["Références", "Bergeron, Rémillard 2021 ; CTC-09 ; ICC/CCI (s.d.) ; Thickett et al. 2024"]], "never": "Ne jamais : séchage rapide (provoque la chute des irisations).", "next": {"label": "Traitement post-fouille →", "to": "P_VER_01"}}, "C_MOTTE_VER_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en bloc (motte)", "accent": "accent", "lines": [["Geste", "Irisations, croûtes, aspect granuleux ou objet écrasé en place. Garder la terre autour pour bloquer l'humidité et maintenir en place les couches d'irisation. Arrêter le dégagement à environ 1 cm des surfaces et laisser la motte interne en place."], ["Matériel", "Sachet étanche, sédiment d'origine, plaque PP rigide, boîte hermétique."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES JOURS — les feuillets d'irisation chutent au séchage non contrôlé."], ["Décor", "Surface décorée (décor peint, émail, dorure) : ne pas la laver, dégagement à sec au pinceau souple, sans jamais frotter. En cas de doute, voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."], ["Si rien n'est fait", "Chute des feuillets d'irisation au séchage, puis perte définitive de la surface et du décor."]], "more": [["Post-fouille — lavage", "NE PAS LAVER : la surface est déjà instable. Nettoyage à sec ou au coton-tige uniquement, et avis de votre GAF ou du pôle restauration."], ["Post-fouille — séchage", "Séchage très lent contrôlé."], ["Post-fouille — conditionnement", "Boîtes sans entassement, Plastazote."], ["Climat cible", "45-50% · 18-20 °C"], ["Niveau de preuve", "EXPÉRIMENTAL — plage de sécurité entre transpiration (> 55 %) et crizzling (< 40 %), ICC/CCI ; mesures de sorption Thickett et al. 2024."], ["Références", "Bergeron, Rémillard 2021 ; CTC-09 ; ICC/CCI (s.d.) ; Thickett et al. 2024"]], "why": "Les feuillets d'irisation ou les fragments en connexion ne tiennent que par le sédiment : on prélève le bloc entier.", "never": "Ne jamais : séchage rapide (provoque la chute des irisations).", "next": {"label": "Traitement post-fouille →", "to": "P_VER_01"}}, "C_DECOR_VER_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement avec surface à préserver", "accent": "accent", "why": "Décors peints, dorures, émaux et filets rapportés ne sont retenus que par une surface déjà fragilisée : le moindre frottement les emporte.", "lines": [["Geste", "Verre cohérent, sans feuillet d'irisation instable. Ramasser individuellement ou par petits lots calés. NE RIEN LAVER SUR LE TERRAIN : le verre archéologique paraît souvent sain par simple effet de mouillage de surface. Le lavage éventuel se décide en post-fouille, l'objet sec et examiné. Attention aux arêtes coupantes."], ["Matériel", "Sachets individuels, mousse fine PE, boîte rigide."], ["Fenêtre", "QUELQUES JOURS — les feuillets d'irisation chutent au séchage non contrôlé."], ["Décor", "Surface décorée (décor peint, émail, dorure) : ne pas la laver, dégagement à sec au pinceau souple, sans jamais frotter. En cas de doute, voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."], ["Si rien n'est fait", "Chute des feuillets d'irisation au séchage, puis perte définitive de la surface et du décor."]], "never": "Ne jamais : séchage rapide (provoque la chute des irisations).", "more": [["Consolidation", "Toute consolidation d'un verre altéré relève du laboratoire de conservation-restauration : ne jamais l'entreprendre sur le terrain ni en agence."], ["Références", "Bergeron, Rémillard 2021 ; CTC-09 ; ICC/CCI (s.d.) ; Thickett et al. 2024"]], "next": {"label": "Traitement post-fouille →", "to": "P_VER_01"}}, "C_HUM_VER_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Humide ou gorgé d'eau — maintenir en état", "accent": "accent", "why": "On conserve l'état d'humidité d'origine : le séchage non contrôlé fait chuter les feuillets d'irisation.", "lines": [["Geste", "Irisations, croûtes, aspect granuleux ou objet écrasé en place. Garder la terre autour pour bloquer l'humidité et maintenir en place les couches d'irisation. Arrêter le dégagement à environ 1 cm des surfaces et laisser la motte interne en place."], ["Matériel", "Sachet étanche, sédiment d'origine, plaque PP rigide, boîte hermétique."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Fenêtre", "QUELQUES JOURS — les feuillets d'irisation chutent au séchage non contrôlé."]], "never": "Ne jamais : séchage rapide (provoque la chute des irisations).", "more": [["Consolidation", "La consolidation d'un verre altéré et la refixation des feuillets d'irisation relèvent exclusivement du laboratoire de conservation-restauration. Aucun consolidant ne doit être appliqué sur le terrain : un produit mal choisi rend le traitement ultérieur impossible."], ["Références", "Bergeron, Rémillard 2021 ; CTC-09 ; ICC/CCI (s.d.) ; Thickett et al. 2024"]], "next": {"label": "Traitement post-fouille →", "to": "P_VER_01"}}, "MAR_VER_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Sous-marin / eau salée — maintenir en eau", "accent": "lab", "why": "Le mobilier gorgé d'eau salée ne doit jamais sécher avant dessalage : la cristallisation des sels fait éclater la matière. Le dessalage se fait en laboratoire, par bains progressifs.", "lines": [["D'abord", "En domaine public maritime, vérifier avec le Drassm et le RO s'il faut remonter l'objet : souvent, on le laisse sur site (réenfouissement, géotextile)."], ["Si remonté", "Maintenir en eau, sans jamais laisser sécher. Petits objets en sachet zippé avec un fond d'eau ; grands objets enroulés de textiles mouillés puis film étanche."], ["Fenêtre", "Urgent — contacter le GAF du pôle subaquatique ou le laboratoire pour le dessalage"]], "never": "Ne jamais laisser sécher l'objet avant son dessalage en laboratoire.", "more": [["Dessalage", "Bains d'eau douce successifs, contrôlés par mesure de la conductivité, sur plusieurs semaines. Seuls l'or et le plomb échappent au dessalage préalable (CTC-06, CTC-12)."], ["Référence", "CTC-12 (milieu subaquatique et sous-marin) ; CTC-06 ; Bergeron & Rémillard 2021"]]}, "P_VER_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Un verre sec, sans altération visible — c'est souvent le cas du verre antique — peut être lavé : brosse souple humidifiée au préalable, sans immersion et sans jet d'eau. ARRÊT IMMÉDIAT à la moindre paillette : c'est la surface du verre qui se désolidarise. Un verre irisé, feuilleté, granuleux ou douteux ne se lave pas — nettoyage à sec ou au coton-tige, et avis de votre GAF ou du pôle restauration."], ["Séchage", "Séchage très lent contrôlé."], ["Marquage", "Indirect (étiquette imputrescible au marqueur, dans le sachet)."], ["Conditionnement", "Boîtes sans entassement, Plastazote."], ["Décor", "Surface décorée (décor peint, émail, dorure) : ne pas la laver, dégagement à sec au pinceau souple, sans jamais frotter. En cas de doute, voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."]], "never": "Ne jamais : séchage rapide (provoque la chute des irisations).", "more": [["Climat cible", "45-50% · 18-20 °C"], ["Niveau de preuve", "EXPÉRIMENTAL — plage de sécurité entre transpiration (> 55 %) et crizzling (< 40 %), ICC/CCI ; mesures de sorption Thickett et al. 2024."], ["Références", "Bergeron, Rémillard 2021 ; CTC-09 ; ICC/CCI (s.d.) ; Thickett et al. 2024"]]}, "ENTREE_VER_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_VER_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_VER_01"}]}}, "epi": false}, "TCA_01": {"nom": "Terres Cuites Architecturales (TCA)", "cat": "Matériaux siliceux / minéraux", "urgence": "Standard", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_TCA_01", "nodes": {"M_TCA_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Tuile ou brique entière, arêtes nettes, pâte sonnante", "sub": "TCA en bon état : matériau stable, attention aux chocs aux angles.", "to": "U_TCA_01"}, {"txt": "Estampille, signature, empreinte de patte ou de doigt en surface", "sub": "Élément à ramasser systématiquement : la marque est une donnée de production à préserver du frottement.", "to": "U_TCA_01", "flag": "fragile"}, {"txt": "Surface qui se délite en feuillets, pâte pulvérulente", "sub": "Cuisson faible ou gélifraction : manipuler avec précaution, protéger du gel.", "to": "U_TCA_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "U_TCA_01"}]}, "U_TCA_01": {"type": "question", "phase": "Terrain · nature de l'unité", "q": "Dans quel type de contexte les TCA se trouvent-elles ?", "help": "La nature de l'US commande le type de prélèvement bien plus que l'état des matériaux.", "choices": [{"txt": "Structure en place", "sub": "Mur, hypocauste, four, foyer, sol, canalisation, tombe en bâtière", "flag": "tca_structure", "to": "F_TCA_01"}, {"txt": "Toiture effondrée ou maçonnerie écroulée", "sub": "L'agencement renseigne sur le mode de couverture", "warn": true, "flag": "tca_effondre", "to": "C_EFF_TCA_01"}, {"txt": "Remblai, niveau de destruction ou d'abandon", "sub": "Contexte le plus courant : prélèvement sélectif sur critères", "flag": "tca_remblai", "to": "F_TCA_01"}, {"txt": "Ensemble clos ou dépôt de matériaux", "sub": "Espace de stockage, cargaison : prélèvement intégral après documentation", "flag": "tca_clos", "to": "F_TCA_01"}]}, "F_TCA_01": {"type": "question", "phase": "Terrain · fragment ou forme entière", "q": "Que ramassez-vous ?", "help": "Il est généralement inutile de recueillir des fragments de moins de quelques centimètres de côté.", "choices": [{"txt": "Élément entier ou conservant une longueur ou une largeur complète", "sub": "À mesurer et enregistrer systématiquement", "warn": true, "flag": "tca_entier", "to": "C_ENT_TCA_01"}, {"txt": "Fragment conservant un angle, un rebord, une encoche ou un crochet", "sub": "Nécessaire au calcul du nombre minimum d'individus", "to": "R_TCA_01"}, {"txt": "Fragment informe de quelques centimètres", "sub": "Généralement sans intérêt, sauf exception définie avec le spécialiste", "to": "C_INF_TCA_01"}]}, "R_TCA_01": {"type": "question", "phase": "Terrain · marques et caractéristiques", "q": "Le fragment présente-t-il une de ces caractéristiques ?", "help": "Ces cinq critères, valables toutes périodes, justifient à eux seuls la conservation du fragment.", "choices": [{"txt": "Marque : digitée, incision, graffite, empreinte de pied, de tissu, animale ou végétale", "sub": "À conserver systématiquement et à photographier", "warn": true, "flag": "decor", "to": "C_MARQ_TCA_01"}, {"txt": "Modification : découpe ou perforation", "sub": "À conserver, en distinguant si elle est antérieure ou postérieure à la cuisson", "flag": "tca_critere", "to": "C_ENT_TCA_01"}, {"txt": "Pâte peu fréquente ou singulière sur le site, ou glaçure", "sub": "À conserver pour le référentiel de pâtes", "flag": "tca_critere", "to": "C_ENT_TCA_01"}, {"txt": "Forme comprise mais non identifiée", "sub": "À conserver et soumettre au spécialiste", "flag": "tca_critere", "to": "C_ENT_TCA_01"}, {"txt": "Mortier adhérent ou trace de feu", "sub": "Indice de mise en œuvre ou de remploi : échantillonner ou documenter", "flag": "tca_critere", "to": "C_ENT_TCA_01"}, {"txt": "Aucune de ces caractéristiques", "sub": "Prélèvement selon les critères de période", "to": "C_STD_TCA_01"}]}, "C_ENT_TCA_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Élément à conserver — mesure et enregistrement", "accent": "accent", "why": "Cet élément répond à un critère de conservation du protocole : il porte une information de production, de format ou de mise en œuvre.", "lines": [["Geste", "Prélever avec précaution, sans choc aux angles. Mesurer et enregistrer avant mise en caisse."], ["Échantillonnage", "Échantillonnage raisonné, en concertation avec le spécialiste et le responsable d'opération, et conformément au protocole du Réseau TCA (groupe Méthodologie). Un lot de TCA ne doit jamais être ramassé de manière exhaustive sans problématique définie. Protocole complet : {{LIEN_PROTOCOLE_TCA}}"], ["Inventaire", "Toute TCA conservant une longueur ou une largeur complète est mesurée et enregistrée. Distinguer les mesures complètes des mesures conservées. Un fragment inventorié n'a pas nécessairement à être récupéré : il peut être laissé sur le terrain."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Prévoir des caisses spécifiques pour les tegulae (format 60 x 40 x 12 cm). Caler les éléments entiers et éviter tout frottement entre pièces."], ["Fenêtre", "PLUSIEURS MOIS — matériau stable."], ["Si rien n'est fait", "Ruptures aux angles et abrasion des estampilles par les chocs et la surcharge des caisses."]], "never": "Ne jamais surcharger les caisses ni empiler sans calage : les angles se rompent et les estampilles s'abrasent.", "more": [["Critères par période", "Antiquité — tegulae et imbrices : tous les angles ; autres TCA : tout. Bas Moyen Âge et Temps modernes — tuiles plates et canal non glaçurées : tous les angles et dispositifs de fixation ; tuiles glaçurées : tout ; briques : tout, à échantillonner si très grand nombre. Protohistoire, haut Moyen Âge et Moyen Âge central : conserver tous les fragments."], ["Type de prélèvement", "Intégral sur les prospections, fouilles programmées et diagnostics. En fouille préventive : intégral pour la Protohistoire, le haut Moyen Âge et le Moyen Âge central ; différencié par US pour l'Antiquité, le bas Moyen Âge et les Temps modernes."], ["Références", "CTC-08 ; Réseau TCA 2015"]], "next": {"label": "Traitement post-fouille →", "to": "P_TCA_01"}}, "C_MARQ_TCA_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Élément marqué — à conserver et photographier", "accent": "accent", "why": "Les marques — digitées, incisées, graffites, empreintes — sont des données de production directement publiables. Le frottement en caisse les efface.", "lines": [["Geste", "Prélever individuellement. Photographier la marque avant conditionnement."], ["Protection", "Caler à part, face marquée protégée par un papier de soie non acide."], ["Échantillonnage", "Échantillonnage raisonné, en concertation avec le spécialiste et le responsable d'opération, et conformément au protocole du Réseau TCA (groupe Méthodologie). Un lot de TCA ne doit jamais être ramassé de manière exhaustive sans problématique définie. Protocole complet : {{LIEN_PROTOCOLE_TCA}}"], ["Inventaire", "Toute TCA conservant une longueur ou une largeur complète est mesurée et enregistrée. Distinguer les mesures complètes des mesures conservées. Un fragment inventorié n'a pas nécessairement à être récupéré : il peut être laissé sur le terrain."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Prévoir des caisses spécifiques pour les tegulae (format 60 x 40 x 12 cm). Caler les éléments entiers et éviter tout frottement entre pièces."], ["Fenêtre", "PLUSIEURS MOIS — matériau stable."], ["Si rien n'est fait", "Ruptures aux angles et abrasion des estampilles par les chocs et la surcharge des caisses."]], "never": "Ne jamais surcharger les caisses ni empiler sans calage : les angles se rompent et les estampilles s'abrasent.", "more": [["Critères par période", "Antiquité — tegulae et imbrices : tous les angles ; autres TCA : tout. Bas Moyen Âge et Temps modernes — tuiles plates et canal non glaçurées : tous les angles et dispositifs de fixation ; tuiles glaçurées : tout ; briques : tout, à échantillonner si très grand nombre. Protohistoire, haut Moyen Âge et Moyen Âge central : conserver tous les fragments."], ["Type de prélèvement", "Intégral sur les prospections, fouilles programmées et diagnostics. En fouille préventive : intégral pour la Protohistoire, le haut Moyen Âge et le Moyen Âge central ; différencié par US pour l'Antiquité, le bas Moyen Âge et les Temps modernes."], ["Références", "CTC-08 ; Réseau TCA 2015"]], "next": {"label": "Traitement post-fouille →", "to": "P_TCA_01"}}, "C_STD_TCA_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement selon les critères de période", "accent": "accent", "why": "Sans caractéristique remarquable, c'est la période et la nature de l'US qui déterminent ce qu'il faut garder.", "lines": [["Geste", "Appliquer les critères de période détaillés ci-dessous. En cas de doute sur un lot, conserver jusqu'à la fin de la phase de terrain avant d'arbitrer."], ["Échantillonnage", "Échantillonnage raisonné, en concertation avec le spécialiste et le responsable d'opération, et conformément au protocole du Réseau TCA (groupe Méthodologie). Un lot de TCA ne doit jamais être ramassé de manière exhaustive sans problématique définie. Protocole complet : {{LIEN_PROTOCOLE_TCA}}"], ["Inventaire", "Toute TCA conservant une longueur ou une largeur complète est mesurée et enregistrée. Distinguer les mesures complètes des mesures conservées. Un fragment inventorié n'a pas nécessairement à être récupéré : il peut être laissé sur le terrain."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Prévoir des caisses spécifiques pour les tegulae (format 60 x 40 x 12 cm). Caler les éléments entiers et éviter tout frottement entre pièces."], ["Fenêtre", "PLUSIEURS MOIS — matériau stable."], ["Si rien n'est fait", "Ruptures aux angles et abrasion des estampilles par les chocs et la surcharge des caisses."]], "never": "Ne jamais surcharger les caisses ni empiler sans calage : les angles se rompent et les estampilles s'abrasent.", "more": [["Critères par période", "Antiquité — tegulae et imbrices : tous les angles ; autres TCA : tout. Bas Moyen Âge et Temps modernes — tuiles plates et canal non glaçurées : tous les angles et dispositifs de fixation ; tuiles glaçurées : tout ; briques : tout, à échantillonner si très grand nombre. Protohistoire, haut Moyen Âge et Moyen Âge central : conserver tous les fragments."], ["Type de prélèvement", "Intégral sur les prospections, fouilles programmées et diagnostics. En fouille préventive : intégral pour la Protohistoire, le haut Moyen Âge et le Moyen Âge central ; différencié par US pour l'Antiquité, le bas Moyen Âge et les Temps modernes."], ["Références", "CTC-08 ; Réseau TCA 2015"]], "next": {"label": "Traitement post-fouille →", "to": "P_TCA_01"}}, "C_INF_TCA_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Fragment informe — généralement non prélevé", "accent": "accent", "why": "Les fragments de quelques centimètres, sans angle ni marque, n'ont pas d'exploitation scientifique connue et alourdissent inutilement le dépôt.", "lines": [["Geste", "Ne pas prélever, sauf exception définie avec le spécialiste ou le responsable d'opération."], ["Toutefois", "Dans un remblai ou un comblement, conserver le lot jusqu'à la fin de la phase de terrain pour juger de la pertinence d'une étude une fois la fouille terminée. Aucun dispositif de stockage particulier n'est nécessaire."], ["Échantillonnage", "Échantillonnage raisonné, en concertation avec le spécialiste et le responsable d'opération, et conformément au protocole du Réseau TCA (groupe Méthodologie). Un lot de TCA ne doit jamais être ramassé de manière exhaustive sans problématique définie. Protocole complet : {{LIEN_PROTOCOLE_TCA}}"]], "never": "Ne jamais éliminer un lot avant la fin de la phase de terrain sans l'accord du responsable d'opération.", "more": [["Références", "CTC-08 ; Réseau TCA 2015"]], "next": {"label": "Traitement post-fouille →", "to": "P_TCA_01"}}, "C_EFF_TCA_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Toiture effondrée — documenter puis démonter", "accent": "lab", "why": "Une toiture effondrée n'est pas un simple tas de tuiles : la disposition des matériaux, des clous et du mortier renseigne sur le mode de couverture. Il faut aussi pouvoir la distinguer d'un remblai de toiture triée.", "lines": [["D'abord", "Réaliser une orthophotographie de l'emprise, voire une photogrammétrie si elle est étendue. Ce document sert de support à la numérotation et à la localisation des tuiles."], ["Démonter", "Prélèvement intégral selon un carroyage métrique, après documentation. Les fragments d'une même tuile peuvent être dispersés sur plusieurs mètres et à des profondeurs différentes : démontage méthodique."], ["Organiser", "Disposer les fragments d'une même tuile sur une planche au fur et à mesure. Étaler ensuite sur un espace plan proche du secteur fouillé, en lignes suivant l'ordre d'inventaire, encoche supérieure vers le haut, par multiples de cinq pour faciliter le comptage."], ["Fragments isolés", "Prévoir un espace adjacent, subdivisé selon la morphologie de la tuile : encoches supérieures et inférieures, rebords, bords avec ou sans marque digitée, fragments informes."], ["Attention", "Rechercher les clous, le mortier et les charbons de bois issus du voligeage : leur présence signe une toiture en place et non un remblai."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Prévoir des caisses spécifiques pour les tegulae (format 60 x 40 x 12 cm). Caler les éléments entiers et éviter tout frottement entre pièces."], ["Fenêtre", "Opération longue à budgéter — prévenir le responsable d'opération et le spécialiste TCA."]], "never": "Ne jamais démonter une toiture effondrée avant de l'avoir documentée.", "more": [["Cas particuliers", "Canalisation : si le démontage est impossible, relever les largeurs accessibles, compléter l'inventaire et photographier in situ, bord supérieur vers le haut. Four : privilégier les mesures et photos in situ, les TCA fragilisées par la chaleur étant très fragmentées et souvent inutiles à récupérer."], ["Références", "CTC-08 ; Réseau TCA 2015"]], "next": {"label": "Traitement post-fouille →", "to": "P_TCA_01"}}, "P_TCA_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Éléments courants, sans marque et en bon état : nettoyeur haute pression possible, ce qui fait gagner un temps considérable. ATTENTION : sous la pression, un engobe peut être emporté et les clous encore fixés par l'oxydation peuvent être perdus."], ["Lavage — cas fragiles", "Éléments marqués, estampillés, glaçurés, engobés, ou en mauvais état : lavage à l'éponge douce ou au pinceau souple, jamais au jet."], ["Séchage", "En caisses ajourées, ce qui allège les racks de séchage et favorise la circulation de l'air."], ["Marquage", "Indirect obligatoire sur le terrain et en post-fouille immédiate (étiquette imputrescible attachée par cordon). Le marquage direct au revers, à l'encre de Chine entre deux couches de Paraloïd B72 à 10 % dans l'acétone selon le protocole C2RMF, n'est admis qu'après étude et séchage complet, par un personnel formé, et sur les seuls éléments robustes non estampillés."], ["Conditionnement", "Caisses gerbables normalisées, calage mousse Plastazote."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Prévoir des caisses spécifiques pour les tegulae (format 60 x 40 x 12 cm). Caler les éléments entiers et éviter tout frottement entre pièces."]], "never": "Ne jamais : surcharges massives, empilements en vrac sans calage.", "more": [["Climat cible", "< 75% · > 12 °C"], ["Références", "CTC-08 ; Réseau TCA 2015"]]}, "ENTREE_TCA_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_TCA_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_TCA_01"}]}}, "epi": false}, "MON_01": {"nom": "Monnaies et dépôts monétaires", "cat": "Métaux", "urgence": "Urgence", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_MON_01", "nodes": {"M_MON_01": {"type": "question", "phase": "Terrain · contexte de découverte", "q": "Monnaie isolée ou concentration de monnaies ?", "help": "C'est au numismate qu'il revient de dire s'il s'agit d'un dépôt. En cas de doute, on traite comme un dépôt.", "choices": [{"txt": "Monnaie isolée", "sub": "Une ou quelques monnaies dispersées, sans organisation apparente", "to": "D_MON_01"}, {"txt": "Concentration de monnaies, dépôt suspecté", "sub": "Monnaies groupées, éventuels restes de bourse, de coffret ou de vase", "warn": true, "flag": "depot_mon", "to": "C_DEPOT_MON_01"}]}, "D_MON_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Disque métallique sous une gangue terreuse, relief à peine perceptible", "sub": "Monnaie probable : ne pas tenter de dégager pour identifier, l'abrasion détruirait les légendes.", "to": "T_MON_01", "flag": "fragile"}, {"txt": "Pustules ou poudre vert vif ('vert piscine') sur un disque cuivreux", "sub": "Paratacamite : maladie du bronze en cours. Altération active, séchage contrôlé nécessaire.", "to": "T_MON_01", "warn": true, "flag": "urgent"}, {"txt": "Gouttelettes orangées ou brunes sur un disque ferreux", "sub": "'Fer qui pleure' : corrosion active caractérisée, sol très humide.", "to": "T_MON_01", "warn": true, "flag": "urgent"}, {"txt": "Surface grise à violacée, cireuse et cassante sur un disque clair", "sub": "Argent corné : la croûte emporte le décor si on la brosse.", "to": "T_MON_01", "flag": "fragile"}, {"txt": "Patine régulière, compacte, légendes encore lisibles", "sub": "Monnaie en état satisfaisant : ne rien faire de plus que le conditionnement.", "to": "T_MON_01"}, {"txt": "Plusieurs monnaies groupées, parfois avec restes de tissu, cuir ou bois", "sub": "Dépôt monétaire probable : l'agencement est une donnée. Ne toucher à rien, alerter.", "to": "T_MON_01", "warn": true, "flag": "urgent"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "T_MON_01"}]}, "T_MON_01": {"type": "question", "phase": "Terrain · délai de prise en charge", "q": "Sous quel délai la monnaie partira-t-elle chez le numismate ?", "help": "Le conditionnement humide préconisé par le pôle numismatique garde le sédiment meuble et facilite le dégagement. Il n'est valable que sur une durée courte.", "choices": [{"txt": "Départ assuré sous 48 heures", "sub": "Retour au gîte le soir même et rapatriement par le GAF référent, comme le prévoit la procédure", "to": "V_MON_01"}, {"txt": "Départ différé, incertain, ou signes d'altération active", "sub": "Au-delà de 48 h, l'humidité retenue se retourne contre la lisibilité de la monnaie", "warn": true, "flag": "urgent", "to": "C_SEC_MON_01"}]}, "V_MON_01": {"type": "question", "phase": "Terrain · moyen disponible", "q": "De quel moyen de conditionnement disposez-vous sur le chantier ?", "help": "Priver la corrosion d'oxygène ralentit fortement les réactions. L'efficacité dépend directement de l'étanchéité du contenant.", "choices": [{"txt": "Sachet zip seul", "sub": "Air chassé manuellement avant fermeture — valable 48 h", "to": "C_ZIP_MON_01"}, {"txt": "Sous-videuse disponible", "sub": "Mise en gaine sous vide — délai sensiblement allongé", "to": "C_VIDE_MON_01"}]}, "C_ZIP_MON_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Conditionnement humide en sachet zip — 48 heures maximum", "accent": "accent", "why": "Garder le sédiment humide le maintient meuble : le numismate le dégagera sans effort et sans abraser les légendes. Chasser l'air ralentit la corrosion en privant la réaction d'oxygène.", "lines": [["Geste", "Ne pas nettoyer, ne pas frotter, ne pas essuyer. Placer la monnaie directement dans un sachet zip polyéthylène, chasser l'air manuellement, fermer hermétiquement. NE PAS PERCER LE SACHET."], ["Étiquetage", "Inscrire la DATE ET L'HEURE de mise en sachet sur l'étiquette : c'est ce qui permet de savoir si le délai de 48 h est dépassé."], ["Pourquoi 48 h", "Le vide d'air obtenu à la main n'est que partiel, et le polyéthylène laisse passer l'oxygène : la corrosion est ralentie, jamais arrêtée. Au-delà de deux jours, le bénéfice s'inverse."], ["Où NE PAS stocker", "Jamais dans un container, un algéco ou un véhicule, ni au soleil : les variations de température y sont très néfastes, et un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la corrosion. Retour au gîte le soir même."], ["Chaîne à prévenir", "Prévenir le pôle numismatique et le GAF référent dès le retour de fouille. Le GAF référent informe le SRA de tout mouvement de mobilier. Contact du pôle : numismates@eveha.fr."], ["Si le délai est dépassé", "Basculer sur le séchage contrôlé (voir la branche « départ différé ») : c'est alors la meilleure façon de préserver la lisibilité de la monnaie."]], "never": "Ne jamais percer le sachet, frotter la monnaie, ni la laisser au soleil ou dans un véhicule.", "more": [["Référence", "Procédure « Travaux numismatiques », Éveha, novembre 2019, § 1.2."]], "next": {"label": "Traitement post-fouille →", "to": "P_MON_01"}}, "C_VIDE_MON_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Mise en gaine sous vide — délai allongé", "accent": "accent", "why": "Une gaine thermosoudée sous vide est bien plus étanche à l'oxygène qu'un sachet zip : l'anoxie obtenue est plus poussée et plus durable, ce qui laisse davantage de marge avant l'étude sans sacrifier la souplesse du sédiment.", "lines": [["Geste", "Ne pas nettoyer ni frotter. Placer la monnaie dans une gaine adaptée, sur un support rigide, puis mettre sous vide et thermosouder."], ["Précaution", "Ne pas appliquer un vide complet sur une monnaie très minéralisée ou fissurée : la pression écraserait l'objet. Utiliser un vide partiel et intercaler une plaque rigide ou une mousse de calage."], ["Étiquetage", "Inscrire la DATE ET L'HEURE de mise sous vide sur l'étiquette."], ["Délai gagné", "Là où le sachet zip ne tient que 48 h, la gaine sous vide permet de raisonner en jours plutôt qu'en heures — de l'ordre d'une semaine selon la qualité du film et de la soudure. À contrôler visuellement : une gaine qui se regonfle a perdu son étanchéité, il faut alors traiter l'objet sans attendre."], ["Où NE PAS stocker", "Jamais dans un container, un algéco ou un véhicule, ni au soleil : les variations de température y sont très néfastes, et un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la corrosion. Retour au gîte le soir même."], ["Chaîne à prévenir", "Prévenir le pôle numismatique et le GAF référent dès le retour de fouille. Le GAF référent informe le SRA de tout mouvement de mobilier. Contact du pôle : numismates@eveha.fr."]], "never": "Ne jamais mettre sous vide complet une monnaie fragile ou fissurée, ni percer la gaine.", "more": [["Limite", "Même sous vide, il ne s'agit pas d'une anoxie de conservation au sens strict (film barrière et absorbeur d'oxygène). Le délai reste une commodité de transport, pas une solution de stockage."], ["Référence", "Procédure « Travaux numismatiques », Éveha, novembre 2019, § 1.2 ; principe d'anoxie, Kramer 2009."]], "next": {"label": "Traitement post-fouille →", "to": "P_MON_01"}}, "C_SEC_MON_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Séchage contrôlé — départ différé ou altération active", "accent": "accent", "why": "Passé 48 h, garder la monnaie humide devient contre-productif POUR L'ÉTUDE elle-même : le sédiment sèche lentement dans le sachet, se rétracte, se cimente en gangue dure, et son retrait ultérieur au scalpel abrase les légendes et les effigies. Sécher maintenant, de façon contrôlée, c'est préserver la lisibilité et raccourcir le temps de dégagement.", "lines": [["Geste", "Retirer délicatement le sédiment NON ADHÉRENT, sans jamais frotter ni gratter la surface. Ne pas chercher à dégager la monnaie."], ["Sécher", "Séchage lent et complet, à l'abri du soleil et des courants d'air."], ["Conditionner", "Boîte hermétique inerte en PP ou PE avec gel de silice sec, chaque monnaie isolée en sachet. Atmosphère contrôlée."], ["Si altération active", "Le séchage ralentit la réaction, il ne la traite pas : une déchloruration reste nécessaire. Le signaler au pôle numismatique, au GAF référent et au pôle restauration."], ["Où NE PAS stocker", "Jamais dans un container, un algéco ou un véhicule, ni au soleil : les variations de température y sont très néfastes, et un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la corrosion. Retour au gîte le soir même."], ["Chaîne à prévenir", "Prévenir le pôle numismatique et le GAF référent dès le retour de fouille. Le GAF référent informe le SRA de tout mouvement de mobilier. Contact du pôle : numismates@eveha.fr."]], "never": "Ne jamais frotter, gratter ou essuyer la monnaie, ni la sécher au soleil ou près d'une source de chaleur.", "more": [["Climat de conservation", "Viser moins de 30 à 35 % d'humidité relative, seuil générique des métaux (CTC-06)."], ["Références", "Berducou 1990 ; Robbiola et al. 1998 ; Costa 2001 ; Kramer 2009 ; Duday 2005 ; CTC-06 ; Winckel et al. 2026 ; Procédure Travaux numismatiques Éveha 2019"]], "next": {"label": "Traitement post-fouille →", "to": "P_MON_01"}}, "C_DEPOT_MON_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Dépôt monétaire — ne toucher à rien, alerter", "accent": "lab", "why": "L'agencement tridimensionnel des monnaies, et les restes du contenant qui a disparu — bourse, coffret, vase — sont des données que le moindre déplacement détruit. C'est au numismate de confirmer qu'il s'agit d'un dépôt.", "lines": [["D'abord", "Éviter autant que possible de toucher aux monnaies. NE PAS LES NETTOYER, ne pas les compter sur place, ne pas les extraire une à une."], ["Alerter", "Contacter immédiatement le pôle numismatique (numismates@eveha.fr) et le GAF référent du chantier pour définir ensemble les modalités de prélèvement. Contacter également le gestionnaire du mobilier du SRA ou le prescripteur de la fouille."], ["Prélever", "Prélèvement en motte (block-lift) avec la gangue sédimentaire, selon le protocole en vigueur ou défini par le numismate référent. Ce protocole doit être validé par écrit par le SRA et annexé au compte rendu de chantier."], ["Sécurité", "Le GAF référent rapatrie les monnaies le jour même pour les mettre en lieu sûr. Si le prélèvement ne peut être fait le jour même, prévenir le DSR pour une prestation de gardiennage de nuit."], ["Ensuite", "En laboratoire : radiographie ou tomographie AVANT tout dégagement, pour localiser les monnaies, évaluer leur minéralisation et guider la micro-fouille."], ["Où NE PAS stocker", "Jamais dans un container, un algéco ou un véhicule, ni au soleil : les variations de température y sont très néfastes, et un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la corrosion. Retour au gîte le soir même."]], "never": "Ne jamais nettoyer, compter, déplacer ou extraire les monnaies d'un dépôt sur le terrain.", "more": [["Pourquoi la motte", "Elle préserve la taphonomie du dépôt et les restes organiques du contenant, souvent invisibles et extrêmement fragiles. L'analyse micro-stratigraphique permet ensuite d'identifier un contenant périssable disparu (Duday 2005)."], ["Déclaration", "Prévenir le SRA de tout mouvement de mobilier. Protocole spécifique pour toute sortie du territoire national ou vers l'outre-mer."], ["Références", "Berducou 1990 ; Robbiola et al. 1998 ; Costa 2001 ; Kramer 2009 ; Duday 2005 ; CTC-06 ; Winckel et al. 2026 ; Procédure Travaux numismatiques Éveha 2019"]], "next": {"label": "Traitement post-fouille →", "to": "P_MON_01"}}, "P_MON_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Ne pas laver ni frotter. Le dégagement et le nettoyage relèvent du numismate ou du laboratoire."], ["Séchage", "Si le délai d'envoi dépasse 48 h : séchage lent et complet, à l'abri du soleil, après retrait délicat du sédiment non adhérent."], ["Marquage", "Indirect uniquement (étiquette imputrescible dans le sachet), jamais sur la monnaie."], ["Conditionnement", "Chaque monnaie isolée dans un sachet zip polyéthylène hermétique non percé ; l'ensemble trié par US dans une boîte hermétique en polypropylène, avec gel de silice sec. Coffre-fort à la base d'affectation."], ["Chaîne administrative", "Pré-inventaire réalisé par le GAF référent avant stockage, imprimé et joint aux monnaies dans le coffre-fort. Information du pôle numismatique avec le contexte de la fouille. Déclaration du mouvement au SRA. Envoi par colis recommandé avec accusé de réception ou suivi, en boîte hermétique pour limiter les variations de température et d'hygrométrie."]], "never": "Ne jamais : sachet percé ; stockage en container, algéco ou véhicule ; exposition au soleil ; contact avec du bois, du carton acide ou du papier journal.", "more": [["Climat cible", "< 30-35% · 15-25 °C"], ["Niveau de preuve", "NORME — CTC-06 pour le seuil métaux ; procédure interne Travaux numismatiques (Éveha, 2019) pour la chaîne opératoire et les obligations administratives."], ["Références", "Berducou 1990 ; Robbiola et al. 1998 ; Costa 2001 ; Kramer 2009 ; Duday 2005 ; CTC-06 ; Winckel et al. 2026 ; Procédure Travaux numismatiques Éveha 2019"]]}, "ENTREE_MON_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_MON_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_MON_01"}]}}, "epi": false}, "DEC_01": {"nom": "Enduits peints, stucs, mosaïques", "cat": "Matériaux siliceux / minéraux", "urgence": "Urgence", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_DEC_01", "nodes": {"M_DEC_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Couche picturale qui se soulève ou se pulvérise", "sub": "Perte de cohésion entre la peinture et son mortier support : intervention urgente.", "to": "N_DEC_01", "warn": true, "flag": "urgent"}, {"txt": "Mortier détrempé, sans cohésion, qui se délite", "sub": "Support saturé : prélèvement en motte coffrée obligatoire.", "to": "N_DEC_01", "warn": true, "flag": "urgent"}, {"txt": "Surface sèche, couche picturale adhérente", "sub": "État permettant un facing temporaire par un spécialiste.", "to": "N_DEC_01", "flag": "fragile"}, {"txt": "Fragments dispersés, faces peintes et revers de mortier mêlés", "sub": "Tout-venant de remblai : ramassage exhaustif, y compris les fragments blancs ou monochromes qui donnent les métriques de la pièce.", "to": "N_DEC_01"}, {"txt": "Plaques encore jointives, tombées à plat ou en accordéon", "sub": "Effondrement en place : l'agencement conserve la mémoire de la chute de la paroi. Ne pas prélever individuellement.", "to": "N_DEC_01", "warn": true, "flag": "urgent"}, {"txt": "Enduit encore adhérent à sa maçonnerie", "sub": "Peinture in situ : la dépose est un acte lourd et irréversible, soumis à autorisation écrite du SRA.", "to": "N_DEC_01", "warn": true, "flag": "urgent"}, {"txt": "Rouge vif, orangé, susceptible d'être du cinabre", "sub": "Pigment photosensible : il noircit à la lumière directe. Protéger de l'exposition dès le dégagement.", "to": "N_DEC_01", "warn": true, "flag": "urgent"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "N_DEC_01"}]}, "N_DEC_01": {"type": "question", "phase": "Terrain · type de découverte", "q": "Comment le revêtement se présente-t-il ?", "help": "C'est la disposition des fragments, plus que leur état, qui détermine la conduite à tenir.", "choices": [{"txt": "Fragments dispersés", "sub": "Remblai, fosse, couche de démolition — fragments mêlés", "to": "H_DEC_01"}, {"txt": "Effondrement en place", "sub": "Plaques encore jointives, paroi tombée à plat ou en accordéon", "warn": true, "flag": "effondrement", "to": "C_EFF_DEC_01"}, {"txt": "Peinture encore adhérente à son mur", "sub": "Décor in situ sur maçonnerie", "warn": true, "flag": "insitu", "to": "C_INSITU_DEC_01"}]}, "H_DEC_01": {"type": "question", "phase": "Terrain · état hydrique", "q": "Les fragments sont-ils secs ou humides ?", "help": "L'enduit sort presque toujours humide de terre. C'est ce qui commande le mode de conditionnement.", "choices": [{"txt": "Secs", "sub": "Mortier ressuyé, pas d'humidité au toucher", "to": "C_FRAG_DEC_01"}, {"txt": "Humides", "sub": "Mortier frais, terre collante", "warn": true, "flag": "humide", "to": "C_FRAG_DEC_01"}]}, "C_FRAG_DEC_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Fragments dispersés — conditionnement aéré", "accent": "accent", "why": "Le remontage du décor est un puzzle : il repose sur l'intégrité des cassures et des tranches. Et l'enduit sortant humide, tout conditionnement étanche provoque une condensation et des moisissures fatales à la chaux et aux pigments.", "lines": [["Ramasser", "Collecte EXHAUSTIVE, y compris les fragments blancs ou monochromes sans décor visible : ils donnent les métriques de la pièce, la hauteur des élévations et la nature des parois."], ["Conditionner", "À plat, deux niveaux maximum pour éviter l'écrasement, dans des caisses ou cagettes en plastique à parois AJOURÉES. Intercaler des feuilles de papier journal sec, sans agrafes."], ["Nettoyage autorisé", "Brossage À SEC (brosse à dents souple ou pinceau) autorisé EXCLUSIVEMENT sur le revers de mortier et sur les tranches de cassure, pour retirer la terre meuble avant qu'elle ne cimente. INTERDICTION ABSOLUE DE BROSSER LA FACE PEINTE. Sur la face, seul un tamponnement local très doux à l'éponge humide est envisageable, sans frotter — et si la couleur déteint, ARRÊT IMMÉDIAT."], ["Jamais d'adhésif", "Aucun ruban adhésif sur la face peinte ni sur les tranches, aucun collage de terrain : la colle migre dans la chaux, arrache la couche picturale au retrait et crée des surépaisseurs qui rendent l'ajustage des fragments impossible en laboratoire."], ["Sécher", "Séchage progressif à l'ombre, à l'abri du soleil et du vent."], ["Marquage", "Indirect uniquement, étiquette imputrescible solidarisée dans la cagette."], ["Fenêtre", "24 À 48 HEURES — la couche picturale se décolle au séchage du mortier support."], ["Si rien n'est fait", "Décollement de la couche picturale de son mortier support au séchage, avec perte définitive du décor."]], "never": "Ne jamais employer de sachet plastique hermétique, de plastique-bulle étanche, de ruban adhésif, ni brosser la face peinte.", "more": [["Pourquoi pas de sachet fermé", "L'eau ne peut plus s'évaporer : elle condense sur le décor et déclenche des moisissures irréversibles."], ["Références", "Berducou 1990 ; Krougly, Nunes Pedroso 1990 ; APPA-CEPMR 2011 ; CTC-07 ; Païn 2015 ; Rothé et al. 2023"]], "next": {"label": "Traitement post-fouille →", "to": "P_DEC_01"}}, "C_EFF_DEC_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Effondrement en place — documenter avant de démonter", "accent": "lab", "why": "Une paroi tombée conserve la mémoire physique de sa chute et un potentiel de reconstitution exceptionnel. Un démontage à la volée le détruit définitivement.", "lines": [["D'abord", "NE PAS PRÉLEVER individuellement dans l'urgence. Prévenir le responsable d'opération et le toichographologue."], ["Fouiller", "Dégager l'effondrement par passes horizontales, en couches planes, pour comprendre le sens de la chute de la paroi."], ["Documenter", "Relevé des contours à l'échelle 1:1, au feutre indélébile sur film plastique transparent (polyane épais) posé sur la surface."], ["Numéroter", "Un numéro d'inventaire unique par plaque. Pour les fragments d'une même plaque, l'écriture directe n'est tolérée QU'AU REVERS, sur le mortier, après une sous-couche blanche protectrice réversible. Si le revers est trop rugueux, étiquettes imputrescibles solidarisées avec le groupe de fragments."], ["Nettoyage autorisé", "Brossage À SEC (brosse à dents souple ou pinceau) autorisé EXCLUSIVEMENT sur le revers de mortier et sur les tranches de cassure, pour retirer la terre meuble avant qu'elle ne cimente. INTERDICTION ABSOLUE DE BROSSER LA FACE PEINTE. Sur la face, seul un tamponnement local très doux à l'éponge humide est envisageable, sans frotter — et si la couleur déteint, ARRÊT IMMÉDIAT."], ["Jamais d'adhésif", "Aucun ruban adhésif sur la face peinte ni sur les tranches, aucun collage de terrain : la colle migre dans la chaux, arrache la couche picturale au retrait et crée des surépaisseurs qui rendent l'ajustage des fragments impossible en laboratoire."], ["Conditionner", "À plat en cagettes ajourées, deux niveaux maximum, papier journal sec intercalé."], ["Fenêtre", "Opération longue à budgéter — prévenir votre GAF et le pôle restauration."]], "never": "Ne jamais démonter un effondrement avant de l'avoir relevé, ni écrire sur la face peinte.", "more": [["Références", "Berducou 1990 ; Krougly, Nunes Pedroso 1990 ; APPA-CEPMR 2011 ; CTC-07 ; Païn 2015 ; Rothé et al. 2023"]], "next": {"label": "Traitement post-fouille →", "to": "P_DEC_01"}}, "C_INSITU_DEC_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Peinture in situ — alerter le SRA, ne rien déposer", "accent": "lab", "why": "La dépose d'une paroi peinte encore adhérente est un acte de restauration lourd et irréversible, qui ampute le bâtiment d'un élément immobilier. Elle est soumise à l'autorisation écrite préalable du SRA.", "lines": [["Arrêter", "Interrompre ponctuellement la fouille dans le secteur concerné."], ["Alerter", "Le responsable d'opération contacte immédiatement le SRA. En cas de décor exceptionnel, le SRA peut émettre une prescription complémentaire dotée d'un budget dédié pour faire intervenir des conservateurs-restaurateurs."], ["Protéger — berme", "Conserver une bande de sédiment de 10 à 15 cm devant l'enduit : elle le maintient physiquement, le protège de la lumière et d'une dessiccation brutale, le temps de purger le reste de la pièce."], ["Protéger — couverture", "Couvrir le décor dégagé d'un géotextile neutre perméable à l'air et d'un panneau rigide de calage. Abri ou auvent léger contre la pluie, le gel et le soleil direct, en laissant circuler l'air."], ["Lumière", "Attention au rouge cinabre, qui noircit à la lumière directe : protéger dès le dégagement."], ["Fenêtre", "Immédiate — la décision de dépose ne se prend jamais sur le terrain."]], "never": "Ne jamais déposer, consolider ni bâcher hermétiquement une peinture in situ. Une bâche plastique étanche crée un effet de serre.", "more": [["Cadre réglementaire", "La dépose relève d'une autorisation écrite du SRA et d'une intervention de conservateurs-restaurateurs professionnels."], ["Références", "Berducou 1990 ; Krougly, Nunes Pedroso 1990 ; APPA-CEPMR 2011 ; CTC-07 ; Païn 2015 ; Rothé et al. 2023"]], "next": {"label": "Traitement post-fouille →", "to": "P_DEC_01"}}, "P_DEC_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Nettoyage mécanique à sec ou tamponnement très doux (coton-tige)."], ["Séchage", "Séchage lent et progressif à plat (caisses non étanches)."], ["Marquage", "Indirect uniquement (étiquette imputrescible dans le sachet, sans contact)."], ["Conditionnement", "Caisses en plastique rigides (PE) avec 2 niveaux max à plat."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."]], "never": "Ne jamais : cartons acides, emballage hermétique ou bulles fermé (condensation destructrice).", "more": [["Climat cible", "40-60% · 18-22 °C"], ["Niveau de preuve", "NORME — CTC-07 (40-60 % HR, impérativement < 65 %)."], ["Références", "Berducou 1990 ; Krougly, Nunes Pedroso 1990 ; APPA-CEPMR 2011 ; CTC-07 ; Païn 2015 ; Rothé et al. 2023"]]}, "ENTREE_DEC_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_DEC_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_DEC_01"}]}}, "epi": false}};

/* ------------------------------------------------------------------
   LIENS EXTERNES — à renseigner quand l'hébergement sera arrêté.
   Laisser la chaîne vide affiche « lien à venir » au lieu d'un lien mort.
   ------------------------------------------------------------------ */
const LIENS = {
  LIEN_FICHE_GRC: "",   // ex. "https://intranet.eveha.fr/fiches/grc-residus.pdf"
  LIEN_PROTOCOLE_TCA: "http://reseautca.hypotheses.org/"
};
/* Les adresses internes citées dans les consignes ne sont montrées qu'aux
   comptes rattachés à un domaine interne. Ailleurs, la consigne reste
   lisible mais ne livre pas le carnet d'adresses de l'entreprise. */
function masquerInterne(txt){
  if(typeof SESSION !== 'undefined' && SESSION && SESSION.interne) return txt;
  const motif = new RegExp('[\\w.\\-]+@(' + DOMAINES_INTERNES.map(d=>d.replace('.','\\.')).join('|') + ')', 'gi');
  return String(txt).replace(motif, 'adresse interne, à demander à votre correspondant');
}
function resoudreLiens(txt){
  return masquerInterne(String(txt)).replace(/\{\{(\w+)\}\}/g, (m, cle) => {
    const url = LIENS[cle];
    return url ? url : "lien à venir (fiche disponible auprès de votre GAF)";
  });
}


/* ==================================================================
   IDENTITÉ, DESTINATAIRES ET CONSTAT DE TERRAIN
   ------------------------------------------------------------------
   Cette partie prépare la fonction « constat de terrain » : une photo,
   un résumé de la décision prise, et un envoi par courriel.

   EN L'ÉTAT (sans hébergement) :
     · les comptes et les constats sont enregistrés sur l'appareil,
       et nulle part ailleurs ;
     · le courriel s'ouvre pré-rempli dans la messagerie de la personne,
       qui l'envoie elle-même ;
     · la photo ne peut pas être jointe automatiquement : elle est
       enregistrée sur l'appareil et l'utilisateur la joint au message.
   Avec un hébergement, ces trois points deviennent automatiques sans

const STORE = (()=>{
  let ok=true;
  try{ localStorage.setItem('__argos','1'); localStorage.removeItem('__argos'); }catch(e){ ok=false; }
  const vive={};
  return {
    durable: ok,
    lire(c){ try{ return JSON.parse(ok?(localStorage.getItem(c)||'null'):(vive[c]||'null')); }catch(e){ return null; } },
    ecrire(c,v){ const t=JSON.stringify(v); try{ ok?localStorage.setItem(c,t):(vive[c]=t); }catch(e){ vive[c]=t; } }
  };
})();

/* La signification doit tenir sur UNE ligne. On réduit le corps jusqu'à 8 px ;
   en dessous ce serait illisible, on laisse alors passer à deux lignes. */
function ajusterSens(){
  const el=$('.accueil .sens'); if(!el) return;   // absente si ARGOS_SENS est vide
  const bloc=el.parentElement;
  const st=getComputedStyle(bloc);
  const dispo=bloc.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight) - 2;
  el.classList.remove('deuxlignes');
  let px=11; el.style.fontSize=px+'px';
  const large=()=>el.getBoundingClientRect().width;
  while(large()>dispo && px>8.5){ px-=0.25; el.style.fontSize=px+'px'; }
  if(large()>dispo){ el.classList.add('deuxlignes'); el.style.fontSize='10px'; }
}

function tenter(creation){
  const mail=($('#f_mail')?.value||'').trim().toLowerCase();
  const mdp=$('#f_mdp')?.value||'';
  const pseudo=($('#f_pseudo')?.value||'').trim();
  const err=m=>{ $('#f_err').textContent=m; };
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return err("Indiquez une adresse électronique valide.");
  if(mdp.length<4) return err("Le mot de passe doit faire au moins 4 caractères.");
  const c=comptes();
  if(creation){
    if(c[mail]) return err("Un compte existe déjà pour cette adresse.");
    c[mail]={ mdp, pseudo: pseudo || mail.split('@')[0] };
    STORE.ecrire('argos_comptes', c);
  }else{
    if(!c[mail]) return err("Aucun compte sur cet appareil pour cette adresse. Créez-en un.");
    if(c[mail].mdp!==mdp) return err("Mot de passe incorrect.");
  }
  SESSION={ mail, pseudo:c[mail].pseudo, interne: estInterne(mail) };
  STORE.ecrire('argos_session', SESSION);
  fermerAccueil(); majQui(); screenHome();
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function linkify(t){
  const r = esc(resoudreLiens(t));
  return r.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function emphasise(t){
  return esc(resoudreLiens(t)).replace(/(PROSCRIPTION ABSOLUE|INTERDICTION ABSOLUE|INTERDICTION DE LAVER|NE JAMAIS[^.:;]*|NE PAS LAVER|ATTENTION ANALYSES|EPI REQUIS)/g,'<strong>$1</strong>');
}

/* ---------- moteur d'arbre ---------- */
function curNode(){ return MAT[CUR].nodes[PATH[PATH.length-1]]; }

function render(){
  const m=MAT[CUR], n=curNode();
  // Fil d'ariane cliquable : chaque étape ramène à la question où le choix a été fait.
  // data-step = nombre d'étapes à conserver dans PATH (0 = début du matériau).
  const dernier = CRUMBS.length;
  $('#trail').innerHTML =
      `<button type="button" class="c" data-step="0" title="Revenir au début de ce matériau">${esc(m.nom)}</button>`
    + CRUMBS.map((c,i)=>{
        const courant = (i === dernier - 1);
        return '<span class="sep">›</span>'
          + `<button type="button" class="c${courant?' now':''}" data-step="${i+1}"`
          + ` title="${courant?'Étape en cours':'Revenir à cette étape'}">${esc(c)}</button>`;
      }).join('');

  let h='<div class="node">';
  if(n.phase) h+=`<div class="phase">${esc(n.phase)}</div>`;

  // EPI persistant si le matériau l'exige
  if(m.epi && (m.risque||'').match(/^(EPI|PRÉCAUTIONS)/)){
    h+=`<div class="urgent"><span class="sign">🧤</span><span>${esc(m.risque)}</span></div>`;
  }
  // rappels transportés
  const vus=new Set();
  FLAGS.forEach(f=>{
    if(f&&RAPPELS[f]&&!vus.has(f)){ vus.add(f);
      const r=RAPPELS[f], cls=r.tone==='stop'?'urgent':'recall', sg=r.tone==='stop'?'⚠':'›';
      let txt=r.t;
      if(txt==="__ALTERATION__"){
        // « corrosion » est réservé aux métaux ; ailleurs on parle d'altération
        txt = (m.cat==="Métaux")
          ? "<b>Corrosion active repérée.</b> L'objet se dégrade : à traiter en priorité."
          : "<b>Altération active repérée.</b> L'objet se dégrade : à traiter en priorité.";
      }
      h+=`<div class="${cls}"><span class="sign">${sg}</span><span>${txt}</span></div>`;
    }
  });

  if(n.type==="question"){
    h+=`<h1 class="q">${esc(n.q)}</h1>`;
    if(n.help) h+=`<p class="qh">${esc(n.help)}</p>`;
    h+='<div class="choices">';
    n.choices.forEach((c,i)=>{
      const vign = c.img
        ? `<img class="thumb" src="img/${esc(c.img)}" alt="" loading="lazy" onerror="this.remove()">`
        : '';
      h+=`<button class="choice${c.warn?' warn':''}" data-i="${i}">${vign}<span class="txt">${esc(c.txt)}`
        +`${c.sub?`<small>${esc(c.sub)}</small>`:''}</span><span class="go">›</span></button>`;
    });
    h+='</div>';
  }

  if(n.type==="consigne"){
    h+=`<div class="consigne"><div class="top ${n.accent==='lab'?'lab':''}"><div class="kind2">Consigne</div>`
      +`<div class="name">${esc(n.kind)}</div></div>`;
    if(n.img) h+=`<img class="illus" src="img/${esc(n.img)}" alt="Schéma : ${esc(n.kind)}" loading="lazy" onerror="this.remove()">`;
    if(n.why) h+=`<div class="why"><b>Pourquoi</b>${esc(n.why)}</div>`;
    h+='<div class="body">';
    n.lines.forEach(([lab,val])=>{
      if(!val) return;
      const cls = /rien n'est fait/i.test(lab) ? ' prono' : '';
      h+=`<div class="line${cls}"><div class="lab">${esc(lab)}</div><div class="val">${emphasise(val)}</div></div>`;
    });
    h+='</div>';
    if(n.never) h+=`<div class="never"><span class="sign">⊘</span><span>${esc(n.never)}</span></div>`;
    h+='</div>';
    if(n.more){
      h+='<details class="more"><summary>En savoir plus</summary><div class="inner">';
      n.more.forEach(([k,v])=>{
        if(!v) return;
        if(/niveau de preuve/i.test(k)) return;   // information interne à la base, inutile sur le terrain
        h+=`<div class="row"><span class="k">${esc(k)}</span><p>${linkify(v)}</p></div>`;
      });
      h+='</div></details>';
    }
  }
  h+='</div>';
  $('#app').innerHTML=h; $('#foot').textContent='';
  window.scrollTo(0,0); $('#app').focus({preventScroll:true});
  renderBar(n);
}

function renderBar(n){
  let b=`<button class="act back" data-back="1">← Retour</button>`;
  if(n.type==="consigne"){
    b+=`<button class="act" data-copy="1">Copier</button>`;
    // Le constat n'est proposé qu'au bout de la chaîne de terrain : c'est là
    // que l'archéologue a l'objet sous les yeux et un doute à faire remonter.
    if(/terrain/i.test(n.phase||'')) b+=`<button class="act" data-constat-nouveau="1">Prendre une photo</button>`;
    if(n.next) b+=`<button class="act primary" data-to="${n.next.to}">${esc(n.next.label)}</button>`;
    else b+=`<button class="act primary" data-home="1">Nouvel objet</button>`;
  }
  $('#barIn').innerHTML=b;
}
function bar(html){ $('#bar').style.display = html===''?'':''; $('#barIn').innerHTML=html||''; }

function plain(n){
  const m=MAT[CUR];
  let t=`ARGOS — ${m.nom}\n${n.kind||''}\n`;
  if(n.why) t+=`\nPourquoi : ${n.why}\n`;
  t+='\n'; (n.lines||[]).forEach(([l,v])=>{ if(v) t+=`${l.toUpperCase()} : ${v}\n`; });
  if(n.never) t+=`\n/!\\ ${n.never}\n`;
  if(n.more){ t+='\n— En savoir plus —\n'; n.more.forEach(([k,v])=>{ if(/niveau de preuve/i.test(k)) return; if(v) t+=`${k} : ${v}\n`; }); }
  t+=`\nParcours : ${m.nom}${CRUMBS.length?' › '+CRUMBS.join(' › '):''}\nARGOS v10`;
  if(SESSION && SESSION.interne) t+=' — pole-restauration@eveha.fr';
  return masquerInterne(t);
}
