support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Déformation, déchirure ou écrasement par contrainte mécanique — le risque n'est pas chimique."]], "more": [["Post-fouille — lavage", "Lavage doux à l'eau déminéralisée s'il s'agit d'un alliage."], ["Post-fouille — séchage", "Séchage rapide naturel après nettoyage."], ["Post-fouille — conditionnement", "Boîte étanche PP/PE + calage mousse Plastazote."], ["Climat cible", "< 30% (si allié) ; indifférent si or pur (métal inerte) · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06 ; inertie de l'or pur : consensus."], ["Références", "Berducou 1990 ; CTC-06 ; Bergeron, Rémillard 2021"]], "why": "En sépulture ou en dépôt, l'organisation des objets est une donnée : on prélève l'ensemble en bloc, sans séparer.", "never": "Ne jamais : matériaux abrasifs, contraintes physiques directes ou manipulations sans gants.", "next": {"label": "Traitement post-fouille →", "to": "P_AU_01"}}, "MAR_AU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Sous-marin / eau salée — maintenir en eau", "accent": "lab", "why": "Le mobilier gorgé d'eau salée ne doit jamais sécher avant dessalage : la cristallisation des sels fait éclater la matière. Le dessalage se fait en laboratoire, par bains progressifs.", "lines": [["D'abord", "En domaine public maritime, vérifier avec le Drassm et le RO s'il faut remonter l'objet : souvent, on le laisse sur site (réenfouissement, géotextile)."], ["Si remonté", "Maintenir en eau, sans jamais laisser sécher. Petits objets en sachet zippé avec un fond d'eau ; grands objets enroulés de textiles mouillés puis film étanche."], ["Fenêtre", "Urgent — contacter le GAF du pôle subaquatique ou le laboratoire pour le dessalage"]], "never": "Ne jamais laisser sécher l'objet avant son dessalage en laboratoire.", "more": [["Dessalage", "Bains d'eau douce successifs, contrôlés par mesure de la conductivité, sur plusieurs semaines. Seuls l'or et le plomb échappent au dessalage préalable (CTC-06, CTC-12)."], ["Référence", "CTC-12 (milieu subaquatique et sous-marin) ; CTC-06 ; Bergeron & Rémillard 2021"]]}, "AQ_AU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Subaquatique eau douce — maintenir humide", "accent": "accent", "why": "En eau douce, pas de sels marins, mais le dessèchement brutal fait éclater la couche de corrosion. On maintient l'objet humide jusqu'à l'avis de votre GAF ou du pôle restauration.", "lines": [["Geste", "Dégagement extrêmement délicat, à la loupe, avec des outils tendres (buis, bambou) : la vulnérabilité est mécanique, non chimique. Ne jamais redresser ni déplier sur le terrain."], ["Matériel", "Sachet individuel neutre, micro-pince, calage mousse Plastazote."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Fenêtre", "PLUSIEURS MOIS — le risque est mécanique, non chimique."]], "never": "Ne jamais : matériaux abrasifs, contraintes physiques directes ou manipulations sans gants.", "more": [["Références", "Berducou 1990 ; CTC-06 ; Bergeron, Rémillard 2021"]], "next": {"label": "Traitement post-fouille →", "to": "P_AU_01"}}, "P_AU_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Lavage doux à l'eau déminéralisée s'il s'agit d'un alliage."], ["Séchage", "Séchage rapide naturel après nettoyage."], ["Marquage", "Indirect uniquement (étiquette imputrescible au marqueur indélébile)."], ["Conditionnement", "Boîte étanche PP/PE + calage mousse Plastazote."]], "never": "Ne jamais : matériaux abrasifs, contraintes physiques directes ou manipulations sans gants.", "more": [["Climat cible", "< 30% (si allié) ; indifférent si or pur (métal inerte) · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06 ; inertie de l'or pur : consensus."], ["Références", "Berducou 1990 ; CTC-06 ; Bergeron, Rémillard 2021"]]}, "ENTREE_AU_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_AU_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_AU_01"}]}}, "epi": false}, "BGE_01": {"nom": "Bois gorgé d'eau", "cat": "Matières organiques", "urgence": "Urgence", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_BGE_01", "nodes": {"M_BGE_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Mou et spongieux au toucher, très lourd, eau qui perle", "sub": "Bois gorgé d'eau : la cellulose est détruite, seule l'eau soutient encore la structure.", "to": "H_BGE_01", "warn": true, "flag": "urgent"}, {"txt": "Surface qui s'effrite, fibres qui se séparent", "sub": "Assèchement amorcé : le collapsus cellulaire est en cours.", "to": "H_BGE_01", "warn": true, "flag": "urgent"}, {"txt": "Noir, léger, cassant, structure du bois encore lisible", "sub": "Bois carbonisé : support de datation C14 et d'anthracologie, à ne pas contaminer.", "to": "H_BGE_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "H_BGE_01"}]}, "H_BGE_01": {"type": "question", "phase": "Terrain · milieu", "q": "Dans quel état d'humidité est l'objet ?", "help": "Pour ce matériau, l'humidité commande tout : un objet gorgé d'eau qu'on laisse sécher est détruit.", "choices": [{"txt": "Sec / déjà desséché", "sub": "L'objet est sec au dégagement", "to": "C_SEC_BGE_01"}, {"txt": "Humide / semi-humide", "sub": "Frais, souple, non saturé", "flag": "humide", "warn": true, "to": "C_HUM_BGE_01"}, {"txt": "Gorgé d'eau / détrempé", "sub": "Saturé, très fragile", "flag": "gorge", "warn": true, "to": "C_GORGE_BGE_01"}, {"txt": "Sous-marin / eau salée", "sub": "Mer, estran, résurgence salée", "warn": true, "to": "MAR_BGE_01"}]}, "C_SEC_BGE_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel + boîte rigide (ne pas comprimer)", "accent": "accent", "lines": [["Geste", "Bois desséché ou charbonneux : matériau léger et très cassant, à ne jamais serrer ni empiler. Ramasser à la main ou à la truelle propre, déposer sans compression dans une boîte rigide. NE PAS LAVER. ATTENTION ANALYSES : le charbon de bois est le support privilégié de la datation C14 et de l'anthracologie. Ne pas manipuler à mains nues, ne pas utiliser de sachet plastique pour l'échantillon destiné au C14 (préférer feuille d'aluminium ou pilulier en verre), et proscrire tout contact avec une matière carbonée moderne (cigarette, papier, charbon de barbecue)."], ["Matériel", "Boîte rigide, feuille d'aluminium ou pilulier en verre (C14), gants, truelle propre."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES HEURES — le collapsus cellulaire est irréversible dès le début de l'évaporation."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Collapsus cellulaire en quelques heures : retrait massif, fissuration, déformation, l'objet ne reprend jamais sa forme."]], "more": [["Post-fouille — lavage", "Lavage très doux sous filet d'eau."], ["Post-fouille — séchage", "SÉCHAGE INTERDIT (lyophilisation par spécialiste)."], ["Post-fouille — conditionnement", "Gaines hermétiques soudées (saturation en eau)."], ["Climat cible", "100% (immergé) · 4 °C"], ["Niveau de preuve", "NORME — CTC-01 (maintien en immersion, 4 °C)."], ["Références", "Berducou 1990 ; Scholl 2015 ; CTC-01"]], "never": "Ne jamais : chiffons en coton (développement fongique).", "next": {"label": "Traitement post-fouille →", "to": "P_BGE_01"}}, "C_HUM_BGE_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Maintien hydrique + support rigide", "accent": "accent", "lines": [["Geste", "Bois humide sans être saturé : état instable et transitoire. Ne pas laisser sécher à l'air libre. Placer sur un support rigide en PP, envelopper en sachet étanche et maintenir au frais jusqu'à l'expertise. Faire trancher rapidement par votre GAF ou le pôle restauration entre séchage lent contrôlé et remise en saturation."], ["Matériel", "Support PP cannelé, sachet Zip étanche, glacière."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES HEURES — le collapsus cellulaire est irréversible dès le début de l'évaporation."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Collapsus cellulaire en quelques heures : retrait massif, fissuration, déformation, l'objet ne reprend jamais sa forme."]], "more": [["Post-fouille — lavage", "Lavage très doux sous filet d'eau."], ["Post-fouille — séchage", "SÉCHAGE INTERDIT (lyophilisation par spécialiste)."], ["Post-fouille — conditionnement", "Gaines hermétiques soudées (saturation en eau)."], ["Climat cible", "100% (immergé) · 4 °C"], ["Niveau de preuve", "NORME — CTC-01 (maintien en immersion, 4 °C)."], ["Références", "Berducou 1990 ; Scholl 2015 ; CTC-01"]], "why": "Objet semi-humide : ni séchage brutal, ni remise en eau. On stabilise l'état et on transmet vite.", "never": "Ne jamais : chiffons en coton (développement fongique).", "next": {"label": "Traitement post-fouille →", "to": "P_BGE_01"}}, "C_GORGE_BGE_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Maintien hydrique + Support rigide", "accent": "accent", "lines": [["Geste", "Dégager doucement sans outil métallique. Placer immédiatement sur un support rigide en polypropylène (éviter le bois, y compris contreplaqué marine : colles et biocides). Ne jamais laisser sécher : l'évaporation provoque le collapsus cellulaire en quelques heures. Maintenir humide avec l'eau du site."], ["Matériel", "Support PP cannelé, film plastique, linges synthétiques mouillés (pas de coton), eau du site."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES HEURES — le collapsus cellulaire est irréversible dès le début de l'évaporation."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Collapsus cellulaire en quelques heures : retrait massif, fissuration, déformation, l'objet ne reprend jamais sa forme."]], "more": [["Post-fouille — lavage", "Lavage très doux sous filet d'eau."], ["Post-fouille — séchage", "SÉCHAGE INTERDIT (lyophilisation par spécialiste)."], ["Post-fouille — conditionnement", "Gaines hermétiques soudées (saturation en eau)."], ["Climat cible", "100% (immergé) · 4 °C"], ["Niveau de preuve", "NORME — CTC-01 (maintien en immersion, 4 °C)."], ["Références", "Berducou 1990 ; Scholl 2015 ; CTC-01"]], "why": "Objet gorgé d'eau : sa structure ne tient souvent que par l'eau. Le laisser sécher le détruirait.", "never": "Ne jamais : chiffons en coton (développement fongique).", "next": {"label": "Traitement post-fouille →", "to": "P_BGE_01"}}, "MAR_BGE_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Sous-marin / eau salée — maintenir en eau", "accent": "lab", "why": "Le mobilier gorgé d'eau salée ne doit jamais sécher avant dessalage : la cristallisation des sels fait éclater la matière. Le dessalage se fait en laboratoire, par bains progressifs.", "lines": [["D'abord", "En domaine public maritime, vérifier avec le Drassm et le RO s'il faut remonter l'objet : souvent, on le laisse sur site (réenfouissement, géotextile)."], ["Si remonté", "Maintenir en eau, sans jamais laisser sécher. Petits objets en sachet zippé avec un fond d'eau ; grands objets enroulés de textiles mouillés puis film étanche."], ["Fenêtre", "Urgent — contacter le GAF du pôle subaquatique ou le laboratoire pour le dessalage"]], "never": "Ne jamais laisser sécher l'objet avant son dessalage en laboratoire.", "more": [["Dessalage", "Bains d'eau douce successifs, contrôlés par mesure de la conductivité, sur plusieurs semaines. Seuls l'or et le plomb échappent au dessalage préalable (CTC-06, CTC-12)."], ["Référence", "CTC-12 (milieu subaquatique et sous-marin) ; CTC-06 ; Bergeron & Rémillard 2021"]]}, "P_BGE_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Lavage très doux sous filet d'eau."], ["Séchage", "SÉCHAGE INTERDIT (lyophilisation par spécialiste)."], ["Marquage", "Indirect (étiquette imputrescible agrafée)."], ["Conditionnement", "Gaines hermétiques soudées (saturation en eau)."]], "never": "Ne jamais : chiffons en coton (développement fongique).", "more": [["Climat cible", "100% (immergé) · 4 °C"], ["Niveau de preuve", "NORME — CTC-01 (maintien en immersion, 4 °C)."], ["Références", "Berducou 1990 ; Scholl 2015 ; CTC-01"]]}, "ENTREE_BGE_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_BGE_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_BGE_01"}]}}, "epi": false}, "CU_R_01": {"nom": "Cuir et fourrure", "cat": "Matières organiques", "urgence": "Urgence", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_CU_R_01", "nodes": {"M_CU_R_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Brun foncé, pouvant être confondu avec le sédiment", "sub": "Cuir humide.", "to": "H_CU_R_01", "flag": "lecture_milieu"}, {"txt": "Noir ou brun très foncé, pouvant être confondu avec le sédiment", "sub": "Cuir complètement gorgé d'eau, de consistance gélatineuse.", "to": "H_CU_R_01", "warn": true, "flag": "urgent"}, {"txt": "Aspect entier, régulier et stable", "sub": "Cuir en état de conservation satisfaisant.", "to": "H_CU_R_01"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "H_CU_R_01"}]}, "H_CU_R_01": {"type": "question", "phase": "Terrain · milieu", "q": "Dans quel état d'humidité est l'objet ?", "help": "Pour ce matériau, l'humidité commande tout : un objet gorgé d'eau qu'on laisse sécher est détruit.", "choices": [{"txt": "Sec / déjà desséché", "sub": "L'objet est sec au dégagement", "to": "C_SEC_CU_R_01"}, {"txt": "Humide / semi-humide", "sub": "Frais, souple, non saturé", "flag": "humide", "warn": true, "to": "C_HUM_CU_R_01"}, {"txt": "Gorgé d'eau / détrempé", "sub": "Saturé, très fragile", "flag": "gorge", "warn": true, "to": "C_GORGE_CU_R_01"}, {"txt": "Sous-marin / eau salée", "sub": "Mer, estran, résurgence salée", "warn": true, "to": "MAR_CU_R_01"}]}, "C_SEC_CU_R_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel à plat", "accent": "accent", "lines": [["Geste", "Cuir déjà desséché, souvent rigide et recroquevillé : ne jamais tenter de le déplier ni de le réhumidifier sur le terrain, l'opération relève de votre GAF ou du pôle restauration. Prélever à plat, sans contrainte mécanique."], ["Matériel", "Plaque PP, boîte rigide, mousse Plastazote."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES HEURES — durcissement et rétraction irréversibles à l'air libre."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Contraction volumétrique, plissement et distorsion de la surface, délamination puis exfoliation, efflorescences blanches — et à terme perte de l'objet."]], "more": [["Post-fouille — lavage", "Lavage à l'eau froide exclusivement."], ["Post-fouille — séchage", "Séchage interdit à l'air libre (lyophilisation)."], ["Post-fouille — conditionnement", "Boîtes hermétiques au frais et obscurité totale."], ["Climat cible", "50-60% · 5 °C"], ["Niveau de preuve", "NORME — CTC-02 (50-60 % pour cuirs gorgés traités ; 40 % pour semi-humides)."], ["Références", "Chahine 2013 ; CTC-02 ; Malea et al. 2012"]], "never": "Ne jamais : colles dures vinyliques ou solvants dégraissants.", "next": {"label": "Traitement post-fouille →", "to": "P_CU_R_01"}}, "C_HUM_CU_R_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement sur support plan + séchage lent contrôlé", "accent": "accent", "lines": [["Geste", "Cuir semi-humide : ne jamais plier, ne pas laisser sécher brutalement (durcissement et rétraction irréversibles). Faire glisser à plat sur une plaque neutre et conditionner en sachet étanche au frais. La conservation à long terme d'un cuir semi-humide vise une HR stable de 40 % (CTC-02), distincte des 50-60 % des cuirs gorgés d'eau traités."], ["Matériel", "Plaque PP, sachet Zip double, glacière."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES HEURES — durcissement et rétraction irréversibles à l'air libre."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Contraction volumétrique, plissement et distorsion de la surface, délamination puis exfoliation, efflorescences blanches — et à terme perte de l'objet."]], "more": [["Post-fouille — lavage", "Lavage à l'eau froide exclusivement."], ["Post-fouille — séchage", "Séchage interdit à l'air libre (lyophilisation)."], ["Post-fouille — conditionnement", "Boîtes hermétiques au frais et obscurité totale."], ["Climat cible", "50-60% · 5 °C"], ["Niveau de preuve", "NORME — CTC-02 (50-60 % pour cuirs gorgés traités ; 40 % pour semi-humides)."], ["Références", "Chahine 2013 ; CTC-02 ; Malea et al. 2012"]], "why": "Objet semi-humide : ni séchage brutal, ni remise en eau. On stabilise l'état et on transmet vite.", "never": "Ne jamais : colles dures vinyliques ou solvants dégraissants.", "next": {"label": "Traitement post-fouille →", "to": "P_CU_R_01"}}, "C_GORGE_CU_R_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement sur support plan", "accent": "accent", "lines": [["Geste", "Ne jamais plier. Faire glisser à plat sur une plaque plastique neutre. Envelopper hermétiquement et maintenir au froid (4-5 °C) à l'obscurité. Ne pas ajouter de biocide."], ["Matériel", "Plaque PP, sachet Zip double sans air, eau douce froide, glacière."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES HEURES — durcissement et rétraction irréversibles à l'air libre."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Contraction volumétrique, plissement et distorsion de la surface, délamination puis exfoliation, efflorescences blanches — et à terme perte de l'objet."]], "more": [["Post-fouille — lavage", "Lavage à l'eau froide exclusivement."], ["Post-fouille — séchage", "Séchage interdit à l'air libre (lyophilisation)."], ["Post-fouille — conditionnement", "Boîtes hermétiques au frais et obscurité totale."], ["Climat cible", "50-60% · 5 °C"], ["Niveau de preuve", "NORME — CTC-02 (50-60 % pour cuirs gorgés traités ; 40 % pour semi-humides)."], ["Références", "Chahine 2013 ; CTC-02 ; Malea et al. 2012"]], "why": "Objet gorgé d'eau : sa structure ne tient souvent que par l'eau. Le laisser sécher le détruirait.", "never": "Ne jamais : colles dures vinyliques ou solvants dégraissants.", "next": {"label": "Traitement post-fouille →", "to": "P_CU_R_01"}}, "MAR_CU_R_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Sous-marin / eau salée — maintenir en eau", "accent": "lab", "why": "Le mobilier gorgé d'eau salée ne doit jamais sécher avant dessalage : la cristallisation des sels fait éclater la matière. Le dessalage se fait en laboratoire, par bains progressifs.", "lines": [["D'abord", "En domaine public maritime, vérifier avec le Drassm et le RO s'il faut remonter l'objet : souvent, on le laisse sur site (réenfouissement, géotextile)."], ["Si remonté", "Maintenir en eau, sans jamais laisser sécher. Petits objets en sachet zippé avec un fond d'eau ; grands objets enroulés de textiles mouillés puis film étanche."], ["Fenêtre", "Urgent — contacter le GAF du pôle subaquatique ou le laboratoire pour le dessalage"]], "never": "Ne jamais laisser sécher l'objet avant son dessalage en laboratoire.", "more": [["Dessalage", "Bains d'eau douce successifs, contrôlés par mesure de la conductivité, sur plusieurs semaines. Seuls l'or et le plomb échappent au dessalage préalable (CTC-06, CTC-12)."], ["Référence", "CTC-12 (milieu subaquatique et sous-marin) ; CTC-06 ; Bergeron & Rémillard 2021"]]}, "P_CU_R_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Lavage à l'eau froide exclusivement."], ["Séchage", "Séchage interdit à l'air libre (lyophilisation)."], ["Marquage", "Indirect (étiquette imputrescible en sous-sachet scellé)."], ["Conditionnement", "Boîtes hermétiques au frais et obscurité totale."]], "never": "Ne jamais : colles dures vinyliques ou solvants dégraissants.", "more": [["Climat cible", "50-60% · 5 °C"], ["Niveau de preuve", "NORME — CTC-02 (50-60 % pour cuirs gorgés traités ; 40 % pour semi-humides)."], ["Références", "Chahine 2013 ; CTC-02 ; Malea et al. 2012"]]}, "ENTREE_CU_R_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_CU_R_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_CU_R_01"}]}}, "epi": false}, "FIB_01": {"nom": "Fibres travaillées (textile, vannerie, cordage)", "cat": "Matières organiques", "urgence": "Urgence", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_FIB_01", "nodes": {"M_FIB_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Masse fibreuse sombre, molle, solidaire du sédiment", "sub": "Fibres gorgées d'eau : l'armure ne tient que par l'eau interstitielle.", "to": "H_FIB_01", "warn": true, "flag": "urgent"}, {"txt": "Empreinte de tissage visible sur ou dans la corrosion d'un objet métallique", "sub": "Pseudomorphose minéralisée : le textile n'existe plus que sous cette forme. Ne jamais séparer du métal.", "to": "H_FIB_01", "warn": true, "flag": "urgent"}, {"txt": "Fibres noires, cassantes, pulvérulentes", "sub": "Textile carbonisé : extrêmement friable.", "to": "H_FIB_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "H_FIB_01"}]}, "H_FIB_01": {"type": "question", "phase": "Terrain · milieu", "q": "Dans quel état d'humidité est l'objet ?", "help": "Pour ce matériau, l'humidité commande tout : un objet gorgé d'eau qu'on laisse sécher est détruit.", "choices": [{"txt": "Sec / déjà desséché", "sub": "L'objet est sec au dégagement", "to": "C_SEC_FIB_01"}, {"txt": "Humide / semi-humide", "sub": "Frais, souple, non saturé", "flag": "humide", "warn": true, "to": "C_HUM_FIB_01"}, {"txt": "Gorgé d'eau / détrempé", "sub": "Saturé, très fragile", "flag": "gorge", "warn": true, "to": "C_GORGE_FIB_01"}, {"txt": "Sous-marin / eau salée", "sub": "Mer, estran, résurgence salée", "warn": true, "to": "MAR_FIB_01"}]}, "C_SEC_FIB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en bloc, sans contact direct", "accent": "accent", "lines": [["Geste", "Textiles carbonisés, ou pseudomorphoses minéralisées au contact d'un objet métallique corrodé. Extrêmement friables : ne jamais brosser ni dépoussiérer. Prélever en bloc avec leur support (y compris l'objet métallique associé, qui ne doit surtout pas en être séparé sur le terrain). Micro-fouille en laboratoire."], ["Matériel", "Plaque PP rigide, boîte rigide, mousse Plastazote, film étirable."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES HEURES — l'armure du tissage se disloque dès l'assèchement."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Dislocation de l'armure du tissage et pulvérisation des fibres dès l'assèchement."]], "more": [["Post-fouille — lavage", "INTERDICTION DE LAVER. Dégagement à sec ou par capillarité."], ["Post-fouille — séchage", "SÉCHAGE INTERDIT à l'air libre si gorgé d'eau (lyophilisation)."], ["Post-fouille — conditionnement", "Boîtes étanches + calage sur mesure en mousse Plastazote."], ["Climat cible", "50-60% · 18-20 °C"], ["Niveau de preuve", "CONSENSUS — Bergeron & Rémillard 2021 (40-60 % pour fibres et textiles)."], ["Références", "Bergeron, Rémillard 2021 ; Senge et Carrlee 2013"]], "never": "Ne jamais : manipulations directes, séchage rapide, colles dures (type vinylique).", "next": {"label": "Traitement post-fouille →", "to": "P_FIB_01"}}, "C_HUM_FIB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en motte, sachet sans air", "accent": "accent", "lines": [["Geste", "Ne pas brosser, ne pas laver, ne pas déplier. Prélever en bloc avec le sédiment d'origine et maintenir au frais à l'obscurité sans laisser sécher : l'armure du tissage ne tient souvent que par l'humidité résiduelle."], ["Matériel", "Plaque PP rigide, sachet Zip double sans air, glacière."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES HEURES — l'armure du tissage se disloque dès l'assèchement."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Dislocation de l'armure du tissage et pulvérisation des fibres dès l'assèchement."]], "more": [["Post-fouille — lavage", "INTERDICTION DE LAVER. Dégagement à sec ou par capillarité."], ["Post-fouille — séchage", "SÉCHAGE INTERDIT à l'air libre si gorgé d'eau (lyophilisation)."], ["Post-fouille — conditionnement", "Boîtes étanches + calage sur mesure en mousse Plastazote."], ["Climat cible", "50-60% · 18-20 °C"], ["Niveau de preuve", "CONSENSUS — Bergeron & Rémillard 2021 (40-60 % pour fibres et textiles)."], ["Références", "Bergeron, Rémillard 2021 ; Senge et Carrlee 2013"]], "why": "Objet semi-humide : ni séchage brutal, ni remise en eau. On stabilise l'état et on transmet vite.", "never": "Ne jamais : manipulations directes, séchage rapide, colles dures (type vinylique).", "next": {"label": "Traitement post-fouille →", "to": "P_FIB_01"}}, "C_GORGE_FIB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en motte, sachet sans air", "accent": "accent", "lines": [["Geste", "Ne pas brosser, ne pas laver, ne pas plier. Prélever en bloc avec son sédiment d'origine : la structure ne tient souvent que par l'eau interstitielle. Conserver au réfrigérateur à l'obscurité."], ["Matériel", "Plaque PP rigide, sachet Zip double sans air (chassé par immersion), glacière."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES HEURES — l'armure du tissage se disloque dès l'assèchement."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Dislocation de l'armure du tissage et pulvérisation des fibres dès l'assèchement."]], "more": [["Post-fouille — lavage", "INTERDICTION DE LAVER. Dégagement à sec ou par capillarité."], ["Post-fouille — séchage", "SÉCHAGE INTERDIT à l'air lib nce confinée sous contrôle d'un spécialiste."], ["Post-fouille — conditionnement", "Boîtes étanches PP/PE + calage sur mesure en mousse Plastazote."], ["Climat cible", "50-60% (très stable) · 18-20 °C"], ["Niveau de preuve", "NORME — CTC-05 prescrit de traiter les artefacts en lignite, bien que minéraux, comme des objets organiques (renvoi à CTC-01). CTC-01 précise que le lignite est un bois fossilisé largement minéralisé (55-75 % de carbone), anisotrope, très sensible aux variations hygrométriques mais peu sensible aux attaques chimiques ou biologiques."], ["Références", "Berducou 1990 ; CTC-05 ; CTC-01"]], "never": "Ne jamais : séchage rapide, exposition au soleil, solvants organiques (solubles).", "next": {"label": "Traitement post-fouille →", "to": "P_LIG_01"}}, "C_HUM_LIG_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Enveloppement étanche + mise au frais immédiate", "accent": "accent", "lines": [["Geste", "Ne pas laver. Envelopper rapidement dans du film étirable pour conserver l'état hydrique d'exhumation (exfoliation et fendillement à l'évaporation). Placer au frais."], ["Matériel", "Film étirable, double sachet Zip étanche superposé, glacière."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES JOURS — exfoliation à l'évaporation."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Fendillement et exfoliation à l'évaporation, jusqu'à la désagrégation."]], "more": [["Post-fouille — lavage", "INTERDICTION DE LAVER. Dégagement à sec sous loupe binoculaire."], ["Post-fouille — séchage", "Séchage extrêmement lent en ambiance confinée sous contrôle d'un spécialiste."], ["Post-fouille — conditionnement", "Boîtes étanches PP/PE + calage sur mesure en mousse Plastazote."], ["Climat cible", "50-60% (très stable) · 18-20 °C"], ["Niveau de preuve", "NORME — CTC-05 prescrit de traiter les artefacts en lignite, bien que minéraux, comme des objets organiques (renvoi à CTC-01). CTC-01 précise que le lignite est un bois fossilisé largement minéralisé (55-75 % de carbone), anisotrope, très sensible aux variations hygrométriques mais peu sensible aux attaques chimiques ou biologiques."], ["Références", "Berducou 1990 ; CTC-05 ; CTC-01"]], "why": "Objet semi-humide : ni séchage brutal, ni remise en eau. On stabilise l'état et on transmet vite.", "never": "Ne jamais : séchage rapide, exposition au soleil, solvants organiques (solubles).", "next": {"label": "Traitement post-fouille →", "to": "P_LIG_01"}}, "C_GORGE_LIG_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Enveloppement étanche + mise au frais immédiate", "accent": "accent", "lines": [["Geste", "Ne pas laver. Envelopper rapidement dans du film étirable pour conserver l'état hydrique d'exhumation (exfoliation et fendillement à l'évaporation). Placer au frais."], ["Matériel", "Film étirable, double sachet Zip étanche superposé, glacière."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES JOURS — exfoliation à l'évaporation."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré,
