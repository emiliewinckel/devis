:root{
  /* ---- fond noir chaud, accordé au logo ---- */
  --ground:#0D0A06; --paper:#1C1610; --paper-haut:#272018;
  --ink:#F2EAE0; --muted:#A89886;
  --line:#4A4034; --line-fort:#726352;
  /* ---- orange ARGOS : couleur de guidage ---- */
  --accent:#F09A27; --accent-vif:#FFB04A; --sur-accent:#241703;
  --accent-soft:#2A2012; --accent-bord:#5E4722; --accent-txt:#F3C98A;
  /* ---- rouge : interdiction, alerte ---- */
  --stop:#E8695C; --stop-plein:#A8352B; --stop-soft:#2E1511; --stop-bord:#6B2B22;
  --stop-txt:#F6B3AC; --sur-stop:#FFF3F1;
  /* ---- pronostic ---- */
  --prono:#241C12; --prono-lab:#C9A472; --prono-val:#DCC9AF;
  --argos-or:#F09A27; --argos-nuit:#0D0A06;
  --sans:'Manrope',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:'Manrope',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:'Manrope',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:40;background:var(--ground);border-bottom:1px solid var(--line)}
.strata{display:flex;height:5px}.strata i{flex:1}
.hbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:7px 16px;max-width:680px;margin:0 auto}
.marque-b{justify-self:start;height:46px;width:46px;padding:0;border:none;background:transparent no-repeat center/contain;
  cursor:pointer;border-radius:50%;display:block}
.marque-b:hover{opacity:.85}
.marque-b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hbar .tag{justify-self:center;text-align:center}
.hbar .mini{justify-self:end}
.logo{font-family:var(--sans);font-size:19px;font-weight:800;letter-spacing:.17em;color:var(--ink)}
.tag{font-family:var(--sans);font-weight:600;font-size:10.5px;color:var(--muted);letter-spacing:.07em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.sp{margin-left:auto}
.mini{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.05em;background:none;border:1px solid var(--line);
  color:var(--muted);padding:5px 9px;border-radius:2px;cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.trail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0 6px;font-family:var(--sans);font-weight:500;
  font-size:10.5px;color:var(--muted);letter-spacing:.03em;min-height:16px}
.trail .c{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:5px 9px;
  max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--muted);
  cursor:pointer;-webkit-appearance:none;appearance:none;line-height:1.3;
  transition:border-color .12s,color .12s,background .12s}
.trail .c:hover,.trail .c:focus-visible{border-color:var(--accent);color:var(--accent);

:root{ --argos-or:#F09A27; --argos-nuit:#1D1206; }

information qui disparaît si on les sépare.", "choices": [{"txt": "Oui, associé ou en connexion", "sub": "Plusieurs éléments liés, disposés ensemble", "warn": true, "to": "C_MOTTE_ASSOC"}, {"txt": "Non, objet isolé", "sub": "Seul dans la couche, sans lien visible", "to": "T1"}, {"txt": "Je ne sais pas", "sub": "Dans le doute, on préserve l'ensemble", "warn": true, "to": "C_MOTTE_ASSOC"}]}, "T1": {"type": "question", "phase": "Terrain · aspect", "q": "Regardez la surface de l'objet.", "help": "Ne testez pas à l'aimant : un fer entièrement minéralisé n'y réagit pas mais reste actif. Fiez-vous à ce que vous voyez.", "choices": [{"txt": "Aspect uniforme", "sub": "Surface régulière, sans altération visible", "to": "T2"}, {"txt": "Éclatements, poudre orangée ou gouttes rouges", "sub": "Signes de corrosion active : l'objet se dégrade, il faudra le traiter vite", "warn": true, "to": "T2", "flag": "urgent"}]}, "T2": {"type": "question", "phase": "Terrain · cohésion", "q": "Les fragments tiennent-ils ensemble ?", "help": "Regardez si l'objet garde sa forme d'un seul tenant, ou si des morceaux se détachent.", "choices": [{"txt": "Oui, d'un seul tenant", "sub": "L'objet garde sa forme", "to": "T3"}, {"txt": "Non, ils se désolidarisent", "sub": "Des morceaux bougent ou risquent de se déplacer → risque de perte d'informations scientifiques", "warn": true, "to": "C_MOTTE"}]}, "T3": {"type": "question", "phase": "Terrain · dégagement", "q": "L'objet se soulève-t-il d'un seul bloc, sans forcer ?", "help": "Il doit être entièrement dégagé et tenir de lui-même.", "choices": [{"txt": "Oui, dégagé et solidaire", "sub": "Je peux le prendre sans qu'il se casse", "to": "C_SEC"}, {"txt": "Non, encore engagé ou je dois forcer", "sub": "Une partie est prise dans la terre", "warn": true, "to": "C_MOTTE"}]}, "C_SEC": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage à sec", "accent": "accent", "lines": [["Geste", "Ramasser à la main, sans brosser ni laver. Sécher lentement à l'abri, jamais au soleil."], ["Matériel", "Sachet neutre · boîte hermétique · gel de silice sec"], ["Sachet — perforer", "Percer le sachet zip de quelques trous (pointe de scalpel ou de compas), en haut du sachet et sans toucher l'objet. En caisse de chantier, la température chute le soir dans le conteneur non chauffé : l'humidité du sédiment se condense, et un sachet fermé retient alors de l'eau liquide au contact du métal — parfois pendant les semaines qui précèdent le rapatriement. Cette eau liquide est l'électrolyte qui fait tourner la corrosion en continu ; quelques trous suffisent à la laisser s'évacuer. NE PAS PERFORER dans trois cas : objet encore mouillé (le sécher d'abord à l'abri, puis perforer) · mise en gaine sous vide · conditionnement humide volontaire de moins de 48 h."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé ou pulvérulent — la pression l'écraserait. Vide partiel seulement, sur support rigide et avec calage. Une gaine qui se regonfle a perdu son étanchéité."], ["Fenêtre", "Quelques jours"], ["Si rien n'est fait", "Reprise de la corrosion : fines fissures longitudinales, puis délamination des couches, détachement de portions ovoïdes, et éclatement de la surface d'origine."]], "never": "Ne jamais apporter d'eau, consolider ni brosser l'objet.", "next": {"label": "Traitement post-fouille →", "to": "P1"}}, "C_MOTTE": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en motte", "accent": "accent", "why": "Les fragments ne tiennent plus ensemble : on prélève tout le bloc pour préserver la forme, la lisibilité et les informations scientifiques de l'objet.", "lines": [["Geste", "Détourer la terre autour de l'objet, glisser une plaque dessous, lever le bloc entier. Garder ≤ 5 cm d'épaisseur pour la radiographie."], ["Matériel", "Plaque PP rigide · film étirable · ruban armé · sachet"], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé ou pulvérulent — la pression l'écraserait. Vide partiel seulement, sur support rigide et avec calage. Une gaine qui se regonfle a perdu son étanchéité."], ["Fenêtre", "Quelques jours — signaler à votre GAF ou au pôle restauration"], ["Si rien n'est fait", "Reprise de la corrosion : fines fissures longitudinales, puis délamination des couches, détachement de portions ovoïdes, et éclatement de la surface d'origine."]], "never": "Ne jamais dégager, brosser ni laver l'objet. Ne pas le toucher directement.", "next": {"label": "Traitement post-fouille →", "to": "P1"}}, "C_MOTTE_ASSOC": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en bloc — ensemble associé", "accent": "accent", "why": "En sépulture ou en dépôt, l'organisation des objets entre eux est une donnée archéologique. En les séparant sur le terrain, on perd cette information définitivement. On prélève l'ensemble en un bloc.", "lines": [["Avant", "Photographier et relever la position en place avant tout prélèvement. Signaler au responsable d'opération et, si des restes humains sont présents, à l'archéo-anthropologue."], ["Geste", "Détourer l'ensemble sans séparer les éléments. Glisser une plaque rigide dessous et lever le bloc entier avec son sédiment. Garder ≤ 5 cm sous les objets pour la radiographie."], ["Matériel", "Plaque PP rigide · film étirable · bandes de plâtre ou mousse expansive si le bloc est lourd · sachet"], ["Fenêtre", "Quelques jours — micro-fouille en laboratoire, sous la conduite d'un conservateur-restaurateur"]], "never": "Ne jamais séparer les éléments, les nettoyer ni les laver sur le terrain.", "next": {"label": "Traitement post-fouille →", "to": "P1"}}, "C_GORGE": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Milieu gorgé d'eau — maintenir humide", "accent": "accent", "why": "En milieu gorgé d'eau, le fer est souvent associé à des matériaux organiques (bois, cuir, textile) invisibles sous la corrosion. Les faire sécher les détruirait. On maintient l'objet dans son état humide jusqu'au laboratoire.", "lines": [["Geste", "Prélever l'objet avec son sédiment, sans le nettoyer ni tenter de le dégager. Le maintenir humide (linge synthétique mouillé, eau du site) dès la sortie de terre."], ["Matériel", "Boîte ou sachet étanche · sédiment du site · linge synthétique mouillé · plaque rigide"], ["Séchage", "Ne pas sécher : conditionnement humide, à l'obscurité et au frais, transmission rapide à votre GAF ou au pôle restauration."], ["Fenêtre", "Quelques heures si des organiques sont présents — l'assèchement les détruit vite"]], "never": "Ne jamais laisser sécher, brosser ni séparer l'objet de son sédiment.", "next": {"label": "Traitement post-fouille →", "to": "P1"}}, "C_SUBAQ": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Subaquatique eau douce — maintenir humide", "accent": "accent", "why": "En eau douce, l'objet n'est pas chargé de sels marins : le risque immédiat n'est pas la corrosion cyclique par les chlorures, mais le dessèchement brutal qui fait éclater la couche de corrosion et détruit les éventuels matériaux organiques associés.", "lines": [["Geste", "Prélever l'objet avec son sédiment, sans le nettoyer ni le dégager. Le maintenir humide dès la sortie de l'eau (eau du site, linge synthétique mouillé)."], ["Matériel", "Boîte ou sachet étanche · eau du site · linge synthétique mouillé · plaque rigide"], ["Séchage", "Ne pas laisser sécher brutalement. Un stockage à l'air reste possible avec précautions, mais l'arbitrage revient à votre GAF ou au pôle restauration."], ["Fenêtre", "Quelques heures si des organiques sont associés — l'assèchement les détruit vite"]], "never": "Ne jamais laisser sécher brutalement, brosser ni séparer l'objet de son sédiment.", "more": [["Différence avec le sous-marin", "En eau douce, pas de chlorures marins : le stockage à l'air est envisageable après avis. En eau salée, l'immersion est impérative et le séchage interdit."], ["Référence", "CTC-12 (milieu subaquatique et sous-marin) ; Bergeron & Rémillard 2021"]]}, "C_MARINE": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Sous-marin / eau salée — maintenir en eau", "accent": "lab", "why": "En eau salée, le fer est chargé de chlorures : il entre en corrosion cyclique dès qu'il sèche, et sa forme, inscrite dans la couche de corrosion, éclate. La gangue de concrétion le protège et contient parfois son empreinte — elle ne se retire qu'en laboratoire.", "lines": [["D'abord", "En domaine public maritime, vérifier auprès du Drassm et du responsable d'opération s'il faut remonter l'objet : souvent, on le laisse sur site (réenfouissement, géotextile). Ne remonter que sur décision."], ["Si remonté", "Maintenir en eau, sans jamais laisser sécher. Eau douce de préférence ; à défaut, eau du site quelques heures. Petits objets en sachet zippé avec un fond d'eau ; grands objets enroulés de textiles mouillés puis film étanche."], ["Gangue", "Ne pas retirer la concrétion : elle protège l'objet et sera dégagée en laboratoire. Radiographie pour visualiser l'objet dessous."], ["Fenêtre", "Urgent — contacter le GAF du pôle subaquatique ou le laboratoire ; en milieu marin, la cellule de conservation compétente"]], "never": "Ne jamais laisser sécher, déganguer, brosser ni nettoyer l'objet.", "more": [["Eau salée / eau douce", "Eau salée (mer, résurgence salée) : immersion impérative. Eau douce (rivière, lac) : stockage à l'air possible avec précautions, mais l'objet reste gorgé d'eau."], ["Référence", "CTC-12 (milieu subaquatique et sous-marin) ; Bergeron & Rémillard 2021 ; guide Drassm"]]}, "P1": {"type": "question", "phase": "Post-fouille · radiographie", "q": "L'objet a-t-il été radiographié ?", "help": "Tout n'est pas systématiquement radiographié : parfois le spécialiste préfère préserver le budget. Ce n'est pas un blocage.", "choices": [{"txt": "Oui", "to": "P2"}, {"txt": "Non, ou je ne sais pas", "sub": "Vérifier avec le spécialiste ou le RO si des radiographies sont prévues", "to": "P2"}]}, "P2": {"type": "question", "phase": "Post-fouille · état", "q": "L'objet présente-t-il une corrosion active ?", "help": "Signes visibles : exsudats, poudre orangée, éclatements, gonflements. Le chlorure de fer se développe aussi en milieu terrestre, pas seulement en bord de mer.", "choices": [{"txt": "Oui, corrosion active", "warn": true, "to": "P2_OUI"}, {"txt": "Non, pas de signe visible", "sub": "Attention : l'absence de signe ne garantit pas la stabilité", "to": "P2_NON"}]}, "P2_OUI": {"type": "question", "phase": "Post-fouille · déchloruration", "q": "Une déchloruration est-elle prévue ?", "help": "À vérifier avec le spécialiste ou le RO.", "choices": [{"txt": "Oui", "sub": "Le traitement se fera en atelier", "to": "ISSUE_LABO"}, {"txt": "Non", "sub": "L'objet reste en conditionnement", "to": "P3_STRICT"}]}, "P2_NON": {"type": "question", "phase": "Post-fouille · déchloruration", "q": "Une déchloruration est-elle prévue ?", "help": "À vérifier avec le spécialiste ou le RO.", "choices": [{"txt": "Oui", "sub": "Le traitement se fera en atelier", "to": "ISSUE_LABO"}, {"txt": "Non", "sub": "L'objet reste en conditionnement", "to": "P3_SURVEILLE"}]}, "ISSUE_LABO": {"type": "consigne", "phase": "Post-fouille · orientation", "kind": "Envoyer au laboratoire de restauration", "accent": "lab", "why": "Une déchloruration est prévue : l'objet ne doit pas être conditionné pour le long terme ici. Il part en atelier pour traitement.", "lines": [["À faire", "Conditionner provisoirement au sec, à l'abri des chocs, et transmettre au laboratoire de restauration."], ["Contact", "pôle conservation-restauration — pole-restauration@eveha.fr"]], "never": "Ne jamais laver, sécher ni traiter l'objet avant son passage en atelier."}, "P3_STRICT": {"type": "consigne", "phase": "Post-fouille · conditionnement", "kind": "Conditionnement HR < 15 % stricte", "accent": "accent", "why": "Corrosion active sans déchloruration prévue : il faut priver le fer de toute humidité pour bloquer la réaction. Le seuil de 15 % est impératif, pas indicatif.", "lines": [["Lavage", "Ne pas laver. Nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé."], ["Séchage", "Mettre dans la pièce à atmosphère contrôlée de l'agence."], ["Marquage", "Indirect, étiquette imputrescible, jamais sur l'objet."], ["Condition.", "HR < 15 % STRICTE : dessiccants ou mise sous vide d'air après abaissement de l'HR sous 15 %. Contrôle régulier. Gaine sous vide pour les éléments hors format, avec dessiccants jusqu'à HR satisfaisante."]], "never": "Ne jamais mettre de bois ni de carton acide au contact de l'objet.", "more": [["Climat SRA cible", "< 15 % HR (fer stable/dessalé) ; < 12 % (corrosion active)"], ["Niveau de preuve", "Expérimental — Watkinson 1987 ; Watkinson & Lewis 2005, cités dans Kramer 2009 ; convergent avec Thickett et al. 2024."], ["Références", "Berducou 1990 ; Réguer et al. 2007 ; CTC-06"]]}, "P3_SURVEILLE": {"type": "consigne", "phase": "Post-fouille · conditionnement", "kind": "Conditionnement HR < 30 %", "accent": "accent", "why": "Pas de corrosion active visible et pas de déchloruration prévue : on maintient un climat sec et on surveille, car la corrosion peut se déclencher plus tard.", "lines": [["Lavage", "Ne pas laver. Nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé."], ["Séchage", "Mettre dans la pièce à atmosphère contrôlée de l'agence."], ["Marquage", "Indirect, étiquette imputrescible, jamais sur l'objet."], ["Condition.", "HR < 30 %. Contrôles réguliers pour anticiper toute reprise de corrosion active. Mise sous vide d'air seulement après abaissement de l'HR sous 30 %. Gaine sous vide pour les éléments hors format, avec dessiccants jusqu'à HR satisfaisante."]], "never": "Ne jamais mettre de bois ni de carton acide au contact de l'objet.", "more": [["Climat SRA cible", "< 30 % HR ; contrôle régulier"], ["Niveau de preuve", "Norme — seuil générique métaux, CTC-06 ; principe de surveillance, Thickett et al. 2024."], ["Références", "Berducou 1990 ; Réguer et al. 2007 ; CTC-06"]]}}, "epi": false}, "CU_01": {"nom": "Alliages cuivreux (bronze, laiton)", "cat": "Métaux", "urgence": "Urgence", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_CU_01", "nodes": {"D_CU_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Vert foncé, couche mince, compacte et lisse, décor bien lisible", "sub": "Patine formée en sol aéré : condition particulièrement favorable.", "to": "K_CU_01", "flag": "lecture_milieu"}, {"txt": "Vert clair avec pustules ou verrues vert foncé, surface rugueuse, perte de détail", "sub": "Sol aéré, humide et acide.", "to": "K_CU_01", "flag": "lecture_milieu"}, {"txt": "Terre adhérente, écaillage, micro-fissures laissant voir une poudre vert clair dessous", "sub": "Condition courante — corrosion ACTIVE (maladie du bronze).", "to": "K_CU_01", "warn": true, "flag": "urgent"}, {"txt": "Gonflement partiel et micro-fissuration de la couche externe", "sub": "Poches de corrosion active sous la surface : la réactivation est amorcée.", "to": "K_CU_01", "warn": true, "flag": "urgent"}, {"txt": "Brun superficiel, couche noire ou taches noires", "sub": "Sol humide.", "to": "K_CU_01", "flag": "lecture_milieu"}, {"txt": "Bleu superficiel avec surface pulvérulente ('sucrée')", "sub": "Sol sec.", "to": "K_CU_01", "flag": "lecture_milieu"}, {"txt": "Objet mince (aiguille, épingle, ardillon de fibule) fortement corrodé", "sub": "Objet largement ou totalement minéralisé : peut casser au dégagement, au levage ou à la mise en sachet.", "to": "K_CU_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "K_CU_01"}]}, "M_CU_01": {"type": "question", "phase": "Terrain · milieu", "q": "Dans quel milieu l'objet était-il enfoui ?", "help": "Le milieu commande la conduite avant même l'état de l'objet. L'eau, surtout salée, change tout.", "choices": [{"txt": "Sec", "sub": "Terre sèche, l'objet n'est pas humide au toucher", "to": "D_CU_01"}, {"txt": "Humide", "sub": "La terre colle, l'objet est frais et humide", "flag": "humide", "to": "D_CU_01"}, {"txt": "Gorgé d'eau", "sub": "Puits, fossé, zone humide non marine", "flag": "gorge", "warn": true, "to": "D_CU_01"}, {"txt": "Subaquatique (eau douce)", "sub": "Rivière, lac, source — eau non salée", "warn": true, "to": "AQ_CU_01"}, {"txt": "Sous-marin / eau salée", "sub": "Mer, estran, épave, résurgence salée", "warn": true, "to": "MAR_CU_01"}]}, "K_CU_01": {"type": "question", "phase": "Terrain · contexte", "q": "Dans quel contexte l'objet a-t-il été découvert ?", "help": "Le contexte dit si l'objet fait partie d'un ensemble dont il faut préserver l'organisation.", "choices": [{"txt": "Standard", "sub": "Habitat, remblai, couche générale", "to": "S1_CU_01"}, {"txt": "Funéraire", "sub": "Sépulture, dépôt funéraire", "flag": "funeraire", "to": "A_CU_01"}, {"txt": "Dépôt / amas", "sub": "Cache, dépôt volontaire, objets groupés", "flag": "depot", "to": "A_CU_01"}, {"txt": "Bâti", "sub": "Pris dans une maçonnerie, un sol, une structure", "flag": "bati", "to": "S1_CU_01"}]}, "A_CU_01": {"type": "question", "phase": "Terrain · association", "q": "L'objet est-il en connexion ou associé à d'autres éléments ?", "help": "En sépulture ou en dépôt, la position relative des objets est une information qui disparaît si on les sépare.", "choices": [{"txt": "Oui, associé ou en connexion", "sub": "Plusieurs éléments liés, disposés ensemble", "warn": true, "to": "C_ASSOC_CU_01"}, {"txt": "Non, objet isolé", "sub": "Seul dans la couche, sans lien visible", "to": "S1_CU_01"}, {"txt": "Je ne sais pas", "sub": "Dans le doute, on préserve l'ensemble", "warn": true, "to": "C_ASSOC_CU_01"}]}, "S1_CU_01": {"type": "question", "phase": "Terrain · aspect", "q": "Regardez la surface de l'objet.", "help": "Malléable d'origine mais fragile et cassant en raison d'une corrosion profonde.", "choices": [{"txt": "Aspect uniforme", "sub": "Surface régulière, sans altération active visible", "to": "S2_CU_01"}, {"txt": "Altération active", "sub": "ALERTE : Maladie du bronze. Pustules poudreuses vert clair très vif ('vert piscine' / para", "warn": true, "to": "S2_CU_01", "flag": "urgent"}]}, "S2_CU_01": {"type": "question", "phase": "Terrain · cohésion", "q": "Les fragments tiennent-ils ensemble ?", "help": "Regardez si l'objet garde sa forme, ou si des morceaux se détachent.", "choices": [{"txt": "Oui, d'un seul tenant", "to": "C_SEC_CU_01"}, {"txt": "Non, ils se désolidarisent", "sub": "Risque de perte d'informations scientifiques", "warn": true, "to": "C_MOTTE_CU_01"}]}, "C_SEC_CU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel + calage souple", "accent": "accent", "lines": [["Geste", "Patine stable, sans pustule vert vif pulvérulente. Ramasser individuellement sans brosser. PROSCRIPTION ABSOLUE d'apporter de l'eau ou un consolidant aqueux in situ. Éviter tout contact avec de l'aluminium humide (pile galvanique)."], ["Matériel", "Sachet individuel neutre, boîte hermétique PP/PE, gel de silice, mousse Plastazote."], ["Sachet — perforer", "Percer le sachet zip de quelques trous (pointe de scalpel ou de compas), en haut du sachet et sans toucher l'objet. En caisse de chantier, la température chute le soir dans le conteneur non chauffé : l'humidité du sédiment se condense, et un sachet fermé retient alors de l'eau liquide au contact du métal — parfois pendant les semaines qui précèdent le rapatriement. Cette eau liquide est l'électrolyte qui fait tourner la corrosion en continu ; quelques trous suffisent à la laisser s'évacuer. NE PAS PERFORER dans trois cas : objet encore mouillé (le sécher d'abord à l'abri, puis perforer) · mise en gaine sous vide · conditionnement humide volontaire de moins de 48 h."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES JOURS si maladie du bronze active ; sinon quelques semaines."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Réactivation de la corrosion active : écaillage continu puis développement d'une poudre vert clair volumineuse, gonflement et micro-fissuration de la couche externe."]], "more": [["Post-fouille — lavage", "NE JAMAIS LAVER À L'EAU, même en l'absence de signe visible d'altération. L'eau réactive les chlorures présents en profondeur dans les couches de corrosion et relance la corrosion active : le dommage ne se voit pas immédiatement, il apparaît des semaines ou des mois plus tard. Nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé. L'éthanol peut être employé pour dégager la surface ou faire apparaître un décor, avec les EPI appropriés (gants nitrile, ventilation, protection oculaire) et à la condition qu'aucun reste organique ne soit associé à l'objet — l'éthanol les déshydraterait irréversiblement."], ["Post-fouille — séchage", "Sécher sans attendre. Séchage à l'air, en pièce à atmosphère contrôlée de l'agence ou en local ventilé, à l'abri du soleil et de toute source de chaleur ; conditionner aussitôt en boîte hermétique avec gel de silice sec. Pas de bain de solvant : il faudrait une hotte aspirante à solvant, dont les agences ne disposent pas."], ["Post-fouille — conditionnement", "Boîte hermétique + Gel de silice."], ["Climat cible", "< 30% · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06 (Ministère de la Culture 2022)."], ["Références", "Berducou 1990 ; Robbiola et al. 1998 ; CTC-06"]], "never": "Ne jamais : eau de lavage (réactive les chlorures). Feuilles d'aluminium mouillées (galvanisme).", "next": {"label": "Traitement post-fouille →", "to": "P_CU_01"}}, "C_MOTTE_CU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en motte (Block-lift) exclusif", "accent": "accent", "lines": [["Geste", "Pustules vert vif (paratacamite), objet fragile ou associé à des restes organiques. PROSCRIPTION ABSOLUE D'APPORTER DE L'EAU ou un consolidant aqueux (Tylose, Primal) in situ : l'eau agit comme électrolyte et réactive les chlorures de cuivre (nantokite), déclenchant la maladie du bronze. Détourer sans toucher l'objet et prélever en bloc avec sa terre d'origine. Micro-fouille et stabilisation exclusivement en laboratoire."], ["Matériel", "Plaque PP rigide, film étirable PE, ruban adhésif toilé, boîte hermétique PP/PE."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES JOURS si maladie du bronze active ; sinon quelques semaines."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Réactivation de la corrosion active : écaillage continu puis développement d'une poudre vert clair volumineuse, gonflement et micro-fissuration de la couche externe."]], "more": [["Post-fouille — lavage", "NE JAMAIS LAVER À L'EAU, même en l'absence de signe visible d'altération. L'eau réactive les chlorures présents en profondeur dans les couches de corrosion et relance la corrosion active : le dommage ne se voit pas immédiatement, il apparaît des semaines ou des mois plus tard. Nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé. L'éthanol peut être employé pour dégager la surface ou faire apparaître un décor, avec les EPI appropriés (gants nitrile, ventilation, protection oculaire) et à la condition qu'aucun reste organique ne soit associé à l'objet — l'éthanol les déshydraterait irréversiblement."], ["Post-fouille — séchage", "Sécher sans attendre. Séchage à l'air, en pièce à atmosphère contrôlée de l'agence ou en local ventilé, à l'abri du soleil et de toute source de chaleur ; conditionner aussitôt en boîte hermétique avec gel de silice sec. Pas de bain de solvant : il faudrait une hotte aspirante à solvant, dont les agences ne disposent pas."], ["Post-fouille — conditionnement", "Boîte hermétique + Gel de silice."], ["Climat cible", "< 30% · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06 (Ministère de la Culture 2022)."], ["Références", "Berducou 1990 ; Robbiola et al. 1998 ; CTC-06"]], "why": "Les fragments ne tiennent plus ensemble : on prélève tout le bloc pour préserver la forme et les informations de l'objet.", "never": "Ne jamais : eau de lavage (réactive les chlorures). Feuilles d'aluminium mouillées (galvanisme).", "next": {"label": "Traitement post-fouille →", "to": "P_CU_01"}}, "C_ASSOC_CU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en bloc — ensemble associé", "accent": "accent", "lines": [["Geste", "Pustules vert vif (paratacamite), objet fragile ou associé à des restes organiques. PROSCRIPTION ABSOLUE D'APPORTER DE L'EAU ou un consolidant aqueux (Tylose, Primal) in situ : l'eau agit comme électrolyte et réactive les chlorures de cuivre (nantokite), déclenchant la maladie du bronze. Détourer sans toucher l'objet et prélever en bloc avec sa terre d'origine. Micro-fouille et stabilisation exclusivement en laboratoire."], ["Matériel", "Plaque PP rigide, film étirable PE, ruban adhésif toilé, boîte hermétique PP/PE."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES JOURS si maladie du bronze active ; sinon quelques semaines."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Réactivation de la corrosion active : écaillage continu puis développement d'une poudre vert clair volumineuse, gonflement et micro-fissuration de la couche externe."]], "more": [["Post-fouille — lavage", "NE JAMAIS LAVER À L'EAU, même en l'absence de signe visible d'altération. L'eau réactive les chlorures présents en profondeur dans les couches de corrosion et relance la corrosion active : le dommage ne se voit pas immédiatement, il apparaît des semaines ou des mois plus tard. Nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé. L'éthanol peut être employé pour dégager la surface ou faire apparaître un décor, avec les EPI appropriés (gants nitrile, ventilation, protection oculaire) et à la condition qu'aucun reste organique ne soit associé à l'objet — l'éthanol les déshydraterait irréversiblement."], ["Post-fouille — séchage", "Sécher sans attendre. Séchage à l'air, en pièce à atmosphère contrôlée de l'agence ou en local ventilé, à l'abri du soleil et de toute source de chaleur ; conditionner aussitôt en boîte hermétique avec gel de silice sec. Pas de bain de solvant : il faudrait une hotte aspirante à solvant, dont les agences ne disposent pas."], ["Post-fouille — conditionnement", "Boîte hermétique + Gel de silice."], ["Climat cible", "< 30% · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06 (Ministère de la Culture 2022)."], ["Références", "Berducou 1990 ; Robbiola et al. 1998 ; CTC-06"]], "why": "En sépulture ou en dépôt, l'organisation des objets est une donnée : on prélève l'ensemble en bloc, sans séparer.", "never": "Ne jamais : eau de lavage (réactive les chlorures). Feuilles d'aluminium mouillées (galvanisme).", "next": {"label": "Traitement post-fouille →", "to": "P_CU_01"}}, "MAR_CU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Sous-marin / eau salée — maintenir en eau", "accent": "lab", "why": "Le mobilier gorgé d'eau salée ne doit jamais sécher avant dessalage : la cristallisation des sels fait éclater la matière. Le dessalage se fait en laboratoire, par bains progressifs.", "lines": [["D'abord", "En domaine public maritime, vérifier avec le Drassm et le RO s'il faut remonter l'objet : souvent, on le laisse sur site (réenfouissement, géotextile)."], ["Si remonté", "Maintenir en eau, sans jamais laisser sécher. Petits objets en sachet zippé avec un fond d'eau ; grands objets enroulés de textiles mouillés puis film étanche."], ["Fenêtre", "Urgent — contacter le GAF du pôle subaquatique ou le laboratoire pour le dessalage"]], "never": "Ne jamais laisser sécher l'objet avant son dessalage en laboratoire.", "more": [["Dessalage", "Bains d'eau douce successifs, contrôlés par mesure de la conductivité, sur plusieurs semaines. Seuls l'or et le plomb échappent au dessalage préalable (CTC-06, CTC-12)."], ["Référence", "CTC-12 (milieu subaquatique et sous-marin) ; CTC-06 ; Bergeron & Rémillard 2021"]]}, "AQ_CU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Subaquatique eau douce — maintenir humide", "accent": "accent", "why": "En eau douce, pas de sels marins, mais le dessèchement brutal fait éclater la couche de corrosion. On maintient l'objet humide jusqu'à l'avis de votre GAF ou du pôle restauration.", "lines": [["Geste", "Pustules vert vif (paratacamite), objet fragile ou associé à des restes organiques. PROSCRIPTION ABSOLUE D'APPORTER DE L'EAU ou un consolidant aqueux (Tylose, Primal) in situ : l'eau agit comme électrolyte et réactive les chlorures de cuivre (nantokite), déclenchant la maladie du bronze. Détourer sans toucher l'objet et prélever en bloc avec sa terre d'origine. Micro-fouille et stabilisation exclusivement en laboratoire."], ["Matériel", "Plaque PP rigide, film étirable PE, ruban adhésif toilé, boîte hermétique PP/PE."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Fenêtre", "QUELQUES JOURS si maladie du bronze active ; sinon quelques semaines."]], "never": "Ne jamais : eau de lavage (réactive les chlorures). Feuilles d'aluminium mouillées (galvanisme).", "more": [["Références", "Berducou 1990 ; Robbiola et al. 1998 ; CTC-06"]], "next": {"label": "Traitement post-fouille →", "to": "P_CU_01"}}, "P_CU_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "NE JAMAIS LAVER À L'EAU, même en l'absence de signe visible d'altération. L'eau réactive les chlorures présents en profondeur dans les couches de corrosion et relance la corrosion active : le dommage ne se voit pas immédiatement, il apparaît des semaines ou des mois plus tard. Nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé. L'éthanol peut être employé pour dégager la surface ou faire apparaître un décor, avec les EPI appropriés (gants nitrile, ventilation, protection oculaire) et à la condition qu'aucun reste organique ne soit associé à l'objet — l'éthanol les déshydraterait irréversiblement."], ["Séchage", "Sécher sans attendre. Séchage à l'air, en pièce à atmosphère contrôlée de l'agence ou en local ventilé, à l'abri du soleil et de toute source de chaleur ; conditionner aussitôt en boîte hermétique avec gel de silice sec. Pas de bain de solvant : il faudrait une hotte aspirante à solvant, dont les agences ne disposent pas."], ["Marquage", "Indirect uniquement (étiquette imputrescible au marqueur indélébile)."], ["Conditionnement", "Boîte hermétique + Gel de silice."]], "never": "Ne jamais : eau de lavage (réactive les chlorures). Feuilles d'aluminium mouillées (galvanisme).", "more": [["Climat cible", "< 30% · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06 (Ministère de la Culture 2022)."], ["Références", "Berducou 1990 ; Robbiola et al. 1998 ; CTC-06"]]}, "ENTREE_CU_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_CU_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_CU_01"}]}}, "epi": false}, "PB_01": {"nom": "Plomb et étain", "cat": "Métaux", "urgence": "Précaution", "risque": "EPI REQUIS — Gants nitrile obligatoires. Les composés du plomb (cérusite) sont classés CMR (toxiques pour la reproduction). Ne pas gratter à sec, ne pas inhaler les poussières, se laver les mains avant toute prise alimentaire.", "start": "ENTREE_PB_01", "nodes": {"TST_PB_01": {"type": "question", "phase": "Terrain · vérifier", "q": "Confirmer qu'il s'agit de plomb ?", "help": "Geste à faire : Frotter très légèrement l'objet sur du papier blanc (gants obligatoires)", "choices": [{"txt": "Trace grise à noire", "sub": "Plomb. Manipuler avec gants nitrile, composés classés CMR.", "to": "K_PB_01"}, {"txt": "Je ne peux pas faire ce test", "sub": "On continue sans", "to": "K_PB_01"}]}, "D_PB_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Gangue blanche épaisse, crayeuse, pulvérulente", "sub": "Cérusite : corrosion par les vapeurs acides. Composés toxiques, gants obligatoires.", "to": "TST_PB_01", "warn": true, "flag": "urgent"}, {"txt": "Surface gris clair, mate et régulière", "sub": "Plomb en état stable.", "to": "TST_PB_01"}, {"txt": "Gris terne, aspect terreux (étain)", "sub": "Étain ou peautre (alliage plomb-étain). Matériau stable dans une réserve : la « peste de l'étain » ne se déclenche en pratique qu'en dessous de 0 °C, et le plomb de l'alliage l'inhibe. Protéger simplement du gel.", "to": "TST_PB_01", "warn": true, "flag": "urgent"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "TST_PB_01"}]}, "M_PB_01": {"type": "question", "phase": "Terrain · milieu", "q": "Dans quel milieu l'objet était-il enfoui ?", "help": "Le milieu commande la conduite avant même l'état de l'objet. L'eau, surtout salée, change tout.", "choices": [{"txt": "Sec", "sub": "Terre sèche, l'objet n'est pas humide au toucher", "to": "D_PB_01"}, {"txt": "Humide", "sub": "La terre colle, l'objet est frais et humide", "flag": "humide", "to": "D_PB_01"}, {"txt": "Gorgé d'eau", "sub": "Puits, fossé, zone humide non marine", "flag": "gorge", "warn": true, "to": "D_PB_01"}, {"txt": "Subaquatique (eau douce)", "sub": "Rivière, lac, source — eau non salée", "warn": true, "to": "AQ_PB_01"}, {"txt": "Sous-marin / eau salée", "sub": "Mer, estran, épave, résurgence salée", "warn": true, "to": "MAR_PB_01"}]}, "K_PB_01": {"type": "question", "phase": "Terrain · contexte", "q": "Dans quel contexte l'objet a-t-il été découvert ?", "help": "Le contexte dit si l'objet fait partie d'un ensemble dont il faut préserver l'organisation.", "choices": [{"txt": "Standard", "sub": "Habitat, remblai, couche générale", "to": "S1_PB_01"}, {"txt": "Funéraire", "sub": "Sépulture, dépôt funéraire", "flag": "funeraire", "to": "A_PB_01"}, {"txt": "Dépôt / amas", "sub": "Cache, dépôt volontaire, objets groupés", "flag": "depot", "to": "A_PB_01"}, {"txt": "Bâti", "sub": "Pris dans une maçonnerie, un sol, une structure", "flag": "bati", "to": "S1_PB_01"}]}, "A_PB_01": {"type": "question", "phase": "Terrain · association", "q": "L'objet est-il en connexion ou associé à d'autres éléments ?", "help": "En sépulture ou en dépôt, la position relative des objets est une information qui disparaît si on les sépare.", "choices": [{"txt": "Oui, associé ou en connexion", "sub": "Plusieurs éléments liés, disposés ensemble", "warn": true, "to": "C_ASSOC_PB_01"}, {"txt": "Non, objet isolé", "sub": "Seul dans la couche, sans lien visible", "to": "S1_PB_01"}, {"txt": "Je ne sais pas", "sub": "Dans le doute, on préserve l'ensemble", "warn": true, "to": "C_ASSOC_PB_01"}]}, "S1_PB_01": {"type": "question", "phase": "Terrain · aspect", "q": "Regardez la surface de l'objet.", "help": "Densité extrême, très lourd. Plomb pur laisse une trace noire sur du papier blanc.", "choices": [{"txt": "Aspect uniforme", "sub": "Surface régulière, sans altération active visible", "to": "S2_PB_01"}, {"txt": "Altération active", "sub": "ALERTE : Fatigue mécanique avancée, microfissures parallèles. Risque d'attaque par les COV", "warn": true, "to": "S2_PB_01", "flag": "urgent"}]}, "S2_PB_01": {"type": "question", "phase": "Terrain · cohésion", "q": "Les fragments tiennent-ils ensemble ?", "help": "Regardez si l'objet garde sa forme, ou si des morceaux se détachent.", "choices": [{"txt": "Oui, d'un seul tenant", "to": "C_SEC_PB_01"}, {"txt": "Non, ils se désolidarisent", "sub": "Risque de perte d'informations scientifiques", "warn": true, "to": "C_MOTTE_PB_01"}]}, "C_SEC_PB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel + calage Plastazote", "accent": "accent", "lines": [["Geste", "Manipuler obligatoirement avec des gants nitrile (composés du plomb classés CMR). Ne pas gratter ni nettoyer, pour éviter la dispersion des poussières de cérusite. Protéger du gel : ne pas laisser en algéco, container ou véhicule non chauffé en hiver."], ["Matériel", "Gants nitrile (EPI), sachet individuel étanche, mousse Plastazote."], ["Sachet — perforer", "Percer le sachet zip de quelques trous (pointe de scalpel ou de compas), en haut du sachet et sans toucher l'objet. En caisse de chantier, la température chute le soir dans le conteneur non chauffé : l'humidité du sédiment se condense, et un sachet fermé retient alors de l'eau liquide au contact du métal — parfois pendant les semaines qui précèdent le rapatriement. Cette eau liquide est l'électrolyte qui fait tourner la corrosion en continu ; quelques trous suffisent à la laisser s'évacuer. NE PAS PERFORER dans trois cas : objet encore mouillé (le sécher d'abord à l'abri, puis perforer) · mise en gaine sous vide · conditionnement humide volontaire de moins de 48 h."], ["Fenêtre", "QUELQUES SEMAINES — la corrosion par les COV est lente mais continue."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Développement d'une gangue blanche de cérusite qui gonfle et fait éclater la surface, avec dispersion de poussières toxiques."]], "more": [["Post-fouille — lavage", "INTERDICTION DE LAVER. Nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé."], ["Post-fouille — séchage", "Séchage lent et naturel."], ["Post-fouille — conditionnement", "Boîtes étanches PP/PE + mousse Plastazote."], ["Climat cible", "< 30% · 15-25 °C (hors gel ; jamais sous 0 °C)"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06."], ["Références", "Berducou 1990 ; Bergeron, Rémillard 2021 ; CTC-06"]], "never": "Ne jamais : bois de chêne, carton acide, colle vinylique (COV).", "next": {"label": "Traitement post-fouille →", "to": "P_PB_01"}}, "C_MOTTE_PB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel + calage Plastazote", "accent": "accent", "lines": [["Geste", "Manipuler obligatoirement avec des gants nitrile (composés du plomb classés CMR). Ne pas gratter ni nettoyer, pour éviter la dispersion des poussières de cérusite. Protéger du gel : ne pas laisser en algéco, container ou véhicule non chauffé en hiver."], ["Matériel", "Gants nitrile (EPI), sachet individuel étanche, mousse Plastazote."], ["Fenêtre", "QUELQUES SEMAINES — la corrosion par les COV est lente mais continue."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Développement d'une gangue blanche de cérusite qui gonfle et fait éclater la surface, avec dispersion de poussières toxiques."]], "more": [["Post-fouille — lavage", "INTERDICTION DE LAVER. Nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé."], ["Post-fouille — séchage", "Séchage lent et naturel."], ["Post-fouille — conditionnement", "Boîtes étanches PP/PE + mousse Plastazote."], ["Climat cible", "< 30% · 15-25 °C (hors gel ; jamais sous 0 °C)"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06."], ["Références", "Berducou 1990 ; Bergeron, Rémillard 2021 ; CTC-06"]], "why": "Les fragments ne tiennent plus ensemble : on prélève tout le bloc pour préserver la forme et les informations de l'objet.", "never": "Ne jamais : bois de chêne, carton acide, colle vinylique (COV).", "next": {"label": "Traitement post-fouille →", "to": "P_PB_01"}}, "C_ASSOC_PB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en bloc — ensemble associé", "accent": "accent", "lines": [["Geste", "Manipuler obligatoirement avec des gants nitrile (composés du plomb classés CMR). Ne pas gratter ni nettoyer, pour éviter la dispersion des poussières de cérusite. Protéger du gel : ne pas laisser en algéco, container ou véhicule non chauffé en hiver."], ["Matériel", "Gants nitrile (EPI), sachet individuel étanche, mousse Plastazote."], ["Fenêtre", "QUELQUES SEMAINES — la corrosion par les COV est lente mais continue."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Développement d'une gangue blanche de cérusite qui gonfle et fait éclater la surface, avec dispersion de poussières toxiques."]], "more": [["Post-fouille — lavage", "INTERDICTION DE LAVER. Nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé."], ["Post-fouille — séchage", "Séchage lent et naturel."], ["Post-fouille — conditionnement", "Boîtes étanches PP/PE + mousse Plastazote."], ["Climat cible", "< 30% · 15-25 °C (hors gel ; jamais sous 0 °C)"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06."], ["Références", "Berducou 1990 ; Bergeron, Rémillard 2021 ; CTC-06"]], "why": "En sépulture ou en dépôt, l'organisation des objets est une donnée : on prélève l'ensemble en bloc, sans séparer.", "never": "Ne jamais : bois de chêne, carton acide, colle vinylique (COV).", "next": {"label": "Traitement post-fouille →", "to": "P_PB_01"}}, "MAR_PB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Sous-marin / eau salée — maintenir en eau", "accent": "lab", "why": "Le mobilier gorgé d'eau salée ne doit jamais sécher avant dessalage : la cristallisation des sels fait éclater la matière. Le dessalage se fait en laboratoire, par bains progressifs.", "lines": [["D'abord", "En domaine public maritime, vérifier avec le Drassm et le RO s'il faut remonter l'objet : souvent, on le laisse sur site (réenfouissement, géotextile)."], ["Si remonté", "Maintenir en eau, sans jamais laisser sécher. Petits objets en sachet zippé avec un fond d'eau ; grands objets enroulés de textiles mouillés puis film étanche."], ["Fenêtre", "Urgent — contacter le GAF du pôle subaquatique ou le laboratoire pour le dessalage"]], "never": "Ne jamais laisser sécher l'objet avant son dessalage en laboratoire.", "more": [["Dessalage", "Bains d'eau douce successifs, contrôlés par mesure de la conductivité, sur plusieurs semaines. Seuls l'or et le plomb échappent au dessalage préalable (CTC-06, CTC-12)."], ["Référence", "CTC-12 (milieu subaquatique et sous-marin) ; CTC-06 ; Bergeron & Rémillard 2021"]]}, "AQ_PB_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Subaquatique eau douce — maintenir humide", "accent": "accent", "why": "En eau douce, pas de sels marins, mais le dessèchement brutal fait éclater la couche de corrosion. On maintient l'objet humide jusqu'à l'avis de votre GAF ou du pôle restauration.", "lines": [["Geste", "Manipuler obligatoirement avec des gants nitrile (composés du plomb classés CMR). Ne pas gratter ni nettoyer, pour éviter la dispersion des poussières de cérusite. Protéger du gel : ne pas laisser en algéco, container ou véhicule non chauffé en hiver."], ["Matériel", "Gants nitrile (EPI), sachet individuel étanche, mousse Plastazote."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Fenêtre", "QUELQUES SEMAINES — la corrosion par les COV est lente mais continue."]], "never": "Ne jamais : bois de chêne, carton acide, colle vinylique (COV).", "more": [["Références", "Berducou 1990 ; Bergeron, Rémillard 2021 ; CTC-06"]], "next": {"label": "Traitement post-fouille →", "to": "P_PB_01"}}, "P_PB_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "INTERDICTION DE LAVER. Nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé."], ["Séchage", "Séchage lent et naturel."], ["Marquage", "Indirect uniquement (étiquette imputrescible au marqueur indélébile) pour éviter toute émission d'acide organique volatile."], ["Conditionnement", "Boîtes étanches PP/PE + mousse Plastazote."]], "never": "Ne jamais : bois de chêne, carton acide, colle vinylique (COV).", "more": [["Climat cible", "< 30% · 15-25 °C (hors gel ; jamais sous 0 °C)"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06."], ["Références", "Berducou 1990 ; Bergeron, Rémillard 2021 ; CTC-06"]]}, "ENTREE_PB_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_PB_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_PB_01"}]}}, "epi": true}, "AG_01": {"nom": "Argent", "cat": "Métaux", "urgence": "Précaution", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_AG_01", "nodes": {"D_AG_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Croûte grise à violacée, cireuse, très cassante", "sub": "Argent corné (chlorure d'argent) : la croûte emporte le décor si on la brosse.", "to": "K_AG_01", "flag": "fragile"}, {"txt": "Surface noircie, ternie", "sub": "Sulfuration de surface, phénomène lent.", "to": "K_AG_01"}, {"txt": "Résidu vert pulvérulent sur un objet clair", "sub": "Décuprification : l'alliage perd son cuivre, le décor est fragilisé.", "to": "K_AG_01", "warn": true, "flag": "urgent"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "K_AG_01"}]}, "M_AG_01": {"type": "question", "phase": "Terrain · milieu", "q": "Dans quel milieu l'objet était-il enfoui ?", "help": "Le milieu commande la conduite avant même l'état de l'objet. L'eau, surtout salée, change tout.", "choices": [{"txt": "Sec", "sub": "Terre sèche, l'objet n'est pas humide au toucher", "to": "D_AG_01"}, {"txt": "Humide", "sub": "La terre colle, l'objet est frais et humide", "flag": "humide", "to": "D_AG_01"}, {"txt": "Gorgé d'eau", "sub": "Puits, fossé, zone humide non marine", "flag": "gorge", "warn": true, "to": "D_AG_01"}, {"txt": "Subaquatique (eau douce)", "sub": "Rivière, lac, source — eau non salée", "warn": true, "to": "AQ_AG_01"}, {"txt": "Sous-marin / eau salée", "sub": "Mer, estran, épave, résurgence salée", "warn": true, "to": "MAR_AG_01"}]}, "K_AG_01": {"type": "question", "phase": "Terrain · contexte", "q": "Dans quel contexte l'objet a-t-il été découvert ?", "help": "Le contexte dit si l'objet fait partie d'un ensemble dont il faut préserver l'organisation.", "choices": [{"txt": "Standard", "sub": "Habitat, remblai, couche générale", "to": "S1_AG_01"}, {"txt": "Funéraire", "sub": "Sépulture, dépôt funéraire", "flag": "funeraire", "to": "A_AG_01"}, {"txt": "Dépôt / amas", "sub": "Cache, dépôt volontaire, objets groupés", "flag": "depot", "to": "A_AG_01"}, {"txt": "Bâti", "sub": "Pris dans une maçonnerie, un sol, une structure", "flag": "bati", "to": "S1_AG_01"}]}, "A_AG_01": {"type": "question", "phase": "Terrain · association", "q": "L'objet est-il en connexion ou associé à d'autres éléments ?", "help": "En sépulture ou en dépôt, la position relative des objets est une information qui disparaît si on les sépare.", "choices": [{"txt": "Oui, associé ou en connexion", "sub": "Plusieurs éléments liés, disposés ensemble", "warn": true, "to": "C_ASSOC_AG_01"}, {"txt": "Non, objet isolé", "sub": "Seul dans la couche, sans lien visible", "to": "S1_AG_01"}, {"txt": "Je ne sais pas", "sub": "Dans le doute, on préserve l'ensemble", "warn": true, "to": "C_ASSOC_AG_01"}]}, "S1_AG_01": {"type": "question", "phase": "Terrain · aspect", "q": "Regardez la surface de l'objet.", "help": "Métal dense, mais la corrosion externe est très cassante et s'écaille, emportant les décors de surface.", "choices": [{"txt": "Aspect uniforme", "sub": "Surface régulière, sans altération active visible", "to": "S2_AG_01"}, {"txt": "Altération active", "sub": "ALERTE : noircissement rapide à l'air. Effritement des décors. Poudroiement vert signalant", "warn": true, "to": "S2_AG_01", "flag": "urgent"}]}, "S2_AG_01": {"type": "question", "phase": "Terrain · cohésion", "q": "Les fragments tiennent-ils ensemble ?", "help": "Regardez si l'objet garde sa forme, ou si des morceaux se détachent.", "choices": [{"txt": "Oui, d'un seul tenant", "to": "C_SEC_AG_01"}, {"txt": "Non, ils se désolidarisent", "sub": "Risque de perte d'informations scientifiques", "warn": true, "to": "C_MOTTE_AG_01"}]}, "C_SEC_AG_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel + calage souple", "accent": "accent", "lines": [["Geste", "Ne jamais brosser ni frotter in situ : la corrosion externe, très cassante, emporte les décors de surface. Isoler individuellement pour éviter les chocs mécaniques."], ["Matériel", "Sachet individuel neutre, calage mousse Plastazote."], ["Sachet — perforer", "Percer le sachet zip de quelques trous (pointe de scalpel ou de compas), en haut du sachet et sans toucher l'objet. En caisse de chantier, la température chute le soir dans le conteneur non chauffé : l'humidité du sédiment se condense, et un sachet fermé retient alors de l'eau liquide au contact du métal — parfois pendant les semaines qui précèdent le rapatriement. Cette eau liquide est l'électrolyte qui fait tourner la corrosion en continu ; quelques trous suffisent à la laisser s'évacuer. NE PAS PERFORER dans trois cas : objet encore mouillé (le sécher d'abord à l'abri, puis perforer) · mise en gaine sous vide · conditionnement humide volontaire de moins de 48 h."], ["Fenêtre", "QUELQUES SEMAINES — noircissement progressif à l'air."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Noircissement progressif et fragilisation de la croûte de chlorure, qui emporte les décors au moindre contact."]], "more": [["Post-fouille — lavage", "Ne pas laver à l'eau. L'argent archéologique porte souvent une croûte de chlorure d'argent fragile, qui emporte les décors au moindre contact : nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé."], ["Post-fouille — séchage", "Séchage à l'air, en pièce à atmosphère contrôlée de l'agence ou en local ventilé, à l'abri du soleil et de toute source de chaleur ; conditionner aussitôt en boîte hermétique avec gel de silice sec. Pas de bain de solvant : il faudrait une hotte aspirante à solvant, dont les agences ne disposent pas."], ["Post-fouille — conditionnement", "Contenant hermétique PP/PE + charbon actif."], ["Climat cible", "< 30% · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06."], ["Références", "Berducou 1990 ; Costa 2001 ; CTC-06"]], "never": "Ne jamais : matériaux soufrés (laine, caoutchouc vulcanisé).", "next": {"label": "Traitement post-fouille →", "to": "P_AG_01"}}, "C_MOTTE_AG_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel + calage souple", "accent": "accent", "lines": [["Geste", "Ne jamais brosser ni frotter in situ : la corrosion externe, très cassante, emporte les décors de surface. Isoler individuellement pour éviter les chocs mécaniques."], ["Matériel", "Sachet individuel neutre, calage mousse Plastazote."], ["Fenêtre", "QUELQUES SEMAINES — noircissement progressif à l'air."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Noircissement progressif et fragilisation de la croûte de chlorure, qui emporte les décors au moindre contact."]], "more": [["Post-fouille — lavage", "Ne pas laver à l'eau. L'argent archéologique porte souvent une croûte de chlorure d'argent fragile, qui emporte les décors au moindre contact : nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé."], ["Post-fouille — séchage", "Séchage à l'air, en pièce à atmosphère contrôlée de l'agence ou en local ventilé, à l'abri du soleil et de toute source de chaleur ; conditionner aussitôt en boîte hermétique avec gel de silice sec. Pas de bain de solvant : il faudrait une hotte aspirante à solvant, dont les agences ne disposent pas."], ["Post-fouille — conditionnement", "Contenant hermétique PP/PE + charbon actif."], ["Climat cible", "< 30% · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06."], ["Références", "Berducou 1990 ; Costa 2001 ; CTC-06"]], "why": "Les fragments ne tiennent plus ensemble : on prélève tout le bloc pour préserver la forme et les informations de l'objet.", "never": "Ne jamais : matériaux soufrés (laine, caoutchouc vulcanisé).", "next": {"label": "Traitement post-fouille →", "to": "P_AG_01"}}, "C_ASSOC_AG_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en bloc — ensemble associé", "accent": "accent", "lines": [["Geste", "Ne jamais brosser ni frotter in situ : la corrosion externe, très cassante, emporte les décors de surface. Isoler individuellement pour éviter les chocs mécaniques."], ["Matériel", "Sachet individuel neutre, calage mousse Plastazote."], ["Fenêtre", "QUELQUES SEMAINES — noircissement progressif à l'air."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Noircissement progressif et fragilisation de la croûte de chlorure, qui emporte les décors au moindre contact."]], "more": [["Post-fouille — lavage", "Ne pas laver à l'eau. L'argent archéologique porte souvent une croûte de chlorure d'argent fragile, qui emporte les décors au moindre contact : nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé."], ["Post-fouille — séchage", "Séchage à l'air, en pièce à atmosphère contrôlée de l'agence ou en local ventilé, à l'abri du soleil et de toute source de chaleur ; conditionner aussitôt en boîte hermétique avec gel de silice sec. Pas de bain de solvant : il faudrait une hotte aspirante à solvant, dont les agences ne disposent pas."], ["Post-fouille — conditionnement", "Contenant hermétique PP/PE + charbon actif."], ["Climat cible", "< 30% · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06."], ["Références", "Berducou 1990 ; Costa 2001 ; CTC-06"]], "why": "En sépulture ou en dépôt, l'organisation des objets est une donnée : on prélève l'ensemble en bloc, sans séparer.", "never": "Ne jamais : matériaux soufrés (laine, caoutchouc vulcanisé).", "next": {"label": "Traitement post-fouille →", "to": "P_AG_01"}}, "MAR_AG_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Sous-marin / eau salée — maintenir en eau", "accent": "lab", "why": "Le mobilier gorgé d'eau salée ne doit jamais sécher avant dessalage : la cristallisation des sels fait éclater la matière. Le dessalage se fait en laboratoire, par bains progressifs.", "lines": [["D'abord", "En domaine public maritime, vérifier avec le Drassm et le RO s'il faut remonter l'objet : souvent, on le laisse sur site (réenfouissement, géotextile)."], ["Si remonté", "Maintenir en eau, sans jamais laisser sécher. Petits objets en sachet zippé avec un fond d'eau ; grands objets enroulés de textiles mouillés puis film étanche."], ["Fenêtre", "Urgent — contacter le GAF du pôle subaquatique ou le laboratoire pour le dessalage"]], "never": "Ne jamais laisser sécher l'objet avant son dessalage en laboratoire.", "more": [["Dessalage", "Bains d'eau douce successifs, contrôlés par mesure de la conductivité, sur plusieurs semaines. Seuls l'or et le plomb échappent au dessalage préalable (CTC-06, CTC-12)."], ["Référence", "CTC-12 (milieu subaquatique et sous-marin) ; CTC-06 ; Bergeron & Rémillard 2021"]]}, "AQ_AG_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Subaquatique eau douce — maintenir humide", "accent": "accent", "why": "En eau douce, pas de sels marins, mais le dessèchement brutal fait éclater la couche de corrosion. On maintient l'objet humide jusqu'à l'avis de votre GAF ou du pôle restauration.", "lines": [["Geste", "Ne jamais brosser ni frotter in situ : la corrosion externe, très cassante, emporte les décors de surface. Isoler individuellement pour éviter les chocs mécaniques."], ["Matériel", "Sachet individuel neutre, calage mousse Plastazote."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Fenêtre", "QUELQUES SEMAINES — noircissement progressif à l'air."]], "never": "Ne jamais : matériaux soufrés (laine, caoutchouc vulcanisé).", "more": [["Références", "Berducou 1990 ; Costa 2001 ; CTC-06"]], "next": {"label": "Traitement post-fouille →", "to": "P_AG_01"}}, "P_AG_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Ne pas laver à l'eau. L'argent archéologique porte souvent une croûte de chlorure d'argent fragile, qui emporte les décors au moindre contact : nettoyage du sédiment à sec uniquement (bâtonnets de bois, brossette…), en laboratoire ou par un personnel formé."], ["Séchage", "Séchage à l'air, en pièce à atmosphère contrôlée de l'agence ou en local ventilé, à l'abri du soleil et de toute source de chaleur ; conditionner aussitôt en boîte hermétique avec gel de silice sec. Pas de bain de solvant : il faudrait une hotte aspirante à solvant, dont les agences ne disposent pas."], ["Marquage", "Indirect uniquement (étiquette imputrescible au marqueur indélébile)."], ["Conditionnement", "Contenant hermétique PP/PE + charbon actif."]], "never": "Ne jamais : matériaux soufrés (laine, caoutchouc vulcanisé).", "more": [["Climat cible", "< 30% · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06."], ["Références", "Berducou 1990 ; Costa 2001 ; CTC-06"]]}, "ENTREE_AG_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_AG_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_AG_01"}]}}, "epi": false}, "AU_01": {"nom": "Or", "cat": "Métaux", "urgence": "Précaution", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_AU_01", "nodes": {"D_AU_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Éclat métallique intact, aucune altération", "sub": "Or pur : chimiquement inerte. Le risque est mécanique.", "to": "K_AU_01", "flag": "fragile"}, {"txt": "Ternissures localisées, zones mates", "sub": "Alliage (électrum, or cuivreux) : altération de surface possible.", "to": "K_AU_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "K_AU_01"}]}, "M_AU_01": {"type": "question", "phase": "Terrain · milieu", "q": "Dans quel milieu l'objet était-il enfoui ?", "help": "Le milieu commande la conduite avant même l'état de l'objet. L'eau, surtout salée, change tout.", "choices": [{"txt": "Sec", "sub": "Terre sèche, l'objet n'est pas humide au toucher", "to": "D_AU_01"}, {"txt": "Humide", "sub": "La terre colle, l'objet est frais et humide", "flag": "humide", "to": "D_AU_01"}, {"txt": "Gorgé d'eau", "sub": "Puits, fossé, zone humide non marine", "flag": "gorge", "warn": true, "to": "D_AU_01"}, {"txt": "Subaquatique (eau douce)", "sub": "Rivière, lac, source — eau non salée", "warn": true, "to": "AQ_AU_01"}, {"txt": "Sous-marin / eau salée", "sub": "Mer, estran, épave, résurgence salée", "warn": true, "to": "MAR_AU_01"}]}, "K_AU_01": {"type": "question", "phase": "Terrain · contexte", "q": "Dans quel contexte l'objet a-t-il été découvert ?", "help": "Le contexte dit si l'objet fait partie d'un ensemble dont il faut préserver l'organisation.", "choices": [{"txt": "Standard", "sub": "Habitat, remblai, couche générale", "to": "S1_AU_01"}, {"txt": "Funéraire", "sub": "Sépulture, dépôt funéraire", "flag": "funeraire", "to": "A_AU_01"}, {"txt": "Dépôt / amas", "sub": "Cache, dépôt volontaire, objets groupés", "flag": "depot", "to": "A_AU_01"}, {"txt": "Bâti", "sub": "Pris dans une maçonnerie, un sol, une structure", "flag": "bati", "to": "S1_AU_01"}]}, "A_AU_01": {"type": "question", "phase": "Terrain · association", "q": "L'objet est-il en connexion ou associé à d'autres éléments ?", "help": "En sépulture ou en dépôt, la position relative des objets est une information qui disparaît si on les sépare.", "choices": [{"txt": "Oui, associé ou en connexion", "sub": "Plusieurs éléments liés, disposés ensemble", "warn": true, "to": "C_ASSOC_AU_01"}, {"txt": "Non, objet isolé", "sub": "Seul dans la couche, sans lien visible", "to": "S1_AU_01"}, {"txt": "Je ne sais pas", "sub": "Dans le doute, on préserve l'ensemble", "warn": true, "to": "C_ASSOC_AU_01"}]}, "S1_AU_01": {"type": "question", "phase": "Terrain · aspect", "q": "Regardez la surface de l'objet.", "help": "Chimiquement inerte, très dense et extrêmement malléable.", "choices": [{"txt": "Aspect uniforme", "sub": "Surface régulière, sans altération active visible", "to": "S2_AU_01"}, {"txt": "Altération active", "sub": "L'or pur est chimiquement inerte et ne présente aucune altération. En revanche, ses ALLIAG", "warn": true, "to": "S2_AU_01", "flag": "urgent"}]}, "S2_AU_01": {"type": "question", "phase": "Terrain · cohésion", "q": "Les fragments tiennent-ils ensemble ?", "help": "Regardez si l'objet garde sa forme, ou si des morceaux se détachent.", "choices": [{"txt": "Oui, d'un seul tenant", "to": "C_SEC_AU_01"}, {"txt": "Non, ils se désolidarisent", "sub": "Risque de perte d'informations scientifiques", "warn": true, "to": "C_MOTTE_AU_01"}]}, "C_SEC_AU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel avec calage", "accent": "accent", "lines": [["Geste", "Dégagement extrêmement délicat, à la loupe, avec des outils tendres (buis, bambou) : la vulnérabilité est mécanique, non chimique. Ne jamais redresser ni déplier sur le terrain."], ["Matériel", "Sachet individuel neutre, micro-pince, calage mousse Plastazote."], ["Sachet — perforer", "Percer le sachet zip de quelques trous (pointe de scalpel ou de compas), en haut du sachet et sans toucher l'objet. En caisse de chantier, la température chute le soir dans le conteneur non chauffé : l'humidité du sédiment se condense, et un sachet fermé retient alors de l'eau liquide au contact du métal — parfois pendant les semaines qui précèdent le rapatriement. Cette eau liquide est l'électrolyte qui fait tourner la corrosion en continu ; quelques trous suffisent à la laisser s'évacuer. NE PAS PERFORER dans trois cas : objet encore mouillé (le sécher d'abord à l'abri, puis perforer) · mise en gaine sous vide · conditionnement humide volontaire de moins de 48 h."], ["Fenêtre", "PLUSIEURS MOIS — le risque est mécanique, non chimique."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Déformation, déchirure ou écrasement par contrainte mécanique — le risque n'est pas chimique."]], "more": [["Post-fouille — lavage", "Lavage doux à l'eau déminéralisée s'il s'agit d'un alliage."], ["Post-fouille — séchage", "Séchage rapide naturel après nettoyage."], ["Post-fouille — conditionnement", "Boîte étanche PP/PE + calage mousse Plastazote."], ["Climat cible", "< 30% (si allié) ; indifférent si or pur (métal inerte) · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06 ; inertie de l'or pur : consensus."], ["Références", "Berducou 1990 ; CTC-06 ; Bergeron, Rémillard 2021"]], "never": "Ne jamais : matériaux abrasifs, contraintes physiques directes ou manipulations sans gants.", "next": {"label": "Traitement post-fouille →", "to": "P_AU_01"}}, "C_MOTTE_AU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel avec calage", "accent": "accent", "lines": [["Geste", "Dégagement extrêmement délicat, à la loupe, avec des outils tendres (buis, bambou) : la vulnérabilité est mécanique, non chimique. Ne jamais redresser ni déplier sur le terrain."], ["Matériel", "Sachet individuel neutre, micro-pince, calage mousse Plastazote."], ["Fenêtre", "PLUSIEURS MOIS — le risque est mécanique, non chimique."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Déformation, déchirure ou écrasement par contrainte mécanique — le risque n'est pas chimique."]], "more": [["Post-fouille — lavage", "Lavage doux à l'eau déminéralisée s'il s'agit d'un alliage."], ["Post-fouille — séchage", "Séchage rapide naturel après nettoyage."], ["Post-fouille — conditionnement", "Boîte étanche PP/PE + calage mousse Plastazote."], ["Climat cible", "< 30% (si allié) ; indifférent si or pur (métal inerte) · 15-25 °C"], ["Niveau de preuve", "NORME — seuil générique métaux < 30 % HR, CTC-06 ; inertie de l'or pur : consensus."], ["Références", "Berducou 1990 ; CTC-06 ; Bergeron, Rémillard 2021"]], "why": "Les fragments ne tiennent plus ensemble : on prélève tout le bloc pour préserver la forme et les informations de l'objet.", "never": "Ne jamais : matériaux abrasifs, contraintes physiques directes ou manipulations sans gants.", "next": {"label": "Traitement post-fouille →", "to": "P_AU_01"}}, "C_ASSOC_AU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en bloc — ensemble associé", "accent": "accent", "lines": [["Geste", "Dégagement extrêmement délicat, à la loupe, avec des outils tendres (buis, bambou) : la vulnérabilité est mécanique, non chimique. Ne jamais redresser ni déplier sur le terrain."], ["Matériel", "Sachet individuel neutre, micro-pince, calage mousse Plastazote."], ["Fenêtre", "PLUSIEURS MOIS — le risque est mécanique, non chimique."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur
