n conditionnement", "to": "P_LIG_01"}]}}, "epi": true}, "FAU_01": {"nom": "Os (Faune)", "cat": "Matières organiques", "urgence": "Précaution", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_FAU_01", "nodes": {"M_FAU_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Surface qui se desquame en plaquettes, fissures longitudinales", "sub": "Séchage trop rapide ou choc thermique : l'os se délite.", "to": "Q_FAU_01", "flag": "fragile"}, {"txt": "Os léger, crayeux, qui marque à l'ongle", "sub": "Déminéralisation par sol acide : très fragile, à prélever en bloc.", "to": "Q_FAU_01", "flag": "fragile"}, {"txt": "Os dense, surface lisse et régulière", "sub": "Bonne conservation, sol plutôt calcaire.", "to": "Q_FAU_01"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "Q_FAU_01"}]}, "Q_FAU_01": {"type": "question", "phase": "Terrain · analyses", "q": "Des analyses sont-elles prévues sur cet objet ?", "help": "Datation C14, ADN ancien, isotopes, ZooMS… Le lavage et tout contact non protégé contaminent l'échantillon de façon irréversible.", "choices": [{"txt": "Oui, ou c'est possible", "sub": "Dans le doute, on protège l'objet de toute contamination", "flag": "analyses", "warn": true, "to": "C_ANA_FAU_01"}, {"txt": "Non, aucune analyse", "sub": "Ramassage courant", "to": "C_STD_FAU_01"}]}, "C_ANA_FAU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement protégé (analyses)", "accent": "lab", "why": "Les analyses (C14, ADN, isotopes) exigent un objet non contaminé : pas de lavage, pas de contact à mains nues, pas de sachet plastique pour un échantillon C14.", "lines": [["Geste", "Os friable, desquamé ou fissuré. Prélever en bloc avec son sédiment. Si humide, conserver en sachet étanche double sans air pour séchage lent en post-fouille. Ne jamais consolider sur le terrain. ATTENTION ANALYSES : mêmes précautions de contamination que pour l'os stable (C14, isotopes, ZooMS, ADN)."], ["Matériel", "Plaque PP rigide, sachets Zip neutres, gants, mousse de calage."], ["Témoin", "Isoler un échantillon non traité comme témoin."], ["Fenêtre", "QUELQUES SEMAINES — sauf exposition au soleil, qui fait éclater l'os en quelques heures."]], "never": "Ne jamais : cartons acides, brosses dures, séchage rapide au soleil ou près d'un radiateur.", "next": {"label": "Traitement post-fouille →", "to": "P_FAU_01"}}, "C_STD_FAU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en bloc (motte)", "accent": "accent", "lines": [["Geste", "Os friable, desquamé ou fissuré. Prélever en bloc avec son sédiment. Si humide, conserver en sachet étanche double sans air pour séchage lent en post-fouille. Ne jamais consolider sur le terrain. ATTENTION ANALYSES : mêmes précautions de contamination que pour l'os stable (C14, isotopes, ZooMS, ADN)."], ["Matériel", "Plaque PP rigide, sachets Zip neutres, gants, mousse de calage."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES SEMAINES — sauf exposition au soleil, qui fait éclater l'os en quelques heures."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Desquamation en plaquettes et fissuration longitudinale, surtout après exposition au soleil."]], "more": [["Post-fouille — lavage", "Lavage doux à l'eau claire (sans brosse dure). Alcool si friable."], ["Post-fouille — séchage", "Séchage lent, progressif et contrôlé à l'ombre en pièce ventilée."], ["Post-fouille — conditionnement", "Sachets perforés dans caisses PP ou caisses ajourées."], ["Climat cible", "50-60% (très stable) · 18-20 °C"], ["Niveau de preuve", "CONSENSUS — Bergeron & Rémillard 2021 (50-60 % pour os et ivoire) ; CTC-03."], ["Références", "Bergeron, Rémillard 2021 ; CTC-03"]], "never": "Ne jamais : cartons acides, brosses dures, séchage rapide au soleil ou près d'un radiateur.", "next": {"label": "Traitement post-fouille →", "to": "P_FAU_01"}}, "P_FAU_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Lavage doux à l'eau claire (sans brosse dure). Alcool si friable."], ["Séchage", "Séchage lent, progressif et contrôlé à l'ombre en pièce ventilée."], ["Marquage", "Indirect uniquement (étiquette imputrescible au marqueur indélébile)."], ["Conditionnement", "Sachets perforés dans caisses PP ou caisses ajourées."]], "never": "Ne jamais : cartons acides, brosses dures, séchage rapide au soleil ou près d'un radiateur.", "more": [["Climat cible", "50-60% (très stable) · 18-20 °C"], ["Niveau de preuve", "CONSENSUS — Bergeron & Rémillard 2021 (50-60 % pour os et ivoire) ; CTC-03."], ["Références", "Bergeron, Rémillard 2021 ; CTC-03"]]}, "ENTREE_FAU_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_FAU_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_FAU_01"}]}}, "epi": false}, "OSH_01": {"nom": "Os humain (Anthropobiologie)", "cat": "Matières organiques", "urgence": "Précaution", "risque": "PRÉCAUTIONS — Gants obligatoires. Restes humains : respect dû aux défunts, cadre légal du traitement des sépultures, et précaution sanitaire élémentaire en contexte récent ou pathologique.", "start": "ENTREE_OSH_01", "nodes": {"M_OSH_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Os en connexion anatomique, position cohérente", "sub": "Sépulture peu perturbée : la position est une donnée à enregistrer avant tout prélèvement.", "to": "Q_OSH_01"}, {"txt": "Os pulvérulent, bloc cranio-facial, sujet immature", "sub": "Fragilité extrême : prélèvement en motte plutôt que dégagement.", "to": "Q_OSH_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "Q_OSH_01"}]}, "Q_OSH_01": {"type": "question", "phase": "Terrain · analyses", "q": "Des analyses sont-elles prévues sur cet objet ?", "help": "Datation C14, ADN ancien, isotopes, ZooMS… Le lavage et tout contact non protégé contaminent l'échantillon de façon irréversible.", "choices": [{"txt": "Oui, ou c'est possible", "sub": "Dans le doute, on protège l'objet de toute contamination", "flag": "analyses", "warn": true, "to": "C_ANA_OSH_01"}, {"txt": "Non, aucune analyse", "sub": "Ramassage courant", "to": "C_STD_OSH_01"}]}, "C_ANA_OSH_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement protégé (analyses)", "accent": "lab", "why": "Les analyses (C14, ADN, isotopes) exigent un objet non contaminé : pas de lavage, pas de contact à mains nues, pas de sachet plastique pour un échantillon C14.", "lines": [["Cadre", "Fouille sous la conduite de l'archéo-anthropologue ; respect du cadre légal des restes humains."], ["Geste", "Sujets immatures, blocs cranio-faciaux, os pulvérulents : prélever en bloc avec le sédiment plutôt que de tenter un dégagement in situ. Micro-fouille différée en laboratoire, sous loupe binoculaire. Ne jamais consolider sur le terrain (interdiction absolue si analyses prévues)."], ["Matériel", "Plaque PP rigide, film étirable, boîte rigide, gants."], ["Témoin", "Isoler un échantillon non traité comme témoin."], ["Fenêtre", "QUELQUES SEMAINES — sauf sujets immatures et blocs cranio-faciaux, plus urgents."]], "never": "Ne jamais : consolidants de terrain (interdits si analyses).", "next": {"label": "Traitement post-fouille →", "to": "P_OSH_01"}}, "C_STD_OSH_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en motte assisté", "accent": "accent", "lines": [["Geste", "Sujets immatures, blocs cranio-faciaux, os pulvérulents : prélever en bloc avec le sédiment plutôt que de tenter un dégagement in situ. Micro-fouille différée en laboratoire, sous loupe binoculaire. Ne jamais consolider sur le terrain (interdiction absolue si analyses prévues)."], ["Matériel", "Plaque PP rigide, film étirable, boîte rigide, gants."], ["Fenêtre", "QUELQUES SEMAINES — sauf sujets immatures et blocs cranio-faciaux, plus urgents."], ["Option — gaine sous vide", "Si une sous-videuse est disponible, la mise en gaine thermosoudée sous vide est bien plus étanche à l'oxygène et à la vapeur d'eau qu'un sachet zip : elle ralentit nettement les réactions et allonge le délai avant traitement. RÉSERVE : ne jamais appliquer un vide complet sur un objet fragile, fissuré, minéralisé, creux ou pulvérulent — la pression l'écraserait. Dans ce cas, vide partiel seulement, sur support rigide et avec calage en mousse. Contrôler la gaine : si elle se regonfle, l'étanchéité est perdue et l'objet doit être traité sans attendre."], ["Si rien n'est fait", "Effritement des os pulvérulents et perte des connexions anatomiques, donc de l'information archéothanatologique."]], "more": [["Post-fouille — lavage", "Lavage doux à l'eau claire (sans brosse)."], ["Post-fouille — séchage", "Séchage lent et naturel à l'ombre."], ["Post-fouille — conditionnement", "Caisses rigides gerbables perforées."], ["Climat cible", "50-60% (très stable) · 18-20 °C"], ["Niveau de preuve", "CONSENSUS — aligné sur FAU_01, même matière ; CTC-10."], ["Références", "CTC-10 ; Duday 2005"]], "never": "Ne jamais : consolidants de terrain (interdits si analyses).", "next": {"label": "Traitement post-fouille →", "to": "P_OSH_01"}}, "P_OSH_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Lavage doux à l'eau claire (sans brosse)."], ["Séchage", "Séchage lent et naturel à l'ombre."], ["Marquage", "Indirect uniquement (étiquette imputrescible au marqueur indélébile)."], ["Conditionnement", "Caisses rigides gerbables perforées."]], "never": "Ne jamais : consolidants de terrain (interdits si analyses).", "more": [["Climat cible", "50-60% (très stable) · 18-20 °C"], ["Niveau de preuve", "CONSENSUS — aligné sur FAU_01, même matière ; CTC-10."], ["Références", "CTC-10 ; Duday 2005"]]}, "ENTREE_OSH_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_OSH_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_OSH_01"}]}}, "epi": true}, "CHA_01": {"nom": "Charbons de bois et carporestes (graines, fruits carbonisés)", "cat": "Matières organiques", "urgence": "Urgence", "risque": "PRÉCAUTIONS — Gants obligatoires, autant pour protéger l'échantillon de la contamination que par hygiène.", "start": "ENTREE_CHA_01", "nodes": {"M_CHA_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Fragments noirs, mats, très légers, structure du bois encore lisible (cernes, rayons)", "sub": "Charbon de bois exploitable en anthracologie et pour la datation C14 : la structure anatomique doit rester intacte.", "to": "Q_CHA_01", "flag": "fragile"}, {"txt": "Graines ou fruits noircis, millimétriques, dans le sédiment", "sub": "Carporestes : ne se récupèrent que par tamisage ou flottation, prévoir un prélèvement de sédiment.", "to": "Q_CHA_01", "flag": "fragile"}, {"txt": "Fragments qui s'écrasent en poussière au moindre contact", "sub": "Charbon très friable : prélever sans compression, ne pas tasser dans un sachet.", "to": "Q_CHA_01", "warn": true, "flag": "urgent"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "Q_CHA_01"}]}, "Q_CHA_01": {"type": "question", "phase": "Terrain · analyses", "q": "Des analyses sont-elles prévues sur cet objet ?", "help": "Datation C14, ADN ancien, isotopes, ZooMS… Le lavage et tout contact non protégé contaminent l'échantillon de façon irréversible.", "choices": [{"txt": "Oui, ou c'est possible", "sub": "Dans le doute, on protège l'objet de toute contamination", "flag": "analyses", "warn": true, "to": "C_ANA_CHA_01"}, {"txt": "Non, aucune analyse", "sub": "Ramassage courant", "to": "C_STD_CHA_01"}]}, "C_ANA_CHA_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement protégé (analyses)", "accent": "lab", "why": "Les analyses (C14, ADN, isotopes) exigent un objet non contaminé : pas de lavage, pas de contact à mains nues, pas de sachet plastique pour un échantillon C14.", "lines": [["Geste", "Prélever à la truelle propre, sans jamais comprimer : la structure anatomique doit rester lisible pour l'anthracologue. Déposer sans tasser dans une boîte rigide, jamais dans un sachet écrasé au fond d'une caisse. Compléter systématiquement par un prélèvement de sédiment (plusieurs litres) destiné au tamisage ou à la flottation, seule méthode permettant de récupérer les carporestes. SI DATATION C14 : sélectionner un fragment isolé, le manipuler avec des gants ou une pince propre, le conditionner en feuille d'aluminium ou en pilulier de verre — jamais en sachet plastique — et proscrire tout contact avec une source de carbone moderne. Ne jamais consolider."], ["Matériel", "Boîte rigide, feuille d'aluminium, pilulier en verre, gants, truelle propre, seaux pour prélèvement sédimentaire, étiquettes indiquant le volume prélevé."], ["Témoin", "Isoler un échantillon non traité comme témoin."], ["Fenêtre", "QUELQUES JOURS — surtout pour le séchage avant conditionnement (moisissures)."]], "never": "Ne jamais : compression dans les sachets et les caisses ; conditionnement avant séchage complet ; contact avec toute source de carbone moderne pour les échantillons C14.", "next": {"label": "Traitement post-fouille →", "to": "P_CHA_01"}}, "C_STD_CHA_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement manuel sans compression + prélèvement sédimentaire pour tamisage/flottation", "accent": "accent", "lines": [["Geste", "Prélever à la truelle propre, sans jamais comprimer : la structure anatomique doit rester lisible pour l'anthracologue. Déposer sans tasser dans une boîte rigide, jamais dans un sachet écrasé au fond d'une caisse. Compléter systématiquement par un prélèvement de sédiment (plusieurs litres) destiné au tamisage ou à la flottation, seule méthode permettant de récupérer les carporestes. SI DATATION C14 : sélectionner un fragment isolé, le manipuler avec des gants ou une pince propre, le conditionner en feuille d'aluminium ou en pilulier de verre — jamais en sachet plastique — et proscrire tout contact avec une source de carbone moderne. Ne jamais consolider."], ["Matériel", "Boîte rigide, feuille d'aluminium, pilulier en verre, gants, truelle propre, seaux pour prélèvement sédimentaire, étiquettes indiquant le volume prélevé."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES JOURS — surtout pour le séchage avant conditionnement (moisissures)."], ["Si rien n'est fait", "Fragmentation en poussière sous compression, et développement fongique si le prélèvement est fermé avant séchage complet."]], "more": [["Post-fouille — lavage", "Nettoyage très délicat à l'eau possible pour les charbons destinés à l'anthracologie. INTERDICTION ABSOLUE pour tout fragment destiné à une datation C14 ou à une analyse isotopique."], ["Post-fouille — séchage", "Séchage complet obligatoire avant conditionnement, à l'air, sans lumière ni soleil direct. Le tamisage par flottation expose les charbons à l'eau : bien les sécher ensuite pour prévenir moisissures et biodégradation. SI un conditionnement hermétique est indispensable avant séchage complet, placer le prélèvement au réfrigérateur : le froid bloque le développement fongique."], ["Post-fouille — conditionnement", "Sachets perforés sans compression, par US ou par lot cohérent, en boîte rigide. Milieu sec, température ambiante, pas trop chaud."], ["Climat cible", "< 60% · 15-20 °C"], ["Niveau de preuve", "VALIDÉ — le risque principal n'est pas climatique mais fongique : un prélèvement fermé hermétiquement avant séchage complet développe des moisissures. En cas de conditionnement hermétique nécessaire, PLACER AU RÉFRIGÉRATEUR pour bloquer le développement fongique. Cohérent avec CTC-01 (« milieu plutôt sec à température ambiante »)."], ["Références", "CTC-01 ; CTC-03"]], "never": "Ne jamais : compression dans les sachets et les caisses ; conditionnement avant séchage complet ; contact avec toute source de carbone moderne pour les échantillons C14.", "next": {"label": "Traitement post-fouille →", "to": "P_CHA_01"}}, "P_CHA_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Nettoyage très délicat à l'eau possible pour les charbons destinés à l'anthracologie. INTERDICTION ABSOLUE pour tout fragment destiné à une datation C14 ou à une analyse isotopique."], ["Séchage", "Séchage complet obligatoire avant conditionnement, à l'air, sans lumière ni soleil direct. Le tamisage par flottation expose les charbons à l'eau : bien les sécher ensuite pour prévenir moisissures et biodégradation. SI un conditionnement hermétique est indispensable avant séchage complet, placer le prélèvement au réfrigérateur : le froid bloque le développement fongique."], ["Marquage", "Indirect uniquement (étiquette imputrescible dans le sachet, sans contact)."], ["Conditionnement", "Sachets perforés sans compression, par US ou par lot cohérent, en boîte rigide. Milieu sec, température ambiante, pas trop chaud."]], "never": "Ne jamais : compression dans les sachets et les caisses ; conditionnement avant séchage complet ; contact avec toute source de carbone moderne pour les échantillons C14.", "more": [["Climat cible", "< 60% · 15-20 °C"], ["Niveau de preuve", "VALIDÉ — le risque principal n'est pas climatique mais fongique : un prélèvement fermé hermétiquement avant séchage complet développe des moisissures. En cas de conditionnement hermétique nécessaire, PLACER AU RÉFRIGÉRATEUR pour bloquer le développement fongique. Cohérent avec CTC-01 (« milieu plutôt sec à température ambiante »)."], ["Références", "CTC-01 ; CTC-03"]]}, "ENTREE_CHA_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_CHA_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_CHA_01"}]}}, "epi": true}, "MAL_01": {"nom": "Malacofaune (coquillages, mollusques)", "cat": "Matières organiques", "urgence": "Précaution", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_MAL_01", "nodes": {"M_MAL_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Coquille nacrée, entière, surface lisse", "sub": "Bonne conservation, sol neutre à calcaire.", "to": "Q_MAL_01"}, {"txt": "Plaquettes blanchâtres, feuilletées, tendres", "sub": "Dissolution par sol acide : ne pas nettoyer, la coquille se délite.", "to": "Q_MAL_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "Q_MAL_01"}]}, "Q_MAL_01": {"type": "question", "phase": "Terrain · analyses", "q": "Des analyses sont-elles prévues sur cet objet ?", "help": "Datation C14, ADN ancien, isotopes, ZooMS… Le lavage et tout contact non protégé contaminent l'échantillon de façon irréversible.", "choices": [{"txt": "Oui, ou c'est possible", "sub": "Dans le doute, on protège l'objet de toute contamination", "flag": "analyses", "warn": true, "to": "C_ANA_MAL_01"}, {"txt": "Non, aucune analyse", "sub": "Ramassage courant", "to": "C_STD_MAL_01"}]}, "C_ANA_MAL_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement protégé (analyses)", "accent": "lab", "why": "Les analyses (C14, ADN, isotopes) exigent un objet non contaminé : pas de lavage, pas de contact à mains nues, pas de sachet plastique pour un échantillon C14.", "lines": [["Geste", "Coquilles sèches et cohérentes : lever directement, nettoyer éventuellement au pinceau. Si la surface est crayeuse ou feuilletée, NE PAS NETTOYER et emballer en l'état. Ne jamais laver une coquille portant un enduit, un résidu culinaire ou une trace d'usage : le nettoyage relève alors de votre GAF ou du pôle restauration. Proscrire papiers et cartons ordinaires, dont les vapeurs acides attaquent le carbonate de calcium."], ["Matériel", "Sachets ou piluliers individuels, boîte rigide, papier de soie non acide, mousse Plastazote."], ["Témoin", "Isoler un échantillon non traité comme témoin."], ["Fenêtre", "QUELQUES SEMAINES — séchage lent à organiser rapidement si trouvées humides."]], "never": "Ne jamais : papiers et cartons ordinaires (vapeurs acides attaquant le carbonate de calcium) ; ouate au contact direct (les fibres s'accrochent aux surfaces friables) ; abrasion entre coquilles.", "next": {"label": "Traitement post-fouille →", "to": "P_MAL_01"}}, "C_STD_MAL_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel ou par lot, calage rigide", "accent": "accent", "lines": [["Geste", "Coquilles sèches et cohérentes : lever directement, nettoyer éventuellement au pinceau. Si la surface est crayeuse ou feuilletée, NE PAS NETTOYER et emballer en l'état. Ne jamais laver une coquille portant un enduit, un résidu culinaire ou une trace d'usage : le nettoyage relève alors de votre GAF ou du pôle restauration. Proscrire papiers et cartons ordinaires, dont les vapeurs acides attaquent le carbonate de calcium."], ["Matériel", "Sachets ou piluliers individuels, boîte rigide, papier de soie non acide, mousse Plastazote."], ["Fenêtre", "QUELQUES SEMAINES — séchage lent à organiser rapidement si trouvées humides."], ["Si rien n'est fait", "Délamination en feuillets et effritement de la coquille, surtout sur ormeaux, patelles et moules."]], "more": [["Post-fouille — lavage", "Lavage à l'eau froide au pinceau souple pour les coquilles cohérentes. NE PAS LAVER les coquilles crayeuses, feuilletées, ou portant enduits et résidus culinaires."], ["Post-fouille — séchage", "Séchage lent à l'abri de la chaleur et du vent. Ne jamais sécher au soleil."], ["Post-fouille — conditionnement", "Sachets ou piluliers individuels calés en boîte rigide, papier de soie non acide. Séparer par catégorie taxonomique après tri."], ["Climat cible", "45-55% · 15-20 °C"], ["Niveau de preuve", "CONSENSUS — Bergeron & Rémillard 2021 ; sensibilité aux vapeurs acides documentée."], ["Références", "Bergeron, Rémillard 2021 ; CTC-03"]], "never": "Ne jamais : papiers et cartons ordinaires (vapeurs acides attaquant le carbonate de calcium) ; ouate au contact direct (les fibres s'accrochent aux surfaces friables) ; abrasion entre coquilles.", "next": {"label": "Traitement post-fouille →", "to": "P_MAL_01"}}, "P_MAL_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Lavage à l'eau froide au pinceau souple pour les coquilles cohérentes. NE PAS LAVER les coquilles crayeuses, feuilletées, ou portant enduits et résidus culinaires."], ["Séchage", "Séchage lent à l'abri de la chaleur et du vent. Ne jamais sécher au soleil."], ["Marquage", "Indirect uniquement (étiquette imputrescible dans le sachet)."], ["Conditionnement", "Sachets ou piluliers individuels calés en boîte rigide, papier de soie non acide. Séparer par catégorie taxonomique après tri."]], "never": "Ne jamais : papiers et cartons ordinaires (vapeurs acides attaquant le carbonate de calcium) ; ouate au contact direct (les fibres s'accrochent aux surfaces friables) ; abrasion entre coquilles.", "more": [["Climat cible", "45-55% · 15-20 °C"], ["Niveau de preuve", "CONSENSUS — Bergeron & Rémillard 2021 ; sensibilité aux vapeurs acides documentée."], ["Références", "Bergeron, Rémillard 2021 ; CTC-03"]]}, "ENTREE_MAL_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_MAL_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_MAL_01"}]}}, "epi": false}, "TCRU_01": {"nom": "Terre crue (torchis, adobe, pisé)", "cat": "Matériaux siliceux / minéraux", "urgence": "Précaution", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_TCRU_01", "nodes": {"M_TCRU_01": {"type": "question", "phase": "Terrain · milieu", "q": "Dans quel milieu l'objet était-il enfoui ?", "help": "Le milieu commande la conduite avant même l'état de l'objet. L'eau, surtout salée, change tout.", "choices": [{"txt": "Sec", "sub": "Terre sèche, l'objet n'est pas humide au toucher", "to": "D_TCRU_01"}, {"txt": "Humide", "sub": "La terre colle, l'objet est frais et humide", "flag": "humide", "to": "D_TCRU_01"}, {"txt": "Gorgé d'eau", "sub": "Puits, fossé, zone humide non marine", "warn": true, "to": "C_HUM_TCRU_01"}, {"txt": "Subaquatique (eau douce)", "sub": "Rivière, lac, source — eau non salée", "warn": true, "to": "C_HUM_TCRU_01"}, {"txt": "Sous-marin / eau salée", "sub": "Mer, estran, épave, résurgence salée", "warn": true, "to": "MAR_TCRU_01"}]}, "DEC_N_TCRU_01": {"type": "question", "phase": "Terrain · décor et marques", "q": "L'objet porte-t-il un décor, un engobe, une estampille ou une marque ?", "help": "Exemples pour ce matériau : empreinte de clayonnage, enduit ou badigeon résiduel. Ces éléments s'effacent au lavage, au frottement dans la caisse ou au séchage trop rapide — et l'information est alors perdue.", "choices": [{"txt": "Oui, ou c'est possible", "sub": "On protège la surface : pas de brossage, lavage à l'éponge douce uniquement", "warn": true, "flag": "decor", "to": "S1_TCRU_01"}, {"txt": "Non, surface nue", "sub": "Traitement courant du matériau", "to": "S1_TCRU_01"}, {"txt": "Je ne sais pas", "sub": "Dans le doute, on protège la surface", "warn": true, "flag": "decor", "to": "S1_TCRU_01"}]}, "D_TCRU_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Masse terreuse à structure lisible, empreintes de végétaux ou de clayonnage", "sub": "Terre crue : fond instantanément à l'eau, s'effrite au séchage brutal.", "to": "DEC_N_TCRU_01", "flag": "fragile"}, {"txt": "Zones rougies, durcies", "sub": "Torchis rubéfié par un incendie : plus cohérent, mais l'HR d'équilibre change.", "to": "DEC_N_TCRU_01"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "DEC_N_TCRU_01"}]}, "S1_TCRU_01": {"type": "question", "phase": "Terrain · aspect", "q": "Regardez l'objet.", "help": "Généralement non cuit, très faible résistance mécanique.", "choices": [{"txt": "Cohérent, d'un seul tenant", "to": "C_SEC_TCRU_01"}, {"txt": "ALERTE : Fonte immédiate au contact de l'eau, effritement to", "sub": "Risque de perte de matière ou d'information", "warn": true, "to": "C_MOTTE_TCRU_01"}]}, "C_SEC_TCRU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en bloc assisté", "accent": "accent", "lines": [["Geste", "INTERDICTION ABSOLUE DE LAVER : la matière fond instantanément au contact de l'eau. Utiliser un support rigide glissé sous l'ensemble pour le soulever. Protéger de la pluie et du séchage brutal (effritement)."], ["Matériel", "Plaque de polypropylène, mousse de calage, bâche."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES JOURS — fonte à l'humidité, effritement au séchage brutal."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."], ["Si rien n'est fait", "Dissolution au contact de l'eau, ou effritement complet au séchage brutal."]], "more": [["Post-fouille — lavage", "INTERDICTION ABSOLUE DE LAVER (la matière fond instantanément)."], ["Post-fouille — séchage", "Séchage très lent progressif sous abri ou confiné."], ["Post-fouille — conditionnement", "Boîtes étanches avec calage mousse Plastazote."], ["Climat cible", "40-60% · 15-25 °C"], ["Niveau de preuve", "VALIDÉ — plage large assumée : le taux d'HR d'équilibre de la terre crue varie fortement selon la composition du matériau (proportion d'argile, dégraissants végétaux ou minéraux), le milieu d'enfouissement et l'existence d'une chauffe partielle (torchis rubéfié). EN CAS DE DOUTE, CONTACTER VOTRE GAF OU LE PÔLE RESTAURATION."], ["Références", "CTC-07"]], "never": "Ne jamais : humidité excessive, brossage humide.", "next": {"label": "Traitement post-fouille →", "to": "P_TCRU_01"}}, "C_MOTTE_TCRU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en bloc assisté", "accent": "accent", "lines": [["Geste", "INTERDICTION ABSOLUE DE LAVER : la matière fond instantanément au contact de l'eau. Utiliser un support rigide glissé sous l'ensemble pour le soulever. Protéger de la pluie et du séchage brutal (effritement)."], ["Matériel", "Plaque de polypropylène, mousse de calage, bâche."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES JOURS — fonte à l'humidité, effritement au séchage brutal."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."], ["Si rien n'est fait", "Dissolution au contact de l'eau, ou effritement complet au séchage brutal."]], "more": [["Post-fouille — lavage", "INTERDICTION ABSOLUE DE LAVER (la matière fond instantanément)."], ["Post-fouille — séchage", "Séchage très lent progressif sous abri ou confiné."], ["Post-fouille — conditionnement", "Boîtes étanches avec calage mousse Plastazote."], ["Climat cible", "40-60% · 15-25 °C"], ["Niveau de preuve", "VALIDÉ — plage large assumée : le taux d'HR d'équilibre de la terre crue varie fortement selon la composition du matériau (proportion d'argile, dégraissants végétaux ou minéraux), le milieu d'enfouissement et l'existence d'une chauffe partielle (torchis rubéfié). EN CAS DE DOUTE, CONTACTER VOTRE GAF OU LE PÔLE RESTAURATION."], ["Références", "CTC-07"]], "why": "Matériau fragile : on prélève en bloc avec le sédiment pour ne pas perdre de matière.", "never": "Ne jamais : humidité excessive, brossage humide.", "next": {"label": "Traitement post-fouille →", "to": "P_TCRU_01"}}, "C_HUM_TCRU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Humide / gorgé — maintenir en état", "accent": "accent", "why": "On conserve l'objet dans son état d'humidité d'origine jusqu'à l'avis de votre GAF ou du pôle restauration.", "lines": [["Geste", "INTERDICTION ABSOLUE DE LAVER : la matière fond instantanément au contact de l'eau. Utiliser un support rigide glissé sous l'ensemble pour le soulever. Protéger de la pluie et du séchage brutal (effritement)."], ["Matériel", "Plaque de polypropylène, mousse de calage, bâche."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Fenêtre", "QUELQUES JOURS — fonte à l'humidité, effritement au séchage brutal."]], "never": "Ne jamais : humidité excessive, brossage humide.", "more": [["Références", "CTC-07"]], "next": {"label": "Traitement post-fouille →", "to": "P_TCRU_01"}}, "MAR_TCRU_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Sous-marin / eau salée — maintenir en eau", "accent": "lab", "why": "Le mobilier gorgé d'eau salée ne doit jamais sécher avant dessalage : la cristallisation des sels fait éclater la matière. Le dessalage se fait en laboratoire, par bains progressifs.", "lines": [["D'abord", "En domaine public maritime, vérifier avec le Drassm et le RO s'il faut remonter l'objet : souvent, on le laisse sur site (réenfouissement, géotextile)."], ["Si remonté", "Maintenir en eau, sans jamais laisser sécher. Petits objets en sachet zippé avec un fond d'eau ; grands objets enroulés de textiles mouillés puis film étanche."], ["Fenêtre", "Urgent — contacter le GAF du pôle subaquatique ou le laboratoire pour le dessalage"]], "never": "Ne jamais laisser sécher l'objet avant son dessalage en laboratoire.", "more": [["Dessalage", "Bains d'eau douce successifs, contrôlés par mesure de la conductivité, sur plusieurs semaines. Seuls l'or et le plomb échappent au dessalage préalable (CTC-06, CTC-12)."], ["Référence", "CTC-12 (milieu subaquatique et sous-marin) ; CTC-06 ; Bergeron & Rémillard 2021"]]}, "P_TCRU_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "INTERDICTION ABSOLUE DE LAVER (la matière fond instantanément)."], ["Séchage", "Séchage très lent progressif sous abri ou confiné."], ["Marquage", "Indirect uniquement (étiquette imputrescible)."], ["Conditionnement", "Boîtes étanches avec calage mousse Plastazote."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."]], "never": "Ne jamais : humidité excessive, brossage humide.", "more": [["Climat cible", "40-60% · 15-25 °C"], ["Niveau de preuve", "VALIDÉ — plage large assumée : le taux d'HR d'équilibre de la terre crue varie fortement selon la composition du matériau (proportion d'argile, dégraissants végétaux ou minéraux), le milieu d'enfouissement et l'existence d'une chauffe partielle (torchis rubéfié). EN CAS DE DOUTE, CONTACTER VOTRE GAF OU LE PÔLE RESTAURATION."], ["Références", "CTC-07"]]}, "ENTREE_TCRU_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_TCRU_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_TCRU_01"}]}}, "epi": false}, "LIAN_01": {"nom": "Liants de construction (mortiers, plâtres)", "cat": "Matériaux siliceux / minéraux", "urgence": "Standard", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_LIAN_01", "nodes": {"DEC_N_LIAN_01": {"type": "question", "phase": "Terrain · décor et marques", "q": "L'objet porte-t-il un décor, un engobe, une estampille ou une marque ?", "help": "Exemples pour ce matériau : empreinte de coffrage ou de clayonnage, lissage de surface, décor incisé. Ces éléments s'effacent au lavage, au frottement dans la caisse ou au séchage trop rapide — et l'information est alors perdue.", "choices": [{"txt": "Oui, ou c'est possible", "sub": "On protège la surface : pas de brossage, lavage à l'éponge douce uniquement", "warn": true, "flag": "decor", "to": "Q_LIAN_01"}, {"txt": "Non, surface nue", "sub": "Traitement courant du matériau", "to": "Q_LIAN_01"}, {"txt": "Je ne sais pas", "sub": "Dans le doute, on protège la surface", "warn": true, "flag": "decor", "to": "Q_LIAN_01"}]}, "Q_LIAN_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement d'échantillons de référence", "accent": "accent", "lines": [["Geste", "Éviter tout lavage ou brossage. Prélever de petits volumes représentatifs (taille d'un morceau de sucre) dans des sachets individuels. Les inclusions charbonneuses des mortiers pouvant servir à une datation C14, manipuler avec des gants et sans contact avec des matières carbonées."], ["Matériel", "Sachets zippés individuels, gants, boîtes rigides de calage."], ["Fenêtre", "PLUSIEURS MOIS — séchage complet à assurer avant conditionnement."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Caler les pièces et éviter tout frottement entre elles."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."], ["Si rien n'est fait", "Effritement et perte des inclusions charbonneuses exploitables pour la datation."]], "more": [["Post-fouille — lavage", "INTERDICTION DE LAVER. Dégagement à sec exclusif."], ["Post-fouille — séchage", "Séchage complet à plat (sac ouvert)."], ["Post-fouille — conditionnement", "Boîtes étanches ou sachets individuels, calage mousse."], ["Climat cible", "Plâtre : < 60% / Mortier : 40-60% · 18-20 °C"], ["Niveau de preuve", "CONSENSUS — CTC-07 ; valeur du plâtre distincte de celle des mortiers."], ["Références", "CTC-07"]], "never": "Ne jamais : humidité excessive, emballage hermétique avant séchage complet (moisissures).", "next": {"label": "Traitement post-fouille →", "to": "P_LIAN_01"}}, "M_LIAN_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Mortier compact, surface lissée ou portant une empreinte de coffrage", "sub": "Liant en bon état : prélever un échantillon de référence sans le laver.", "to": "DEC_N_LIAN_01"}, {"txt": "Inclusions noires charbonneuses visibles dans la masse", "sub": "Charbons inclus : potentiel de datation C14, manipuler avec gants et sans contact carboné.", "to": "DEC_N_LIAN_01", "flag": "fragile"}, {"txt": "Mortier friable qui se délite au toucher, plâtre pulvérulent", "sub": "Perte de cohésion : prélever en bloc avec un support rigide.", "to": "DEC_N_LIAN_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "DEC_N_LIAN_01"}]}, "P_LIAN_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "INTERDICTION DE LAVER. Dégagement à sec exclusif."], ["Séchage", "Séchage complet à plat (sac ouvert)."], ["Marquage", "Indirect uniquement (étiquette imputrescible au marqueur indélébile)."], ["Conditionnement", "Boîtes étanches ou sachets individuels, calage mousse."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Caler les pièces et éviter tout frottement entre elles."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."]], "never": "Ne jamais : humidité excessive, emballage hermétique avant séchage complet (moisissures).", "more": [["Climat cible", "Plâtre : < 60% / Mortier : 40-60% · 18-20 °C"], ["Niveau de preuve", "CONSENSUS — CTC-07 ; valeur du plâtre distincte de celle des mortiers."], ["Références", "CTC-07"]]}, "ENTREE_LIAN_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_LIAN_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_LIAN_01"}]}}, "epi": false}, "LIT_01": {"nom": "Silex taillé", "cat": "Matériaux siliceux / minéraux", "urgence": "Précaution", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_LIT_01", "nodes": {"Q_LIT_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage individuel immédiat", "accent": "accent", "lines": [["Geste", "NE JAMAIS BROSSER NI FROTTER si une étude tracéologique est envisagée : le poli d'usure (lustré) et les résidus de surface sont détruits par le moindre frottement, y compris entre pièces dans une même caisse. Isoler immédiatement en sachet individuel."], ["Matériel", "Sachets Minigrip individuels."], ["Fenêtre", "PLUSIEURS MOIS — matériau inerte ; seul le lavage est irréversible."], ["Si rien n'est fait", "Effacement du lustré d'usure et des résidus par frottement — perte irréversible du potentiel tracéologique."]], "more": [["Post-fouille — lavage", "NE PAS LAVER (si étude de tracéologie prévue)."], ["Post-fouille — séchage", "Séchage naturel."], ["Post-fouille — conditionnement", "Sachets Minigrip individuels séparés."], ["Climat cible", "Indifférent · 15-25 °C"], ["Niveau de preuve", "CONSENSUS — matériau inerte, aucune contrainte climatique documentée."], ["Références", "CTC-05"]], "never": "Ne jamais : brossage dur, frottements entre silex dans les caisses.", "next": {"label": "Traitement post-fouille →", "to": "P_LIT_01"}}, "M_LIT_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Tranchant luisant, poli localisé", "sub": "Lustré d'usure : indice tracéologique, détruit par le moindre frottement. NE PAS LAVER.", "to": "Q_LIT_01", "flag": "fra : pas de brossage, lavage à l'éponge douce uniquement", "warn": true, "flag": "decor", "to": "Q_MIN_01"}, {"txt": "Non, surface nue", "sub": "Traitement courant du matériau", "to": "Q_MIN_01"}, {"txt": "Je ne sais pas", "sub": "Dans le doute, on protège la surface", "warn": true, "flag": "decor", "to": "Q_MIN_01"}]}, "Q_MIN_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage systématique, prélèvement spécifique pour les meules", "accent": "accent", "lines": [["Geste", "Pour les meules et molettes, protéger absolument les surfaces actives de broyage en les emballant hermétiquement : elles conservent phytolithes, amidons et résidus végétaux. Ne pas laver ces surfaces. Prélever un échantillon de sédiment témoin au contact."], ["Matériel", "Film étirable, sachet Zip (sédiment témoin), palettes, sangles."], ["Fenêtre", "PLUSIEURS MOIS — matériau stable."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Caler les pièces et éviter tout frottement entre elles."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."], ["Si rien n'est fait", "Perte des résidus végétaux et des amidons conservés sur les surfaces actives des meules."]], "more": [["Post-fouille — lavage", "Lavage à l'eau (meules : ne pas laver la zone active)."], ["Post-fouille — séchage", "Séchage lent progressif à l'ombre."], ["Post-fouille — conditionnement", "Caisses PP ajour 01"}, {"txt": "Non, surface nue", "sub": "Traitement courant du matériau", "to": "Q_LAP_01"}, {"txt": "Je ne sais pas", "sub": "Dans le doute, on protège la surface", "warn": true, "flag": "decor", "to": "Q_LAP_01"}]}, "Q_LAP_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement sur palette avec calage mousse", "accent": "accent", "lines": [["Geste", "Utiliser exclusivement des élingues de levage souples. NE JAMAIS BROSSER en cas de trace de polychromie, même très lacunaire. Protéger du gel (gélifraction) et ne pas stocker à l'extérieur sans abri."], ["Matériel", "Palette bois, élingues de levage souples, mousse Plastazote, bâche."], ["Fenêtre", "PLUSIEURS MOIS — hors gel, qui impose une mise à l'abri avant l'hiver."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Caler les pièces et éviter tout frottement entre elles."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."], ["Si rien n'est fait", "Gélifraction en cas d'exposition au gel, et perte des traces de polychromie au brossage."]], "more": [["Post-fouille — lavage", "Nettoyage doux pour la pierre nue. Ne pas brosser polychromies."], ["Post-fouille — séchage", "Séchage naturel complet à plat à l'abri du soleil direct."], ["Post-fouille — conditionnement", "Caisses robustes, calage Plastazote, plaques ou palettes."], ["Climat cible", "40-60% (stucs : < 55%) · 18-20 °C"], ["Niveau de preuve", "NORME — CTC-04 ; hors gel."], ["Références", "CTC-04"]], "never": "Ne jamais : stockage extérieur sans abri, bâche hermétique humide (condensation).", "next": {"label": "Traitement post-fouille →", "to": "P_LAP_01"}}, "M_LAP_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Bloc taillé à surface régulière, traces d'outil visibles", "sub": "Lapidaire architectural : les traces d'outil sont une donnée technique à préserver.", "to": "DEC_N_LAP_01", "flag": "fragile"}, {"txt": "Zones colorées, résidus d'enduit ou de badigeon, même très lacunaires", "sub": "Polychromie résiduelle : NE JAMAIS BROSSER, l'information disparaît au premier geste.", "to": "DEC_N_LAP_01", "warn": true, "flag": "urgent"}, {"txt": "Pierre qui s'effrite, se desquame ou se délite en plaques", "sub": "Altération par le gel ou les sels : protéger du gel, ne pas stocker à l'extérieur sans abri.", "to": "DEC_N_LAP_01", "flag": "fragile"}, {"txt": "Inscription, moulure ou décor sculpté", "sub": "Élément à documenter et à caler individuellement, face décorée protégée.", "to": "DEC_N_LAP_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "DEC_N_LAP_01"}]}, "P_LAP_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Nettoyage doux pour la pierre nue. Ne pas brosser polychromies."], ["Séchage", "Séchage naturel complet à plat à l'abri du soleil direct."], ["Marquage", "Indirect privilégié (étiquette imputrescible attachée par un élastique à chapeau)."], ["Conditionnement", "Caisses robustes, calage Plastazote, plaques ou palettes."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Caler les pièces et éviter tout frottement entre elles."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."]], "never": "Ne jamais : stockage extérieur sans abri, bâche hermétique humide (condensation).", "more": [["Climat cible", "40-60% (stucs : < 55%) · 18-20 °C"], ["Niveau de preuve", "NORME — CTC-04 ; hors gel."], ["Références", "CTC-04"]]}, "ENTREE_LAP_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_LAP_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_LAP_01"}]}}, "epi": false}, "SCO_01": {"nom": "Scories et déchets de production métallurgique", "cat": "Matériaux siliceux / minéraux", "urgence": "Standard", "risque": "PRÉCAUTIONS — Charges lourdes : respecter les règles de manutention et ne pas surcharger les caisses.", "start": "ENTREE_SCO_01", "nodes": {"Q_SCO_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Échantillonnage raisonné par US + prélèvement sédimentaire pour les battitures", "accent": "accent", "lines": [["Geste", "Ne pas ramasser en vrac : le tri doit être raisonné et rattaché à l'US. Prélever environ la moitié du remplissage de chaque structure, jusqu'à un volume de 10 litres ; traiter individuellement les foyers et les structures complexes, et relever une coupe stratigraphique dans le cas d'un ferrier. Ajouter un prélèvement systématique de 5 à 10 cm³ de sédiment par US pour la recherche des battitures, et de 2 à 5 litres sur les structures de travail identifiées (foyers, ateliers). ATTENTION : isoler à part tout objet identifiable et toute « boule d'oxydes » douteuse, qui relève du protocole des métaux (boîte étanche avec dessiccant, radiographie) et non de celui des déchets."], ["Matériel", "Seaux gradués, sachets par US, caisses renforcées, aimant (repérage des battitures), étiquettes imputrescibles."], ["Fenêtre", "PLUSIEURS MOIS — matériau stable ; l'urgence est organisationnelle (volumes)."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Caler les pièces et éviter tout frottement entre elles."], ["Si rien n'est fait", "Écrasement des scories bulleuses sous le poids, et perte du rattachement à l'US si le tri n'est pas raisonné."]], "more": [["Post-fouille — lavage", "Lavage sur le terrain recommandé (jet nébulisé à basse pression sur grille), qui évite de transporter des volumes considérables au dépôt. Le tri doit être dirigé par un paléométallurgiste."], ["Post-fouille — séchage", "Séchage à l'air libre sur bâche après lavage. Tri une fois sec, par catégories techniques : minerai, argile cuite, parois de foyer, scories coulées, scories piégées, culots, matériel métallique."], ["Post-fouille — conditionnement", "Caisses gerbables renforcées, pesée par catégorie (culots individuellement, scories coulées en vrac). Ne pas surcharger : risque d'écrasement des scories bulleuses."], ["Climat cible", "< 60% (stable) · > 12 °C"], ["Niveau de preuve", "VALIDÉ — matériau stable, seuil large suffisant. Aucune contrainte climatique spécifique n'est prescrite par CTC-06 pour les déchets de production, à la différence des objets métalliques."], ["Références", "CTC-06"]], "never": "Ne jamais : surcharge des caisses ; mélange des catégories techniques ; conditionnement avec les objets métalliques, qui relèvent d'un climat sec strict.", "next": {"label": "Traitement post-fouille →", "to": "P_SCO_01"}}, "M_SCO_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Masse dense, vitreuse ou bulleuse, gris sombre à brun-rouge", "sub": "Scorie : matériau stable.", "to": "Q_SCO_01"}, {"txt": "Paillettes millimétriques attirées par l'aimant", "sub": "Battitures : signent une activité de forge. Prélèvement de sédiment nécessaire.", "to": "Q_SCO_01"}, {"txt": "Boule d'oxydes indéterminée, dense", "sub": "Peut masquer un objet métallique : relève du protocole des métaux, pas des déchets.", "to": "Q_SCO_01", "warn": true, "flag": "urgent"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "Q_SCO_01"}]}, "P_SCO_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Lavage sur le terrain recommandé (jet nébulisé à basse pression sur grille), qui évite de transporter des volumes considérables au dépôt. Le tri doit être dirigé par un paléométallurgiste."], ["Séchage", "Séchage à l'air libre sur bâche après lavage. Tri une fois sec, par catégories techniques : minerai, argile cuite, parois de foyer, scories coulées, scories piégées, culots, matériel métallique."], ["Marquage", "Indirect (étiquette imputrescible par lot, dans le sachet ou attachée)."], ["Conditionnement", "Caisses gerbables renforcées, pesée par catégorie (culots individuellement, scories coulées en vrac). Ne pas surcharger : risque d'écrasement des scories bulleuses."], ["Mise en caisse", "Ne pas dépasser 10 kg par caisse, seuil retenu par la plupart des SRA. Adapter le FORMAT DE LA CAISSE AU CONTENU, et non l'inverse : plus les éléments sont lourds, plus la caisse doit être petite. Caler les pièces et éviter tout frottement entre elles."]], "never": "Ne jamais : surcharge des caisses ; mélange des catégories techniques ; conditionnement avec les objets métalliques, qui relèvent d'un climat sec strict.", "more": [["Climat cible", "< 60% (stable) · > 12 °C"], ["Niveau de preuve", "VALIDÉ — matériau stable, seuil large suffisant. Aucune contrainte climatique spécifique n'est prescrite par CTC-06 pour les déchets de production, à la différence des objets métalliques."], ["Références", "CTC-06"]]}, "ENTREE_SCO_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_SCO_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_SCO_01"}]}}, "epi": true}, "COMP_01": {"nom": "Objets composites (métal + organique, métal + verre, etc.)", "cat": "Composite", "urgence": "Urgence", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_COMP_01", "nodes": {"M_COMP_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Deux matières visibles sur le même objet (métal + os, bois, cuir, verre…)", "sub": "Objet composite : les exigences climatiques sont contradictoires, ne jamais séparer.", "to": "C_COMP_01", "warn": true, "flag": "urgent"}, {"txt": "Empreinte de fibres ou de bois dans la corrosion d'un métal", "sub": "Restes organiques minéralisés : invisibles mais présents, ne pas nettoyer la gangue.", "to": "C_COMP_01", "warn": true, "flag": "urgent"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "C_COMP_01"}]}, "C_COMP_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement en motte (Block-lift) — règle par défaut", "accent": "lab", "why": "Les exigences des composantes sont contradictoires (le métal veut le sec, l'organique l'humidité). On ne sépare jamais, on prélève en bloc et on privilégie la composante la plus fragile — le plus souvent l'organique.", "lines": [["Geste", "NE JAMAIS SÉPARER LES COMPOSANTES SUR LE TERRAIN, ni tenter de dégager l'une pour atteindre l'autre : l'association matérielle est en elle-même une donnée archéologique (technologie de l'objet, restes organiques minéralisés, contenu). Prélever l'ensemble en bloc avec son sédiment, sur plaque PP rigide (jamais de métal ni de bois, qui gênent la radiographie). Ne rien laver, ne rien consolider. Signaler la nature composite dès la fiche d'intervention : l'arbitrage climatique et la micro-fouille relèvent obligatoirement d'un conservateur-restaurateur."], ["Matériel", "Plaque PP rigide, film étirable PE, ruban adhésif toilé, boîte hermétique, mousse Plastazote."], ["Arbitrage", "Privilégier le matériau le plus fragile pour le conditionnement. Arbitrage climatique par le pôle restauration (cas complexe)."], ["Fenêtre", "ALIGNÉE SUR LA COMPOSANTE LA PLUS URGENTE — généralement le métal ou l'organique associé."]], "never": "Ne jamais : tout compromis climatique intermédiaire non documenté ; séparation mécanique des composantes ; gel de silice au contact direct de la composante organique.", "next": {"label": "Traitement post-fouille →", "to": "P_COMP_01"}}, "P_COMP_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "INTERDICTION DE LAVER (l'eau attaque la composante la plus sensible, généralement le métal)."], ["Séchage", "Séchage proscrit sans arbitrage préalable de votre GAF ou du pôle restauration : les régimes de séchage des composantes sont incompatibles."], ["Marquage", "Indirect uniquement (étiquette imputrescible, sans contact avec l'objet)."], ["Conditionnement", "Boîte hermétique PP/PE, calage Plastazote sur mesure, isolation physique de l'interface."]], "never": "Ne jamais : tout compromis climatique intermédiaire non documenté ; séparation mécanique des composantes ; gel de silice au contact direct de la composante organique.", "more": [["Climat cible", "RÈGLE D'ARBITRAGE : appliquer l'exigence du matériau le PLUS RÉACTIF, c'est-à-dire en pratique le métal (< 15 % HR si fer, < 30 % HR sinon). Le métal se dégrade de façon rapide, active et irréversible, tandis que l'organique maintenu trop sec subit un dommage plus lent et partiellement réversible. Isoler physiquement la composante organique (mousse, interface inerte) pour limiter sa dessiccation, et signaler le compromis dans la notice d'inventaire. · 15-25 °C, stable"], ["Niveau de preuve", "RÈGLE D'ARBITRAGE — non mesurée : découle de l'exigence du composant le plus réactif (Kramer 2009 ; Thickett et al. 2024)."], ["Références", "Berducou 1990 ; Scholl 2015 ; Kramer 2009 ; Thickett et al. 2024"]]}, "ENTREE_COMP_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_COMP_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_COMP_01"}]}}, "epi": true}, "CER_01": {"nom": "Céramique et terre cuite", "cat": "Matériaux siliceux / minéraux", "urgence": "Précaution", "risque": "Aucun risque pour la personne. Le niveau d'urgence indiqué concerne exclusivement l'objet.", "start": "ENTREE_CER_01", "nodes": {"M_CER_01": {"type": "question", "phase": "Terrain · milieu", "q": "Dans quel milieu l'objet était-il enfoui ?", "help": "Le milieu commande la conduite avant même l'état de l'objet. L'eau, surtout salée, change tout.", "choices": [{"txt": "Sec", "sub": "Terre sèche, l'objet n'est pas humide au toucher", "to": "K_CER_01"}, {"txt": "Humide", "sub": "La terre colle, l'objet est frais et humide", "flag": "humide", "to": "K_CER_01"}, {"txt": "Gorgé d'eau", "sub": "Puits, fossé, zone humide non marine", "warn": true, "to": "C_HUM_CER_01"}, {"txt": "Subaquatique (eau douce)", "sub": "Rivière, lac, source — eau non salée", "warn": true, "to": "C_HUM_CER_01"}, {"txt": "Sous-marin / eau salée", "sub": "Mer, estran, épave, résurgence salée", "warn": true, "to": "MAR_CER_01"}]}, "D_CER_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Tesson cohérent, tranche nette, son clair", "sub": "Céramique bien cuite, stable.", "to": "E_CER_01"}, {"txt": "Pâte tendre qui marque à l'ongle, tranche friable", "sub": "Céramique peu cuite : ne supporte ni le lavage ni le séchage rapide.", "to": "E_CER_01", "flag": "fragile"}, {"txt": "Efflorescences blanches en surface, poudre saline", "sub": "Cristallisation de sels solubles : va faire éclater la surface au séchage.", "to": "E_CER_01", "warn": true, "flag": "urgent"}, {"txt": "Croûte ou dépôt carbonisé adhérent, surface grasse", "sub": "Résidus organiques ou culinaires : NE PAS LAVER, potentiel d'analyse.", "to": "E_CER_01", "flag": "fragile"}, {"txt": "Rien de tout cela / je ne sais pas", "sub": "On continue avec le protocole le plus protecteur", "to": "E_CER_01"}]}, "K_CER_01": {"type": "question", "phase": "Terrain · contexte", "q": "Dans quel contexte l'objet a-t-il été découvert ?", "help": "Le contexte dit si l'objet fait partie d'un ensemble dont il faut préserver l'organisation.", "choices": [{"txt": "Standard", "sub": "Habitat, remblai, couche générale", "to": "D_CER_01"}, {"txt": "Funéraire", "sub": "Sépulture, dépôt funéraire", "flag": "funeraire", "to": "D_CER_01"}, {"txt": "Dépôt / amas", "sub": "Cache, dépôt volontaire, objets groupés", "flag": "depot", "to": "D_CER_01"}, {"txt": "Bâti", "sub": "Pris dans une maçonnerie, un sol, une structure", "flag": "bati", "to": "D_CER_01"}]}, "E_CER_01": {"type": "question", "phase": "Terrain · état et typologie", "q": "Dans quel état se présente la céramique ?", "help": "Un vase complet, un vase de forme particulière ou une pâte peu cuite n'appellent pas le même geste qu'un tesson courant.", "choices": [{"txt": "Tesson ou lot de tessons", "sub": "Pâte en bon état, tranche nette", "to": "R_CER_01"}, {"txt": "Vase complet ou archéologiquement complet, encore rempli de sédiment", "sub": "Le contenu est une archive : ne jamais le vider sur le terrain", "warn": true, "flag": "vase_plein", "to": "R_CER_01"}, {"txt": "Forme particulière (vase miniature, vase perforé, entonnoir, biberon…)", "sub": "Ces formes sont ciblées en priorité pour l'analyse des contenus", "warn": true, "flag": "typo_particuliere", "to": "R_CER_01"}, {"txt": "Pâte peu cuite, pulvérulente ou gorgée d'eau", "sub": "Ne supporte ni le lavage ni le séchage rapide", "warn": true, "flag": "fragile", "to": "R_CER_01"}]}, "R_CER_01": {"type": "question", "phase": "Terrain · résidus, décors et marques", "q": "Que voyez-vous sur la surface du tesson ou dans le vase ?", "help": "Ces éléments disparaissent au lavage, au frottement ou au contact d'un plastique. Plusieurs cas possibles : choisissez le plus contraignant.", "choices": [{"txt": "Dépôts noirs ou blanchâtres, encroûtements, résidus adhérents", "sub": "Macro ou micro-restes organiques : protocole d'analyse du Groupe de Recherche Céramique", "warn": true, "flag": "residus", "to": "C_GRC_CER_01"}, {"txt": "Décor peint, engobe, vernis, estampille, graffite", "sub": "Marque de surface à préserver du lavage et du frottement", "warn": true, "flag": "decor", "to": "C_DECOR_CER_01"}, {"txt": "Suies ou traces de feu à l'extérieur", "sub": "Trace d'usage culinaire : à conserver, ne pas frotter", "warn": true, "flag": "decor", "to": "C_DECOR_CER_01"}, {"txt": "Rien de particulier, surface nue", "sub": "Traitement courant", "to": "C_STD_CER_01"}]}, "C_GRC_CER_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement pour analyse de résidus (protocole GRC)", "accent": "lab", "why": "Les dépôts noirs ou blanchâtres et les encroûtements conservent des macro et micro-restes organiques qui documentent le contenu du vase. Le moindre contact inadapté — main nue, sachet plastique, papier — les contamine définitivement.", "lines": [["Avant", "Récupérer le kit de prélèvement. Faire appel à un spécialiste (ou au RO, au RS ou à votre GAF) pour choisir les parties à prélever."], ["Documenter", "Photographier et remplir la fiche de prélèvement avant tout geste."], ["Prélever", "Outils nettoyés entre chaque échantillon, si possible à l'eau claire ou déminéralisée."], ["Tessons avec résidus", "Envelopper dans du papier d'aluminium, FACE MATE au contact de l'objet. Ne jamais mettre en sachet plastique."], ["Groupement de tessons ou parties de vase", "Prélever en motte sur un support rigide recouvert de papier d'aluminium (face mate côté objet), maintenu par du cellophane. Transporter et manipuler le moins possible."], ["Sédiment de référence", "Prélever aussi un échantillon du sédiment environnant, selon le même protocole : il sert de référence pour distinguer les résidus du vase de ceux du sol."], ["Fenêtre", "QUELQUES JOURS si pâte peu cuite ou gorgée d'eau ; sinon plusieurs mois."], ["Si rien n'est fait", "Contamination irréversible des résidus, ou perte du contenu au lavage : l'analyse devient impossible ou ininterprétable."]], "never": "Ne jamais toucher à mains nues, ni mettre au contact d'un sachet plastique, de papier ou carton, de coton hydrophile, de gants poudrés ou en coton, d'encre, de colle, d'adhésif, de solvant, ni d'aucun produit de consolidation ou de désinfection.", "more": [["Éviter également", "Les changements brusques de température, d'hygrométrie et d'exposition à la lumière."], ["Céramiques concernées", "Céramiques portant des dépôts noirs ou blanchâtres et des encroûtements ; vases complets encore remplis de sédiment ; tessons avec résidus ; vases de forme particulière (miniatures, perforés, entonnoirs)."], ["Référence", "Groupe de Recherche Céramique — Protocole de prélèvement sur le terrain pour analyses, livrable 2a, 2024. Fiche complète : {{LIEN_FICHE_GRC}}"]], "next": {"label": "Traitement post-fouille →", "to": "P_CER_01"}}, "C_DECOR_CER_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Prélèvement avec surface à préserver", "accent": "accent", "why": "Décors, engobes, estampilles et traces de feu sont des données de production et d'usage. Le brossage, le frottement en caisse et le séchage rapide les effacent.", "lines": [["Geste", "Tesson cohérent et bien cuit. Ramassage par lot, par unité stratigraphique, sans surcharge des caisses. ATTENTION ANALYSES : ne pas laver ni brosser si une analyse de résidus organiques (lipides, croûtes alimentaires, contenus de vases) est envisagée — le lavage détruit ces résidus. Dans le doute, isoler quelques tessons non lavés comme témoins."], ["Matériel", "Caisses gerbables normalisées, sachets par US, étiquettes imputrescibles."], ["Fenêtre", "QUELQUES JOURS si pâte peu cuite ou gorgée d'eau ; sinon plusieurs mois."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."], ["Si rien n'est fait", "Cristallisation des sels solubles en surface, qui fait éclater l'engobe et le décor ; désagrégation des pâtes peu cuites."]], "never": "Ne jamais : séchage brutal au soleil ou radiateur.", "next": {"label": "Traitement post-fouille →", "to": "P_CER_01"}}, "C_STD_CER_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Ramassage par lot et par US", "accent": "accent", "lines": [["Geste", "Tesson cohérent et bien cuit. Ramassage par lot, par unité stratigraphique, sans surcharge des caisses. ATTENTION ANALYSES : ne pas laver ni brosser si une analyse de résidus organiques (lipides, croûtes alimentaires, contenus de vases) est envisagée — le lavage détruit ces résidus. Dans le doute, isoler quelques tessons non lavés comme témoins."], ["Matériel", "Caisses gerbables normalisées, sachets par US, étiquettes imputrescibles."], ["Transmission", "En cas de doute ou de fragilité, prévenir votre GAF ou le pôle restauration."], ["Fenêtre", "QUELQUES JOURS si pâte peu cuite ou gorgée d'eau ; sinon plusieurs mois."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."], ["Si rien n'est fait", "Cristallisation des sels solubles en surface, qui fait éclater l'engobe et le décor ; désagrégation des pâtes peu cuites."]], "more": [["Post-fouille — lavage", "Brossage doux à l'eau déminéralisée (si cuite)."], ["Post-fouille — séchage", "Séchage lent progressif à l'ombre."], ["Post-fouille — conditionnement", "Caisses gerbables normalisées, calage Plastazote."], ["Climat cible", "40-60% · 15-25 °C"], ["Niveau de preuve", "CONSENSUS — Bergeron & Rémillard 2021 (20-60 % céramique/pierre) ; CTC-08."], ["Références", "Andrey 2010 ; CTC-08"]], "never": "Ne jamais : séchage brutal au soleil ou radiateur.", "next": {"label": "Traitement post-fouille →", "to": "P_CER_01"}}, "C_HUM_CER_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Humide ou gorgé d'eau — maintenir en état", "accent": "accent", "why": "Une pâte peu cuite ou gorgée d'eau ne supporte ni le lavage ni le séchage rapide : on conserve l'état d'humidité jusqu'à l'avis de votre GAF ou du pôle restauration.", "lines": [["Geste", "Céramique peu cuite, gorgée d'eau ('biscuit mouillé') ou pulvérulente. Ne pas nettoyer la terre adhérente. Si humide : enrouler fermement dans du film étirable au fur et à mesure du dégagement. Si sèche et friable : glisser un support rigide sous l'objet et prélever en bloc. Séchage lent obligatoire en post-fouille (risque de cristallisation saline)."], ["Matériel", "Film étirable PE, plaque PP rigide, boîte hermétique."], ["Suite", "Ne pas laisser sécher sur le terrain. Conditionnement humide, à l'obscurité et au frais, puis transmission à votre GAF : le séchage lent contrôlé peut être conduit en agence sous sa direction. PRÉVENIR RAPIDEMENT LE LABORATOIRE dans les cas complexes — objet composite, décor, surface fragile, restes organiques associés — où le séchage ne suffit pas et où une consolidation peut être nécessaire."], ["Où ne pas laisser", "Jamais au soleil, ni dans un container, un algéco ou un véhicule : un sachet hermétique humide exposé au soleil produit un effet de serre et de la condensation qui accélèrent la dégradation, et les variations de température y sont très fortes."], ["Fenêtre", "QUELQUES JOURS si pâte peu cuite ou gorgée d'eau ; sinon plusieurs mois."]], "never": "Ne jamais : séchage brutal au soleil ou radiateur.", "more": [["Références", "Andrey 2010 ; CTC-08"]], "next": {"label": "Traitement post-fouille →", "to": "P_CER_01"}}, "MAR_CER_01": {"type": "consigne", "phase": "Terrain · consigne", "kind": "Sous-marin / eau salée — maintenir en eau", "accent": "lab", "why": "Le mobilier gorgé d'eau salée ne doit jamais sécher avant dessalage : la cristallisation des sels fait éclater la matière. Le dessalage se fait en laboratoire, par bains progressifs.", "lines": [["D'abord", "En domaine public maritime, vérifier avec le Drassm et le RO s'il faut remonter l'objet : souvent, on le laisse sur site (réenfouissement, géotextile)."], ["Si remonté", "Maintenir en eau, sans jamais laisser sécher. Petits objets en sachet zippé avec un fond d'eau ; grands objets enroulés de textiles mouillés puis film étanche."], ["Fenêtre", "Urgent — contacter le GAF du pôle subaquatique ou le laboratoire pour le dessalage"]], "never": "Ne jamais laisser sécher l'objet avant son dessalage en laboratoire.", "more": [["Dessalage", "Bains d'eau douce successifs, contrôlés par mesure de la conductivité, sur plusieurs semaines. Seuls l'or et le plomb échappent au dessalage préalable (CTC-06, CTC-12)."], ["Référence", "CTC-12 (milieu subaquatique et sous-marin) ; CTC-06 ; Bergeron & Rémillard 2021"]]}, "P_CER_01": {"type": "consigne", "phase": "Post-fouille · consigne", "kind": "Traitement en post-fouille", "accent": "accent", "lines": [["Lavage", "Brossage doux à l'eau déminéralisée (si cuite)."], ["Séchage", "Séchage lent progressif à l'ombre."], ["Marquage", "Indirect uniquement (étiquette imputrescible au marqueur indélébile)."], ["Conditionnement", "Caisses gerbables normalisées, calage Plastazote."], ["Décor", "Lavage à l'éponge douce ou au pinceau souple, à l'eau claire, sans jamais brosser ni frotter. Si le décor est pulvérulent, s'écaille ou reste douteux : ne rien laver et voir avec votre GAF ou le pôle restauration."], ["Conditionnement", "Caler individuellement, face décorée protégée par un papier de soie non acide. Éviter tout contact et tout frottement entre objets dans la caisse."], ["Séchage", "Lent et à l'abri : un séchage rapide fait migrer les sels et écailler engobes et peintures."]], "never": "Ne jamais : séchage brutal au soleil ou radiateur.", "more": [["Climat cible", "40-60% · 15-25 °C"], ["Niveau de preuve", "CONSENSUS — Bergeron & Rémillard 2021 (20-60 % céramique/pierre) ; CTC-08."], ["Références", "Andrey 2010 ; CTC-08"]]}, "ENTREE_CER_01": {"type": "question", "phase": "Où en êtes-vous ?", "q": "Que voulez-vous faire ?", "help": "Choisissez le moment de votre intervention.", "choices": [{"txt": "Je viens de le trouver", "sub": "Sur le terrain, l'objet est en place ou vient d'être dégagé", "to": "M_CER_01"}, {"txt": "Je le traite après fouille", "sub": "L'objet est déjà prélevé, je m'occupe de son conditionnement", "to": "P_CER_01"}]}}, "epi": false}, "AMB_01": {"nom": "Ambre", "cat": "Matières organiques", "urgence": "Urgence", "risque": "PRÉCAUTIONS — Éviter l'inhalation des poussières lors du dégagement à sec.", "start": "ENTREE_AMB_01", "nodes": {"M_AMB_01": {"type": "question", "phase": "Terrain · ce que vous voyez", "q": "Regardez l'objet. Qu'est-ce qui ressemble le plus à ce que vous avez sous les yeux ?", "help": "Chaque réponse vous dit ce que l'aspect signifie. C'est aussi ce qui permet de recouper le milieu d'enfouissement.", "choices": [{"txt": "Craquelures superficielles, surface qui devient opaque", "sub": "Assèchement : l'ambre se fissure puis se pulvérise.", "to": "H_AMB_01", "warn": true, "flag": "urgent"}, {"txt": "Aspect translucide, orangé à brun, brillant", "sub": "Ambre en bon état, à protéger de la lumière et du séchage.", "to": "H_AMB_01"
