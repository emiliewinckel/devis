  });
  ($('#f_autre')?.value||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean)
    .forEach(a=>{ if(!coches.includes(a)) coches.push(a); });
  return {
    ...CONSTAT,
    chantier:($('#f_chantier')?.value||'').trim(),
    us:($('#f_us')?.value||'').trim(),
    objet:($('#f_objet')?.value||'').trim(),
    commentaire:($('#f_com')?.value||'').trim(),
    destinataires:coches, agence,
    photo: PHOTO ? PHOTO.nom : null
  };
}

function texteConstat(c){
  const L=[];
  L.push("CONSTAT DE TERRAIN — ARGOS");
  L.push("");
  if(c.agence)   L.push("Agence : "+c.agence);
  if(c.chantier) L.push("Chantier / opération : "+c.chantier);
  if(c.us)       L.push("US, structure : "+c.us);
  if(c.objet)    L.push("Objet / isolat : "+c.objet);
  L.push("Matériau : "+c.materiau);
  L.push("Date : "+new Date(c.date).toLocaleString('fr-FR'));
  if(SESSION) L.push("Établi par : "+SESSION.pseudo+" ("+SESSION.mail+")");
  L.push("");
  if(c.commentaire){ L.push("CE QUI EST OBSERVÉ"); L.push(c.commentaire); L.push(""); }
  L.push("PARCOURS SUIVI DANS ARGOS");
  L.push(c.materiau + (c.parcours.length? " › "+c.parcours.join(" › ") : ""));
  L.push("");
  L.push("CONSIGNE OBTENUE");
  L.push(c.texte);
  L.push("");
  L.push(c.photo ? "Photo jointe : "+c.photo+" (à joindre au message)"
                 : "Aucune photo jointe.");
  return L.join("\n");
}

function envoyerConstat(){
  const c=lireConstat();
  if(!c.destinataires.length){
    $('#c_err').textContent = (SESSION && SESSION.interne)
      ? "Choisissez au moins un destinataire, ou saisissez une adresse."
      : "Indiquez au moins une adresse de destinataire.";
    return;
  }
  $('#c_err').textContent='';
  if(SESSION){
    const liste=constats(); liste.unshift(c);
    STORE.ecrire('argos_constats', liste.slice(0,60));
  }
  const objet = "[ARGOS] "+c.materiau+(c.chantier? " — "+c.chantier:"")+(c.objet? " — "+c.objet:"");
  const url = "mailto:"+encodeURIComponent(c.destinataires.join(','))
            + "?subject="+encodeURIComponent(objet)
            + "&body="+encodeURIComponent(texteConstat(c));
  location.href = url;
}

/* ---------- mes constats ---------- */
function screenMesConstats(){
  CUR=null; PATH=[]; CRUMBS=[]; FLAGS=[];
  $('#matTag').textContent='Mes constats';
  $('#trail').innerHTML='';
  const l=constats();
  let h='<div class="node"><h1 class="q">Mes constats</h1>';
  if(!SESSION){
    h+='<p class="qh">Identifiez-vous pour conserver vos constats et les retrouver ensuite.</p>';
  }else if(!l.length){
    h+='<p class="qh">Aucun constat pour le moment. Ils apparaîtront ici après leur envoi.</p>';
  }else{
    h+='<p class="qh">Enregistrés sur cet appareil, du plus récent au plus ancien.</p>';
    l.forEach((c,i)=>{
      h+=`<button class="constat-item" data-constat="${i}">${esc(c.materiau)}${c.objet? ' — '+esc(c.objet):''}
            <span class="meta">${esc(new Date(c.date).toLocaleString('fr-FR'))}${c.chantier? ' · '+esc(c.chantier):''}</span></button>`;
    });
  }
  h+='</div>';
  $('#app').innerHTML=h;
  $('#foot').textContent = STORE.durable ? '' :
    "Cet appareil n'autorise pas l'enregistrement local : les constats ne seront pas conservés après fermeture.";
  bar('<button class="act back" data-home>← Matériaux</button>'
      + (SESSION?'<button class="act" data-deconnexion>Se déconnecter</button>':''));
  window.scrollTo(0,0);
}

function screenUnConstat(i){
  const c=constats()[i]; if(!c) return screenMesConstats();
  $('#app').innerHTML=`<div class="node"><h1 class="q">${esc(c.materiau)}</h1>
    <p class="qh">${esc(new Date(c.date).toLocaleString('fr-FR'))}${c.chantier? ' · '+esc(c.chantier):''}</p>
    <div class="consigne"><div class="body"><div class="line"><div class="val">
      <pre style="white-space:pre-wrap;font-family:var(--sans);font-size:15px;margin:0">${esc(texteConstat(c))}</pre>
    </div></div></div></div></div>`;
  bar('<button class="act back" data-mes-constats>← Mes constats</button>');
  window.scrollTo(0,0);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-mat],[data-i],[data-back],[data-to],[data-home],[data-copy],[data-step],[data-vue],[data-constat-nouveau],[data-envoyer],[data-copier-constat],[data-mes-constats],[data-constat],[data-deconnexion]');
  if(!t) return;
  if(t.dataset.mat){ openMat(t.dataset.mat); return; }

  if(t.dataset.vue){
    const v=t.dataset.vue;
    if(v==='connexion') return screenConnexion(false);
    if(v==='creation')  return screenConnexion(true);
    if(v==='entrer')    return tenter(false);
    if(v==='creer')     return tenter(true);
    if(v==='passer'){ if(!SESSION) return screenConnexion(false);   // identification obligatoire
                      fermerAccueil(); majQui(); return screenHome(); }
    if(v==='accueil'){ CONSTAT=null; return screenAccueil(); }
    if(v==='oubli'){
      const mail=(($('#f_mail')?.value)||'').trim().toLowerCase();
      const c=comptes();
      if(!c[mail]) { $('#f_err').textContent =
        "Saisissez d'abord l'adresse du compte, puis touchez de nouveau « Mot de passe oublié »."; return; }
      const neuf=$('#f_mdp')?.value||'';
      if(neuf.length<4){ $('#f_err').textContent =
        "Tapez le nouveau mot de passe dans le champ ci-dessus (4 caractères au moins), puis touchez de nouveau « Mot de passe oublié »."; return; }
      c[mail].mdp=neuf; STORE.ecrire('argos_comptes', c);
      $('#f_err').textContent = "Mot de passe redéfini sur cet appareil. Touchez « Se connecter ».";
      return;
    }
    if(v==='sortir'){ SESSION=null; STORE.ecrire('argos_session', null); return screenAccueil(); }
    return;
  }
  if(t.dataset.deconnexion!=null) return deconnexion();
  if(t.dataset.mesConstats!=null) return screenMesConstats();
  if(t.dataset.constat!=null)     return screenUnConstat(+t.dataset.constat);
  if(t.dataset.constatNouveau!=null){ CONSTAT=null; return screenConstat(); }
  if(t.dataset.envoyer!=null)     return envoyerConstat();
  if(t.dataset.copierConstat!=null){
    const txt=texteConstat(lireConstat()), fini=()=>{t.textContent='Copié';setTimeout(()=>t.textContent='Copier',1500);};
    navigator.clipboard?.writeText(txt).then(fini).catch(()=>{
      const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();
      document.execCommand('copy');a.remove();fini();
    });
    return;
  }
  if(CUR===null) return;
  const n=curNode();
  if(t.dataset.i!=null){
    const ch=n.choices[+t.dataset.i];
    CRUMBS.push(ch.txt); FLAGS.push(ch.flag||null); PATH.push(ch.to); return render();
  }
  if(t.dataset.to){ CRUMBS.push(n.kind||'suite'); FLAGS.push(null); PATH.push(t.dataset.to); return render(); }
  if(t.dataset.back){
    if(PATH.length<=1){ return screenHome(); }
    PATH.pop(); CRUMBS.pop(); FLAGS.pop(); return render();
  }
  if(t.dataset.home){ return screenHome(); }
  if(t.dataset.step!=null){
    // Remonter dans l'arbre : on tronque la pile au niveau demandé.
    const n = +t.dataset.step;
    if(n >= CRUMBS.length) return;          // déjà à cette étape
    PATH = PATH.slice(0, n+1);
    CRUMBS = CRUMBS.slice(0, n);
    FLAGS = FLAGS.slice(0, n);
    return render();
  }
  if(t.dataset.copy){
    const txt=plain(n), done=()=>{t.textContent='Copié';setTimeout(()=>t.textContent='Copier',1500);};
    navigator.clipboard?.writeText(txt).then(done).catch(()=>{
      const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done();
    });
  }
});
$('#home').addEventListener('click',()=>{ CONSTAT=null; screenHome(); });

/* ---------- démarrage ---------- */
$('#marqueH').style.backgroundImage = `url(${LOGO_ARGOS})`;
SESSION = STORE.lire('argos_session');
if(SESSION && SESSION.mail) SESSION.interne = estInterne(SESSION.mail);
majQui();
if(SESSION){ screenHome(); } else { screenHome(); screenAccueil(); }
</script>
</body>
</html>
