</script>
<style>
:root{
  --olive:#79874C; --olive-d:#5A6636; --olive-dd:#3F4826; --olive-l:#EEF0E3; --olive-ll:#F6F7F0;
  --ink:#2B2D26; --muted:#6E7063; --faint:#9A9C8E; --line:#E1E2D7; --bg:#F4F3EC; --card:#FFFFFF;
  --warn:#B4651E; --warn-l:#FBF1E6; --err:#A33A2D; --ok:#4E7A2E;
  --r:10px; --shadow:0 1px 2px rgba(40,44,30,.06),0 4px 16px rgba(40,44,30,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Titillium Web",-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;transition:background .12s,border-color .12s}
button:hover{background:var(--olive-ll);border-color:#cfd3bd}
button.pri{background:var(--olive);border-color:var(--olive);color:#fff;font-weight:600}
button.pri:hover{background:var(--olive-d)}
button.ghost{background:transparent;border-color:transparent;color:var(--olive-d)}
button.ghost:hover{background:var(--olive-l)}
button.sm{padding:4px 9px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink);width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(121,135,76,.15)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
label.f{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--olive-d);margin:0 0 4px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand img{height:40px;width:auto;display:block}
.brand .t1{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--olive);font-weight:600}
.brand .t2{font-size:18px;font-weight:600;letter-spacing:.02em;line-height:1.1;color:var(--olive-dd)}
.top .sp{flex:1}
.save-state{font-size:12px;color:var(--faint);white-space:nowrap}
.save-state.dirty{color:var(--warn)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:320px 1fr;gap:20px;padding:20px;max-width:1400px;margin:0 auto;align-items:start}
.side{position:sticky;top:82px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 100px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.dossier-card{padding:14px 16px;cursor:pointer;position:relative;overflow:hidden}
.dossier-card:hover{border-color:#cfd3bd}
.dossier-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--olive)}
.dossier-card .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--olive);font-weight:600}
.dossier-card .n{font-size:17px;font-weight:600;margin:2px 0 1px}
.dossier-card .s{font-size:12.5px;color:var(--muted)}
.dossier-card .edit{position:absolute;right:10px;top:10px;font-size:11px;color:var(--faint)}
.list-card{display:flex;flex-direction:column;min-height:0;flex:1}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.list-head h3{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--olive-d)}
.list{overflow:auto;padding:0 8px 8px;min-height:60px}
.fi{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:8px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.fi:hover{background:var(--olive-ll)}
.fi.on{background:var(--olive-l);border-color:#d6dbc3}
.fi input{width:15px;height:15px;margin:0;accent-color:var(--olive)}
.fi .ti{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .su{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .badges{display:flex;gap:4px;align-items:center}
.badge{font-size:10.5px;padding:1px 7px;border-radius:20px;background:#f0f0ea;color:var(--muted);white-space:nowrap}
.badge.lot{background:#e7ead9;color:var(--olive-dd);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#d7d8cc}
.dot.ok{background:var(--ok)} .dot.wa{background:#E0A458}
.list-foot{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
.bulk{display:none;flex-wrap:wrap;gap:6px;padding:10px 12px;background:var(--olive-ll);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
.bulk.on{display:flex}
.bulk .lbl{width:100%;font-size:11.5px;color:var(--olive-dd);font-weight:600}
.gen-card{padding:14px}
.gen-card .row{display:flex;gap:8px}
.gen-card button{flex:1}
.gen-card .hint{font-size:11.5px;color:var(--muted);margin-top:8px}

/* ---------- editor ---------- */
.main{min-width:0}
.empty{padding:60px 30px;text-align:center;color:var(--muted)}
.empty h2{font-weight:600;color:var(--olive-dd);margin:10px 0 6px}
.ed-head{display:flex;align-items:flex-end;gap:14px;margin:2px 0 14px}
.ed-head .kind{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--olive);font-weight:600}
.ed-head h1{margin:0;font-size:26px;font-weight:600;letter-spacing:.01em;color:var(--olive-dd);line-height:1.15}
.ed-head .no{font-size:13px;color:var(--muted)}
.ed-head .sp{flex:1}
.nav{display:flex;gap:4px;position:sticky;top:61px;z-index:10;background:var(--bg);padding:8px 0 10px;margin-bottom:4px;overflow-x:auto}
.nav a{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 11px;border-radius:20px;white-space:nowrap}
.nav a:hover{background:var(--olive-l);color:var(--olive-dd)}
.sec{padding:18px 20px 20px;margin-bottom:14px;scroll-margin-top:120px}
.sec h2{margin:0 0 14px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--olive);font-weight:700;display:flex;align-items:center;gap:10px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--line)}
.sec h2 .act{order:2;font-size:12px;letter-spacing:0;text-transform:none;font-weight:400}
.g{display:grid;gap:12px 14px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.g7{grid-template-columns:repeat(7,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
.fld{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;user-select:none;transition:all .1s}
.chip:hover{border-color:var(--olive);color:var(--olive-dd)}
.chip.on{background:var(--olive);border-color:var(--olive);color:#fff}
.irow{display:grid;grid-template-columns:170px 1fr 190px;gap:10px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--line)}
.irow:last-child{border-bottom:0}
.irow .il{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--olive-d);padding-top:9px}
.irow .solv input{font-size:12.5px}
.irow .solv .chips{margin-top:4px}
.preset-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--olive-ll);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;flex-wrap:wrap}
.preset-bar select{flex:1;min-width:200px}
.preset-bar .lb{font-size:12px;color:var(--olive-dd);font-weight:600}
.warn-txt{font-size:12px;color:var(--warn);margin-top:5px}

/* inventory table */
.inv{width:100%;border-collapse:collapse;font-size:13px}
.inv th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--olive-d);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:600}
.inv td{padding:3px 3px;border-bottom:1px solid #f0f0ea;vertical-align:top}
.inv td input{padding:5px 7px;font-size:13px}
.inv .del{border:0;background:transparent;color:var(--faint);padding:4px 6px;font-size:15px}
.inv .del:hover{color:var(--err)}

/* photos */
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.drop{border:1.5px dashed #cdd2b8;border-radius:10px;padding:12px;min-height:150px;background:var(--olive-ll);transition:all .12s}
.drop.over{border-color:var(--olive);background:var(--olive-l)}
.drop .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.drop .dh b{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--olive-d)}
.drop .dh span{font-size:11.5px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.th{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.th img{width:100%;height:96px;object-fit:cover;display:block;background:#eee}
.th .tools{position:absolute;top:4px;right:4px;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.th:hover .tools{opacity:1}
.th .tools button{padding:1px 6px;font-size:11px;background:rgba(255,255,255,.92);border-radius:5px}
.th .cap{border:0;border-top:1px solid var(--line);border-radius:0;font-size:11px;padding:4px 6px}
.th .nm{font-size:10px;color:var(--faint);padding:2px 6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .q{position:absolute;left:4px;top:4px;background:#E0A458;color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px}
.drop-empty{font-size:12px;color:var(--faint);text-align:center;padding:30px 6px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(35,38,28,.35);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 16px;overflow:auto}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(30,35,20,.25);width:min(720px,100%);overflow:hidden}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:17px;font-weight:600;color:var(--olive-dd)}
.modal .mb{padding:18px 20px;max-height:70vh;overflow:auto}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--olive-ll)}
.dl{display:flex;flex-direction:column;gap:6px}
.dl .it{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.dl .it:hover{border-color:var(--olive);background:var(--olive-ll)}
.dl .it b{font-weight:600}
.dl .it .m{font-size:12px;color:var(--muted)}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--olive-l);color:var(--olive-dd)}
details.set{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.set summary{cursor:pointer;font-size:12px;color:var(--muted)}
.issues{margin:0;padding-left:18px;font-size:13px}
.issues li{margin:3px 0}
.issues .w{color:var(--warn)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--olive-dd);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:all .2s;z-index:200;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--err)}
.unassigned{padding:10px 12px;border-top:1px solid var(--line);background:var(--warn-l)}
.unassigned .h{font-size:11.5px;font-weight:600;color:var(--warn);margin-bottom:6px}
.un-it{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.un-it img{width:42px;height:42px;object-fit:cover;border-radius:5px}
.un-it .nm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un-it select{font-size:12px;padding:3px 5px}
.side-drop{margin:0 12px 10px;border:1.5px dashed #cdd2b8;border-radius:9px;padding:9px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;background:var(--olive-ll)}
.side-drop.over{border-color:var(--olive);background:var(--olive-l)}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:12px}
  .side{position:static;max-height:none}
  .list{max-height:300px}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .g7{grid-template-columns:repeat(4,1fr)}
  .irow{grid-template-columns:1fr}
  .irow .il{padding-top:0}
  .ph-grid{grid-template-columns:1fr}
  .top{padding:8px 12px;gap:8px}
  .brand .t1{display:none}
  .save-state{display:none}
  .hm{display:none}
  .brand .t2{font-size:15px}
  .nav{top:57px}
}
</style>
</head>

var saveT=null;
function markDirty(){ S.dirty=true; S.notionDirty=true; setSaveState(); clearTimeout(saveT); saveT=setTimeout(saveLocal,500); }
function setSaveState(){
  var el=$("saveState");
  if(!S.key){ el.textContent=""; return; }
  if(S.dossier.notionId){ el.textContent = S.notionDirty ? "● modifications non envoyées à Notion" : "✓ synchronisé avec Notion"; el.className="save-state"+(S.notionDirty?" dirty":""); }
  else { el.textContent="✓ enregistré sur cet appareil"; el.className="save-state"; }
}
function saveLocal(){
  if(!S.key) return;
  LS.set("rcr:d:"+S.key,{dossier:S.dossier,fiches:S.fiches,notionDirty:S.notionDirty,t:Date.now()});
  var idx=LS.get("rcr:index",{}); idx[S.key]={numLabo:S.dossier.numLabo,commune:S.dossier.commune,site:S.dossier.site,t:Date.now(),notionId:S.dossier.notionId};
  LS.set("rcr:index",idx); LS.set("rcr:last",S.key);
  S.dirty=false; setSaveState();
}

var phT=null;
function savePhotos(){ clearTimeout(phT); phT=setTimeout(function(){ idb().then(function(db){ if(!db||!S.key) return; try{ db.transaction("photos","readwrite").objectStore("photos").put(S.photos,S.key); }catch(e){} }); },400); }
function loadPhotos(key){ return idb().then(function(db){ return new Promise(function(res){ if(!db) return res([]); try{ var r=db.transaction("photos").objectStore("photos").get(key); r.onsuccess=function(){ res(r.result||[]); }; r.onerror=function(){ res([]); }; }catch(e){ res([]); } }); }); }

/* =====================================================================
   OUVERTURE D'UN DOSSIER
   ===================================================================== */
function openDossier(key, dossier, fiches){
  S.key=key; S.dossier=dossier; S.fiches=fiches||[]; S.sel={}; S.cur=S.fiches.length?S.fiches[0].id:null; S.photos=[];
  var saved=LS.get("rcr:d:"+key,null); S.notionDirty = saved ? !!saved.notionDirty : false;
  loadPhotos(key).then(function(p){ S.photos=p||[]; renderAll(); });
  saveLocal(); renderAll();
}
function openLocal(key){
  var d=LS.get("rcr:d:"+key,null); if(!d){ toast("Dossier introuvable sur cet appareil",1); return; }
  S.key=key; S.dossier=Object.assign(newDossier(),d.dossier); S.fiches=d.fiches||[]; S.sel={}; S.cur=S.fiches.length?S.fiches[0].id:null; S.notionDirty=!!d.notionDirty;
  S.photos=[]; loadPhotos(key).then(function(p){ S.photos=p||[]; renderAll(); });
  LS.set("rcr:last",key); renderAll();
}

function chipsHtml(k,o,val,multi){
  var opts=OPT[o]||[]; if(!opts.length) return "";
  var cur = multi ? splitList(val) : [String(val||"").trim()];
  return '<div class="chips">'+opts.map(function(v){ return '<span class="chip'+(cur.indexOf(v)>=0?' on':'')+'" data-chip="'+esc(k)+'" data-v="'+esc(v)+'" data-m="'+(multi?1:0)+'">'+esc(v)+'</span>'; }).join("")+'</div>';
}
function splitList(v){ return String(v||"").split(",").map(function(s){return s.trim();}).filter(Boolean); }
function fld(f,k,label,o,multi,cls,ph){
  return '<div class="fld '+(cls||"")+'"><label class="f">'+esc(label)+'</label><input data-k="'+k+'" value="'+esc(getPath(f,k))+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+(o?chipsHtml(k,o,getPath(f,k),multi):"")+'</div>';
}
function getPath(o,k){ if(k.indexOf("dim.")===0){ return (o.dim||{})[k.slice(4)]||""; } return o[k]==null?"":o[k]; }
function setPath(o,k,v){ if(k.indexOf("dim.")===0){ o.dim=o.dim||{}; o.dim[k.slice(4)]=v; } else o[k]=v; }

    (f.items||[]).forEach(function(it,i){

    });

  INTERV.forEach(function(x){
    h+='<div class="irow"><div class="il">'+esc(x.l)+'</div><div><input data-k="'+x.k+'" value="'+esc(f[x.k])+'">'+chipsHtml(x.k,x.o,f[x.k],x.m)+'</div>';
    if(x.s) h+='<div class="solv"><input data-k="'+x.s+'" value="'+esc(f[x.s])+'" placeholder="solvant">'+chipsHtml(x.s,"solvant",f[x.s],0)+'</div>'; else h+='<div></div>';
    h+='</div>';
  });
  h+='<div style="margin-top:14px"><label class="f">Description / remarques — intervention</label><textarea data-k="descInterv" rows="7">'+esc(f.descInterv)+'</textarea>'+(/\[à compléter/i.test(JSON.stringify(f))?'<div class="warn-txt">⚠ Cette fiche contient encore « [à compléter] ».</div>':'')+'</div></section>';

  /* Conditionnement */
  h+='<section class="card sec" id="s-cond"><h2>Conditionnement</h2><div class="g g2">';

function photoSection(f,ph,id,title){
  var list=S.photos.filter(function(p){ return p.fiche===f.id && p.phase===ph; });
  var h='<section class="card sec" id="'+id+'"><h2>'+title+'</h2><div class="drop" data-drop="'+ph+'"><div class="dh"><b>'+(ph==="av"?"Avant":"Après")+'</b><span>Glisser des images ici · <a href="#" onclick="pickPhotos(\''+ph+'\');return false" style="color:var(--olive-d)">parcourir</a></span></div>';
  if(!list.length) h+='<div class="drop-empty">Aucune photo</div>';
  else {
    h+='<div class="thumbs">';
    list.forEach(function(p){
      h+='<div class="th">'+(p.guess?'<span class="q" title="phase devinée — à vérifier">?</span>':'')+'<img src="'+p.data+'" alt=""><div class="tools"><button onclick="movePh(\''+p.id+'\',-1)" title="avant">◀</button><button onclick="movePh(\''+p.id+'\',1)" title="après">▶</button><button onclick="swapPhase(\''+p.id+'\')" title="basculer avant/après">⇄</button><button onclick="delPh(\''+p.id+'\')" title="retirer">✕</button></div>'+
        (f.kind==="lot"?'<input class="cap" data-cap="'+p.id+'" value="'+esc(p.cap||"")+'" placeholder="légende (n° objet)">':'')+'<div class="nm">'+esc(p.name)+'</div></div>';
    });
    h+='</div>';
  }
  return h+'</div></section>';
}
function reportNo(idx){
  var base=S.dossier.numRapport || ((S.dossier.numLabo||"")+"_01");
  return S.fiches.length>1 ? base+"."+(idx+1) : base;
}

/* ---------- saisie ---------- */
$("main").addEventListener("input",function(e){
  var t=e.target, f=curF(); if(!f) return;
  if(t.hasAttribute("data-k")){ setPath(f,t.getAttribute("data-k"),t.value); syncChips(t.getAttribute("data-k"),t.value); markDirty(); softRefresh(); }
  else if(t.hasAttribute("data-item")){ var it=f.items[+t.getAttribute("data-item")]; it[t.getAttribute("data-ik")]=t.value; markDirty(); softRefresh(); }
  else if(t.hasAttribute("data-cap")){ var p=findPh(t.getAttribute("data-cap")); if(p){ p.cap=t.value; savePhotos(); } }
});
var srT=null;
function softRefresh(){ clearTimeout(srT); srT=setTimeout(function(){ renderList(); var f=curF(); var h1=document.querySelector(".ed-head h1"); if(f&&h1) h1.textContent=ficheTitle(f); },250); }
function syncChips(k,val){
  document.querySelectorAll('[data-chip="'+k+'"]').forEach(function(c){
    var m=c.getAttribute("data-m")==="1"; var v=c.getAttribute("data-v");
    var on = m ? splitList(val).indexOf(v)>=0 : String(val).trim()===v; c.classList.toggle("on",on);
  });
}
$("main").addEventListener("click",function(e){
  var c=e.target.closest("[data-chip]"); if(!c) return;
  var f=curF(), k=c.getAttribute("data-chip"), v=c.getAttribute("data-v"), m=c.getAttribute("data-m")==="1";
  var val;
  if(m){ var a=splitList(getPath(f,k)); var i=a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v); val=a.join(", "); }
  else val = String(getPath(f,k)).trim()===v ? "" : v;
  setPath(f,k,val); var inp=document.querySelector('#main [data-k="'+k+'"]'); if(inp) inp.value=val; syncChips(k,val); markDirty(); softRefresh();
});

/* ---------- actions fiches ---------- */
function addFiche(kind){ if(!S.key){ dossiersModal(); return; } var f=newFiche(kind); S.fiches.push(f); S.cur=f.id; markDirty(); renderAll(); }
function dupFiche(){ var f=curF(); if(!f) return; var c=JSON.parse(JSON.stringify(f)); c.id=uid(); if(c.kind==="objet"){ c.num=""; } else c.designation+=" (copie)"; S.fiches.splice(S.fiches.indexOf(f)+1,0,c); S.cur=c.id; markDirty(); renderAll(); toast("Fiche dupliquée — photos non copiées"); }
function addItem(){ var f=curF(); f.items.push({num:"",designation:"",ue:"",us:"",nr:"1",masse:"",rem:""}); markDirty(); renderEditor(); renderList(); var ins=document.querySelectorAll('[data-item="'+(f.items.length-1)+'"]'); if(ins[0]) ins[0].focus(); }
function delItem(i){ var f=curF(); f.items.splice(i,1); markDirty(); renderEditor(); renderList(); }
$("addObj").onclick=function(){ addFiche("objet"); };
$("addLot").onclick=function(){ addFiche("lot"); };
$("pasteBtn").onclick=function(){ pasteModal(); };

function copyFields(src,dst,keys){ keys.forEach(function(k){ dst[k]=src[k]; }); }
var ETAT_KEYS=["etat","env","profil","prelev","alt_pc","alt_me","alt_bio","descEtat","periode"];
function ungroup(){
  var f=curF(); if(!f||f.kind!=="lot") return;
  if(!(f.items||[]).length){ toast("Le lot est vide",1); return; }
  if(!confirm("Transformer ce lot en "+f.items.length+" fiches individuelles ? Les champs du lot seront recopiés dans chaque fiche.")) return;
  var pos=S.fiches.indexOf(f); var nf=[];
  f.items.forEach(function(it){ var o=newFiche("objet"); copyFields(f,o,ETAT_KEYS.concat(PRESET_KEYS)); o.num=it.num||""; o.designation=it.designation||""; o.ue=it.ue||""; o.us=it.us||""; o.nr=it.nr||"1"; o.dim={masse:it.masse||""}; nf.push(o);
    S.photos.forEach(function(p){ if(p.fiche===f.id && p.cap && it.num && normNum(p.cap)===normNum(it.num)) p.fiche=o.id; }); });
  S.photos.forEach(function(p){ if(p.fiche===f.id) p.fiche=null; });
  S.fiches.splice.apply(S.fiches,[pos,1].concat(nf)); S.cur=nf[0].id; savePhotos(); markDirty(); renderAll(); toast(nf.length+" fiches créées");
}
$("bkLot").onclick=function(){
  var ids=selIds().filter(function(id){ return getF(id).kind==="objet"; });
  if(ids.length<2){ toast("Sélectionnez au moins 2 fiches objets",1); return; }
  var title=prompt("Intitulé du lot :", ""); if(title===null) return;
  var first=getF(ids[0]); var lot=newFiche("lot"); copyFields(first,lot,ETAT_KEYS.concat(PRESET_KEYS)); lot.designation=title||"Lot";
  ids.forEach(function(id){ var o=getF(id); lot.items.push({num:o.num,designation:o.designation,ue:o.ue,us:o.us,nr:o.nr,masse:(o.dim||{}).masse||"",rem:""});
    S.photos.forEach(function(p){ if(p.fiche===id){ p.fiche=lot.id; if(!p.cap) p.cap=o.num; } }); });
  var pos=S.fiches.indexOf(first); S.fiches=S.fiches.filter(function(x){ return ids.indexOf(x.id)<0; }); S.fiches.splice(Math.min(pos,S.fiches.length),0,lot);
  S.sel={}; S.cur=lot.id; savePhotos(); markDirty(); renderAll(); toast("Lot créé ("+ids.length+" objets)");
};
$("bkDel").onclick=function(){
  var ids=selIds(); if(!ids.length) return; if(!confirm("Supprimer "+ids.length+" fiche(s) ? Leurs photos seront retirées.")) return;
  S.fiches=S.fiches.filter(function(x){ return ids.indexOf(x.id)<0; }); S.photos=S.photos.filter(function(p){ return ids.indexOf(p.fiche)<0; });
  S.sel={}; if(!curF()) S.cur=S.fiches.length?S.fiches[0].id:null; savePhotos(); markDirty(); renderAll();
};
$("bkCopy").onclick=function(){
  var src=curF(); var ids=selIds().filter(function(id){ return id!==S.cur; }); if(!src||!ids.length){ toast("Ouvrez la fiche source et cochez les fiches cibles",1); return; }
  modal("Copier depuis « "+esc(ficheTitle(src))+" »",
    '<p style="margin-top:0">Vers '+ids.length+' fiche(s) cochée(s). Parties à recopier :</p>'+
    ['État préalable et altérations|etat','Description de l\'état|descEtat','Intervention (champs + texte)|interv','Conditionnement|cond'].map(function(s){ var a=s.split("|"); return '<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" style="width:auto" data-cp="'+a[1]+'" '+(a[1]==="descEtat"?"":"checked")+'> '+a[0]+'</label>'; }).join(""),
    [{t:"Annuler"},{t:"Copier",pri:1,fn:function(){
      var parts={}; document.querySelectorAll("[data-cp]").forEach(function(c){ parts[c.getAttribute("data-cp")]=c.checked; });
      var keys=[]; if(parts.etat) keys=keys.concat(["etat","env","profil","prelev","alt_pc","alt_me","alt_bio"]); if(parts.descEtat) keys.push("descEtat");
      if(parts.interv){ INTERV.forEach(function(x){ keys.push(x.k); if(x.s) keys.push(x.s); }); keys.push("descInterv"); } if(parts.cond) COND.forEach(function(x){ keys.push(x.k); });
      ids.forEach(function(id){ copyFields(src,getF(id),keys); }); markDirty(); renderAll(); toast("Copié vers "+ids.length+" fiche(s)"); }}]);
};

/* ---------- modèles ---------- */
function applyPreset(p,f){ PRESET_KEYS.forEach(function(k){ f[k] = p.v[k]!=null ? p.v[k] : ""; }); }
function applyPresetCur(){
  var i=$("presetSel").value; if(i===""){ toast("Choisissez un modèle",1); return; }
  var f=curF(); var hasTxt=PRESET_KEYS.some(function(k){ return String(f[k]||"").trim(); });
  if(hasTxt && !confirm("Remplacer l'intervention et le conditionnement de cette fiche par le modèle ?")) return;
  applyPreset(presets()[+i],f); markDirty(); renderEditor(); renderList(); toast("Modèle appliqué");
}
$("bkPreset").onclick=function(){
  var ids=selIds(); var pr=presets();
  modal("Appliquer un modèle à "+ids.length+" fiche(s)",'<select id="bkPs">'+pr.map(function(p,i){return '<option value="'+i+'">'+esc(p.name)+'</option>';}).join("")+'</select><p style="font-size:12.5px;color:var(--muted)">Remplace les champs Intervention, le texte d\'intervention et le Conditionnement des fiches cochées.</p>',
    [{t:"Annuler"},{t:"Appliquer",pri:1,fn:function(){ var p=pr[+$("bkPs").value]; ids.forEach(function(id){ applyPreset(p,getF(id)); }); markDirty(); renderAll(); toast("Modèle appliqué à "+ids.length+" fiche(s)"); }}]);
};

        else { var first=null; rows.forEach(function(r){ var o=newFiche("objet"); o.num=r.num; o.designation=r.designation; o.ue=r.ue; o.us=r.us; if(r.periode) o.periode=r.periode; o.nr=r.nr||"1"; o.dim={masse:r.masse||""}; S.fiches.push(o); if(!first) first=o; }); S.cur=first.id; }

function parseTable(txt){
  var lines=String(txt||"").replace(/\r/g,"").split("\n").filter(function(l){ return l.trim(); }); if(!lines.length) return [];
  var sep = lines[0].indexOf("\t")>=0 ? "\t" : (lines[0].indexOf(";")>=0 ? ";" : ",");
  var cells=lines.map(function(l){ return l.split(sep).map(function(c){ return c.trim().replace(/^"|"$/g,""); }); });
  var order=["num","designation","ue","us","periode","nr","masse"]; var map=null;
  var h=cells[0].map(function(c){ return c.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); });
  var guess=function(c){ if(/^(n.?\s*)?(objet|inv|iso|n°|no|num)/.test(c)||c==="n°"||/n.?\s*objet|numero|inventaire|isolat/.test(c)) return "num"; if(/design|objet|identif|type/.test(c)) return "designation"; if(/^ue$|^fait$|^st$|unite.*enreg/.test(c)) return "ue"; if(/^us$|unite.*strat/.test(c)) return "us"; if(/period|datation|chrono/.test(c)) return "periode"; if(/^nr$|nombre.*reste|^nb/.test(c)) return "nr"; if(/masse|poids/.test(c)) return "masse"; return null; };
  var hm=h.map(guess); if(hm.filter(Boolean).length>=2){ map=hm; cells.shift(); }
  return cells.map(function(r){ var o={num:"",designation:"",ue:"",us:"",periode:"",nr:"",masse:""}; r.forEach(function(v,i){ var k = map ? map[i] : order[i]; if(k && !o[k]) o[k]=v; }); return o; }).filter(function(o){ return o.num||o.designation; });
}

/* =====================================================================
   PHOTOS
   ===================================================================== */
function findPh(id){ for(var i=0;i<S.photos.length;i++) if(S.photos[i].id===id) return S.photos[i]; return null; }
function normNum(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function tokens(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean); }
function hasSeq(a,b){ if(!b.length) return false; for(var i=0;i+b.length<=a.length;i++){ var ok=true; for(var j=0;j<b.length;j++) if(a[i+j]!==b[j]){ ok=false; break; } if(ok) return true; } return false; }
function guessPhase(name){ var t=tokens(name.replace(/\.[a-z0-9]+$/i,"")); var av=["av","avant","before","pre","avt","initial"], ap=["ap","apres","after","post","apr","final","fin"];
  for(var i=0;i<t.length;i++){ if(av.indexOf(t[i])>=0) return "av"; if(ap.indexOf(t[i])>=0) return "ap"; }
  var n=normNum(name); if(/avant/.test(n)) return "av"; if(/apres/.test(n)) return "ap"; return null; }
function matchFiche(name){
  var base=name.replace(/\.[a-z0-9]+$/i,""); var ft=tokens(base), fn=normNum(base); var best=null, bs=0;
  S.fiches.forEach(function(f){
    var cands = f.kind==="lot" ? (f.items||[]).map(function(i){ return i.num; }) : [f.num];
    cands.forEach(function(c){ if(!c) return; var ct=tokens(c), cn=normNum(c); var ok = hasSeq(ft,ct) || (cn.length>=4 && fn.indexOf(cn)>=0);
      if(ok && cn.length>bs){ bs=cn.length; best={fiche:f.id, cap: f.kind==="lot"?c:""}; } });
  });
  return best;
}
function readImage(file){
  return new Promise(function(res){
    var r=new FileReader(); r.onload=function(){ var img=new Image(); img.onload=function(){ var max=1800, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,max/Math.max(w,h)); var c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k); var x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); res({data:c.toDataURL("image/jpeg",0.86),w:c.width,h:c.height}); }; img.onerror=function(){ res(null); }; img.src=r.result; };
    r.onerror=function(){ res(null); }; r.readAsDataURL(file);
  });
}
function addPhotos(files, target){
  if(!S.key){ toast("Ouvrez d'abord un dossier",1); return; }
  files=[].slice.call(files).filter(function(f){ return /^image\//.test(f.type); }).sort(function(a,b){ return a.name.localeCompare(b.name,"fr",{numeric:true}); });
  if(!files.length) return;
  toast("Import de "+files.length+" photo(s)…");
  var auto=0, un=0;
  Promise.all(files.map(readImage)).then(function(imgs){
    imgs.forEach(function(im,i){ if(!im) return; var name=files[i].name; var p={id:uid(),name:name,data:im.data,w:im.w,h:im.h,cap:"",fiche:null,phase:"av",guess:false};
      var ph=guessPhase(name);
      if(target){ p.fiche=target.fiche; p.phase=target.phase; var f=getF(target.fiche); if(f&&f.kind==="lot"){ var m=matchFiche(name); if(m&&m.fiche===f.id) p.cap=m.cap; } }
      else { var m2=matchFiche(name); if(m2){ p.fiche=m2.fiche; p.cap=m2.cap; auto++; } else un++; p.phase=ph||"av"; p.guess=!ph; }
      S.photos.push(p); });
    savePhotos(); renderAll();
    if(!target) toast(auto+" photo(s) attribuée(s) automatiquement"+(un?" · "+un+" à attribuer":""));
    else toast(files.length+" photo(s) ajoutée(s)");
  });
}

function setupDrop(el,getTarget){

}
setupDrop($("sideDrop"),function(){ return null; });
$("sideDrop").onclick=function(){ pickPhotos(null); };
document.addEventListener("dragover",function(e){ var d=e.target.closest&&e.target.closest("[data-drop]"); if(d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave",function(e){ var d=e.target.closest&&e.target.closest("[data-drop]"); if(d) d.classList.remove("over"); });
document.addEventListener("drop",function(e){ var d=e.target.closest&&e.target.closest("[data-drop]"); if(!d){ if(!e.target.closest("#sideDrop")) e.preventDefault(); return; } e.preventDefault(); d.classList.remove("over"); addPhotos(e.dataTransfer.files,{fiche:S.cur,phase:d.getAttribute("data-drop")}); });
function movePh(id,dir){ var p=findPh(id); var same=S.photos.filter(function(x){ return x.fiche===p.fiche&&x.phase===p.phase; }); var i=same.indexOf(p), j=i+dir; if(j<0||j>=same.length) return; var a=S.photos.indexOf(p), b=S.photos.indexOf(same[j]); S.photos[a]=same[j]; S.photos[b]=p; savePhotos(); renderEditor(); }
function swapPhase(id){ var p=findPh(id); p.phase = p.phase==="av"?"ap":"av"; p.guess=false; savePhotos(); renderEditor(); renderList(); }
function delPh(id){ S.photos=S.photos.filter(function(p){ return p.id!==id; }); savePhotos(); renderEditor(); renderList(); renderUnassigned(); }

$("unassigned").addEventListener("change",function(e){
  var a=e.target.getAttribute("data-asg"), b=e.target.getAttribute("data-asp");

   NOTION (via le proxy Cloudflare existant)
   ===================================================================== */
function nfetch(path,method,body){
  var st=settings();
  return fetch(st.proxy.replace(/\/$/,"")+"/v1"+path,{method:method||"GET",headers:{"Content-Type":"application/json","Notion-Version":NOTION_VERSION,"X-App-Key":st.key},body:body?JSON.stringify(body):undefined})
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error((j&&(j.message||j.error))||("Erreur "+r.status)); return j; }); });
}
function ptext(p){
  if(!p) return "";
  switch(p.type){
    case "title": case "rich_text": return (p[p.type]||[]).map(function(t){ return t.plain_text; }).join("");
    case "select": case "status": return p[p.type]?p[p.type].name:"";
    case "multi_select": return (p.multi_select||[]).map(function(s){ return s.name; }).join(", ");
    case "number": return p.number==null?"":String(p.number);
    case "url": case "email": case "phone_number": return p[p.type]||"";
    case "date": return p.date?p.date.start:"";
    case "people": return (p.people||[]).map(function(x){ return x.name||""; }).join(", ");
    case "formula": var f=p.formula||{}; return f.type==="string"?(f.string||""):f.type==="number"?(f.number==null?"":String(f.number)):f.type==="date"?(f.date?f.date.start:""):f.type==="boolean"?String(f.boolean):"";
    case "rollup": var r=p.rollup||{}; if(r.type==="array") return (r.array||[]).map(ptext).filter(Boolean).join(", "); if(r.type==="number") return r.number==null?"":String(r.number); return "";
    default: return "";
  }
}
function nk(s){ return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function prop(props){ var names=[].slice.call(arguments,1).map(nk); for(var k in props){ if(names.indexOf(nk(k))>=0) return ptext(props[k]); } return ""; }
function parseAgence(s){
  s=String(s||"").trim(); var o={nom:"",adr:"",tel:""}; if(!s) return o;
  var tm=s.match(/t[ée]l\.?\s*:?\s*([\d .]{8,})/i); if(tm){ o.tel=tm[1].trim(); s=s.slice(0,tm.index).trim(); }
  var nm=s.match(/^(EVEHA|ÉVEHA)\s+([A-ZÀ-Ý'\-]+(?:\s+(?:[A-ZÀ-Ý'\-]{2,}))?)/i);
  if(nm){ var nom=nm[0]; var rest=s.slice(nom.length).trim();
    var w=nom.split(/\s+/); if(w.length===3 && /^\d/.test(rest)===false && /\d/.test(w[2])){ nom=w.slice(0,2).join(" "); rest=w[2]+" "+rest; }
    o.nom=nom.toUpperCase(); var cp=rest.search(/\b\d{2}\s?\d{3}\b/); o.adr = cp>0 ? rest.slice(0,cp).trim().replace(/[,–-]\s*$/,"")+"\n"+rest.slice(cp).trim() : rest; }
  else o.nom=s;
  return o;
}
function dossierFromPage(pg){
  var p=pg.properties||{}; var d=newDossier(); var ag=parseAgence(prop(p,"Agence"));
  d.notionId=pg.id; d.numLabo=prop(p,"N° labo","N labo","No labo"); d.numEveha=prop(p,"N° EVEHA","N EVEHA");
  d.commune=prop(p,"Commune"); d.site=prop(p,"Site"); d.oa=prop(p,"OA"); d.ro=prop(p,"RO"); d.lienDrive=prop(p,"Lien Drive");
  d.nbObjets=prop(p,"Nombre objets"); d.typeMobilier=prop(p,"Type Mobilier"); d.typeInterv=prop(p,"Type d'intervention"); d.annee=prop(p,"Année");
  d.agenceNom=ag.nom; d.agenceAdr=ag.adr; d.agenceTel=ag.tel; d.etat=prop(p,"Etat","État");
  var spe=prop(p,"Spécialiste"); if(spe && !/winckel/i.test(spe)) d.specialiste=spe;
  d.numRapport=(d.numLabo||"")+"_01";
  return d;
}
function listNotion(q){
  var st=settings(); var body={page_size:100,sorts:[{timestamp:"last_edited_time",direction:"descending"}]};
  return nfetch("/databases/"+st.db.replace(/-/g,"")+"/query","POST",body).then(function(j){ return (j.results||[]).map(function(pg){ return {page:pg,d:dossierFromPage(pg)}; }); });
}
function chunk(s,n){ var a=[]; for(var i=0;i<s.length;i+=n) a.push(s.slice(i,i+n)); return a; }
function findDataBlock(pageId){
  return nfetch("/blocks/"+pageId+"/children?page_size=100").then(function(j){
    var tg=(j.results||[]).filter(function(b){ return b.type==="toggle" && ptext({type:"rich_text",rich_text:b.toggle.rich_text})===TOGGLE_TITLE; })[0];
    if(!tg) return {toggle:null,code:null};
    return nfetch("/blocks/"+tg.id+"/children?page_size=100").then(function(c){ var cb=(c.results||[]).filter(function(b){ return b.type==="code"; })[0]; return {toggle:tg,code:cb||null}; });
  });
}
function saveNotion(){
  if(!S.key) return; if(!S.dossier.notionId){ toast("Dossier local : utilisez « Exporter (.json) » dans le menu ⋯, ou ouvrez le dossier depuis Notion",1); return; }
  var json=DATA_MARK+"\n"+JSON.stringify({dossier:S.dossier,fiches:S.fiches,t:new Date().toISOString()});
  var parts=chunk(json,1900); if(parts.length>100){ toast("Données trop volumineuses pour Notion — exportez en .json",1); return; }
  var rt=parts.map(function(t){ return {type:"text",text:{content:t}}; });
  var btn=$("btnNotionSave"); btn.disabled=true; btn.textContent="Envoi…";
  findDataBlock(S.dossier.notionId).then(function(r){
    if(r.code) return nfetch("/blocks/"+r.code.id,"PATCH",{code:{rich_text:rt,language:"json"}});
    var codeB={object:"block",type:"code",code:{rich_text:rt,language:"json"}};
    if(r.toggle) return nfetch("/blocks/"+r.toggle.id+"/children","PATCH",{children:[codeB]});
    return nfetch("/blocks/"+S.dossier.notionId+"/children","PATCH",{children:[{object:"block",type:"toggle",toggle:{rich_text:[{type:"text",text:{content:TOGGLE_TITLE}}],children:[codeB]}}]});
  }).then(function(){ S.notionDirty=false; saveLocal(); toast("Fiches enregistrées dans la page Notion du dossier"); })
    .catch(function(e){ toast("Notion : "+e.message,1); })
    .then(function(){ btn.disabled=false; btn.innerHTML='☁<span class="hm"> Enregistrer dans Notion</span>'; });
}
$("btnNotionSave").onclick=saveNotion;
function loadNotionData(pageId){
  return findDataBlock(pageId).then(function(r){
    if(!r.code) return null;
    var txt=(r.code.code.rich_text||[]).map(function(t){ return t.plain_text; }).join("");
    if(txt.indexOf(DATA_MARK)!==0) return null;
    try{ return JSON.parse(txt.slice(DATA_MARK.length+1)); }catch(e){ return null; }
  });
}
function openNotionPage(pg){
  var d=dossierFromPage(pg); var key="n:"+pg.id.replace(/-/g,"");
  toast("Ouverture du dossier…");

    var local=LS.get("rcr:d:"+key,null);
    if(saved && local && local.notionDirty && local.t > Date.parse(saved.t||0)){
      if(confirm("Cet appareil contient des modifications plus récentes que Notion pour ce dossier.\nOK = garder la version de cet appareil · Annuler = reprendre la version Notion")){ openLocal(key); refreshHeader(d); return; }
    }
    if(saved){ var dd=Object.assign(newDossier(),saved.dossier||{}); refreshHeaderInto(dd,d); openDossier(key,dd,saved.fiches||[]); S.notionDirty=false; saveLocal(); toast("Dossier chargé ("+S.fiches.length+" fiches)"); return; }
    if(local){ var ld=Object.assign(newDossier(),local.dossier); refreshHeaderInto(ld,d); openDossier(key,ld,local.fiches||[]); return; }
    openDossier(key,d,[]); startFichesModal();
  }).catch(function(e){ toast("Notion : "+e.message,1); });

function issues(f){
  var a=[];
  if(f.kind==="lot"){ if(!(f.items||[]).length) a.push({err:1,t:"inventaire du lot vide"}); else if(f.items.some(function(i){ return !i.num; })) a.push({t:"lignes d'inventaire sans n° d'objet"}); }
  else if(!f.num) a.push({err:1,t:"n° d'objet manquant"});
  if(!f.designation) a.push({t:"désignation manquante"});
  if(!f.descInterv) a.push({t:"texte d'intervention vide"});
  if(/\[à compléter/i.test(JSON.stringify(f))) a.push({err:1,t:"contient « [à compléter] »"});
  if(!photoCount(f.id,"av")) a.push({t:"pas de photo avant traitement"});
  if(!photoCount(f.id,"ap")) a.push({t:"pas de photo après traitement"});
  return a;
}

var OL="79874C", INK="3A3C34", MUT="7A7C6E", LINE="C9CFB3", FONT="Titillium Web", FONT_SB="Titillium Web SemiBold";
var CW=9906; /* largeur utile en twips (A4 − 2 × 1000) */
function b64bytes(dataUrl){ var b=atob(dataUrl.split(",")[1]); var u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function safe(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9.\-]+/g,"_").replace(/^_+|_+$/g,"").slice(0,80); }

function buildDoc(f, idx){
  var X=docx, d=S.dossier, isLot=f.kind==="lot";
  var NONE={style:X.BorderStyle.NONE,size:0,color:"FFFFFF"};
  var NB={top:NONE,bottom:NONE,left:NONE,right:NONE,insideHorizontal:NONE,insideVertical:NONE};
  var NBc={top:NONE,bottom:NONE,left:NONE,right:NONE};
  var TH={style:X.BorderStyle.SINGLE,size:4,color:LINE};
  function run(t,o){ o=o||{}; return new X.TextRun({text:String(t==null?"":t),font:o.semi?FONT_SB:FONT,bold:!!o.bold,size:o.size||17,color:o.color||INK,characterSpacing:o.sp||0,italics:!!o.it,break:o.br?1:undefined}); }
  function runs(t,o){ var lines=String(t==null?"":t).split("\n"); return lines.map(function(l,i){ var oo=Object.assign({},o||{}); if(i) oo.br=1; return run(l,oo); }); }
  function lab(t){ return run(t,{semi:1,color:OL,sp:28}); }
  function P(ch,o){ o=o||{}; return new X.Paragraph({children:ch,alignment:o.al,spacing:{before:o.b||0,after:o.a==null?30:o.a,line:o.line},keepNext:!!o.kn,keepLines:!!o.kl,pageBreakBefore:!!o.pb}); }
  function C(ch,w,o){ o=o||{}; return new X.TableCell({children:Array.isArray(ch)?ch:[ch],width:{size:w,type:X.WidthType.DXA},borders:o.bd||NBc,columnSpan:o.span,verticalAlign:o.va,shading:o.fill?{type:X.ShadingType.CLEAR,color:"auto",fill:o.fill}:undefined,margins:o.m||{top:25,bottom:25,left:50,right:50}}); }
  function T(rows,widths,o){ o=o||{}; return new X.Table({rows:rows,width:{size:widths.reduce(function(a,b){return a+b;},0),type:X.WidthType.DXA},columnWidths:widths,borders:o.bd||NB,layout:X.TableLayoutType.FIXED,alignment:o.al}); }
  function R(cells,o){ return new X.TableRow({children:cells,cantSplit:true,tableHeader:!!(o&&o.hd)}); }
  function title(t,o){ o=o||{}; return P([run(t.toUpperCase(),{bold:1,size:19,color:OL,sp:55})],{b:o.b==null?260:o.b,a:90,kn:1,pb:o.pb}); }
  var W4=[2250,2950,1350,3356];
  function kv4(l1,v1,l2,v2,o){ o=o||{};
    return R([C(P([lab(l1)]),W4[0]),C(P(runs(v1,o.b1?{bold:1}:{})),W4[1]),C(P(l2?[lab(l2)]:[]),W4[2]),C(P(Array.isArray(v2)?v2:runs(v2,o.b2?{bold:1}:{})),W4[3])]); }
  var W2=[2250,CW-2250];
  function kv2(l,v){ return R([C(P([lab(l)]),W2[0]),C(P(runs(v)),W2[1])]); }

  var body=[];
  var no="n°"+reportNo(idx);
  /* en-tête du rapport */
  body.push(T([R([C(P([lab("Auteur"),run("   "),run(d.auteur)]),5000),C(P([run(no,{semi:1,color:OL,sp:20,size:19})],{al:X.AlignmentType.RIGHT}),CW-5000)]),
               R([C(P([lab("Date"),run("   "),run(d.date)]),5000),C(P([]),CW-5000)])],[5000,CW-5000]));

  /* informations administratives */
  body.push(title("Informations administratives"));
  var adm=[];
  var desig = isLot ? f.designation : f.designation;
  var numV = isLot ? "lot de "+(f.items||[]).length+" objet"+((f.items||[]).length>1?"s":"")+" (voir inventaire)" : f.num;
  adm.push(kv4("Désignation",desig,"N° objet",numV,{b2:!isLot}));
  var ueus = isLot ? [run(uniq(f.items,"ue"))] : [run(f.ue||""),run("     "),lab("US"),run("  "+(f.us||""))];
  adm.push(kv4("Période",f.periode,isLot?"UE":"UE",ueus));
  adm.push(kv4("Commune",d.commune,"OA",d.oa));
  adm.push(kv4("Site",d.site,"RO",d.ro));
  if(d.numEveha) adm.push(kv4("N° Éveha",d.numEveha,"",""));
  adm.push(R([C(P([lab("Agence de référence")]),W4[0]+W4[1],{span:2}),C(P([]),W4[2]+W4[3],{span:2})]));
  adm.push(R([C(P(runs([d.agenceNom,d.agenceAdr].filter(Boolean).join("\n"))),W4[0]+W4[1],{span:2}),C(P(d.agenceTel?[lab("Tél."),run("  "+d.agenceTel)]:[]),W4[2]+W4[3],{span:2,va:X.VerticalAlign.BOTTOM})]));
  body.push(T(adm,W4));

  /* état préalable */
  body.push(title("État préalable"));
  body.push(T([kv4("État de conservation",f.etat,isLot?"NR total":"NR",isLot?String(sumNR(f.items)):f.nr),kv4("Environnement",f.env,"Profil",f.profil),kv4("Type de prélèvement",f.prelev,"","")],W4));

  /* dimensions */
  var dm=f.dim||{}; var hasDim=DIMS.some(function(x){ return String(dm[x[0]]||"").trim(); });
  if(!isLot && hasDim){
    body.push(title("Dimensions"));
    var DW=[1350,1126,1350,1126,1350,1126,1350,1128]; var BD={top:TH,bottom:TH,left:TH,right:TH};
    var cellL=function(t,i){ return C(P([lab(t)]),DW[i],{bd:BD,fill:"F4F5EE"}); }, cellV=function(t,i){ return C(P([run(t)],{al:X.AlignmentType.CENTER}),DW[i],{bd:BD}); };
    body.push(T([R([cellL("Haut. (mm)",0),cellV(dm.haut,1),cellL("Larg. (mm)",2),cellV(dm.larg,3),cellL("Épais. (mm)",4),cellV(dm.epais,5),cellL("Masse (g)",6),cellV(dm.masse,7)]),
                 R([cellL("Long. (mm)",0),cellV(dm.long,1),cellL("Prof. (mm)",2),cellV(dm.prof,3),cellL("Diam. (mm)",4),cellV(dm.diam,5),cellL("",6),cellV("",7)])],DW));
  }
  /* altérations */
  var altRows=ALT.filter(function(x){ return String(f[x.k]||"").trim(); }).map(function(x){ return kv2(x.l,f[x.k]); });
  if(altRows.length){ body.push(title("Altérations")); body.push(T(altRows,W2)); }
  /* description état */
  if(String(f.descEtat||"").trim()){ body.push(title("Description / remarques")); paras(f.descEtat).forEach(function(p){ body.push(p); }); }

  /* inventaire du lot */
  if(isLot && (f.items||[]).length){
    var IW=[1500,2900,850,850,650,1050,2106]; var BD2={top:TH,bottom:TH,left:NONE,right:NONE};
    var hd=["N° objet","Désignation","UE","US","NR","Masse (g)","Remarques"];
    var rows=[R(hd.map(function(t,i){ return C(P([run(t,{semi:1,color:OL,size:15,sp:15})]),IW[i],{bd:BD2,fill:"EEF0E3"}); }),{hd:1})];
    f.items.forEach(function(it){ rows.push(R(["num","designation","ue","us","nr","masse","rem"].map(function(k,i){ return C(P([run(it[k]||"",{size:16,bold:k==="num"})]),IW[i],{bd:BD2}); }))); });
    body.push(title("Inventaire du lot ("+f.items.length+" objets)"));
    body.push(T(rows,IW));
  }

  /* photos avant */
  var pav=S.photos.filter(function(p){ return p.fiche===f.id && p.phase==="av"; });
  if(pav.length){ body.push(title("Photographies avant traitement",{pb:1,b:0})); photoBlocks(pav,isLot).forEach(function(b){ body.push(b); }); }

  /* intervention */
  body.push(title("Intervention",{pb:1,b:0}));
  var IW4=[2250,3700,1050,2906]; var irows=[];
  INTERV.forEach(function(x){ var v=String(f[x.k]||"").trim(), s=x.s?String(f[x.s]||"").trim():"";
    if(!v && !s) return; var l=x.l.replace(" (2)","");
    irows.push(R([C(P([lab(l)]),IW4[0]),C(P(runs(v)),IW4[1]),C(P(s?[lab("Solvant")]:[]),IW4[2]),C(P(runs(s)),IW4[3])])); });
  if(irows.length) body.push(T(irows,IW4));
  if(String(f.descInterv||"").trim()){ body.push(title("Description / remarques")); paras(f.descInterv).forEach(function(p){ body.push(p); }); }

  /* conditionnement */
  var crows=COND.filter(function(x){ return String(f[x.k]||"").trim(); }).map(function(x){ return kv2(x.l,f[x.k]); });
  if(crows.length){ body.push(title("Conditionnement")); body.push(T(crows,W2)); }

  /* photos après */
  var pap=S.photos.filter(function(p){ return p.fiche===f.id && p.phase==="ap"; });
  if(pap.length){ body.push(title("Photographies après traitement",{pb:1,b:0})); photoBlocks(pap,isLot).forEach(function(b){ body.push(b); }); }

  function paras(t){ return String(t).split(/\n\s*\n|\n/).filter(function(s){ return s.trim(); }).map(function(s){ return new X.Paragraph({children:[run(s.trim(),{size:18})],alignment:X.AlignmentType.JUSTIFIED,spacing:{after:90,line:290}}); }); }
  function uniq(items,k){ var a=[]; (items||[]).forEach(function(i){ var v=String(i[k]||"").trim(); if(v&&a.indexOf(v)<0) a.push(v); }); return a.join(", "); }
  function sumNR(items){ var s=0; (items||[]).forEach(function(i){ s+=parseInt(i.nr,10)||0; }); return s||""; }

  /* mise en page des photos : 1 colonne si paysage, 2 colonnes si portrait ; pagination automatique */
  function photoBlocks(list,caps){
    var out=[]; var maxW=655, gap=14, firstH=830, pageH=890, capH=caps?20:0;
    var portrait = list.filter(function(p){ return p.h>p.w*1.05; }).length > list.length/2;
    var cols = (caps && list.length>4) ? 3 : ((portrait && list.length>1) ? 2 : 1);
    var cw = Math.floor((maxW-gap*(cols-1))/cols);
    var rows=[]; for(var i=0;i<list.length;i+=cols){ var r=list.slice(i,i+cols); var hs=r.map(function(p){ return cw*p.h/p.w; }); rows.push({ps:r,h:Math.max.apply(null,hs)+capH+gap}); }
    /* regroupement en pages : on accepte jusqu'à 45 % de dépassement, compensé par une réduction homothétique */
    var pages=[], cur=[], tot=0, avail=firstH;
    rows.forEach(function(r){ if(cur.length && (tot+r.h)>avail*1.45){ pages.push({rows:cur,tot:tot,avail:avail}); cur=[]; tot=0; avail=pageH; } cur.push(r); tot+=r.h; });
    if(cur.length) pages.push({rows:cur,tot:tot,avail:avail});
    pages.forEach(function(pgx,pi){
      if(pi>0) out.push(new X.Paragraph({children:[new X.PageBreak()]}));
      var k=Math.min(1,pgx.avail/pgx.tot);
      pgx.rows.forEach(function(r){
        var dims=r.ps.map(function(p){ var w=Math.round(cw*k), h=Math.round(cw*k*p.h/p.w); return {p:p,w:w,h:h}; });
        var imgP=function(x){ var ch=[P([new X.ImageRun({type:"jpg",data:b64bytes(x.p.data),transformation:{width:x.w,height:x.h}})],{al:X.AlignmentType.CENTER,a:caps?10:100})]; if(caps) ch.push(P([run(x.p.cap||"",{size:15,color:MUT,it:1})],{al:X.AlignmentType.CENTER,a:100})); return ch; };
        if(cols===1){ imgP(dims[0]).forEach(function(p){ out.push(p); }); return; }
        var tw=Math.floor(CW/cols), ws=[]; for(var c=0;c<cols;c++) ws.push(c<cols-1?tw:CW-tw*(cols-1));
        var cells=[]; for(var c2=0;c2<cols;c2++) cells.push(dims[c2]?C(imgP(dims[c2]),ws[c2],{m:{top:0,bottom:0,left:40,right:40}}):C(P([]),ws[c2]));
        out.push(T([R(cells)],ws));
      });
    });
    return out;
  }

  /* en-tête / pied de page */
  var logo=b64bytes(LOGO);
  var header=new X.Header({children:[
    T([R([C(P([new X.ImageRun({type:"jpg",data:logo,transformation:{width:43,height:53}})],{a:0}),1000,{va:X.VerticalAlign.BOTTOM}),
          C([P([run("Pôle Conservation-Restauration",{semi:1,size:25,color:OL,sp:45})],{al:X.AlignmentType.RIGHT,a:0}),P([run("Rapport de traitement",{size:20,color:OL,sp:45})],{al:X.AlignmentType.RIGHT,a:50})],CW-1000,{va:X.VerticalAlign.BOTTOM,bd:{top:NONE,left:NONE,right:NONE,bottom:{style:X.BorderStyle.SINGLE,size:6,color:OL}}})])],[1000,CW-1000])]});
  var footer=new X.Footer({children:[new X.Paragraph({alignment:X.AlignmentType.RIGHT,children:[
    new X.TextRun({text:[d.commune,d.site].filter(Boolean).join(" — ")+"   ·   "+no+"   ·   ",font:FONT,size:14,color:MUT}),
    new X.TextRun({children:[X.PageNumber.CURRENT," / ",X.PageNumber.TOTAL_PAGES],font:FONT,size:14,color:MUT})]})]});
  return new X.Document({creator:d.auteur||"Éveha",title:"Rapport de traitement "+no,
    styles:{default:{document:{run:{font:FONT,size:17,color:INK}}}},
    sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:1650,bottom:1000,left:1000,right:1000,header:500,footer:450}}},headers:{default:header},footers:{default:footer},children:body}]});
}
function fileName(f,idx){
  var d=S.dossier; var id = f.kind==="lot" ? "lot-"+(f.designation||"") : (f.num||"objet"+(idx+1));
  return [safe(d.commune),safe(d.site),safe(id),"rapport"].filter(Boolean).join("_")+".docx";
}
function confirmIssues(list,go){
  var bad=list.map(function(f){ return {f:f,i:issues(f)}; }).filter(function(x){ return x.i.length; });
  if(!bad.length){ go(); return; }
  modal("Avant de générer",'<p style="margin-top:0">Points à vérifier :</p><ul class="issues">'+bad.slice(0,30).map(function(x){ return '<li><b>'+esc(ficheTitle(x.f))+'</b> — '+x.i.map(function(i){ return '<span class="'+(i.err?"":"w")+'">'+esc(i.t)+'</span>'; }).join(", ")+'</li>'; }).join("")+'</ul>',
    [{t:"Corriger"},{t:"Générer quand même",pri:1,fn:function(){ setTimeout(go,30); }}]);
}
function genOne(){
  var f=curF(); if(!f){ toast("Aucune fiche ouverte",1); return; }
  confirmIssues([f],function(){ var idx=S.fiches.indexOf(f); toast("Génération…");
    docx.Packer.toBlob(buildDoc(f,idx)).then(function(b){ download(b,fileName(f,idx)); toast("Rapport généré"); }).catch(function(e){ console.error(e); toast("Erreur de génération : "+e.message,1); }); });
}
function genAll(){
  var ids=selIds(); var list = ids.length ? S.fiches.filter(function(f){ return ids.indexOf(f.id)>=0; }) : S.fiches.slice();
  if(!list.length){ toast("Aucune fiche",1); return; }
  confirmIssues(list,function(){
    toast("Génération de "+list.length+" rapport(s)…"); var zip=new JSZip(); var names={};
    var p=Promise.resolve();
    list.forEach(function(f){ p=p.then(function(){ var idx=S.fiches.indexOf(f); var n=fileName(f,idx); if(names[n]){ n=n.replace(/\.docx$/,"_"+(idx+1)+".docx"); } names[n]=1; return docx.Packer.toBlob(buildDoc(f,idx)).then(function(b){ zip.file(n,b); }); }); });
    p.then(function(){ return zip.generateAsync({type:"blob"}); }).then(function(z){ download(z,safe(S.dossier.numLabo||"rapports")+"_rapports.zip"); toast(list.length+" rapport(s) générés"); }).catch(function(e){ console.error(e); toast("Erreur : "+e.message,1); });
  });
}
$("genOne").onclick=genOne; $("genAll").onclick=genAll;

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
(function init(){
  var q=new URLSearchParams(location.search); var pid=q.get("dossier");
  if(pid){
    renderAll(); toast("Chargement du dossier Notion…");
    nfetch("/pages/"+pid).then(openNotionPage).catch(function(e){ toast("Notion : "+e.message,1); var k=LS.get("rcr:last",null); if(k) openLocal(k); });
    return;
  }
  var last=LS.get("rcr:last",null);
  if(last && LS.get("rcr:d:"+last,null)) openLocal(last); else { renderAll(); dossiersModal(); }
})();
window.addEventListener("beforeunload",function(){ if(S.dirty) saveLocal(); });
</script>
