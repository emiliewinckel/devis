<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korè — redirection</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#F4F2EF;color:#1A1210;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
  .c{background:#fff;border:1px solid #E7E2DC;border-radius:12px;padding:24px;max-width:380px;text-align:center}
  .k{font-size:20px;font-weight:800;letter-spacing:4px;color:#8B3A2A;margin-bottom:10px}
  p{font-size:13px;line-height:1.6;color:#4A423E;margin:0 0 14px}
  a{display:inline-block;background:#8B3A2A;color:#fff;text-decoration:none;padding:9px 18px;
    border-radius:8px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="c">
  <div class="k">KORE</div>
  <p>Cette étiquette renvoie vers l'ancienne adresse de l'application.<br>Redirection en cours…</p>
  <a id="lien" href="kore_FER.html">Ouvrir KORE</a>
</div>
<script>
// Les QR codes imprimés avant le renommage du fichier pointent ici.
// On conserve les paramètres (?lot=...) pour ouvrir directement le bon lot.
(function () {
  var cible = 'kore_FER.html' + (location.search || '') + (location.hash || '');
  var a = document.getElementById('lien');
  if (a) a.href = cible;
  location.replace(cible);
})();
</script>
</body>
</html>
