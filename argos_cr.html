<style>
/* Charte ARGOS CR : bandeau bleu foncé, accents bleu clair (les deux bleus de l’œil), fond gris-bleu, Montserrat (famille KORE / KERA / ARGOS).
   Mise en page : une colonne pensée pour la tablette ou le téléphone tenu d'une main, gros boutons. */
:root{
  /* Deux bleus seulement, ceux de l'œil : bleu foncé (#2E3192) et bleu clair de l'iris (#A8DDF0). Les teintes très claires ne servent qu'en fond. */
  --navy:#2E3192; --navy-d:#2E3192; --navy-l:#E9EAF6; --sky:#A8DDF0; --sky-l:#EAF6FB;
  --green:#3B6D11; --green-l:#EAF3DE; --amber:#BA7517; --amber-l:#FAEEDA;
  --bg:#F1F3F7; --card:#FFFFFF; --border:#E1E4EC; --txt:#2C2C2A; --txt2:#6B6966; --txt3:#9B9895;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font-family:var(--font)}
body{font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:101;background:var(--navy)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--navy);color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:720px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;min-width:0;flex:1}
.brand-b{display:flex;align-items:center;min-width:0;background:none;border:0;padding:0;margin:0;cursor:pointer;color:inherit;font:inherit;border-radius:50%}.brand-b:focus-visible{outline:2px solid #fff;outline-offset:3px}

<script type="text/plain" id="tpl-ren-py"># Renommage des photos — ARGOS CR (outil conçu par Emilie Winckel, Pôle Conservation-Restauration, Éveha)
# Même règle que la version Windows : année_n° de dossier_n° d'inventaire_avant_1.jpg … / _post_1.jpg …
import os, re, sys, csv, uuid, datetime

AN = '%%AN%%'
DOS = '%%DOS%%'
CORR = %%CORR%%

racine = os.path.abspath(sys.argv[1] if len(sys.argv) > 1 else os.getcwd())
EXT = {'.jpg', '.jpeg', '.png', '.tif', '.tiff', '.heic', '.webp', '.cr2', '.cr3', '.nef', '.arw', '.dng', '.orf', '.rw2', '.raf'}

def nettoie(s): return re.sub(r'[\\/:*?"<>|]+', '-', re.sub(r'\s+', '', s.strip()))
def cle_nat(s): return re.sub(r'\d+', lambda m: m.group(0).zfill(12), s.lower())
def phase(nom):
    n = nom.lower()
    if 'avant' in n: return 'avant'
    if re.search(r'post|apr[eè]s', n): return 'post'
    return None
def demande(q):
    try: return input(q).strip()
    except EOFError: return ''
def oui(r): return bool(re.match(r'^[oOyY]', r))
def journaux(): return sorted(f for f in os.listdir(racine) if f.startswith('renommage_photos_') and f.endswith('.csv'))

def annuler():
    j = journaux()
    if not j: print('Aucun renommage à annuler.'); return
    dernier = os.path.join(racine, j[-1])
    with open(dernier, encoding='utf-8-sig', newline='') as fh: lignes = list(csv.DictReader(fh, delimiter=';'))
    print(f'Annulation de « {j[-1]} » : {len(lignes)} fichier(s) retrouvent leur ancien nom.')
    if not oui(demande('Confirmer ? (O/N) ')): print("Rien n'a été modifié."); return
    tmp = []
    for l in lignes:
        p = os.path.join(racine, *re.split(r'[\\/]', l['nouveau']))
        if os.path.exists(p): t = p + '.argos_tmp'; os.rename(p, t); tmp.append((t, os.path.join(racine, *re.split(r'[\\/]', l['ancien']))))
        else: print('  introuvable :', l['nouveau'])
    for t, a in tmp: os.rename(t, a)
    os.rename(dernier, dernier[:-4] + '_annule.txt')
    print('Annulation terminée.')

def main():
    global AN, DOS
    nom_racine = os.path.basename(racine)
    if not AN or AN.startswith('%%'):
        m = re.match(r'^(\d{4})[_\-\s]+([^_]+)', nom_racine)
        if not m:
            print(f'Le dossier « {nom_racine} » ne commence pas par année_n° de dossier (ex. 2026_9120_Caen).')
            print('Placez ce fichier dans le dossier du chantier, ou téléchargez-le depuis la page du dossier dans ARGOS CR.'); return
        AN, DOS = m.group(1), m.group(2)
    print(f'\nARGOS CR — renommage des photos du dossier {AN}_{DOS}\nDossier : {racine}\n')
    if journaux():
        if re.match(r'^[aA]', demande('Un renommage a déjà été fait ici. R = renommer (nouvelles photos comprises), A = annuler le dernier renommage : ')):
            annuler(); return
    plan, alertes = [], []
    # deux rangements acceptés : chantier/objet/photo_avant_traitement  ou  chantier/photo_avant_traitement/objet
    paires = []
    sous = lambda p: sorted((d for d in os.listdir(p) if os.path.isdir(os.path.join(p, d))), key=cle_nat)
    for d in sous(racine):
        pd = os.path.join(racine, d)
        if phase(d):
            for o in sous(pd): paires.append((o, phase(d), os.path.join(pd, o)))
            if any(os.path.splitext(f)[1].lower() in EXT for f in os.listdir(pd)):
                alertes.append(f'« {d} » contient des photos en vrac : rangez-les dans un dossier par objet (n° d\'inventaire ou 001…), elles ne sont pas renommées.')
        else:
            ph = [p for p in sous(pd) if phase(p)]
            if not ph: alertes.append(f'« {d} » : pas de dossier photo_avant_traitement / photo_post_traitement, ignoré.'); continue
            for p in ph: paires.append((d, phase(p), os.path.join(pd, p)))
    objets = []
    for obj, sens, pp in paires:
        cle = obj.strip().lower()
        if cle in CORR: inv = CORR[cle]
        else:
            inv = nettoie(obj)
            if CORR and obj not in objets: alertes.append(f'« {obj} » : objet inconnu dans ARGOS CR, le nom du dossier est utilisé tel quel.')
        if obj not in objets: objets.append(obj)
        fichiers = [f for f in os.listdir(pp) if os.path.isfile(os.path.join(pp, f)) and os.path.splitext(f)[1].lower() in EXT]
        groupes = {}
        for f in fichiers: groupes.setdefault(os.path.splitext(f)[0], []).append(f)   # RAW + JPG : même numéro
        for n, base in enumerate(sorted(groupes, key=cle_nat), 1):
            for f in groupes[base]:
                nouveau = f'{AN}_{DOS}_{inv}_{sens}_{n}{os.path.splitext(f)[1].lower()}'
                if f != nouveau: plan.append((pp, f, nouveau))
    nb_obj = len(objets)
    for a in alertes: print('  !', a)
    if not nb_obj: print('Aucun dossier d\'objet trouvé. Rangement attendu : chantier / objet / photo_avant_traitement, ou chantier / photo_avant_traitement / objet.'); return
    if not plan: print(f'Rien à renommer ({nb_obj} objet(s) vus) : les photos portent déjà le bon nom.'); return
    print(f'{len(plan)} photo(s) à renommer dans {nb_obj} objet(s). Exemples :')
    for pp, f, nouveau in plan[:8]: print(f'  {f}  ->  {nouveau}')
    if len(plan) > 8: print('  …')
    if not oui(demande('\nRenommer ? (O/N) ')): print("Rien n'a été modifié."); return
    tmp = []
    for pp, f, nouveau in plan:   # en deux temps : jamais d'écrasement
        t = os.path.join(pp, f + '.argos_tmp'); os.rename(os.path.join(pp, f), t); tmp.append((t, pp, f, nouveau))
    journal = []
    for t, pp, f, nouveau in tmp:
        os.rename(t, os.path.join(pp, nouveau))
        journal.append({'ancien': os.path.relpath(os.path.join(pp, f), racine), 'nouveau': os.path.relpath(os.path.join(pp, nouveau), racine)})
    nom_j = 'renommage_photos_' + datetime.datetime.now().strftime('%Y%m%d_%H%M%S') + '.csv'
    with open(os.path.join(racine, nom_j), 'w', encoding='utf-8-sig', newline='') as fh:
        w = csv.DictWriter(fh, fieldnames=['ancien', 'nouveau'], delimiter=';', quoting=csv.QUOTE_ALL); w.writeheader(); w.writerows(journal)
    print(f'Terminé : {len(plan)} photo(s) renommée(s). Journal : {nom_j} (relancer ce fichier puis A pour annuler).')

try: main()
except Exception as e: print('Erreur :', e)
</script>
<script type="text/plain" id="tpl-ren"># Renommage des photos — ARGOS CR (outil conçu par Emilie Winckel, Pôle Conservation-Restauration, Éveha)
# À placer dans le dossier « numéro Éveha_commune » qui contient un dossier par objet,
# chacun avec « photo_avant_traitement » et « photo_post_traitement ».
# Nom produit : année_n° de dossier_n° d'inventaire_avant_1.jpg … / _post_1.jpg …
$ErrorActionPreference = 'Stop'
try { [Console]::OutputEncoding = [Text.Encoding]::UTF8 } catch {}

$AN  = '%%AN%%'
$DOS = '%%DOS%%'
$CORR = @{}
%%CORR%%

$self = $env:ARGOS_SELF
if (-not $self) { $self = $PSCommandPath }
$racine = Split-Path -Parent $self
$EXT = @('.jpg','.jpeg','.png','.tif','.tiff','.heic','.webp','.cr2','.cr3','.nef','.arw','.dng','.orf','.rw2','.raf')

function Nettoie([string]$s) { return (($s.Trim() -replace '\s+','') -replace '[\\/:*?"<>|]+','-') }
function CleNat([string]$s) { return [regex]::Replace($s.ToLower(), '\d+', { param($m) $m.Value.PadLeft(12,'0') }) }
function Phase([string]$nom) {
  $n = $nom.ToLower()
  if ($n -match 'avant') { return 'avant' }
  if ($n -match 'post|apr[eè]s') { return 'post' }
  return $null
}

# Année et n° de dossier : fournis par ARGOS CR, sinon lus dans le nom du dossier (« 2026_9120_Caen », « 2026-5131_Mauves »)
$nomRacine = Split-Path -Leaf $racine
if (-not $AN -or $AN -like '%%*') {
  if ($nomRacine -match '^(\d{4})[_\-\s]+([^_]+)') { $AN = $matches[1]; $DOS = $matches[2] }
  else {
    Write-Host "Le dossier « $nomRacine » ne commence pas par année_n° de dossier (ex. 2026_9120_Caen)." -ForegroundColor Red
    Write-Host "Placez ce fichier dans le dossier du chantier, ou téléchargez-le depuis la page du dossier dans ARGOS CR."
    return
  }
}

function Journaux { return @(Get-ChildItem -LiteralPath $racine -Filter 'renommage_photos_*.csv' -File | Sort-Object Name) }

function Annuler {
  $j = Journaux
  if (-not $j.Count) { Write-Host 'Aucun renommage à annuler.'; return }
  $dernier = $j[-1]
  $lignes = Import-Csv -LiteralPath $dernier.FullName -Delimiter ';' -Encoding UTF8
  Write-Host ("Annulation de « {0} » : {1} fichier(s) retrouvent leur ancien nom." -f $dernier.Name, $lignes.Count)
  if ((Read-Host 'Confirmer ? (O/N)') -notmatch '^[oOyY]') { Write-Host 'Rien n''a été modifié.'; return }
  $tmp = @()
  foreach ($l in $lignes) {
    $p = Join-Path $racine $l.nouveau
    if (Test-Path -LiteralPath $p) { $t = $p + '.argos_tmp'; Rename-Item -LiteralPath $p -NewName (Split-Path -Leaf $t); $tmp += ,@($t, (Join-Path $racine $l.ancien)) }
    else { Write-Host ("  introuvable : {0}" -f $l.nouveau) -ForegroundColor Yellow }
  }
  foreach ($x in $tmp) { Rename-Item -LiteralPath $x[0] -NewName (Split-Path -Leaf $x[1]) }
  Rename-Item -LiteralPath $dernier.FullName -NewName ($dernier.Name -replace '\.csv$','_annule.txt')
  Write-Host 'Annulation terminée.' -ForegroundColor Green
}

Write-Host ''
Write-Host "ARGOS CR — renommage des photos du dossier $AN`_$DOS" -ForegroundColor Cyan
Write-Host "Dossier : $racine"
Write-Host ''
if ((Journaux).Count) {
  $c = Read-Host 'Un renommage a déjà été fait ici. R = renommer (nouvelles photos comprises), A = annuler le dernier renommage'
  if ($c -match '^[aA]') { Annuler; return }
}

$plan = @(); $alertes = @()
# deux rangements acceptés : chantier\objet\photo_avant_traitement  ou  chantier\photo_avant_traitement\objet
$paires = @()
foreach ($d in (Get-ChildItem -LiteralPath $racine -Directory | Sort-Object { CleNat $_.Name })) {
  if (Phase $d.Name) {
    foreach ($o in (Get-ChildItem -LiteralPath $d.FullName -Directory | Sort-Object { CleNat $_.Name })) { $paires += ,@($o.Name, (Phase $d.Name), $o.FullName) }
    if (@(Get-ChildItem -LiteralPath $d.FullName -File | Where-Object { $EXT -contains $_.Extension.ToLower() }).Count) { $alertes += "« $($d.Name) » contient des photos en vrac : rangez-les dans un dossier par objet (n° d'inventaire ou 001…), elles ne sont pas renommées." }
  } else {
    $ph = @(Get-ChildItem -LiteralPath $d.FullName -Directory | Where-Object { Phase $_.Name } | Sort-Object { CleNat $_.Name })
    if (-not $ph.Count) { $alertes += "« $($d.Name) » : pas de dossier photo_avant_traitement / photo_post_traitement, ignoré."; continue }
    foreach ($p in $ph) { $paires += ,@($d.Name, (Phase $p.Name), $p.FullName) }
  }
}
$objets = @()
foreach ($pr in $paires) {
  $obj = $pr[0]; $sens = $pr[1]; $dir = $pr[2]
  $cle = $obj.Trim().ToLower()
  if ($CORR.ContainsKey($cle)) { $inv = $CORR[$cle] }
  else {
    $inv = Nettoie $obj
    if ($CORR.Count -and ($objets -notcontains $obj)) { $alertes += "« $obj » : objet inconnu dans ARGOS CR, le nom du dossier est utilisé tel quel." }
  }
  if ($objets -notcontains $obj) { $objets += $obj }
  $fichiers = @(Get-ChildItem -LiteralPath $dir -File | Where-Object { $EXT -contains $_.Extension.ToLower() })
  # une photo prise en RAW + JPG garde le même numéro
  $groupes = $fichiers | Group-Object BaseName | Sort-Object { CleNat $_.Name }
  $n = 0
  foreach ($g in $groupes) {
    $n++
    foreach ($f in $g.Group) {
      $nouveau = "{0}_{1}_{2}_{3}_{4}{5}" -f $AN, $DOS, $inv, $sens, $n, $f.Extension.ToLower()
      if ($f.Name -cne $nouveau) { $plan += [pscustomobject]@{ f = $f; nouveau = $nouveau } }
    }
  }
}
$nbObj = $objets.Count

$alertes | ForEach-Object { Write-Host "  ! $_" -ForegroundColor Yellow }
if (-not $nbObj) { Write-Host "Aucun dossier d'objet trouvé. Rangement attendu : chantier\objet\photo_avant_traitement, ou chantier\photo_avant_traitement\objet." -ForegroundColor Yellow; return }
if (-not $plan.Count) { Write-Host "Rien à renommer ($nbObj objet(s) vus) : les photos portent déjà le bon nom." -ForegroundColor Green; return }
Write-Host ("{0} photo(s) à renommer dans {1} objet(s). Exemples :" -f $plan.Count, $nbObj)
$plan | Select-Object -First 8 | ForEach-Object { Write-Host ("  {0}  ->  {1}" -f $_.f.Name, $_.nouveau) }
if ($plan.Count -gt 8) { Write-Host '  …' }
Write-Host ''
if ((Read-Host 'Renommer ? (O/N)') -notmatch '^[oOyY]') { Write-Host 'Rien n''a été modifié.'; return }

# en deux temps (noms provisoires) pour ne jamais écraser une photo
$rel = { param($p) $p.Substring($racine.Length).TrimStart('\','/') }
$journal = @(); $tmp = @()
foreach ($x in $plan) {
  $t = $x.f.FullName + '.argos_tmp'
  Rename-Item -LiteralPath $x.f.FullName -NewName (Split-Path -Leaf $t)
  $tmp += ,@($t, $x)
}
foreach ($y in $tmp) {
  $x = $y[1]; $dest = Join-Path $x.f.DirectoryName $x.nouveau
  Rename-Item -LiteralPath $y[0] -NewName $x.nouveau
  $journal += [pscustomobject]@{ ancien = (& $rel $x.f.FullName); nouveau = (& $rel $dest) }
}
$nomJ = 'renommage_photos_' + (Get-Date -Format 'yyyyMMdd_HHmmss') + '.csv'
$journal | Export-Csv -LiteralPath (Join-Path $racine $nomJ) -Delimiter ';' -NoTypeInformation -Encoding UTF8
Write-Host ("Terminé : {0} photo(s) renommée(s). Journal : {1} (relancer ce fichier puis A pour annuler)." -f $plan.Count, $nomJ) -ForegroundColor Green
</script>

/* ---------- lecture des propriétés Notion ---------- */
function pv(p){
  if(!p)return '';
  switch(p.type){
    case 'title':case 'rich_text':return (p[p.type]||[]).map(t=>t.plain_text).join('');
    case 'select':case 'status':return p[p.type]?p[p.type].name:'';
    case 'multi_select':return (p.multi_select||[]).map(s=>s.name);
    case 'number':return p.number;

    case 'date':return p.date?p.date.start:'';
    case 'relation':return (p.relation||[]).map(r=>r.id);
    case 'formula':{const f=p.formula||{};return f[f.type]==null?'':f[f.type]}
    case 'rollup':{const r=p.rollup||{};if(r.type==='array')return (r.array||[]).map(pv).flat().join(', ');return r[r.type]==null?'':r[r.type]}

  o.med=!!pv(P['Intérêt médiation']);o.romSusp=!!pv(P['Restes organiques suspectés']);try{const j=pv(P['Restes organiques (données)']);o.rom=j?JSON.parse(j):null}catch(e){o.rom=null}
  o.altM=pv(P['Altérations mécaniques'])||[];o.altP=pv(P['Altérations physico-chimique'])||[];o.altB=pv(P['Altérations biologiques'])||[];
  o.dL=pv(P['Longueur (mm) ']);o.dl=pv(P['Largeur (mm)']);o.dH=pv(P['Hauteur (mm)']);o.dD=pv(P['Diamètre (mm)']);o.dnum=pv(P['N° labo dossier']);o.dcom=pv(P['Commune']);
  STEPS.forEach(s=>o.steps[s.k]=pv(P[s.col]));return o}

  etape:etapeAlias(pv(P['Étape'])),personne:pv(P['Personne']),debut:pv(P['Début']),ech:pv(P['Échéance']),note:pv(P['Note']),par:pv(P['Créée par'])}}
// « Retouche » est devenue une option de l'étape Restauration
const etapeAlias=e=>e==='Retouche'?'Restauration':e;
function mapIv(pg){const P=pg.properties;return {id:pg.id,etape:etapeAlias(pv(P['Étape'])),statut:pv(P['Statut']),date:pv(P['Date']),
  op:pv(P['Opérateur']),proto:pv(P['Protocole']),note:pv(P['Note'])}}

/* ---------- accès Notion (proxy) ---------- */
let CFG=LS.get('argoslab:cfg',{proxy:DEF_PROXY,key:''});
function nfetch(path,method,body){
  return fetch(CFG.proxy.replace(/\/$/,'')+'/v1'+path,{method:method||'GET',
    headers:{'Content-Type':'application/json','Notion-Version':NV,'X-App-Key':CFG.key},body:body?JSON.stringify(body):undefined})
  .then(r=>r.json().catch(()=>({})).then(j=>{if(!r.ok){const e=new Error((j&&(j.message||j.error))||('Erreur '+r.status));e.status=r.status;throw e}return j}));
}
async function queryAll(db,body){let out=[],cur;do{const j=await nfetch('/databases/'+db+'/query','POST',Object.assign({page_size:100},body,cur?{start_cursor:cur}:{}));
  out=out.concat(j.results||[]);cur=j.has_more?j.next_cursor:null}while(cur);return out}

// Texte long → plusieurs morceaux (Notion limite chaque morceau à 2000 caractères)
const rtChunks=v=>{const t=String(v||''),o=[];for(let i=0;i<t.length&&o.length<100;i+=1900)o.push({type:'text',text:{content:t.slice(i,i+1900)}});return o};

    if(note)P['Note']={rich_text:[{text:{content:note.slice(0,1900)}}]};
    return (await nfetch('/pages','POST',{parent:{database_id:DB.interv},properties:P})).id},
  archive(id){return nfetch('/pages/'+id,'PATCH',{archived:true})},
  setNA(o,na){return nfetch('/pages/'+o.id,'PATCH',{properties:{'Étapes non applicables':{multi_select:na.map(name=>({name}))}}})},
  setBain(o,app,kid){return nfetch('/pages/'+o.id,'PATCH',{properties:{[BATH[app].prop]:{relation:kid?[{id:kid}]:[]}}})},
  // Bains KORE / lots KERA en cours (les terminés ne sont pas proposés)
  async bainLots(app){const B=BATH[app],res=await queryAll(DB[app],{sorts:[{property:'Date début',direction:'descending'}]});
    return res.map(pg=>({id:pg.id,int:pv(pg.properties[B.title]),ref:pv(pg.properties['Référence']),statut:pv(pg.properties['Statut']),kid:pv(pg.properties[B.nom+' ID'])}))
      .filter(l=>!/termin/i.test(l.statut||''))},

  async echeances(){const out=[];out.lus=0;out.err=[];

      (j.results||[]).forEach(pg=>{const P=pg.properties;out.lus++;if(/termin/i.test(pv(P['Statut'])||''))return;
        out.push({app,id:pg.id,ref:pv(P['Référence']),int:pv(P[B.title]),act:pv(P['Prochaine action']),due:pv(P['Échéance']),kid:pv(P[B.nom+' ID'])})})}catch(e){out.err.push(B.nom)}}
    return out},
  // Commentaires : bloc dépliant « 💬 Commentaires ARGOS CR » dans la page Notion du dossier (visible aussi dans Notion)
  async _comToggle(did){let cur;do{const j=await nfetch('/blocks/'+did+'/children?page_size=100'+(cur?'&start_cursor='+cur:''));
      const t=(j.results||[]).find(b=>b.type==='toggle'&&(b.toggle.rich_text||[]).map(x=>x.plain_text).join('').startsWith(COM_TITRE));if(t)return t.id;cur=j.has_more?j.next_cursor:null}while(cur);return null},
  async comments(did){const t=await this._comToggle(did);if(!t)return [];let out=[],cur;
    do{const j=await nfetch('/blocks/'+t+'/children?page_size=100'+(cur?'&start_cursor='+cur:''));
      (j.results||[]).filter(b=>b.type==='paragraph').forEach(b=>{const rt=b.paragraph.rich_text||[];if(!rt.length)return;
        const h=rt[0].annotations&&rt[0].annotations.bold?rt[0].plain_text:'';out.push({id:b.id,head:h.replace(/\s*—\s*$/,''),txt:rt.slice(h?1:0).map(x=>x.plain_text).join('')})});
      cur=j.has_more?j.next_cursor:null}while(cur);return out},
  async addComment(did,txt){const head=op()+' · '+fr(iso())+' '+new Date().toTimeString().slice(0,5);
    const para={object:'block',type:'paragraph',paragraph:{rich_text:[{type:'text',text:{content:head+' — '},annotations:{bold:true}},{type:'text',text:{content:txt.slice(0,1900)}}]}};
    const t=await this._comToggle(did);
    if(t)await nfetch('/blocks/'+t+'/children','PATCH',{children:[para]});
    else await nfetch('/blocks/'+did+'/children','PATCH',{children:[{object:'block',type:'toggle',toggle:{rich_text:[{type:'text',text:{content:COM_TITRE}}],children:[para]}}]});
    return {head,txt}},

// Bandeau des bains : une ligne, la liste s'ouvre au toucher ; rien quand il n'y a rien à faire
function bainsV(){
  const E=S.ech,t=iso(),lim=addJ(t,7);
  const info=m=>`<div class="bains" role="status"><span class="t">${m}</span></div>`;
  if(!E)return info('Bains : planning KORE / KERA inaccessible pour le moment.');
  const L=E.filter(x=>x.due&&x.due<=lim);
  if(!L.length){
    if(E.err&&E.err.length)return info(`Bains : planning ${E.err.join(' et ')} inaccessible (clé ou connexion).`);
    if(!E.lus)return info('Bains : pas encore de planning. Ouvrez KORE et KERA une fois pour l’afficher ici.');
    return info('Bains : rien à faire aujourd’hui ni dans les 7 jours.');}
  // un résumé par application (KORE / KERA), pour ne pas mélanger déchloruration et dessalement
  const resume=app=>{const A=L.filter(x=>x.app===app),auj=A.filter(x=>x.due<=t),ret=A.filter(x=>x.due<t),sem=A.filter(x=>x.due>t),parts=[];
    if((E.err||[]).includes(BATH[app].nom))return `<span class="ba ${app}"><span class="dot"></span><b class="n">${BATH[app].nom}</b><span>inaccessible</span></span>`;
    if(auj.length)parts.push(`<b>${auj.length}</b> aujourd’hui${ret.length?` (<span class="late">dont ${ret.length} en retard</span>)`:''}`);
    if(sem.length)parts.push(`<b>${sem.length}</b> dans les 7 jours`);
    return `<span class="ba ${app}"><span class="dot"></span><b class="n">${BATH[app].nom}</b><span>${parts.length?parts.join(' · '):'rien cette semaine'}</span></span>`};
  const quand=x=>{if(x.due<t){const n=Math.round((new Date(t)-new Date(x.due))/864e5);return `<span class="q late">en retard de ${n} j</span>`}
    if(x.due===t)return '<span class="q">aujourd’hui</span>';return `<span class="q">${fr(x.due)}</span>`};
  const lien=x=>(x.app==='kore'?URLS.kore:URLS.kera)+(x.kid?'?lot='+encodeURIComponent(x.kid):'');
  return `<button class="bains" data-a="bains" aria-expanded="${!!view.bains}"><span class="t">${resume('kore')}${resume('kera')}</span>
    <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  ${view.bains?`<div class="blist">${['kore','kera'].filter(a=>L.some(x=>x.app===a)).map(a=>`<div class="bh">${BATH[a].nom}</div>`+L.filter(x=>x.app===a).map(x=>`<a class="${x.app}" href="${lien(x)}" target="_blank" rel="noopener"><span class="dot"></span>
    <span class="m"><b>${esc(x.ref||x.int)}</b><span>${BATH[x.app].nom} · ${esc(x.act||'')}</span></span>${quand(x)}</a>`).join('')).join('')}</div>`:''}`;
}

function home(){
  const q=view.q.trim().toLowerCase();
  const list=S.dossiers.filter(d=>!q||[d.num,d.commune,d.site,d.ro].join(' ').toLowerCase().includes(q));
  const enc=list.filter(d=>d.etat!=='à faire'&&d.etat!=='Terminé'),todo=list.filter(d=>d.etat==='à faire');
  const TL=S.term?S.term.filter(d=>!q||[d.num,d.commune,d.site,d.ro].join(' ').toLowerCase().includes(q)):null;
  const nEnc=S.dossiers.filter(d=>d.etat!=='à faire').length,nTodo=S.dossiers.length-nEnc;
  return `${topInfo()}
  <div class="biglogo-w">${LOGO_PAYSAGE}</div>
  <div class="hello"><div><div class="label">Labo CR · ${esc(op())}</div><h1>Dossiers</h1></div>
    <div class="tally"><span><b>${nEnc}</b>en cours</span><span class="t2"><b>${nTodo}</b>à faire</span></div></div>
  ${aujV()}
  ${planningV()}
  <button class="big primary" data-a="scan">${ICON.scan}Scanner un objet</button>
  <label class="search">${ICON.search}<input id="q" type="search" placeholder="N° labo, commune, RO…" value="${esc(view.q)}" autocomplete="off"></label>
  <div class="sec"><h2>En cours</h2><span class="count">${nEnc}</span></div>
  <div class="dlist">${enc.length?enc.map(dcardT).join(''):`<p class="empty card">${q?'Aucun dossier en cours ne correspond.':'Aucun dossier « en cours » dans Notion.'}</p>`}</div>
  <div class="sec"><h2>À faire</h2><span class="count">${nTodo}</span></div>
  <div class="dlist">${todo.length?todo.map(dcardT).join(''):`<p class="empty card">${q?'Aucun dossier à faire ne correspond.':'Aucun dossier « à faire » dans Notion.'}</p>`}</div>
  <button class="sec sec-tog" data-a="termtog" aria-expanded="${!!view.term}"><h2>${view.term?'▾':'▸'} Terminés</h2><span class="count">${TL?TL.length:'…'}</span></button>
  ${view.term?`<div class="dlist">${TL===null?loadingV('Chargement des dossiers terminés…'):S.termErr?`<p class="empty card">Dossiers terminés inaccessibles : ${esc(S.termErr)}</p>`:TL.length?TL.map(dcard).join(''):`<p class="empty card">${q?'Aucun dossier terminé ne correspond.':'Aucun dossier « Terminé » dans Notion.'}</p>`}</div>`:''}
  <p class="foot"><button class="link" data-a="cfg">Paramètres</button>${S.mode==='demo'?' · <button class="link" data-a="reset">Remettre la démo à zéro</button>':''}</p>`;
}

function links(d){
  const t=(d.types||[]).join(' ').toLowerCase();
  const a=[`<a class="lk main" href="${URLS.rapport}?dossier=${hex(d.id)}" target="_blank" rel="noopener">${ICON.doc}<span><b>Rapport de traitement</b><small>${d.rapport?esc(d.rapport)+(d.dateRapport?' · '+fr(d.dateRapport):''):'pas encore commencé'}</small></span>${ICON.ext}</a>`];
  if(/déchlo|stabil|fer/.test(t))a.push(`<a class="lk kore" href="${koreUrl(d,[])}" target="_blank" rel="noopener"><span class="dot"></span>KORE${ICON.ext}</a>`);
  if(/dessal|céram/.test(t))a.push(`<a class="lk kera" href="${URLS.kera}" target="_blank" rel="noopener"><span class="dot"></span>KERA${ICON.ext}</a>`);
  if(/^https?:\/\//i.test(d.drive||''))a.push(`<a class="lk drive" href="${esc(d.drive)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Drive${ICON.ext}</a>`);
  if(S.objs.length&&S.d&&S.d.id===d.id)a.push(`<button class="lk lab" data-a="renphotos"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Renommer les photos</button>`);
  if(S.objs.length&&S.d&&S.d.id===d.id)a.push(`<button class="lk lab" data-a="labels"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><path d="M6 14h12v7H6z"/></svg>Étiquettes QR</button>`);

/* ---------- tâches ---------- */
// Une tâche = une étape à faire sur des objets d'un dossier, pour une personne, entre deux dates.
// Elle se termine seule quand l'étape est faite (ou non applicable) sur tous ses objets, quel que soit

const kEt=n=>(STEPS.find(s=>s.n===n)||{}).k;
const T_FICHES='Création des fiches';
const dossierDe=id=>(S.d&&hex(S.d.id)===hex(id)?S.d:null)||S.dossiers.find(x=>hex(x.id)===hex(id))||null;

async function chargerTaches(){

  S.taches=S.taches.filter(t=>!finis.includes(t));finis.forEach(t=>API().finirTache(t).catch(()=>{}))}
const dNum=id=>{const d=S.dossiers.find(x=>hex(x.id)===hex(id))||(S.d&&hex(S.d.id)===hex(id)?S.d:null);return d?d.num:''};
const lundi=iso0=>{const d=new Date(iso0+'T12:00:00'),j=(d.getDay()+6)%7;d.setDate(d.getDate()-j);return d.toISOString().slice(0,10)};
function tRetard(t){return t.ech&&t.ech<iso()}
const tAv=p=>p.fiches?(p.n?p.ok+'/'+p.n+' fiches':p.ok+' fiche'+(p.ok>1?'s':'')):p.ok+'/'+p.n+' objet'+(p.n>1?'s':'');

function planningV(){

const ordreT=(a,b)=>(a.etape===T_FICHES?0:1)-(b.etape===T_FICHES?0:1)||STEPS.findIndex(s=>s.n===a.etape)-STEPS.findIndex(s=>s.n===b.etape)||(a.ech||'9').localeCompare(b.ech||'9');

    busy=false;undo={ids,prev,k};

// L'état d'une étape se déduit du journal (comme les colonnes ①…⑧ de Notion) : terminé l'emporte, sinon en cours, sinon à faire.
function etatDepuisJournal(o,k){
  if(o.na.includes(sn(k)))return 'n/a';
  if(k==='st'){const a=bainOf(o);if(a)return 'en cours · '+BATH[a].nom}
  const L=S.journal.filter(l=>l.etape===sn(k));
  const fin=L.filter(l=>l.statut==='terminé').map(l=>l.date||'').sort().pop();
  if(fin!=null)return '✓ '+fr(fin);
  return L.some(l=>l.statut==='en cours')?'en cours':'';
}

  S.objs.forEach(o=>{const v=invOf(o);[o.inv,String(o.inv||'').replace(/\s+/g,''),v].forEach(k=>put(k,v));if(o.inv&&invSimple(o))put(label(o),v)});
  S.objs.forEach(o=>{const v=invOf(o),seq=o.idObj?o.idObj.slice(-3):'';[seq,o.idObj].forEach(k=>put(k,v))});
  const lignes=Object.keys(corr).map(k=>`$CORR['${q(k)}']='${q(corr[k])}'`).join('\n');
  const nomF='renommer_photos_'+(d.num||'dossier').replace(/[^\w\-]+/g,'_');
  if(os==='nix'){
    const py=$('#tpl-ren-py').textContent.replace("'%%AN%%'",JSON.stringify(an)).replace("'%%DOS%%'",JSON.stringify(dos)).replace('%%CORR%%',JSON.stringify(corr));
    const sh=['#!/usr/bin/env bash','# Renommage des photos — ARGOS CR (Emilie Winckel, Éveha). Lancer depuis le dossier du chantier : bash '+nomF+'.sh',

/* ---------- scanner : caméra + jsQR (ou BarcodeDetector) ---------- */
let cam=null,camRAF=0;
function stopCam(){cancelAnimationFrame(camRAF);if(cam){cam.getTracks().forEach(t=>t.stop());cam=null}}
function loadJsQR(){return window.jsQR?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
function onCode(txt){const m=String(txt).replace(/-/g,'').match(/[0-9a-f]{32}/i);
  if(!m)return toast('QR code non reconnu',0,1);closeSheet();
  const id=m[0];if(S.dossiers.some(d=>hex(d.id)===id.toLowerCase())&&!/objet/.test(txt))return openDossier(id);openObj(id)}
async function scan(){
  const inDossier=S.objs.length&&view.v!=='home';
  const l=sheet(`<div class="viewfinder" id="vf"><video id="cam" playsinline muted></video><span id="vfmsg">Visez l'étiquette QR de l'objet</span></div>
    ${inDossier?`<div class="label">Ou choisissez l'objet</div><div class="pick">${S.objs.map(o=>`<button data-pick="${o.id}">${esc(label(o))}</button>`).join('')}</div>`:''}
    <button class="link" data-a="close" style="align-self:center">Fermer</button>`);
  try{
    cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=l.querySelector('#cam');v.srcObject=cam;await v.play();l.querySelector('#vf').classList.add('on');
    const det='BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null;
    if(!det)await loadJsQR();
    const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
    const tick=async()=>{if(!cam)return;
      try{if(v.readyState>=2){
        if(det){const r=await det.detect(v);if(r[0])return onCode(r[0].rawValue)}
        else{c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r)return onCode(r.data)}}}catch(e){}
      camRAF=requestAnimationFrame(tick)};tick();
  }catch(e){const m=l.querySelector('#vfmsg');if(m)m.textContent='Caméra indisponible ici'+(inDossier?' : choisissez l’objet ci-dessous.':'.')}
}

// ============================================================
// ÉTIQUETTES : planche A4 prédécoupée 4 × 4 (52,5 × 74,25 mm), commune à KORE, KERA et ARGOS CR
// o = { titre, couleur, filet, cartes:[{tete, qr, nm, rf, dt}] }  →  { html, ouvrir(fenêtre) }
// La fenêtre ouverte permet de choisir la case de départ (planche déjà entamée).
// ============================================================
function planche16(o) {
  var C = o.couleur || '#2E3192', L = o.filet || '#E9EAF6';
  var e = function(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); };
  var cartes = (o.cartes || []).map(function(c) {
    // Chaque ligne du sous-texte (séparées par <br>) devient un bloc ajusté séparément à la largeur du cadre
    var dt = String(c.dt || '').split(/<br\s*\/?>/i).map(function(l) { return '<div>' + l + '</div>'; }).join('');
    return '<div class="card">' + c.tete + '<div class="zq">' + (c.qr ? '<img class="qr" src="' + c.qr + '" alt="QR">' : '') + '</div>' +
      '<div class="pied"><div class="sep"></div><div class="nm">' + e(c.nm) + '</div><div class="rf">' + e(c.rf) + '</div><div class="dt">' + dt + '</div></div></div>';
  });
  var css = '@page{size:A4;margin:0}*{box-sizing:border-box;margin:0;padding:0}html{-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    'body{font-family:Montserrat,Arial,sans-serif;background:#ECE9E4;color:#2C2C2A}' +
    '.bar{position:sticky;top:0;z-index:2;background:#fff;padding:10px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:12px}' +
    '.bar b{color:' + C + '}.pick{display:grid;grid-template-columns:repeat(4,20px);gap:3px}' +
    '.pick button{width:20px;height:27px;border:1px solid #ccc;background:#fff;border-radius:3px;font-size:9px;cursor:pointer;color:#666}' +
    '.pick button.u{background:#e3e3e3;color:#aaa}.pick button.s{background:' + C + ';border-color:' + C + ';color:#fff}' +
    '.go{padding:9px 22px;background:' + C + ';color:#fff;border:none;border-radius:8px;font:600 12px Montserrat,Arial,sans-serif;cursor:pointer}' +
    '.page{width:210mm;height:297mm;margin:14px auto;background:#fff;display:grid;grid-template-columns:repeat(4,52.5mm);grid-template-rows:repeat(4,74.25mm);box-shadow:0 2px 10px rgba(0,0,0,.15);overflow:hidden}' +
    '.cell{padding:2.5mm;display:flex;outline:1px dashed #ddd;outline-offset:-.5px}.cell.used{background:repeating-linear-gradient(135deg,#f3f3f3 0 4px,#fff 4px 8px)}' +
    '.card{flex:1;min-width:0;border:1px solid ' + C + ';border-radius:3mm;padding:2.6mm 2.2mm 2mm;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}' +
    '.zq{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}.pied{width:100%;flex:none}' +
    '.kt{font-size:16px;font-weight:700;letter-spacing:3.5px;color:' + C + ';line-height:1;margin-top:1mm}' +
    '.kh{display:flex;flex-direction:column;align-items:center;gap:1mm}.kh svg{width:12.5mm;height:12.5mm;display:block}' +
    '.kh b{font-size:7px;font-weight:700;letter-spacing:1.8px;color:' + C + ';line-height:1}.kh b span{color:#A8DDF0;font-size:.62em;letter-spacing:1px}' +
    '.qr{width:27mm;height:27mm;display:block;flex:none}.sep{height:1px;background:' + L + ';width:100%;margin:0 0 1.6mm}' +
    '.nm{font-size:8.5px;font-weight:600;line-height:1.25;margin-bottom:.8mm;max-height:7.4mm;overflow:hidden}' +
    '.rf{font-size:8px;font-weight:700;color:' + C + ';margin-bottom:.6mm;white-space:nowrap;overflow:hidden}.dt{color:#777;line-height:1.3}.dt div{font-size:6.8px;white-space:nowrap;overflow:hidden}' +
    '@media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none;break-after:page}.cell{outline:none}.cell.used{background:none}}';
  var doc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + e(o.titre || 'Étiquettes') + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"><style>' + css + '</style></head><body>' +
    '<div class="bar"><span>Case de départ<br><small>(planche entamée)</small></span><div class="pick" id="pick"></div><span id="info"></span>' +
    '<button class="go" id="go">🖨 Imprimer</button><small>Imprimer à 100 % (taille réelle), sans marges.</small></div><div id="pages"></div></body></html>';
  // La mise en page est pilotée depuis la fenêtre de l'app (pas de script dans la fenêtre d'impression)
  function monter(w, D) {
    var d = w.document, n = cartes.length, P = Math.max(1, Math.ceil((D + n) / 16)), h = '';
    for (var p = 0; p < P; p++) { h += '<div class="page">';
      for (var c = 0; c < 16; c++) { var i = p * 16 + c, k = i - D;
        h += i < D ? '<div class="cell used"></div>' : (k < n ? '<div class="cell">' + cartes[k] + '</div>' : '<div class="cell"></div>'); }
      h += '</div>'; }
    d.getElementById('pages').innerHTML = h;
    var q = ''; for (var j = 0; j < 16; j++) q += '<button class="' + (j < D ? 'u' : j === D ? 's' : '') + '" data-c="' + j + '">' + (j + 1) + '</button>';
    d.getElementById('pick').innerHTML = q;
    Array.prototype.forEach.call(d.querySelectorAll('#pick button'), function(b) { b.onclick = function() { monter(w, +b.getAttribute('data-c')); }; });
    d.getElementById('info').innerHTML = '<b>' + n + '</b> étiquette' + (n > 1 ? 's' : '') + ' · ' + P + ' planche' + (P > 1 ? 's' : '') + ' · départ case <b>' + (D + 1) + '</b>';
    d.getElementById('go').onclick = function() { w.focus(); w.print(); };
    // Réduit la police des textes qui débordent du cadre (police d'origine si ça tient)
    var ajuster = function() {
      Array.prototype.forEach.call(d.querySelectorAll('.nm,.rf,.dt div'), function(t) {
        t.style.fontSize = ''; var f = parseFloat(w.getComputedStyle(t).fontSize), min = 4.5;
        while (f > min && (t.scrollWidth > t.clientWidth + .5 || t.scrollHeight > t.clientHeight + .5)) { f -= .25; t.style.fontSize = f + 'px'; }
      });
    };
    ajuster(); if (d.fonts && d.fonts.ready) d.fonts.ready.then(ajuster);
  }
  return { html: doc, ouvrir: function(w) { w.document.open(); w.document.write(doc); w.document.close(); monter(w, 0); } };
}

// « Non applicable » pour plusieurs objets d'un coup (même effet que le bouton n/a d'un objet)
async function naLot(objs,k){
  const n=sn(k),prev=objs.map(o=>({o,na:[...o.na],s:o.steps[k]}));let done=0;
  objs.forEach(o=>{if(!o.na.includes(n))o.na=[...o.na,n];o.steps[k]='n/a'});render();
  try{for(const o of objs){if(objs.length>1){busy=`Enregistrement ${done+1} / ${objs.length}…`;render()}
      await API().setNA(o,o.na);done++;if(objs.length>1&&S.mode!=='demo')await sleep(340)}
    busy=false;undo={k,prev:prev.map(p=>({o:p.o,s:p.s})),restore:()=>prev.forEach(p=>p.o.na=p.na),naMulti:prev.map(p=>({o:p.o,na:p.na}))};
    toast(`« ${n} » non applicable pour ${objs.length} objet${objs.length>1?'s':''}`,true);render()}
  catch(e){busy=false;prev.slice(done).forEach(p=>{p.o.na=p.na;p.o.steps[k]=p.s});render();fail(e)}
}

// ID objet = partie numérique du N° labo + _001 à n (« 2026_10659_Gatteville-le-Phare » → « 2026_10659 »)
const baseId=num=>{const m=String(num||'').match(/^[0-9][0-9_.\-]*/);return m?m[0].replace(/[_.\-]+$/,''):String(num||'').trim()};
const MATS=['Fer','Alliages cuivreux','Argent','Plomb','Or','Verre','Céramique','Os','Tabletterie','Bois','Cuir','Textile','Lapidaire','Glyptique','Mosaïque','Enduit peint','Composite','Autre'];
function matNorm(t){return String(t||'').split(/[,+\/]| et /).map(x=>x.trim()).filter(Boolean).map(x=>{const l=x.toLowerCase();
  if(/cuivr|bronze|laiton|cu\b/.test(l))return 'Alliages cuivreux';if(/^fe\b|fer\b/.test(l))return 'Fer';if(/plomb|^pb$/.test(l))return 'Plomb';
  if(/c[ée]ram|terre cuite/.test(l))return 'Céramique';if(/verre/.test(l))return 'Verre';if(/^os$/.test(l))return 'Os';
  return MATS.find(m=>m.toLowerCase()===l)||x.charAt(0).toUpperCase()+x.slice(1)}).filter((v,i,a)=>a.indexOf(v)===i)}
// Liste collée : une ligne par objet, colonnes séparées par tabulation (Excel) ou « ; » : N° inventaire ; désignation ; matériau ; NR
function parseListe(t){return String(t||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
  const c=(l.includes('\t')?l.split('\t'):l.split(';')).map(x=>x.trim());
  const nr=c[3]&&!isNaN(parseFloat(c[3].replace(',','.')))?parseFloat(c[3].replace(',','.')):null;
  return {inv:c[0]||'',des:c[1]||'',mat:matNorm(c[2]),nr,_h:/d[ée]signation|mat[ée]riau|inventaire|^n°\s*inv/i.test(l)}}).filter((x,i)=>!(i===0&&x._h))}
function creerV(d,vide){const b=baseId(d.num),n=view.cMode==='liste'?parseListe(view.cListe).length:view.cMode==='lot'?(view.clotdes?Math.max(1,parseInt(view.clotn)||1):0):(parseInt(view.cNb)||0),deb=nextNum();

      <label class="fl">Désignation<input id="clotdes" class="ti" value="${esc(view.clotdes||'')}" placeholder="clous, tiges, tôles…"></label>

async function creerFiches(){

  else if(view.cMode==='lot'){const n=Math.max(1,parseInt(view.clotn)||1),des=String(view.clotdes||'').trim(),inv=String(view.clotinv||'').trim(),nr=parseInt(view.clotnr)||null;

  else{const n=parseInt(view.cNb)||0;items=Array.from({length:n},()=>({inv:'',des:'',mat:view.cMat?[view.cMat]:[],nr:null}))}

function koreUrl(d,objs){const q=new URLSearchParams({prefill:'1',ref:d.num||'',int:(d.commune||'')+(d.site?' - '+d.site:''),resp:d.ro||'',dd:iso()});
  if(d.op)q.set('op',d.op);const m=objs.reduce((a,o)=>a+(Number(o.masse)||0),0);if(m)q.set('poids',String(Math.round(m*10)/10));return URLS.kore+'?'+q}
// On note les bains / lots existants avant d'ouvrir KORE ou KERA : au retour, le nouveau est repéré et proposé pour les objets choisis
async function bainPending(objs,app){let known=[];try{known=(await lotsOf(app,true)).map(l=>hex(l.id))}catch(e){}
  LS.set('argoslab:korepending',{app,did:S.d.id,num:S.d.num,ids:objs.map(o=>o.id),known,t:Date.now()});
  if(S.mode==='demo')setTimeout(()=>{DEMO[app].unshift({id:'demo-'+app+Date.now(),int:S.d.commune+' - '+S.d.site,ref:S.d.num+(app==='kore'?' lot fer ':' céramiques ')+(DEMO[app].length+1),statut:'En cours',kid:'KDEMO'+Date.now()});dsave();checkBain()},1500)}
let bainChecking=false;
async function checkBain(){const p=LS.get('argoslab:korepending',null);
  if(!p||bainChecking||!S.d||S.d.id!==p.did||document.querySelector('.sheet'))return;
  if(Date.now()-p.t>8*3600e3){LS.set('argoslab:korepending',null);return}
  const app=p.app||'kore',B=BATH[app];let lots;
  bainChecking=true;try{lots=await lotsOf(app,true)}catch(e){bainChecking=false;return}bainChecking=false;
  const nw=lots.filter(l=>!p.known.includes(hex(l.id)));if(!nw.length)return;
  nw.sort((a,b)=>(String(b.ref+b.int).includes(p.num)?1:0)-(String(a.ref+a.int).includes(p.num)?1:0));
  const objs=S.objs.filter(o=>p.ids.includes(o.id));if(!objs.length)return;
  sheet(`<div class="sh-h"><small>Nouveau ${B.lot} dans ${B.nom}</small><b>Relier ${objs.length} objet${objs.length>1?'s':''} ?</b></div>
    <p class="hint">${objs.map(o=>esc(label(o))).join(', ')}</p>
    <div class="kb">${nw.slice(0,4).map((l,i)=>`<button class="${i?'':'on'}" data-klink="${l.id}" data-kapp="${app}">${esc(l.ref||l.int)}<small>${esc(l.int)}</small></button>`).join('')}</div>
    <div class="sh-act"><button class="big secondary" data-a="kplater">Plus tard</button><button class="big primary" data-klink="${nw[0].id}" data-kapp="${app}">${ICON.check}Relier</button></div>`);
}
async function linkBain(objs,kid,app){const B=BATH[app];
  const prev=objs.map(o=>({o,s:o.steps.st,k:o[app][0]||null})),ids=[];
  objs.forEach(o=>{o[app]=[kid];o.bainName=null;applyLocal(o,'st','en cours',app)});render();
  try{for(let i=0;i<objs.length;i++){if(objs.length>1){busy=`Liaison ${B.nom} ${i+1} / ${objs.length}…`;render()}
      await API().setBain(objs[i],app,kid);ids.push(await API().add(objs[i],'st','en cours',[B.proto]));if(S.mode!=='demo')await sleep(340)}
    busy=false;LS.set('argoslab:korepending',null);view.sel=new Set();
    undo={ids,k:'st',prev:prev.map(p=>({o:p.o,s:p.s})),multiBain:prev.map(p=>({o:p.o,app,prev:p.k}))};

  catch(e){busy=false;prev.slice(ids.length).forEach(p=>{p.o.steps.st=p.s;p.o[app]=p.k?[p.k]:[]});render();fail(e)}
}

/* ---------- étiquettes de sécurité pour le flaconnage (transvasement, solution) ---------- */
// Pictogrammes SGH/CLP : d'après le champ « Dangers » et les codes H de la fiche produit (mélange : union des composants).
const GHS_DANGER={'Explosif':'GHS01','Inflammable':'GHS02','Comburant':'GHS03','Gaz sous pression':'GHS04','Corrosif':'GHS05','Toxique':'GHS06','Nocif / irritant':'GHS07','CMR':'GHS08',"Dangereux pour l'environnement":'GHS09'};
const GHS_NOM={GHS01:'Explosif',GHS02:'Inflammable',GHS03:'Comburant',GHS04:'Gaz sous pression',GHS05:'Corrosif',GHS06:'Toxicité aiguë',GHS07:'Nocif, irritant',GHS08:'Danger pour la santé',GHS09:'Danger pour l’environnement'};
function ghsDeH(txt){const out=new Set(),codes=String(txt||'').match(/H\d{3}/g)||[];
  codes.forEach(c=>{const n=+c.slice(1);
    if(n>=200&&n<=205||n===240||n===241)out.add('GHS01');
    if(n>=220&&n<=242||n===250||n===251||n===252||n===260||n===261)out.add('GHS02');
    if(n>=270&&n<=272)out.add('GHS03');if(n===280||n===281)out.add('GHS04');
    if(n===290||n===314||n===318)out.add('GHS05');
    if([300,301,310,311,330,331].includes(n))out.add('GHS06');
    if([302,312,315,317,319,332,335,336].includes(n))out.add('GHS07');
    if([304,334,340,341,350,351,360,361,362,370,371,372,373].includes(n))out.add('GHS08');
    if([400,410,411].includes(n))out.add('GHS09')});
  return out}
function ghsDe(prods){const s=new Set();prods.forEach(p=>{(p.dang||[]).forEach(d=>GHS_DANGER[d]&&s.add(GHS_DANGER[d]));ghsDeH(p.h).forEach(g=>s.add(g))});
  if(s.has('GHS06'))s.delete('GHS07');                // règle de préséance CLP

/* ---------- PLANCHE COMMUNE (ARGOS CR, KORE, KERA) ----------

        '<div class="pied"><div class="sep"></div><div class="nm">' + e(c.nm) + '</div><div class="rf">' + e(c.rf) + '</div><div class="dt">' + dt + '</div></div></div>';

      '.bar b{color:#2E3192}.pick{display:grid;grid-template-columns:repeat(4,20px);gap:3px}' +

      '.page{width:210mm;height:297mm;margin:14px auto;background:#fff;display:grid;grid-template-columns:repeat(4,52.5mm);grid-template-rows:repeat(4,74.25mm);box-shadow:0 2px 10px rgba(0,0,0,.15);overflow:hidden}' +

      '.kh b{font-size:7px;font-weight:700;letter-spacing:1.8px;color:var(--c);line-height:1}.kh b span{color:#A8DDF0;font-size:.62em;letter-spacing:1px}' +

/* ---------- menu des outils (logo) ---------- */

/* ---------- démarrage ---------- */
(async function init(){
  const q=new URLSearchParams(location.search),obj=q.get('objet'),dos=q.get('dossier');
  let inside=false;try{inside=sessionStorage.getItem('argoslab:in')==='1'}catch(e){}
