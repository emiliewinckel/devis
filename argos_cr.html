<style>
/* Charte ARGOS CR : bandeau bleu foncé, accents bleu clair (les deux bleus de l’œil), fond gris-bleu, Montserrat (famille KORE / KERA / ARGOS).
   Mise en page : une colonne pensée pour la tablette ou le téléphone tenu d'une main, gros boutons. */
:root{
  /* Deux bleus seulement, ceux de l'œil : bleu foncé (#2E3192) et bleu clair de l'iris (#A8DDF0). Les teintes très claires ne servent qu'en fond. */
  --navy:#2E3192; --navy-d:#2E3192; --navy-l:#E9EAF6; --sky:#A8DDF0; --sky-l:#EAF6FB;
  --green:#3B6D11; --green-l:#EAF3DE; --amber:#BA7517; --amber-l:#FAEEDA;
  --bg:#F1F3F7; --card:#FFFFFF; --border:#E1E4EC; --txt:#2C2C2A; --txt2:#6B6966; --txt3:#9B9895;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font-family:var(--font)}
body{font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:101;background:var(--navy)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--navy);color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:720px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;min-width:0;flex:1}
.brand .logo{height:34px;width:auto;max-width:100%;display:block}
.brand .ico{display:none;height:36px;width:36px;background:#fff;border-radius:50%;padding:2px}
@media (max-width:360px){.brand .logo{display:none}.brand .ico{display:block}}
.brand b{font-size:20px;font-weight:800;letter-spacing:2.5px}
.brand span{font-size:11px;font-weight:500;opacity:.8;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:20px;padding:4px 6px 4px 10px}
.op label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;opacity:.8}
.op select{appearance:none;background:#fff;color:var(--navy-d);border:0;border-radius:14px;padding:5px 10px;font:600 12px var(--font)}

.wrap{max-width:720px;margin:0 auto;padding-block:16px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.demo{font-size:11px;color:var(--amber);background:var(--amber-l);border-radius:8px;padding:8px 12px;font-weight:500}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.label{font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--txt2)}

/* Dossier */
.dossier{display:flex;flex-direction:column;gap:10px}
.dossier h1{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.dossier .meta{color:var(--txt2);font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--navy-l);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:4px;transition:width .3s}
.stats{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums}
.stats b{color:var(--txt)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{border:0;border-radius:12px;padding:16px 12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px}
.big.primary{background:var(--navy);color:#fff}
.big.secondary{background:var(--card);color:var(--navy);border:1.5px solid var(--navy)}
.big svg{width:22px;height:22px;flex:none}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--card);border-radius:20px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--txt2);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip em{font-style:normal;opacity:.7;margin-left:4px}

.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--border);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:active{background:var(--navy-l)}
.oi{font-size:17px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.oi small{display:block;font-size:9px;font-weight:600;color:var(--txt3);letter-spacing:.6px}
.row .d{min-width:0}
.row .d b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d span{font-size:11px;color:var(--txt2)}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:11px;height:5px;border-radius:2px;background:var(--border)}
.dots i.done{background:var(--green)}
.dots i.na{background:repeating-linear-gradient(135deg,var(--border) 0 2px,transparent 2px 4px)}
.dots i.next{background:var(--sky)}
.next{font-size:11px;font-weight:700;color:var(--navy);background:var(--sky-l);border-radius:6px;padding:5px 8px;white-space:nowrap}
.next.ok{color:var(--green);background:var(--green-l)}

/* Fiche objet */
.back{align-self:flex-start;border:0;background:none;color:var(--navy);font-weight:600;font-size:13px;padding:4px 0;display:flex;align-items:center;gap:4px}
.obj-head{display:flex;gap:14px;align-items:flex-start}
.obj-head .num{font-size:34px;font-weight:800;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.obj-head .num small{display:block;font-size:10px;letter-spacing:1px;color:var(--txt3);font-weight:700;margin-bottom:2px}
.obj-head h2{margin:0 0 4px;font-size:17px;font-weight:700;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;font-weight:600;border-radius:5px;padding:3px 7px;background:var(--bg);color:var(--txt2)}
.tag.t{background:var(--navy-l);color:var(--navy-d)}

.go{width:100%;border:0;border-radius:14px;background:var(--sky);color:var(--navy);padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;box-shadow:0 3px 10px rgba(46,49,146,.16)}
.go small{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;opacity:.8;font-weight:600}
.go b{font-size:21px;font-weight:700}
.go .ck{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center;flex:none}
.go.done{background:var(--green);box-shadow:none}

.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{position:relative;border:1.5px solid var(--border);background:var(--card);border-radius:12px;padding:12px 12px 10px;text-align:left;min-height:76px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.step .n{font-size:10px;font-weight:700;color:var(--txt3);letter-spacing:.6px}
.step b{font-size:14px;font-weight:700}
.step .s{font-size:11px;color:var(--txt2);font-variant-numeric:tabular-nums}
.step.done{border-color:var(--green);background:var(--green-l)}
.step.done b,.step.done .n{color:var(--green)}
.step.na{background:repeating-linear-gradient(135deg,var(--bg) 0 6px,var(--card) 6px 12px);color:var(--txt3)}
.step.na b{color:var(--txt3);text-decoration:line-through;text-decoration-thickness:1px}
.step.cur{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-l)}
.na-btn{position:absolute;top:6px;right:6px;border:1px solid var(--border);background:var(--card);border-radius:6px;font-size:10px;font-weight:700;padding:3px 6px;color:var(--txt2)}
.step.na .na-btn{background:var(--txt2);color:#fff;border-color:var(--txt2)}

.note{display:flex;gap:8px}
.note textarea{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;padding:10px;font:13px var(--font);resize:vertical;min-height:44px;background:var(--card);color:var(--txt)}
.note button{border:0;border-radius:10px;background:var(--txt);color:#fff;font-weight:600;padding:0 14px}
.journal{display:flex;flex-direction:column;gap:0;font-size:12px}
.journal div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--border)}
.journal .del{border:1px solid var(--border);background:#fff;color:var(--txt2);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;padding:0}
.journal .del:hover{color:var(--navy);border-color:var(--navy)}
.journal div:first-child{border-top:0}
.journal time{color:var(--txt3);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--txt3);font-size:12px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav button{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:12px;font-weight:600;color:var(--txt2)}
.nav button:disabled{opacity:.4}

/* Mode lot */
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px 4px;font-size:11px;font-weight:700;color:var(--txt2);line-height:1.2}
.seg button em{display:block;font-style:normal;font-size:16px;color:var(--txt);margin-top:2px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg button[aria-pressed="true"] em{color:#fff}
.lot-row{display:grid;grid-template-columns:28px 52px minmax(0,1fr);gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--border);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.lot-row:first-child{border-top:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--border);display:grid;place-items:center}
.lot-row[aria-checked="true"] .box{background:var(--navy);border-color:var(--navy)}
.lot-row[aria-checked="true"] .box::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.lot-tools{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{border:0;background:none;color:var(--navy);font-weight:600;font-size:12px;padding:4px 0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(0,0,0,.06);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .big{width:100%;max-width:720px;margin:0 auto}
.big:disabled{opacity:.45}

/* Scan simulé */
.sheet{position:fixed;inset:0;z-index:200;background:rgba(44,44,42,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;
  padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.viewfinder{aspect-ratio:4/3;max-width:100%;border-radius:12px;background:#1d1b19;position:relative;display:grid;place-items:center;color:#fff;font-size:12px;opacity:.95}
.viewfinder::before{content:"";width:52%;aspect-ratio:1;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.viewfinder span{position:absolute;bottom:12px;left:0;right:0;text-align:center;opacity:.8}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pick button{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:10px 0;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:300;bottom:calc(96px + env(safe-area-inset-bottom,0px));
  background:var(--txt);color:#fff;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:14px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast button{border:0;background:none;color:var(--sky);font-weight:700;font-size:13px;white-space:nowrap}
.foot{text-align:center;font-size:11px;color:var(--txt3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:600px){.steps,.seg{grid-template-columns:repeat(5,1fr)}}

.dots i.run{background:var(--sky)}
.next.run{color:var(--navy);background:var(--sky)}
.step.run{border-color:var(--sky);background:var(--sky-l)}
.step.run b,.step.run .n{color:var(--navy)}
.tag.id{background:var(--navy);color:#fff;font-variant-numeric:tabular-nums}
.dossier-steps{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt2);border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
.dossier-steps b{color:var(--txt);font-weight:700;margin-left:4px}
.go.kore{background:var(--navy);box-shadow:none;align-items:center}
.go.kore b{font-size:18px}
.go.kore em{display:block;font-style:normal;font-size:12px;opacity:.85;margin-top:3px}
.go .ko{flex:none;background:#fff;color:var(--navy);border-radius:10px;padding:10px 12px;font-weight:700;font-size:13px;text-decoration:none}
.link.sim{align-self:center;font-size:12px}
.chips.cwrap{flex-wrap:wrap;overflow:visible}
.seg.two{grid-template-columns:1fr 1fr!important}
.sh-h small{display:block;font-size:11px;color:var(--txt2);font-weight:600;letter-spacing:.4px}
.sh-h b{font-size:20px;font-weight:800;color:var(--navy)}
.sh-act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sh-act .big:only-child{grid-column:1/-1}
.kbox{border:1.5px dashed var(--sky);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sky-l)}
.kbox b{display:block;font-size:13px}.kbox span{font-size:12px;color:var(--txt2)}
.kb{display:flex;flex-wrap:wrap;gap:6px}
.kb button{border:1px solid var(--sky);background:#fff;color:var(--navy);border-radius:8px;padding:8px 10px;font-weight:700;font-size:12px}

.op{border:0;color:#fff}.op small{font-size:10px;text-transform:uppercase;letter-spacing:.8px;opacity:.8}
.op span{background:#fff;color:var(--navy-d);border-radius:14px;padding:5px 10px;font:600 12px var(--font);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.biglogo-w{display:flex;justify-content:center;margin:6px 0 2px}.biglogo{width:min(360px,82%);height:auto;display:block}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.hello h1{margin:2px 0 0;font-size:22px;font-weight:800;color:var(--navy)}
.hello .count{font-size:28px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 12px;color:var(--txt3)}
.search input{flex:1;border:0;outline:0;background:none;font:500 14px var(--font);padding:12px 0;color:var(--txt);min-width:0}
.dlist{display:flex;flex-direction:column;gap:10px}
.dcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--sky);border-radius:12px;padding:14px 14px 14px 12px;width:100%}
.dcard:active{background:var(--navy-l)}
.dc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dc-top b{font-size:15px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.dc-t{font-size:15px;font-weight:600}
.dc-m{font-size:12px;color:var(--txt2)}.dc-m b{color:var(--txt)}
.dc-tags{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;background:var(--bg);color:var(--txt2)}
.pill.r-à-rédiger{background:var(--amber-l);color:var(--amber)}.pill.r-en-relecture{background:var(--navy-l);color:var(--navy)}.pill.r-envoyé{background:var(--green-l);color:var(--green)}.pill.r-rédigé{background:var(--sky-l);color:var(--navy)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lk{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--txt);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px}
.lk svg{flex:none}.lk.main{flex:1 1 100%;color:var(--navy)}.lk.main svg:first-child{width:26px;height:26px;color:var(--navy)}
.lk.main span{flex:1;display:flex;flex-direction:column}.lk.main small{font-weight:500;color:var(--txt2);font-size:11px}
.lk .dot{width:10px;height:10px;border-radius:50%}.lk.kore .dot{background:#8B3A2A}.lk.kera .dot{background:#7FC4E8}
.lk.kore,.lk.kera,.lk.lab{flex:1}.lk.lab{color:var(--navy);font-family:inherit;cursor:pointer;justify-content:center}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px 0;color:var(--txt2);font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--navy-l);border-top-color:var(--navy);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast.err{background:#7a1f1f}
.ta,.ti{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:500 14px var(--font);background:var(--bg);color:var(--txt);resize:vertical}
.fl{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--txt2)}
.fl .ti{text-transform:none;letter-spacing:0}
.hint{margin:0;font-size:12.5px;color:var(--txt2)}
.kb button{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.kb button small{font-weight:500;color:var(--txt2);font-size:10.5px}
.kb button.on{background:var(--sky);color:var(--navy)}.kb button[disabled]{opacity:.45}
.kb .newk{align-self:center;font-weight:700;font-size:12px;color:#8B3A2A;text-decoration:none;display:flex;align-items:center;gap:4px;padding:8px 4px}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;opacity:0}
.viewfinder.on video{opacity:1}.viewfinder span{z-index:1}
.viewfinder.on span{background:rgba(0,0,0,.45);color:#fff;padding:4px 10px;border-radius:12px}

body.locked{overflow:hidden}
.login{position:fixed;inset:0;z-index:500;overflow:auto;background:
  radial-gradient(120% 70% at 50% 0%,#fff 0%,var(--bg) 55%,var(--navy-l) 100%);
  display:flex;justify-content:center;padding:max(40px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));transition:opacity .3s,transform .3s}
.login.out{opacity:0;transform:scale(1.02)}
.lg-in{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:6px;margin:auto 0}
.lg-eye{width:min(46vw,200px);aspect-ratio:1;filter:drop-shadow(0 10px 24px rgba(46,49,146,.25));margin-bottom:14px;animation:lgin .6s ease-out}
.lg-eye svg{width:100%;height:100%;display:block}
@keyframes lgin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.lg-name{font-size:30px;font-weight:800;letter-spacing:3px;color:var(--navy)}
.lg-name span{font-weight:600;letter-spacing:.5px;color:var(--sky);font-size:18.5px}
.lg-sub{font-size:12.5px;color:var(--txt2);font-weight:500;margin-bottom:22px;text-align:center}
.lg-form{width:100%;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 6px 24px rgba(46,49,146,.08)}
.lg-ops{gap:6px}
.lg-ok{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--green);font-weight:600;background:var(--green-l);border-radius:10px;padding:9px 12px}
.lg-ok svg{width:16px;height:16px;flex:none}.lg-ok .link{font-size:12.5px}
.lg-err{margin:0;min-height:0;font-size:12.5px;color:#a3261f;font-weight:600}.lg-err:empty{display:none}
.lg-demo{align-self:center;margin-top:2px}
.lg-form .big[disabled]{opacity:.7}

body.compact .brand .logo{display:none}
body.compact .brand .ico{display:block;height:38px;width:38px}

.tally{display:flex;gap:16px;align-items:flex-end}
.tally span{display:flex;flex-direction:column;align-items:flex-end;font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--txt2);line-height:1.1}
.tally b{font-size:28px;font-weight:800;color:var(--navy);letter-spacing:0;font-variant-numeric:tabular-nums}
.tally .t2 b{background:var(--sky);border-radius:10px;padding:0 10px;margin-bottom:3px}
/* Bandeau des bains (KORE / KERA) : échéances écrites par les deux applications dans Notion */
div.bains{cursor:default}
.bains{width:100%;display:flex;align-items:center;gap:10px;background:var(--sky-l);border:1px solid var(--sky);border-radius:12px;padding:10px 14px;font:inherit;color:var(--navy);text-align:left;cursor:pointer}
.bains .t{flex:1;min-width:0;font-size:14px;line-height:1.35}.bains .t b{font-weight:800}.bains .late{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.bains .chev{flex:none;transition:transform .15s}.bains[aria-expanded="true"] .chev{transform:rotate(180deg)}
.blist{display:flex;flex-direction:column;gap:6px;margin-top:-4px}
.blist a{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--ink);box-shadow:0 1px 2px rgba(46,49,146,.08)}

/* ---------- lecture des propriétés Notion ---------- */
function pv(p){
  if(!p)return '';
  switch(p.type){
    case 'title':case 'rich_text':return (p[p.type]||[]).map(t=>t.plain_text).join('');
    case 'select':case 'status':return p[p.type]?p[p.type].name:'';
    case 'multi_select':return (p.multi_select||[]).map(s=>s.name);
    case 'number':return p.number;
    case 'date':return p.date?p.date.start:'';
    case 'relation':return (p.relation||[]).map(r=>r.id);
    case 'formula':{const f=p.formula||{};return f[f.type]==null?'':f[f.type]}
    case 'rollup':{const r=p.rollup||{};if(r.type==='array')return (r.array||[]).map(pv).flat().join(', ');return r[r.type]==null?'':r[r.type]}
    default:return '';
  }
}
function parseStep(s){
  s=String(s||'');
  if(!s)return {x:'todo'};
  if(s==='n/a')return {x:'na'};
  if(s.startsWith('✓'))return {x:'done',d:s.replace('✓','').trim()};
  if(s.includes('KORE'))return {x:'run',app:'kore'};
  if(s.includes('KERA'))return {x:'run',app:'kera'};
  if(s.includes('en cours'))return {x:'run'};
  return {x:'todo'};
}
function mapDossier(pg){const P=pg.properties;return {id:pg.id,num:pv(P['N° labo']),commune:pv(P['Commune']),site:pv(P['Site']),
  ro:pv(P['RO']),nb:pv(P['Nombre objets']),av:Number(pv(P['Avancement objets'])||0),fin:Number(pv(P['Objets terminés'])||0),
  rapport:pv(P['Rapport de traitement']),dateRapport:pv(P['Date rapport']),retour:pv(P['Date de retour']),arrivee:pv(P["Date d'arrivée au labo"]),
  types:pv(P["Type d'intervention"])||[],nObj:(pv(P['Objets'])||[]).length,op:pv(P['Type Opération']),etat:pv(P['Etat'])}}
function mapObjet(pg){const P=pg.properties,o={id:pg.id,nom:pv(P['Nom']),idObj:pv(P['ID objet']),inv:pv(P['N° inventaire']),
  d:pv(P['Description']),m:(pv(P['Matériau'])||[]).join(', '),nr:pv(P['NR']),t:pv(P["Description de l'intervention"]),
  na:pv(P['Étapes non applicables'])||[],kore:pv(P['Bain KORE'])||[],koreStat:pv(P['Statut KORE']),kera:pv(P['Lot KERA'])||[],keraStat:pv(P['Statut KERA']),masse:pv(P['Masse (g)']),dossier:(pv(P['Dossier'])||[])[0],steps:{}};
  STEPS.forEach(s=>o.steps[s.k]=pv(P[s.col]));return o}
function mapIv(pg){const P=pg.properties;return {id:pg.id,etape:pv(P['Étape']),statut:pv(P['Statut']),date:pv(P['Date']),
  op:pv(P['Opérateur']),proto:pv(P['Protocole']),note:pv(P['Note'])}}

/* ---------- accès Notion (proxy) ---------- */
let CFG=LS.get('argoslab:cfg',{proxy:DEF_PROXY,key:''});
function nfetch(path,method,body){
  return fetch(CFG.proxy.replace(/\/$/,'')+'/v1'+path,{method:method||'GET',
    headers:{'Content-Type':'application/json','Notion-Version':NV,'X-App-Key':CFG.key},body:body?JSON.stringify(body):undefined})
  .then(r=>r.json().catch(()=>({})).then(j=>{if(!r.ok){const e=new Error((j&&(j.message||j.error))||('Erreur '+r.status));e.status=r.status;throw e}return j}));
}
async function queryAll(db,body){let out=[],cur;do{const j=await nfetch('/databases/'+db+'/query','POST',Object.assign({page_size:100},body,cur?{start_cursor:cur}:{}));
  out=out.concat(j.results||[]);cur=j.has_more?j.next_cursor:null}while(cur);return out}

const Notion={
  async dossiers(){return (await queryAll(DB.dossiers,{filter:{or:[{property:'Etat',status:{equals:'en cours'}},{property:'Etat',status:{equals:'à faire'}}]},
    sorts:[{property:"Date d'arrivée au labo",direction:'descending'}]})).map(mapDossier)},
  async dossier(id){return mapDossier(await nfetch('/pages/'+id))},
  async objets(did){return (await queryAll(DB.objets,{filter:{property:'Dossier',relation:{contains:did}},
    sorts:[{property:'ID objet',direction:'ascending'},{timestamp:'created_time',direction:'ascending'}]})).map(mapObjet)},
  async objet(id){return mapObjet(await nfetch('/pages/'+id))},
  async journal(oid){const j=await nfetch('/databases/'+DB.interv+'/query','POST',{page_size:50,
    filter:{property:'Objet',relation:{contains:oid}},sorts:[{timestamp:'created_time',direction:'descending'}]});return (j.results||[]).map(mapIv)},
  async add(o,k,statut,proto,note){const P={
      'Intervention':{title:[{text:{content:(o.idObj||o.nom)+' · '+(k?sn(k):'Observation')}}]},
      'Objet':{relation:[{id:o.id}]},'Date':{date:{start:iso()}},'Opérateur':{select:{name:op()}}};
    if(k)P['Étape']={select:{name:sn(k)}};
    if(statut)P['Statut']={select:{name:statut}};
    if(proto&&proto.length)P['Protocole']={multi_select:[].concat(proto).map(name=>({name}))};
    if(note)P['Note']={rich_text:[{text:{content:note.slice(0,1900)}}]};
    return (await nfetch('/pages','POST',{parent:{database_id:DB.interv},properties:P})).id},
  archive(id){return nfetch('/pages/'+id,'PATCH',{archived:true})},
  setNA(o,na){return nfetch('/pages/'+o.id,'PATCH',{properties:{'Étapes non applicables':{multi_select:na.map(name=>({name}))}}})},
  setBain(o,app,kid){return nfetch('/pages/'+o.id,'PATCH',{properties:{[BATH[app].prop]:{relation:kid?[{id:kid}]:[]}}})},
  // Bains KORE / lots KERA en cours (les terminés ne sont pas proposés)
  async bainLots(app){const B=BATH[app],j=await nfetch('/databases/'+DB[app]+'/query','POST',{page_size:40,
    sorts:[{property:'Date début',direction:'descending'}]});
    return (j.results||[]).map(pg=>({id:pg.id,int:pv(pg.properties[B.title]),ref:pv(pg.properties['Référence']),statut:pv(pg.properties['Statut']),kid:pv(pg.properties[B.nom+' ID'])}))
      .filter(l=>!/termin/i.test(l.statut||''))},
  // Prochaines actions des bains KORE et des lots KERA (champs écrits par les deux applications)
  async echeances(){const out=[];out.lus=0;out.err=[];
    for(const app of APPS){const B=BATH[app];try{
      const j=await nfetch('/databases/'+DB[app]+'/query','POST',{page_size:100,filter:{property:'Prochaine action',rich_text:{is_not_empty:true}},sorts:[{property:'Échéance',direction:'ascending'}]});
      (j.results||[]).forEach(pg=>{const P=pg.properties;out.lus++;if(/termin/i.test(pv(P['Statut'])||''))return;
        out.push({app,id:pg.id,ref:pv(P['Référence']),int:pv(P[B.title]),act:pv(P['Prochaine action']),due:pv(P['Échéance']),kid:pv(P[B.nom+' ID'])})})}catch(e){out.err.push(B.nom)}}
    return out},
  setRetour(d,date){return nfetch('/pages/'+d.id,'PATCH',{properties:{'Date de retour':{date:date?{start:date}:null}}})},
  async creerObjet(d,x){const P={'Nom':{title:[{text:{content:x.id+(x.inv?' · '+x.inv:'')}}]},'ID objet':{rich_text:[{text:{content:x.id}}]},
      'Dossier':{relation:[{id:d.id}]}};
    if(x.inv)P['N° inventaire']={rich_text:[{text:{content:x.inv}}]};
    if(x.des)P['Description']={rich_text:[{text:{content:x.des.slice(0,1900)}}]};
    if(x.mat.length)P['Matériau']={multi_select:x.mat.map(name=>({name}))};
    if(x.nr!=null)P['NR']={number:x.nr};
    if(x.trait)P["Description de l'intervention"]={rich_text:[{text:{content:x.trait}}]};
    return mapObjet(await nfetch('/pages','POST',{parent:{database_id:DB.objets},properties:P}))}
};

function bainsV(){
  const E=S.ech,t=iso(),lim=addJ(t,7);
  const info=m=>`<div class="bains" role="status"><span class="t">${m}</span></div>`;
  if(!E)return info('Bains : planning KORE / KERA inaccessible pour le moment.');
  const L=E.filter(x=>x.due&&x.due<=lim);
  if(!L.length){
    if(E.err&&E.err.length)return info(`Bains : planning ${E.err.join(' et ')} inaccessible (clé ou connexion).`);
    if(!E.lus)return info('Bains : pas encore de planning. Ouvrez KORE et KERA une fois pour l’afficher ici.');
    return info('Bains : rien à faire aujourd’hui ni dans les 7 jours.');}
  const auj=L.filter(x=>x.due<=t),ret=L.filter(x=>x.due<t),sem=L.filter(x=>x.due>t);
  const parts=[];
  if(auj.length)parts.push(`<b>${auj.length}</b> aujourd’hui${ret.length?` (<span class="late">dont ${ret.length} en retard</span>)`:''}`);
  if(sem.length)parts.push(`<b>${sem.length}</b> dans les 7 jours`);
  const quand=x=>{if(x.due<t){const n=Math.round((new Date(t)-new Date(x.due))/864e5);return `<span class="q late">en retard de ${n} j</span>`}
    if(x.due===t)return '<span class="q">aujourd’hui</span>';return `<span class="q">${fr(x.due)}</span>`};
  const lien=x=>(x.app==='kore'?URLS.kore:URLS.kera)+(x.kid?'?lot='+encodeURIComponent(x.kid):'');
  return `<button class="bains" data-a="bains" aria-expanded="${!!view.bains}"><span class="t">Bains : ${parts.join(' · ')}</span>
    <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  ${view.bains?`<div class="blist">${L.map(x=>`<a class="${x.app}" href="${lien(x)}" target="_blank" rel="noopener"><span class="dot"></span>
    <span class="m"><b>${esc(x.ref||x.int)}</b><span>${BATH[x.app].nom} · ${esc(x.act||'')}</span></span>${quand(x)}</a>`).join('')}</div>`:''}`;
}

function home(){
  const q=view.q.trim().toLowerCase();
  const list=S.dossiers.filter(d=>!q||[d.num,d.commune,d.site,d.ro].join(' ').toLowerCase().includes(q));
  const enc=list.filter(d=>d.etat!=='à faire'),todo=list.filter(d=>d.etat==='à faire');
  const nEnc=S.dossiers.filter(d=>d.etat!=='à faire').length,nTodo=S.dossiers.length-nEnc;
  return `${topInfo()}
  <div class="biglogo-w">${LOGO_PAYSAGE}</div>
  <div class="hello"><div><div class="label">Labo CR · ${esc(op())}</div><h1>Dossiers</h1></div>
    <div class="tally"><span><b>${nEnc}</b>en cours</span><span class="t2"><b>${nTodo}</b>à faire</span></div></div>
  ${bainsV()}
  <button class="big primary" data-a="scan">${ICON.scan}Scanner un objet</button>
  <label class="search">${ICON.search}<input id="q" type="search" placeholder="N° labo, commune, RO…" value="${esc(view.q)}" autocomplete="off"></label>
  <div class="sec"><h2>En cours</h2><span class="count">${nEnc}</span></div>
  <div class="dlist">${enc.length?enc.map(dcard).join(''):`<p class="empty card">${q?'Aucun dossier en cours ne correspond.':'Aucun dossier « en cours » dans Notion.'}</p>`}</div>
  <div class="sec"><h2>À faire</h2><span class="count">${nTodo}</span></div>
  <div class="dlist">${todo.length?todo.map(dcard).join(''):`<p class="empty card">${q?'Aucun dossier à faire ne correspond.':'Aucun dossier « à faire » dans Notion.'}</p>`}</div>
  <p class="foot"><button class="link" data-a="cfg">Paramètres</button>${S.mode==='demo'?' · <button class="link" data-a="reset">Remettre la démo à zéro</button>':''}</p>`;
}

function links(d){
  const t=(d.types||[]).join(' ').toLowerCase();
  const a=[`<a class="lk main" href="${URLS.rapport}?dossier=${hex(d.id)}" target="_blank" rel="noopener">${ICON.doc}<span><b>Rapport de traitement</b><small>${d.rapport?esc(d.rapport)+(d.dateRapport?' · '+fr(d.dateRapport):''):'pas encore commencé'}</small></span>${ICON.ext}</a>`];
  if(/déchlo|stabil|fer/.test(t))a.push(`<a class="lk kore" href="${koreUrl(d,[])}" target="_blank" rel="noopener"><span class="dot"></span>KORE${ICON.ext}</a>`);
  if(/dessal|céram/.test(t))a.push(`<a class="lk kera" href="${URLS.kera}" target="_blank" rel="noopener"><span class="dot"></span>KERA${ICON.ext}</a>`);
  if(S.objs.length&&S.d&&S.d.id===d.id)a.push(`<button class="lk lab" data-a="labels"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><path d="M6 14h12v7H6z"/></svg>Étiquettes QR</button>`);
  return `<div class="links">${a.join('')}</div>`;
}

function dossierV(){
  const d=S.d,objs=S.objs;
  if(!objs.length)return `<button class="back" data-a="home">‹ Dossiers</button>${topInfo()}
    <section class="card dossier"><div class="label">Dossier</div><h1>${esc(d.commune)}${d.site?' · '+esc(d.site):''}</h1><div class="meta">${esc(d.num)}${d.ro?' · RO '+esc(d.ro):''}</div></section>
    ${links(d)}${creerV(d,true)}`;
  const tot=objs.reduce((a,o)=>a+progress(o),0)/objs.length,fin=objs.filter(o=>!next(o)).length;
  const counts={};objs.forEach(o=>{const n=next(o);const k=n?n.k:'fin';counts[k]=(counts[k]||0)+1});
  const list=objs.filter(o=>view.filter==='all'||(next(o)?next(o).k:'fin')===view.filter);
  return `<button class="back" data-a="home">‹ Dossiers</button>${topInfo()}
  <section class="card dossier">
    <div class="label">Dossier ${d.etat==='à faire'?'à faire':'en cours'}</div>
    <h1>${esc(d.commune)}${d.site?' · '+esc(d.site):''}</h1>
    <div class="meta">${esc(d.num)}${d.ro?' · RO '+esc(d.ro):''} · ${objs.length} objets</div>
    <div class="bar"><i style="width:${Math.round(tot*100)}%"></i></div>
    <div class="stats"><span><b>${Math.round(tot*100)} %</b> des étapes</span><span><b>${fin}</b> / ${objs.length} objets terminés</span></div>
    <div class="dossier-steps"><span>Retour <b>${d.retour?fr(d.retour):'—'}</b></span>
      ${fin===objs.length&&!d.retour?'<button class="link" data-a="retour">Marquer le retour aujourd’hui</button>':''}</div>
  </section>
  ${links(d)}
  <div class="actions">
    <button class="big primary" data-a="scan">${ICON.scan}Scanner</button>
    <button class="big secondary" data-a="lot">${ICON.lot}Mode lot</button>
  </div>
  <div class="chips" role="toolbar" aria-label="Filtrer par étape suivante">

/* ---------- écritures ---------- */
// Une validation = une ligne dans Interventions ; l'état affiché est mis à jour tout de suite,
// les colonnes ①…⑧ de Notion se recalculent de leur côté.
function applyLocal(o,k,statut,app){o.steps[k]=statut==='terminé'?'✓ '+fr(iso()):statut==='en cours'?(app?'en cours · '+BATH[app].nom:'en cours'):''}
// En mode lot, chaque objet ne reçoit que les protocoles de son matériau (pas de « Déchloruration (KORE) » sur un alliage cuivreux)
function protoPour(o,k,proto){if(!proto||!proto.length)return proto;const ok=protos(o,k);return ok.length?proto.filter(p=>ok.includes(p)):proto}
async function record(objs,k,statut,proto){
  const prev=objs.map(o=>({o,s:o.steps[k]})),ids=[];
  objs.forEach(o=>applyLocal(o,k,statut));render();
  try{for(let i=0;i<objs.length;i++){if(objs.length>1){busy=`Enregistrement ${i+1} / ${objs.length}…`;render()}
      ids.push(await API().add(objs[i],k,statut,protoPour(objs[i],k,proto)));if(objs.length>1&&S.mode!=='demo')await sleep(340)}
    busy=false;undo={ids,prev,k};
    toast(objs.length>1?`« ${sn(k)} » ${statut} pour ${objs.length} objets`:`${sn(k)} ${statut} · ${label(objs[0])}`,true);
    if(view.v==='obj'){S.journal=await API().journal(objs[0].id).catch(()=>S.journal)}render()}
  catch(e){busy=false;prev.slice(ids.length).forEach(p=>p.o.steps[k]=p.s);render();fail(e)}
}
async function doUndo(){if(!undo)return;const u=undo;undo=null;
  try{for(const id of (u.ids||[]))await API().archive(id);
    if(u.na)await API().setNA(u.na.o,u.na.prev);
    if(u.bain)await API().setBain(u.bain.o,u.bain.app,u.bain.prev||null);
    if(u.multiBain)for(const m of u.multiBain){await API().setBain(m.o,m.app,m.prev);m.o[m.app]=m.prev?[m.prev]:[]}
    if(u.naMulti)for(const m of u.naMulti){await API().setNA(m.o,m.na);if(S.mode!=='demo')await sleep(340)}}catch(e){return fail(e)}
  if(u.restore)u.restore();
  (u.prev||[]).forEach(p=>{p.o.steps[u.k]=p.s});
  if(view.v==='obj'&&cur())S.journal=await API().journal(cur().id).catch(()=>S.journal);
  render();toast('Action annulée')}

/* ---------- suppression d'une saisie du journal ---------- */
// L'état d'une étape se déduit du journal (comme les colonnes ①…⑧ de Notion) : terminé l'emporte, sinon en cours, sinon à faire.
function etatDepuisJournal(o,k){
  if(o.na.includes(sn(k)))return 'n/a';
  if(k==='st'){const a=bainOf(o);if(a)return 'en cours · '+BATH[a].nom}
  const L=S.journal.filter(l=>l.etape===sn(k));
  const fin=L.filter(l=>l.statut==='terminé').map(l=>l.date||'').sort().pop();
  if(fin!=null)return '✓ '+fr(fin);
  return L.some(l=>l.statut==='en cours')?'en cours':'';
}
function delSheet(id){
  const o=cur(),l=S.journal.find(x=>x.id===id);if(!o||!l)return;
  const app=l.etape==='Stabilisation'&&bainOf(o)&&(pj(l.proto)||'').includes(BATH[bainOf(o)].nom)?bainOf(o):null;
  sheet(`<div class="sh-h"><small>${esc(o.inv||'')}${o.idObj?' · '+esc(o.idObj):''}</small><b>Supprimer cette saisie ?</b></div>
    <p class="hint">${fr(l.date)} · ${l.etape?esc(l.etape)+' '+esc(l.statut||''):'Observation'}${pj(l.proto)?' · '+esc(pj(l.proto)):''}${l.note?' — '+esc(l.note):''} · ${esc(l.op||'')}</p>
    ${app?`<p class="hint">L’objet est aussi relié au ${BATH[app].lot} ${BATH[app].nom} : il en sera détaché.</p>`:''}
    <p class="hint">La saisie est retirée du journal (elle reste récupérable dans la corbeille de Notion) et l’étape est recalculée.</p>
    <div class="sh-act"><button class="big secondary" data-a="close">Garder</button><button class="big primary" data-delok="${id}" data-delapp="${app||''}">Supprimer</button></div>`)}
async function supprimerSaisie(id,app){
  const o=cur(),l=S.journal.find(x=>x.id===id);closeSheet();if(!o||!l)return;
  const k=(STEPS.find(s=>s.n===l.etape)||{}).k,prevJ=S.journal,prevS=k?o.steps[k]:null,prevB=app?o[app][0]:null;
  try{await API().archive(id);
    if(app){await API().setBain(o,app,null);o[app]=[];o.bainName=null}
    S.journal=S.journal.filter(x=>x.id!==id);if(k)o.steps[k]=etatDepuisJournal(o,k);
    if(S.mode==='demo')Demo._sync(o);
    render();toast('Saisie supprimée du journal')}
  catch(e){S.journal=prevJ;if(k)o.steps[k]=prevS;if(app)o[app]=prevB?[prevB]:[];render();fail(e)}}

function onCode(txt){const m=String(txt).replace(/-/g,'').match(/[0-9a-f]{32}/i);
  if(!m)return toast('QR code non reconnu',0,1);closeSheet();
  const id=m[0];if(S.dossiers.some(d=>hex(d.id)===id.toLowerCase())&&!/objet/.test(txt))return openDossier(id);openObj(id)}
async function scan(){
  const inDossier=S.objs.length&&view.v!=='home';
  const l=sheet(`<div class="viewfinder" id="vf"><video id="cam" playsinline muted></video><span id="vfmsg">Visez l'étiquette QR de l'objet</span></div>
    ${inDossier?`<div class="label">Ou choisissez l'objet</div><div class="pick">${S.objs.map(o=>`<button data-pick="${o.id}">${esc(label(o))}</button>`).join('')}</div>`:''}
    <button class="link" data-a="close" style="align-self:center">Fermer</button>`);
  try{
    cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=l.querySelector('#cam');v.srcObject=cam;await v.play();l.querySelector('#vf').classList.add('on');
    const det='BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null;
    if(!det)await loadJsQR();
    const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
    const tick=async()=>{if(!cam)return;
      try{if(v.readyState>=2){
        if(det){const r=await det.detect(v);if(r[0])return onCode(r[0].rawValue)}
        else{c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r)return onCode(r.data)}}}catch(e){}
      camRAF=requestAnimationFrame(tick)};tick();
  }catch(e){const m=l.querySelector('#vfmsg');if(m)m.textContent='Caméra indisponible ici'+(inDossier?' : choisissez l’objet ci-dessous.':'.')}
}

// ÉTIQUETTES : planche A4 prédécoupée 4 × 4 (52,5 × 74,25 mm), commune à KORE, KERA et ARGOS CR
// o = { titre, couleur, filet, cartes:[{tete, qr, nm, rf, dt}] }  →  { html, ouvrir(fenêtre) }
// La fenêtre ouverte permet de choisir la case de départ (planche déjà entamée).
// ============================================================
function planche16(o) {
  var C = o.couleur || '#2E3192', L = o.filet || '#E9EAF6';
  var e = function(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); };
  var cartes = (o.cartes || []).map(function(c) {
    // Chaque ligne du sous-texte (séparées par <br>) devient un bloc ajusté séparément à la largeur du cadre
    var dt = String(c.dt || '').split(/<br\s*\/?>/i).map(function(l) { return '<div>' + l + '</div>'; }).join('');
    return '<div class="card">' + c.tete + '<div class="zq">' + (c.qr ? '<img class="qr" src="' + c.qr + '" alt="QR">' : '') + '</div>' +
      '<div class="pied"><div class="sep"></div><div class="nm">' + e(c.nm) + '</div><div class="rf">' + e(c.rf) + '</div><div class="dt">' + dt + '</div></div></div>';
  });
  var css = '@page{size:A4;margin:0}*{box-sizing:border-box;margin:0;padding:0}html{-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    'body{font-family:Montserrat,Arial,sans-serif;background:#ECE9E4;color:#2C2C2A}' +
    '.bar{position:sticky;top:0;z-index:2;background:#fff;padding:10px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:12px}' +
    '.bar b{color:' + C + '}.pick{display:grid;grid-template-columns:repeat(4,20px);gap:3px}' +
    '.pick button{width:20px;height:27px;border:1px solid #ccc;background:#fff;border-radius:3px;font-size:9px;cursor:pointer;color:#666}' +
    '.pick button.u{background:#e3e3e3;color:#aaa}.pick button.s{background:' + C + ';border-color:' + C + ';color:#fff}' +
    '.go{padding:9px 22px;background:' + C + ';color:#fff;border:none;border-radius:8px;font:600 12px Montserrat,Arial,sans-serif;cursor:pointer}' +
    '.page{width:210mm;height:297mm;margin:14px auto;background:#fff;display:grid;grid-template-columns:repeat(4,52.5mm);grid-template-rows:repeat(4,74.25mm);box-shadow:0 2px 10px rgba(0,0,0,.15);overflow:hidden}' +
    '.cell{padding:2.5mm;display:flex;outline:1px dashed #ddd;outline-offset:-.5px}.cell.used{background:repeating-linear-gradient(135deg,#f3f3f3 0 4px,#fff 4px 8px)}' +
    '.card{flex:1;min-width:0;border:1px solid ' + C + ';border-radius:3mm;padding:2.6mm 2.2mm 2mm;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}' +
    '.zq{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}.pied{width:100%;flex:none}' +
    '.kt{font-size:16px;font-weight:700;letter-spacing:3.5px;color:' + C + ';line-height:1;margin-top:1mm}' +
    '.kh{display:flex;flex-direction:column;align-items:center;gap:1mm}.kh svg{width:12.5mm;height:12.5mm;display:block}' +
    '.kh b{font-size:7px;font-weight:700;letter-spacing:1.8px;color:' + C + ';line-height:1}.kh b span{color:#A8DDF0;font-size:.62em;letter-spacing:1px}' +
    '.qr{width:27mm;height:27mm;display:block;flex:none}.sep{height:1px;background:' + L + ';width:100%;margin:0 0 1.6mm}' +
    '.nm{font-size:8.5px;font-weight:600;line-height:1.25;margin-bottom:.8mm;max-height:7.4mm;overflow:hidden}' +
    '.rf{font-size:8px;font-weight:700;color:' + C + ';margin-bottom:.6mm;white-space:nowrap;overflow:hidden}.dt{color:#777;line-height:1.3}.dt div{font-size:6.8px;white-space:nowrap;overflow:hidden}' +
    '@media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none;break-after:page}.cell{outline:none}.cell.used{background:none}}';
  var doc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + e(o.titre || 'Étiquettes') + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"><style>' + css + '</style></head><body>' +
    '<div class="bar"><span>Case de départ<br><small>(planche entamée)</small></span><div class="pick" id="pick"></div><span id="info"></span>' +
    '<button class="go" id="go">🖨 Imprimer</button><small>Imprimer à 100 % (taille réelle), sans marges.</small></div><div id="pages"></div></body></html>';
  // La mise en page est pilotée depuis la fenêtre de l'app (pas de script dans la fenêtre d'impression)
  function monter(w, D) {
    var d = w.document, n = cartes.length, P = Math.max(1, Math.ceil((D + n) / 16)), h = '';
    for (var p = 0; p < P; p++) { h += '<div class="page">';
      for (var c = 0; c < 16; c++) { var i = p * 16 + c, k = i - D;
        h += i < D ? '<div class="cell used"></div>' : (k < n ? '<div class="cell">' + cartes[k] + '</div>' : '<div class="cell"></div>'); }
      h += '</div>'; }
    d.getElementById('pages').innerHTML = h;
    var q = ''; for (var j = 0; j < 16; j++) q += '<button class="' + (j < D ? 'u' : j === D ? 's' : '') + '" data-c="' + j + '">' + (j + 1) + '</button>';
    d.getElementById('pick').innerHTML = q;
    Array.prototype.forEach.call(d.querySelectorAll('#pick button'), function(b) { b.onclick = function() { monter(w, +b.getAttribute('data-c')); }; });
    d.getElementById('info').innerHTML = '<b>' + n + '</b> étiquette' + (n > 1 ? 's' : '') + ' · ' + P + ' planche' + (P > 1 ? 's' : '') + ' · départ case <b>' + (D + 1) + '</b>';
    d.getElementById('go').onclick = function() { w.focus(); w.print(); };
    // Réduit la police des textes qui débordent du cadre (police d'origine si ça tient)
    var ajuster = function() {
      Array.prototype.forEach.call(d.querySelectorAll('.nm,.rf,.dt div'), function(t) {
        t.style.fontSize = ''; var f = parseFloat(w.getComputedStyle(t).fontSize), min = 4.5;
        while (f > min && (t.scrollWidth > t.clientWidth + .5 || t.scrollHeight > t.clientHeight + .5)) { f -= .25; t.style.fontSize = f + 'px'; }
      });
    };
    ajuster(); if (d.fonts && d.fonts.ready) d.fonts.ready.then(ajuster);
  }
  return { html: doc, ouvrir: function(w) { w.document.open(); w.document.write(doc); w.document.close(); monter(w, 0); } };
}

let EYE_SVG='';

  s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}

    await sleep(30);const el=tmp.querySelector('canvas')||tmp.querySelector('img');
    cartes.push({tete:`<div class="kh">${EYE_SVG}<b>ARGOS <span>CR</span></b></div>`,qr:el?(el.tagName==='CANVAS'?el.toDataURL('image/png'):el.src):'',
      nm:(o.inv?o.inv+' — ':'')+(o.d||o.nom),rf:o.idObj||o.nom,dt:esc([d.commune,d.site].filter(Boolean).join(' · '))+(o.m?'<br>'+esc(o.m):'')})}
  tmp.remove();
  planche16({titre:'ARGOS CR — étiquettes '+d.num,couleur:'#2E3192',filet:'#E9EAF6',cartes}).ouvrir(w);
}



// « Non applicable » pour plusieurs objets d'un coup (même effet que le bouton n/a d'un objet)
async function naLot(objs,k){
  const n=sn(k),prev=objs.map(o=>({o,na:[...o.na],s:o.steps[k]}));let done=0;
  objs.forEach(o=>{if(!o.na.includes(n))o.na=[...o.na,n];o.steps[k]='n/a'});render();
  try{for(const o of objs){if(objs.length>1){busy=`Enregistrement ${done+1} / ${objs.length}…`;render()}
      await API().setNA(o,o.na);done++;if(objs.length>1&&S.mode!=='demo')await sleep(340)}
    busy=false;undo={k,prev:prev.map(p=>({o:p.o,s:p.s})),restore:()=>prev.forEach(p=>p.o.na=p.na),naMulti:prev.map(p=>({o:p.o,na:p.na}))};
    toast(`« ${n} » non applicable pour ${objs.length} objet${objs.length>1?'s':''}`,true);render()}
  catch(e){busy=false;prev.slice(done).forEach(p=>{p.o.na=p.na;p.o.steps[k]=p.s});render();fail(e)}
}

/* ---------- création des fiches objets ---------- */
// ID objet = partie numérique du N° labo + _001 à n (« 2026_10659_Gatteville-le-Phare » → « 2026_10659 »)
const baseId=num=>{const m=String(num||'').match(/^[0-9][0-9_.\-]*/);return m?m[0].replace(/[_.\-]+$/,''):String(num||'').trim()};
const MATS=['Fer','Alliages cuivreux','Argent','Plomb','Or','Verre','Céramique','Os','Tabletterie','Bois','Cuir','Textile','Lapidaire','Glyptique','Mosaïque','Enduit peint','Composite','Autre'];
function matNorm(t){return String(t||'').split(/[,+\/]| et /).map(x=>x.trim()).filter(Boolean).map(x=>{const l=x.toLowerCase();
  if(/cuivr|bronze|laiton|cu\b/.test(l))return 'Alliages cuivreux';if(/^fe\b|fer\b/.test(l))return 'Fer';if(/plomb|^pb$/.test(l))return 'Plomb';
  if(/c[ée]ram|terre cuite/.test(l))return 'Céramique';if(/verre/.test(l))return 'Verre';if(/^os$/.test(l))return 'Os';
  return MATS.find(m=>m.toLowerCase()===l)||x.charAt(0).toUpperCase()+x.slice(1)}).filter((v,i,a)=>a.indexOf(v)===i)}
// Liste collée : une ligne par objet, colonnes séparées par tabulation (Excel) ou « ; » : N° inventaire ; désignation ; matériau ; NR
function parseListe(t){return String(t||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
  const c=(l.includes('\t')?l.split('\t'):l.split(';')).map(x=>x.trim());
  const nr=c[3]&&!isNaN(parseFloat(c[3].replace(',','.')))?parseFloat(c[3].replace(',','.')):null;
  return {inv:c[0]||'',des:c[1]||'',mat:matNorm(c[2]),nr,_h:/d[ée]signation|mat[ée]riau|inventaire|^n°\s*inv/i.test(l)}}).filter((x,i)=>!(i===0&&x._h))}
function creerV(d,vide){const b=baseId(d.num),n=view.cMode==='liste'?parseListe(view.cListe).length:(parseInt(view.cNb)||0),deb=nextNum();
  return `<section class="card creer"><div class="label">${vide?'Créer les fiches objets':'Ajouter des objets'}</div>
    ${vide?'<p class="hint">Ce dossier n’a pas encore de fiches objets dans Notion. Créez-les ici, elles seront numérotées automatiquement.</p>':''}
    <div class="seg two"><button data-cm="nb" aria-pressed="${view.cMode!=='liste'}">Par nombre</button><button data-cm="liste" aria-pressed="${view.cMode==='liste'}">Coller une liste</button></div>
    ${view.cMode==='liste'?`<textarea id="cliste" class="ta" rows="7" placeholder="Une ligne par objet : N° inventaire ; désignation ; matériau ; NR&#10;Ex. : OI 12 ; fibule ; alliage cuivreux ; 1&#10;Un copier-coller depuis Excel (colonnes dans cet ordre) fonctionne aussi.">${esc(view.cListe||'')}</textarea>`
      :`<label class="fl">Nombre d'objets<input id="cnb" class="ti" type="number" min="1" max="500" inputmode="numeric" value="${esc(view.cNb||'')}"></label>
      <label class="fl">Matériau (facultatif, commun à tous)<select id="cmat" class="ti"><option value="">—</option>${MATS.map(m=>`<option ${view.cMat===m?'selected':''}>${m}</option>`).join('')}</select></label>`}
    <p class="hint">${n?`<b>${n}</b> fiche${n>1?'s':''} : <b>${esc(b)}_${String(deb).padStart(3,'0')}</b>${n>1?` à <b>${esc(b)}_${String(deb+n-1).padStart(3,'0')}</b>`:''}`:'Indiquez le nombre d’objets ou collez la liste.'}</p>
    <button class="big primary" data-a="creer" ${n&&!busy?'':'disabled'}>${ICON.check}${busy||`Créer ${n||''} fiche${n>1?'s':''} dans Notion`}</button></section>`}
function nextNum(){let m=0;S.objs.forEach(o=>{const x=String(o.idObj||'').match(/_(\d{3,})$/);if(x)m=Math.max(m,+x[1])});return m+1}
async function creerFiches(){
  const d=S.d,b=baseId(d.num);let items;
  if(view.cMode==='liste')items=parseListe(view.cListe);
  else{const n=parseInt(view.cNb)||0;items=Array.from({length:n},()=>({inv:'',des:'',mat:view.cMat?[view.cMat]:[],nr:null}))}
  if(!items.length)return;if(items.length>300)return toast('300 objets maximum à la fois',0,1);
  let k=nextNum(),ok=0;
  try{for(const x of items){busy=`Création ${ok+1} / ${items.length}…`;document.querySelector('.csheet')?rerenderCreer():render();
      x.id=b+'_'+String(k++).padStart(3,'0');S.objs.push(await API().creerObjet(d,x));ok++;if(S.mode!=='demo')await sleep(340)}
    busy=false;d.nObj=S.objs.length;view.cListe='';view.cNb='';closeSheet();
    toast(`${ok} fiche${ok>1?'s':''} objet créée${ok>1?'s':''} dans Notion`);render()}
  catch(e){busy=false;render();fail(e);if(ok)toast(`${ok} fiche${ok>1?'s':''} créée${ok>1?'s':''} avant l’erreur`,0,1)}
}

/* ---------- passage en bain KORE (fer) ou en lot KERA (céramique) ---------- */
const isFer=o=>/\bfer\b/i.test(o.m||'');
const isCeram=o=>/céram|terre cuite/i.test(o.m||'');
const BATH={
  kore:{nom:'KORE',prop:'Bain KORE',title:'Intitulé',proto:'Déchloruration (KORE)',test:o=>isFer(o),mat:'en fer',act:'Déchloruration',lot:'bain',
    nouveau:'Créer le bain dans KORE',fin:'le bain sera « Terminé » dans KORE'},
  kera:{nom:'KERA',prop:'Lot KERA',title:'Désignation',proto:'Dessalement (KERA)',test:o=>isCeram(o),mat:'en céramique',act:'Dessalement',lot:'lot',
    nouveau:'Créer le lot dans KERA',fin:'le dessalement sera terminé dans KERA (bouton « Terminer le dessalement »)'}};
const APPS=['kore','kera'];
const bathFor=o=>APPS.find(a=>BATH[a].test(o));
const bainOf=o=>APPS.find(a=>(o[a]||[]).length)||null;
function bainUrl(app,d,objs){return app==='kore'?koreUrl(d,objs):URLS.kera}
function bainOpen(o,app){if(app==='kore')return URLS.kore+'?prefill=1&notionId='+(o.kore[0]||'');
  const l=(S.lots.kera||[]).find(x=>hex(x.id)===hex(o.kera[0]));return URLS.kera+(l&&l.kid?'?lot='+encodeURIComponent(l.kid):'')}
// Fiche KORE pré-remplie : référence, intitulé, responsable, type d'opération, date, poids total des objets choisis
function koreUrl(d,objs){const q=new URLSearchParams({prefill:'1',ref:d.num||'',int:(d.commune||'')+(d.site?' - '+d.site:''),resp:d.ro||'',dd:iso()});
  if(d.op)q.set('op',d.op);const m=objs.reduce((a,o)=>a+(Number(o.masse)||0),0);if(m)q.set('poids',String(Math.round(m*10)/10));return URLS.kore+'?'+q}
// On note les bains / lots existants avant d'ouvrir KORE ou KERA : au retour, le nouveau est repéré et proposé pour les objets choisis
async function bainPending(objs,app){let known=[];try{known=(await lotsOf(app,true)).map(l=>hex(l.id))}catch(e){}
  LS.set('argoslab:korepending',{app,did:S.d.id,num:S.d.num,ids:objs.map(o=>o.id),known,t:Date.now()});
  if(S.mode==='demo')setTimeout(()=>{DEMO[app].unshift({id:'demo-'+app+Date.now(),int:S.d.commune+' - '+S.d.site,ref:S.d.num+(app==='kore'?' lot fer ':' céramiques ')+(DEMO[app].length+1),statut:'En cours',kid:'KDEMO'+Date.now()});dsave();checkBain()},1500)}
let bainChecking=false;
async function checkBain(){const p=LS.get('argoslab:korepending',null);
  if(!p||bainChecking||!S.d||S.d.id!==p.did||document.querySelector('.sheet'))return;
  if(Date.now()-p.t>8*3600e3){LS.set('argoslab:korepending',null);return}
  const app=p.app||'kore',B=BATH[app];let lots;
  bainChecking=true;try{lots=await lotsOf(app,true)}catch(e){bainChecking=false;return}bainChecking=false;
  const nw=lots.filter(l=>!p.known.includes(hex(l.id)));if(!nw.length)return;
  nw.sort((a,b)=>(String(b.ref+b.int).includes(p.num)?1:0)-(String(a.ref+a.int).includes(p.num)?1:0));
  const objs=S.objs.filter(o=>p.ids.includes(o.id));if(!objs.length)return;
  sheet(`<div class="sh-h"><small>Nouveau ${B.lot} dans ${B.nom}</small><b>Relier ${objs.length} objet${objs.length>1?'s':''} ?</b></div>
    <p class="hint">${objs.map(o=>esc(label(o))).join(', ')}</p>
    <div class="kb">${nw.slice(0,4).map((l,i)=>`<button class="${i?'':'on'}" data-klink="${l.id}" data-kapp="${app}">${esc(l.ref||l.int)}<small>${esc(l.int)}</small></button>`).join('')}</div>
    <div class="sh-act"><button class="big secondary" data-a="kplater">Plus tard</button><button class="big primary" data-klink="${nw[0].id}" data-kapp="${app}">${ICON.check}Relier</button></div>`);
}
async function linkBain(objs,kid,app){const B=BATH[app];
  const prev=objs.map(o=>({o,s:o.steps.st,k:o[app][0]||null})),ids=[];
  objs.forEach(o=>{o[app]=[kid];o.bainName=null;applyLocal(o,'st','en cours',app)});render();
  try{for(let i=0;i<objs.length;i++){if(objs.length>1){busy=`Liaison ${B.nom} ${i+1} / ${objs.length}…`;render()}
      await API().setBain(objs[i],app,kid);ids.push(await API().add(objs[i],'st','en cours',[B.proto]));if(S.mode!=='demo')await sleep(340)}
    busy=false;LS.set('argoslab:korepending',null);view.sel=new Set();
    undo={ids,k:'st',prev:prev.map(p=>({o:p.o,s:p.s})),multiBain:prev.map(p=>({o:p.o,app,prev:p.k}))};
    toast(`${objs.length} objet${objs.length>1?'s':''} relié${objs.length>1?'s':''} ${app==='kore'?'au bain KORE':'au lot KERA'}`,true);render()}
  catch(e){busy=false;prev.slice(ids.length).forEach(p=>{p.o.steps.st=p.s;p.o[app]=p.k?[p.k]:[]});render();fail(e)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(checkBain,600)});
window.addEventListener('focus',()=>setTimeout(checkBain,600));
document.addEventListener('click',e=>{const a=e.target.closest('a[data-kp]');if(!a)return;const o=S.objs.find(x=>x.id===a.dataset.kp);if(o){closeSheet();bainPending([o],a.dataset.kapp||'kore')}});

/* ---------- page d'accueil / connexion ---------- */
// Affichée à chaque ouverture (tablette partagée) : on choisit qui travaille, la clé n'est demandée qu'une fois par appareil.
function showLogin(){
  return new Promise(done=>{
    const ops=LS.get('argoslab:ops',[]),cur=LS.get('argoslab:op','');
    const ico=document.querySelector('.brand .ico').cloneNode(true);ico.removeAttribute('class');
    const el=document.createElement('div');el.className='login';el.id='login';
    el.innerHTML=`<div class="lg-in">
      <div class="lg-eye"></div>
      <div class="lg-name">ARGOS <span>CR</span></div>
      <div class="lg-sub">Suivi des traitements · Labo CR Éveha</div>
      <form class="lg-form" autocomplete="off">
        <div class="label">Qui travaille ?</div>
        ${ops.length?`<div class="chips cwrap lg-ops">${ops.map(n=>`<button type="button" class="chip" data-lop="${esc(n)}" aria-pressed="${n===cur}">${esc(n)}</button>`).join('')}</div>`:''}
        <input id="lg-op" class="ti" placeholder="${ops.length?'Autre : Prénom N.':'Prénom N.'}" value="${ops.includes(cur)?'':esc(cur)}">
        ${CFG.key?`<div class="lg-ok">${ICON.check}<span>Appareil autorisé · <button type="button" class="link" data-lg="key">changer la clé</button></span></div>
          <input id="lg-key" class="ti" hidden value="${esc(CFG.key)}">`
          :`<div class="label">Clé d'accès de l'appareil</div><input id="lg-key" class="ti" placeholder="KORE-XXXX-XXXX-XXXX-XXXX" autocapitalize="characters">
            <p class="hint">Même clé que pour KORE, à demander à la responsable du labo.</p>`}
        <p class="lg-err" id="lg-err" role="alert"></p>
        <button type="submit" class="big primary">Entrer</button>
        <button type="button" class="link lg-demo" data-lg="demo">Découvrir en mode démo</button>
      </form></div>`;
    el.querySelector('.lg-eye').appendChild(ico);
    document.body.appendChild(el);document.body.classList.add('locked');
    const sel=n=>{el.querySelectorAll('[data-lop]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.lop===n));el.querySelector('#lg-op').value=''};
    const finish=(mode,name)=>{if(name){const o=LS.get('argoslab:ops',[]);if(!o.includes(name)){o.push(name);LS.set('argoslab:ops',o)}LS.set('argoslab:op',name)}
      S.mode=mode;LS.set('argoslab:mode',mode);try{sessionStorage.setItem('argoslab:in','1')}catch(e){}
      el.classList.add('out');document.body.classList.remove('locked');setTimeout(()=>el.remove(),350);done()};
    const name=()=>el.querySelector('#lg-op').value.trim()||el.querySelector('[data-lop][aria-pressed="true"]')?.dataset.lop||'';
    el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.lop){sel(b.dataset.lop);return}
      if(b.dataset.lg==='key'){const k=el.querySelector('#lg-key');k.hidden=false;k.value='';k.placeholder='KORE-XXXX-XXXX-XXXX-XXXX';k.focus();b.closest('.lg-ok').remove();return}
      if(b.dataset.lg==='demo')finish('demo',name()||'Démo')});
    el.querySelector('#lg-op').addEventListener('input',()=>el.querySelectorAll('[data-lop]').forEach(c=>c.setAttribute('aria-pressed','false')));
    el.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();
      const n=name(),k=el.querySelector('#lg-key').value.trim(),err=el.querySelector('#lg-err');
      if(!n){err.textContent='Indiquez votre nom : il est enregistré avec chaque intervention.';return}
      if(!k){err.textContent='Saisissez la clé d’accès, ou découvrez l’app en mode démo.';return}
      const btn=el.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Connexion…';err.textContent='';
      const prev=CFG;CFG={proxy:CFG.proxy||DEF_PROXY,key:k};
      try{await nfetch('/databases/'+DB.dossiers+'/query','POST',{page_size:1});LS.set('argoslab:cfg',CFG);finish('notion',n)}
      catch(x){CFG=prev;btn.disabled=false;btn.textContent='Entrer';
        err.textContent=x.status===401||x.status===403?'Clé refusée par le serveur.':'Connexion impossible : '+(x.message||x)}});
  });
}

function rerenderCreer(){const sh=document.querySelector('.sheet.csheet .sheet-in');
  if(sh){sh.innerHTML=creerV(S.d,false)+'<button class="link" data-a="close" style="align-self:center">Fermer</button>'}else render();
  const t=document.getElementById(view.cFocus||'');if(t){t.focus();if(t.setSelectionRange&&t.type!=='number'){const n=t.value.length;t.setSelectionRange(n,n)}}}
document.addEventListener('input',e=>{const t=e.target;if(!t.closest('.creer'))return;
  if(t.id==='cliste')view.cListe=t.value;if(t.id==='cnb')view.cNb=t.value;view.cFocus=t.id;
  clearTimeout(window._ct);window._ct=setTimeout(()=>{const p=t.selectionStart;rerenderCreer();const n=document.getElementById(t.id);if(n&&p!=null&&n.setSelectionRange&&n.type!=='number')n.setSelectionRange(p,p)},350)});
document.addEventListener('change',e=>{if(e.target.id==='cmat'){view.cMat=e.target.value}});

/* ---------- démarrage ---------- */
(async function init(){
  const q=new URLSearchParams(location.search),obj=q.get('objet'),dos=q.get('dossier');
  let inside=false;try{inside=sessionStorage.getItem('argoslab:in')==='1'}catch(e){}
  if(!inside||!LS.get('argoslab:op',''))await showLogin();
  else S.mode=CFG.key&&LS.get('argoslab:mode','')!=='demo'?'notion':'demo';
  await loadHome();
  if(obj)openObj(obj);else if(dos)openDossier(dos);
})();
</script>
