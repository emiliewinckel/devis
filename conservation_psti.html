/* Charte : celle du module de rapports de traitement (olive Éveha) */
:root{--olive:#79874C;--olive-d:#5A6636;--olive-dd:#3F4826;--olive-l:#EEF0E3;--olive-ll:#F6F7F0;--ink:#2B2D26;--muted:#6E7063;--faint:#9A9C8E;
  --line:#E1E2D7;--bg:#F4F3EC;--card:#fff;--warn:#B4651E;--warn-l:#FBF1E6;--err:#A33A2D;--err-l:#F8E7E4;--r:10px;
  --shadow:0 1px 2px rgba(40,44,30,.06),0 4px 16px rgba(40,44,30,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Titillium Web',Arial,sans-serif}
header{background:var(--olive-dd);color:#fff;padding:14px 16px}
header .in{max-width:1120px;margin:0 auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header b{font-size:20px;letter-spacing:.3px}header span{opacity:.8;font-size:13px}
main{max-width:1120px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 4px;color:var(--olive-dd)}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--olive);outline-offset:-1px;border-color:var(--olive)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
.tw{overflow-x:auto;margin:0 -4px}
table.mob{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.mob th{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line);line-height:1.2}
table.mob th:first-child{text-align:left}
table.mob th small{display:block;font-weight:400;color:var(--faint)}
table.mob td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.mob td.m b{display:block;font-size:14px}table.mob td.m small{color:var(--faint);font-size:12px;line-height:1.25;display:block}
table.mob input{width:100%;min-width:52px;padding:6px 6px;text-align:center}
table.mob td.one{text-align:left}
details.cls{margin:10px 0 0;font-size:13px;color:var(--muted)}details.cls summary{cursor:pointer;font-weight:600;color:var(--olive-d)}
details.cls ul{margin:6px 0 0;padding-left:18px}
.res{position:sticky;top:12px}
.big{font-size:40px;font-weight:700;color:var(--olive-dd);line-height:1}
.big small{font-size:16px;font-weight:600;color:var(--muted)}
.lines{margin:12px 0 0;padding:0;list-style:none;font-size:14px}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.lines li b{white-space:nowrap}.lines li.opt{color:var(--muted)}
.al{background:var(--warn-l);color:#7a4310;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px}
.al.err{background:var(--err-l);color:var(--err)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--olive-d);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--olive-dd);border:1px solid var(--line);font-size:14px;padding:9px;margin-top:8px}
.paste{font-size:13px;background:var(--olive-ll);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}
.foot{font-size:12px;color:var(--faint);text-align:center;margin:8px 0 24px}
.adm textarea{min-height:110px;font-size:13px}.adm textarea[data-t="moyens"]{min-height:320px}
.adm table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}.adm td{padding:3px 4px;border-bottom:1px solid var(--olive-ll)}
.adm .ko{color:var(--err);font-weight:700}

var TEXTES = {
  "signataire": "Pôle Conservation-Restauration, Éveha",
  "moyens": "Les interventions seront conduites au sein du laboratoire de restauration d'Éveha, situé au 29 rue des Métiers, 14123 Cormelles-le-Royal.\n\nLe laboratoire est placé sous la responsabilité d'Emilie Winckel, conservatrice-restauratrice diplômée du master Conservation-restauration des biens culturels de l'université Paris 1 Panthéon-Sorbonne et habilitée à intervenir sur les collections des musées de France.\n\n## Équipements disponibles\n\nLe laboratoire principal, d'une superficie de 32 m², est organisé en plusieurs zones fonctionnelles. Une première partie est dédiée au traitement de tous les matériaux à l'exception des ferreux. Elle accueille deux loupes binoculaires, un stéréomicroscope Zeiss relié à une caméra, ainsi qu'un studio photo portatif permettant la réalisation des prises de vue dans des conditions optimales. Cette zone est également équipée d'une hotte aspirante (Chemfast) pour la réalisation des traitements chimiques - nettoyage, consolidation, collage, protection -, d'une cuve à ultrasons, d'une cloche à vide d'air, d'un conductimètre, ainsi que de rangements en armoires fermées à clé. Les appareils photographiques, ordinateurs, mobilier adapté et armoire à solvants complètent l'équipement de cet espace.\n\nUne pièce insonorisée d'environ 10 m² est exclusivement dévolue au traitement des objets en fer. Elle contient deux micro-sableuses avec leurs enceintes de sablage de tailles différentes, reliées à un compresseur et à un système d'aspiration, ainsi que des micro-tours équipés de différentes têtes diamantées.\n\nUn espace annexe abrite le laboratoire dédié à la stabilisation des objets métalliques, comprenant des cuves pour les bains de déchloruration des ferreux. Le nettoyage électrochimique y est également réalisé. Une étuve permet le séchage des objets après traitement, tandis que deux réfrigérateurs assurent le stockage des pièces humides ou gorgées d'eau et permettent la mise en œuvre de traitements de désinfection.\n\nLe bâtiment abrite par ailleurs une zone de stockage pour le mobilier archéologique issu des fouilles Éveha (notamment les pièces hors format), un atelier de menuiserie et de logistique, ainsi que des espaces communs.\n\n## Sécurité des objets et des personnes\n\nLa conservation préventive des mobiliers métalliques est assurée dans un local dédié au stockage long terme, climatisé et régulé en température (19 °C) et en humidité relative (< 40 %), dont le suivi continu est assuré par thermo-hygromètre. Ce local, fermé à clé et réservé exclusivement au stockage des collections métalliques, accueille les objets après traitement dans l'attente de leur versement aux services régionaux d'archéologie ou aux musées. Un coffre-fort permet par ailleurs la mise en sécurité des pièces à caractère exceptionnel.\n\nL'ensemble des locaux est sécurisé par un système anti-effraction avec alarme, placé sous surveillance par contrat avec la société Sécuritas (certifiée ISO 9001). Les biens sont assurés et des extincteurs opérationnels et conformes sont présents dans l'ensemble des espaces de travail.\n\n## Gestion des produits chimiques et des déchets\n\nLes produits chimiques sont stockés en armoires de sécurité, classés selon leurs compatibilités et accompagnés d'un inventaire rigoureux. Chaque contenant est étiqueté avec le nom du produit, sa concentration, le fournisseur ainsi que les mentions de risque et de sécurité. Un classeur récapitulatif, disponible dans la zone d'activité, recense l'ensemble des produits présents.\n\nLes équipements de protection individuelle (EPI) adaptés aux produits manipulés sont systématiquement utilisés : lunettes de protection, masques filtrants P2 et P3, masques à cartouches pour solvants, gants en latex et en nitrile de différentes tailles, blouses et tabliers en coton 100 %.\n\nL'évacuation des déchets suit une procédure stricte : les solvants usagés sont collectés dans des bacs fermés à l'aide d'un entonnoir, puis acheminés en déchetterie ; les lames de scalpel usées sont placées dans des conteneurs spécifiques et déposées en pharmacie.",

function repartirQuota() {
  var cells = [], N = 0;
  MATS.forEach(function(m) { if (!m.appro) return; (m.cls ? C4 : [null]).forEach(function(c) { var n = c ? qte(m.k, c) : qte(m.k); if (n) { cells.push({key: m.k + (c || ''), n: n}); N += n; } }); });
