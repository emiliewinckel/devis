<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volet conservation PSTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Charte : celle du module de rapports de traitement (olive Éveha) */
:root{--olive:#79874C;--olive-d:#5A6636;--olive-dd:#3F4826;--olive-l:#EEF0E3;--olive-ll:#F6F7F0;--ink:#2B2D26;--muted:#6E7063;--faint:#9A9C8E;
  --line:#E1E2D7;--bg:#F4F3EC;--card:#fff;--warn:#B4651E;--warn-l:#FBF1E6;--err:#A33A2D;--ok:#4E7A2E;--r:10px;
  --shadow:0 1px 2px rgba(40,44,30,.06),0 4px 16px rgba(40,44,30,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Titillium Web',Arial,sans-serif}
header{background:var(--olive-dd);color:#fff;padding:14px 16px}
header .in{max-width:1080px;margin:0 auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header b{font-size:20px;letter-spacing:.3px}header span{opacity:.8;font-size:13px}
main{max-width:1080px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 4px;color:var(--olive-dd)}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--olive);outline-offset:-1px;border-color:var(--olive)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
table.mob{width:100%;border-collapse:collapse;font-size:14px}
table.mob th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
table.mob td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.mob td.m b{display:block}table.mob td.m small{color:var(--faint);font-size:12px;line-height:1.25;display:block}
table.mob input[type=number]{width:96px}
table.mob td.c{text-align:center;white-space:nowrap}
table.mob input[type=checkbox]{width:18px;height:18px;accent-color:var(--olive)}
@media(max-width:560px){table.mob td.m small{display:none}table.mob input[type=number]{width:74px}}
.res{position:sticky;top:12px}
.big{font-size:40px;font-weight:700;color:var(--olive-dd);line-height:1}
.big small{font-size:16px;font-weight:600;color:var(--muted)}
.lines{margin:12px 0 0;padding:0;list-style:none;font-size:14px}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.lines li b{white-space:nowrap}
.lines li.opt{color:var(--muted)}
.al{background:var(--warn-l);color:#7a4310;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--olive-d);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--olive-dd);border:1px solid var(--line);font-size:14px;padding:9px}
.paste{font-size:13px;background:var(--olive-ll);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}
.foot{font-size:12px;color:var(--faint);text-align:center;margin:8px 0 24px}
.adm h3{font-size:14px;margin:14px 0 6px;color:var(--olive-d)}
.adm .row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center;font-size:13px;padding:3px 0;border-bottom:1px solid var(--olive-ll)}
.adm .row.k4{grid-template-columns:minmax(0,1fr) repeat(4,64px)}
.adm .row input{padding:4px 6px}
.adm textarea{min-height:110px;font-size:13px}
.flag{color:var(--warn);font-weight:700}
</style>
</head>
<body>
<header><div class="in"><b>Volet conservation-restauration du PSTI</b><span>Pôle Conservation-Restauration · Éveha</span></div></header>
<main>
  <div id="form"></div>
  <aside class="res"><div class="card" id="res"></div></aside>
</main>
<p class="foot" id="foot"></p>

<script>
/* =====================================================================
   PARAMÈTRES DU LABORATOIRE — réglés par la responsable du pôle C-R
   (page ?admin). Ne pas modifier à la main : utiliser l'écran Paramètres,
   qui régénère ce bloc. Les valeurs marquées « à valider » ne viennent pas
   encore du suivi des temps du laboratoire.
   ===================================================================== */
/*PARAMS-DEBUT*/
var PARAMS = {
  "version": "2026-11-04",
  "responsable": "Émilie Winckel, responsable du pôle Conservation-Restauration",
  "jh": 7,
  "fer": {
    "mix": {"S": 0.4, "M": 0.35, "L": 0.2, "XL": 0.05},
    "sediment": {"S": 5, "M": 10, "L": 20, "XL": 30},
    "surface": {"S": 30, "M": 45, "L": 120, "XL": 240},
    "consolidation": {"S": 15, "M": 20, "L": 30, "XL": 60},
    "postbain": {"S": 5, "M": 5, "L": 10, "XL": 15},
    "fiche": {"S": 15, "M": 15, "L": 30, "XL": 60},
    "poids": {"S": 15, "M": 80, "L": 250, "XL": 400},
    "clicheEuros": 40,
    "objetsParCliche": {"S": 20, "M": 5, "L": 3, "XL": 0.5}
  },
  "quotaSurface": 0.10,
  "partConsolidation": 0.10,
  "radioMinObjet": 3,
  "clousMinReste": 1,
  "coef": {"cu": 0.8, "monnaies": 0.6, "plomb": 0.5, "precieux": 0.8, "verre": 1.0, "ceram": 1.0, "os": 0.8, "parure": 0.8},
  "stab": {
    "ferHeuresBoite": 6, "ferObjetsBoite": 30, "ferLitresKg": 10, "ferEurosLitre": 1, "ferDureeMois": 6,
    "cuMinObjet": 10, "cuDureeMois": 1,
    "ceramMinObjet": 20, "ceramDureeMois": 3
  },
  "motteMin": 60,
  "ficheLotMin": 30,
  "coordBase": 0.5, "coordPalier": 30, "coordAjout": 0.5,
  "seuilObjets": 50,
  "contextes": {"Rural / habitat": 0, "Urbain": 0.15, "Funéraire": 0.25, "Subaquatique / milieu humide": 0.20},
  "aValider": ["quotaSurface", "partConsolidation", "radioMinObjet", "clousMinReste", "coef", "ferObjetsBoite", "cuMinObjet", "ceramMinObjet", "ceramDureeMois", "cuDureeMois", "motteMin"],
  "textes": {
    "moyens": "Le laboratoire de conservation-restauration de l'agence Éveha de Caen assure la prise en charge du mobilier de la sortie de fouille à la remise pour étude. Il dispose notamment : d'un caisson de micro-sablage équipé d'un stéréomicroscope ; de loupes binoculaires et de micro-outillage (scalpels, micro-tour, outils en bois et en polyéthylène) ; de bains de stabilisation en boîtes hermétiques adaptées au volume des objets, suivis par titrage des chlorures (déchloruration des métaux ferreux) ou par mesure de conductivité (dessalement des céramiques) ; d'enceintes semi-closes pour les séchages lents ; et du matériel de conditionnement de conservation (boîtes hermétiques, gel de silice, mousses Plastazote®, Tyvek®). La radiographie X est réalisée en interne ou par un prestataire selon le format des objets.",
    "tracabilite": "Chaque objet est suivi individuellement, de son arrivée au laboratoire à sa remise : inventaire, étiquetage indirect imputrescible avec QR code, journal des interventions (protocoles, produits, dates, opérateurs) et suivi des bains. L'inventaire, les étiquettes et les fiches de traitement relèvent des données scientifiques de l'archéologie au sens de l'arrêté du 7 février 2022 et sont versés avec le mobilier."
  }
};
/*PARAMS-FIN*/

/* ---------------------------------------------------------------------
   MATÉRIAUX proposés au chargé de projet
   --------------------------------------------------------------------- */
var MATS = [
  {k:'fer',      n:'Fer — objets',                       u:'objets', d:'Outils, armes, parure, éléments de construction… (hors clous)'},
  {k:'clous',    n:'Fer — clous, tiges, tôles',          u:'restes', d:'Traités par lot, radiographie sélective'},
  {k:'cu',       n:'Alliages cuivreux',                  u:'objets', d:'Bronze, laiton : parure, vaisselle, appliques…'},
  {k:'monnaies', n:'Monnaies',                           u:'monnaies', d:'Traitées par lot'},
  {k:'plomb',    n:'Plomb, étain',                       u:'objets', d:''},
  {k:'precieux', n:'Argent, or',                         u:'objets', d:''},
  {k:'verre',    n:'Verre',                              u:'objets ou vases', d:'Vaisselle, perles, verre à vitre'},
  {k:'ceram',    n:'Céramique à consolider ou dessaler', u:'vases ou lots', d:'Pâtes peu cuites, pulvérulentes, salées : pas la céramique courante'},
  {k:'os',       n:'Os travaillé, tabletterie',          u:'objets', d:'Peignes, épingles, dés…'},
  {k:'parure',   n:'Autres matériaux (lignite, ambre, jais…)', u:'objets', d:''},
  {k:'mottes',   n:'Prélèvements en motte',              u:'mottes', d:'Sépultures, dépôts, objets trop fragiles pour être levés seuls'},
  {k:'humide',   n:'Bois, cuir, textile gorgés d’eau',   u:'', d:'Toujours sur devis', devis:true},
  {k:'lapid',    n:'Lapidaire, enduits peints, mosaïque',   u:'', d:'Toujours sur devis', devis:true}
];
var METAUX = ['fer','cu','monnaies','plomb','precieux'];

/* ---------------------------------------------------------------------
   ÉTAT DU FORMULAIRE (gardé dans le navigateur, pour reprendre plus tard)
   --------------------------------------------------------------------- */
var F = {op:'', commune:'', ro:'', cp:'', ref:'', contexte:'Rural / habitat', delai:'', stab:'oui', terrain:'', q:{}, inc:{}};
try { var sv = JSON.parse(localStorage.getItem('psti-cons') || 'null'); if (sv) F = Object.assign(F, sv); } catch (e) {}
function save() { try { localStorage.setItem('psti-cons', JSON.stringify(F)); } catch (e) {} }
var ADMIN = /[?&]admin\b/.test(location.search);

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function num(v) { var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) && n > 0 ? n : 0; }
function r1(x) { return Math.round(x * 10) / 10; }
function fmt(x) { return r1(x).toLocaleString('fr-FR', {minimumFractionDigits: 1, maximumFractionDigits: 1}); }
function fmtE(x) { return Math.round(x).toLocaleString('fr-FR') + ' €'; }
function aujourdhui() { var d = new Date(); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear(); }

/* =====================================================================
   CALCUL
   Tout est exprimé en minutes puis converti en jours-hommes (1 JH = PARAMS.jh heures).
   ===================================================================== */
function calcul() {
  var P = PARAMS, f = P.fer, C = ['S','M','L','XL'];
  var moy = function(t) { return C.reduce(function(a, c) { return a + f.mix[c] * t[c]; }, 0); };
  // Temps moyen d'un objet en fer (mise en état d'étude) : sédiment ou surface d'origine (quota) + consolidation + fiche individuelle
  var tFer = (1 - P.quotaSurface) * moy(f.sediment) + P.quotaSurface * (moy(f.surface) + moy(f.fiche)) + P.partConsolidation * moy(f.consolidation);
  var poidsMoy = moy(f.poids);           // g
  var clicheObjet = C.reduce(function(a, c) { return a + f.mix[c] * (f.clicheEuros / (f.objetsParCliche[c] || 1)); }, 0);
  var majo = P.contextes[F.contexte] || 0;
  var q = {}; MATS.forEach(function(m) { q[m.k] = m.devis ? 0 : num(F.q[m.k]); });
  var H = 60 * P.jh, L = {ferme: [], option: [], devis: []};
  var add = function(where, label, min, detail) { if (min > 0) L[where].push({l: label, jh: min / H, d: detail || ''}); };

  // --- mise en état d'étude, par matériau ---
  var objMin = 0, nObj = 0;
  var etude = {fer: q.fer * tFer, cu: q.cu * tFer * P.coef.cu, monnaies: q.monnaies * tFer * P.coef.monnaies, plomb: q.plomb * tFer * P.coef.plomb,
    precieux: q.precieux * tFer * P.coef.precieux, verre: q.verre * tFer * P.coef.verre, ceram: q.ceram * tFer * P.coef.ceram,
    os: q.os * tFer * P.coef.os, parure: q.parure * tFer * P.coef.parure};
  Object.keys(etude).forEach(function(k) { objMin += etude[k]; nObj += q[k]; });
  var clous = q.clous * P.clousMinReste, mottes = q.mottes * P.motteMin;
  var nMet = METAUX.reduce(function(a, k) { return a + q[k]; }, 0);
  var radio = nMet * P.radioMinObjet;
  var nLots = MATS.filter(function(m) { return !m.devis && q[m.k] > 0; }).length;
  var fichesLot = nLots * P.ficheLotMin;
  var base = objMin + clous + mottes;
  add('ferme', 'Mise en état d’étude des objets (dégagement, consolidation, fiches)', objMin);
  add('ferme', 'Clous, tiges et tôles (traitement par lot)', clous);
  add('ferme', 'Fouille des prélèvements en motte', mottes);
  add('ferme', 'Radiographie : préparation des lots et lecture', radio);
  add('ferme', 'Fiches de lot', fichesLot);
  if (majo > 0) add('ferme', 'Majoration liée au contexte (' + F.contexte.toLowerCase() + ', +' + Math.round(majo * 100) + ' %)', base * majo);
  var terrain = num(F.terrain) * H;
  add('ferme', 'Présence du conservateur-restaurateur sur le terrain', terrain);
  var coord = nObj + q.mottes > 0 ? (P.coordBase + P.coordAjout * Math.max(0, Math.ceil((nObj + q.mottes) / P.coordPalier) - 1)) * H : 0;
  add('ferme', 'Suivi de projet et coordination', coord);

  // --- stabilisation (ferme si demandée par le CCS, sinon en option) ---
  var st = P.stab, stabWhere = F.stab === 'oui' ? 'ferme' : 'option';
  var boites = q.fer > 0 ? Math.max(1, Math.ceil(q.fer / st.ferObjetsBoite)) : 0;
  var stFer = q.fer > 0 ? q.fer * moy(f.postbain) + boites * st.ferHeuresBoite * 60 : 0;
  add(stabWhere, 'Stabilisation du fer : déchloruration (' + boites + ' boîte' + (boites > 1 ? 's' : '') + ' de bain, post-bain)', stFer);
  add(stabWhere, 'Stabilisation des alliages cuivreux et monnaies (L-cystéine)', (q.cu + q.monnaies) * st.cuMinObjet);
  add(stabWhere, 'Dessalement des céramiques (bains suivis par conductivité)', q.ceram * st.ceramMinObjet);
  var dureeStab = Math.max(q.fer ? st.ferDureeMois : 0, (q.cu + q.monnaies) ? st.cuDureeMois : 0, q.ceram ? st.ceramDureeMois : 0);
  if (!num(F.terrain)) L.option.push({l: 'Présence du conservateur-restaurateur sur le terrain (prélèvements, consolidation in situ)', jh: null, d: 'sur demande, au jour'});

  // --- consommables et prestations (€ HT) ---
  var eClich = nMet * clicheObjet, eSol = (stabWhere === 'ferme' && q.fer) ? q.fer * poidsMoy / 1000 * st.ferLitresKg * st.ferEurosLitre : 0;

  // --- provisions sur devis ---
  MATS.forEach(function(m) {
    if (m.devis && F.inc[m.k]) L.devis.push({l: m.n, d: 'présence attendue'});
    else if (!m.devis && F.inc[m.k] && !q[m.k]) L.devis.push({l: m.n, d: 'présence possible, quantité inconnue'});
  });
  L.devis.push({l: 'Objets hors gabarit (plus de 60 cm) et objets composites', d: ''});
  L.devis.push({l: 'Étude des restes organiques minéralisés par un spécialiste', d: 'prestation complémentaire'});
  L.devis.push({l: 'Analyses (composition, datation, contenus)', d: 'prestation complémentaire'});
  L.devis.push({l: 'Restauration pour présentation au public', d: ''});

  var sum = function(a) { return a.reduce(function(s, x) { return s + (x.jh || 0); }, 0); };
  var alertes = [];
  var delai = num(F.delai);
  if (dureeStab && delai && dureeStab > delai) alertes.push('La stabilisation dure environ ' + dureeStab + ' mois, plus que le délai de rendu (' + delai + ' mois) : elle se fera après le rendu, ou sortira du périmètre de l’offre.');
  if (nObj > P.seuilObjets) alertes.push('Le corpus attendu (' + nObj + ' objets) dépasse le domaine de validité de la grille (' + P.seuilObjets + ' objets) : au-delà, tranche conditionnelle ou devis.');
  if (!nObj && !q.clous && !q.mottes) alertes.push('Aucune quantité saisie : renseignez le mobilier attendu (rapport de diagnostic ou estimation du RO).');
  return {L: L, ferme: sum(L.ferme), option: sum(L.option), eClich: eClich, eSol: eSol, alertes: alertes, nObj: nObj, q: q, dureeStab: dureeStab, majo: majo, boites: boites, stabWhere: stabWhere};
}

/* =====================================================================
   FORMULAIRE
   ===================================================================== */
function seg(name, opts, cur) {
  return '<div class="seg" data-seg="' + name + '">' + opts.map(function(o) { return '<button type="button" data-v="' + esc(o) + '" aria-pressed="' + (o === cur) + '">' + esc(o) + '</button>'; }).join('') + '</div>';
}
function renderForm() {
  var h = '';
  h += '<section class="card"><h2>1. Opération</h2><p class="hint">Ces informations figurent en tête du document.</p><div class="grid">' +
    fld('op', 'Nom de l’opération') + fld('commune', 'Commune (département)') + fld('ro', 'Responsable d’opération') +
    fld('ref', 'N° d’arrêté de prescription (facultatif)') + fld('cp', 'Chargé(e) de projet') + '</div></section>';
  h += '<section class="card"><h2>2. Contexte et délais</h2><p class="hint">Si le site mêle plusieurs contextes, choisissez le contexte dominant.</p>' +
    '<label>Contexte de l’opération</label>' + seg('contexte', Object.keys(PARAMS.contextes), F.contexte) +
    '<div class="grid" style="margin-top:12px">' + fld('delai', 'Délai de rendu après la fouille (mois)', 'number') +
    fld('terrain', 'Jours de présence du C-R sur le terrain (facultatif)', 'number') + '</div>' +
    '<label style="margin-top:12px">Le cahier des charges demande-t-il la stabilisation ?</label>' + seg('stab', ['oui', 'non'], F.stab) + '</section>';
  h += '<section class="card"><h2>3. Mobilier attendu</h2><p class="hint">Reprenez les chiffres du rapport de diagnostic, ou l’estimation du RO. Si un matériau est probable mais que vous n’avez pas de chiffre, cochez « probable » : il passera en provision sur devis.</p>' +
    '<table class="mob"><thead><tr><th>Matériau</th><th>Nombre</th><th class="c">Probable,<br>sans chiffre</th></tr></thead><tbody>' +
    MATS.map(function(m) {
      return '<tr><td class="m"><b>' + esc(m.n) + '</b><small>' + esc(m.d) + '</small></td><td>' +
        (m.devis ? '<small style="color:var(--faint)">sur devis</small>' : '<input type="number" min="0" step="1" inputmode="numeric" data-q="' + m.k + '" value="' + esc(F.q[m.k] || '') + '" placeholder="' + esc(m.u) + '" aria-label="' + esc(m.n) + ' : nombre de ' + esc(m.u) + '">') +
        '</td><td class="c"><input type="checkbox" data-inc="' + m.k + '"' + (F.inc[m.k] ? ' checked' : '') + ' aria-label="' + esc(m.n) + ' probable"></td></tr>';
    }).join('') + '</tbody></table></section>';
  if (ADMIN) h += adminHtml();
  document.getElementById('form').innerHTML = h;
}
function fld(k, lab, type) {
  return '<div><label for="f-' + k + '">' + esc(lab) + '</label><input id="f-' + k + '" data-f="' + k + '" type="' + (type || 'text') + '"' + (type === 'number' ? ' min="0" inputmode="decimal"' : '') + ' value="' + esc(F[k]) + '"></div>';
}

/* =====================================================================
   RÉSULTAT
   ===================================================================== */
function renderRes() {
  var R = calcul(), h = '';
  h += '<h2>Enveloppe conservation</h2><div class="big">' + fmt(R.ferme) + ' <small>jours-hommes</small></div>' +
    '<p class="hint" style="margin:4px 0 0">tranche ferme' + (R.option ? ', + ' + fmt(R.option) + ' JH en option' : '') + '</p>';
  h += '<ul class="lines">' + R.L.ferme.map(function(x) { return '<li><span>' + esc(x.l) + '</span><b>' + fmt(x.jh) + '</b></li>'; }).join('') +
    R.L.option.map(function(x) { return '<li class="opt"><span>Option : ' + esc(x.l) + '</span><b>' + (x.jh == null ? esc(x.d) : fmt(x.jh)) + '</b></li>'; }).join('') + '</ul>';
  if (R.eClich + R.eSol > 0) h += '<p class="hint" style="margin:8px 0 0">Consommables et prestations : environ ' + fmtE(R.eClich + R.eSol) + ' HT (clichés' + (R.eSol ? ', solution de déchloruration' : '') + ').</p>';
  R.alertes.forEach(function(a) { h += '<div class="al">' + esc(a) + '</div>'; });
  h += '<button class="btn" id="dl"' + (R.nObj || R.q.clous || R.q.mottes ? '' : ' disabled') + '>Télécharger le volet (.odt)</button>';
  h += '<div class="paste"><b>À reporter dans le PSTI :</b><br><span id="pst">' + esc(ligne(R)) + '</span></div>';

function telecharger() {
  var R = calcul();
  var X = function(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var x = odtXml({xml: odtContent(R), esc: X});
  var z = new JSZip();
  z.file('mimetype', 'application/vnd.oasis.opendocument.text', {compression: 'STORE'});
  z.file('META-INF/manifest.xml', x.manifest); z.file('content.xml', x.content); z.file('styles.xml', x.styles); z.file('meta.xml', x.meta);
  return z.generateAsync({type: 'blob', mimeType: 'application/vnd.oasis.opendocument.text', compression: 'DEFLATE'}).then(function(blob) {
    var nom = 'Volet_conservation_' + (F.op || 'operation').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w-]+/g, '_').replace(/^_|_$/g, '') + '.odt';
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return nom;
  });
}

function adminHtml() {
  var P = PARAMS, f = P.fer, C = ['S','M','L','XL'], av = function(k) { return P.aValider.indexOf(k) >= 0 ? ' <span class="flag" title="Valeur de départ, à valider">●</span>' : ''; };

  var four = function(path, lab) { return '<div class="row k4"><span>' + lab + '</span>' + C.map(function(c) { return '<input data-p="' + path + '.' + c + '" value="' + esc(get(path + '.' + c)) + '" aria-label="' + lab + ' ' + c + '">'; }).join('') + '</div>'; };

  h += '<h3>Hypothèses de corpus</h3>' + one('quotaSurface', 'Part des objets avec dégagement de la surface d’origine (0,10 = 10 %)') + one('partConsolidation', 'Part des objets consolidés') +
    one('radioMinObjet', 'Radiographie : préparation et lecture (min par objet métallique)') + one('clousMinReste', 'Clous, tiges, tôles (min par reste)') + one('motteMin', 'Fouille d’une motte (min, valeur moyenne)') +
    one('ficheLotMin', 'Fiche de lot (min par matériau)') + one('fer.clicheEuros', 'Coût d’un cliché (€)') + one('seuilObjets', 'Domaine de validité (objets)') + one('jh', 'Durée d’un jour-homme (h)');
  h += '<h3>Autres matériaux : coefficient par rapport au fer</h3>' + Object.keys(P.coef).map(function(k) { var m = MATS.filter(function(x) { return x.k === k; })[0]; return one('coef.' + k, m ? m.n : k, 'coef'); }).join('');

    one('stab.cuMinObjet', 'Alliages cuivreux : min par objet', 'cuMinObjet') + one('stab.cuDureeMois', 'Alliages cuivreux : durée (mois)', 'cuDureeMois') +
    one('stab.ceramMinObjet', 'Céramique : dessalement, min par objet', 'ceramMinObjet') + one('stab.ceramDureeMois', 'Céramique : durée (mois)', 'ceramDureeMois');

  h += '<button class="btn" id="admdl">Télécharger la page avec ces paramètres</button><p class="hint" id="admmsg" style="margin-top:8px"></p></section>';

function get(path) { return path.split('.').reduce(function(o, k) { return o == null ? o : o[k]; }, PARAMS); }
function set(path, v) { var ks = path.split('.'), o = PARAMS; ks.slice(0, -1).forEach(function(k) { o = o[k]; }); o[ks[ks.length - 1]] = v; }
function telechargerPage() {
  var msg = document.getElementById('admmsg');
  PARAMS.version = new Date().toISOString().slice(0, 10);
  fetch(location.href.replace(/[?#].*$/, ''), {cache: 'no-store'}).then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(function(src) {
    var i = src.indexOf('/*PARAMS-DEBUT*/'), j = src.indexOf('/*PARAMS-FIN*/');
    if (i < 0 || j < 0) throw new Error('bloc de paramètres introuvable');
    var out = src.slice(0, i) + '/*PARAMS-DEBUT*/\nvar PARAMS = ' + JSON.stringify(PARAMS, null, 2) + ';\n' + src.slice(j);
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], {type: 'text/html'})); a.download = 'conservation_psti.html'; document.body.appendChild(a); a.click(); a.remove();
    msg.textContent = 'Page téléchargée : remplacez conservation_psti.html sur GitHub (même nom).';
  }).catch(function(e) { msg.textContent = 'Téléchargement impossible (' + e.message + ') : ouvrez la page depuis GitHub Pages.'; });
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
document.addEventListener('input', function(e) {
  var t = e.target, d = t.dataset;
  if (d.f) { F[d.f] = t.value; }
  else if (d.q) { F.q[d.q] = t.value; }
  else if (d.p) { var v = parseFloat(String(t.value).replace(',', '.')); if (isFinite(v)) set(d.p, v); }
  else if (d.pc) { var w = parseFloat(String(t.value).replace(',', '.')); if (isFinite(w)) PARAMS.contextes[d.pc] = w; }
  else if (d.pt) { set(d.pt, t.value); }
  else return;
  save(); renderRes();
});
document.addEventListener('change', function(e) { var d = e.target.dataset; if (d.inc) { F.inc[d.inc] = e.target.checked; save(); renderRes(); } });
document.addEventListener('click', function(e) {
  var b = e.target.closest('button'); if (!b) return;
  var sg = b.closest('[data-seg]');
  if (sg) { F[sg.dataset.seg] = b.dataset.v; sg.querySelectorAll('button').forEach(function(x) { x.setAttribute('aria-pressed', x === b); }); save(); renderRes(); return; }
  if (b.id === 'dl') { b.disabled = true; telecharger().then(function() { b.disabled = false; }).catch(function(err) { b.disabled = false; alert('Erreur : ' + err.message); }); }
  if (b.id === 'cp') { var t = document.getElementById('pst').textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function() { b.textContent = 'Copié'; setTimeout(function() { b.textContent = 'Copier la ligne'; }, 1500); }).catch(function() {}); }
  if (b.id === 'raz' && confirm('Vider le formulaire pour une nouvelle opération ?')) { F = {op:'', commune:'', ro:'', cp:'', ref:'', contexte:'Rural / habitat', delai:'', stab:'oui', terrain:'', q:{}, inc:{}}; save(); renderForm(); renderRes(); }
  if (b.id === 'admdl') telechargerPage();
});
document.getElementById('foot').textContent = 'Paramètres du laboratoire du ' + PARAMS.version + (ADMIN ? ' · mode Paramètres' : '');
renderForm(); renderRes();
